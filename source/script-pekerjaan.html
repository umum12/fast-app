<script>
// ============================================================
// PEKERJAAN — FORM "BUAT" (Tahap 4 Cutover — form dinamis pengganti
// form Laporan & form Penugasan terpisah lama)
// ============================================================

var MAX_PHOTOS = 3;
var selectedPhotos = []; // { base64, mimeType, previewUrl } — foto kondisi awal (atau foto penuntasan pada mode "Buat Laporan")
var activePhotoSlotIndex = null;

// 3.1 — Dropdown Jenis difilter PER ROLE di frontend. Validasi "siapa
// boleh membuat" TETAP ditegakkan backend (createPekerjaan) — filter
// ini murni UX, bukan satu-satunya lapisan keamanan.
// PATCH — Admin job desk murni dispatcher: hanya Penugasan. Validasi
// SERVER-SIDE (createPekerjaan, pekerjaan.gs) juga WAJIB diterapkan di
// samping filter dropdown ini — filter ini murni UX.
var JENIS_ROLE_FILTER = {
  admin: ['penugasan'],
  fs: ['lapor_kerusakan', 'permintaan', 'kebersihan', 'perbaikan', 'lainnya'],
  demo: []
};


/**
 * Patch Bug Navigasi & Workflow (Bagian 3) — konteks prefill saat form
 * "Buat" dibuka lewat tombol "Buat Laporan" dari sebuah Pekerjaan yang
 * sedang DIKERJAKAN (lihat openBuatLaporanForPekerjaan()). null berarti
 * form beroperasi dalam mode normal (createPekerjaan). Saat terisi,
 * submit form memanggil selesaikanPekerjaan() TERHADAP pekerjaanId yang
 * sama (bukan membuat Pekerjaan baru) — TIDAK ADA business logic baru,
 * murni memakai ulang endpoint selesaikanPekerjaan yang sudah ada
 * (sebelumnya hanya bisa diakses lewat modal "Selesaikan").
 */
var buatPrefillContext = null;

function updateJenisIcon() {
  var jenisSelect = document.getElementById('form-jenis');
  var info = JENIS_PEKERJAAN_BADGE[jenisSelect.value] || { icon: 'description', cls: 'badge-neutral' };
  var color = STATUS_BUBBLE_COLOR[info.cls] || STATUS_BUBBLE_COLOR['badge-neutral'];
  var iconEl = document.getElementById('form-jenis-icon');
  if (!iconEl) return;
  iconEl.innerHTML = mdIcon(info.icon, 15);
  iconEl.style.background = color.bg;
  iconEl.style.color = color.fg;
}

function updateAssignmentFieldsVisibility() {
  var jenisSelect = document.getElementById('form-jenis');
  // Mode "Buat Laporan" (prefill) selalu menyembunyikan field Mode
  // Penugasan/Petugas Penerima — konteksnya sudah pekerjaan yang ada,
  // bukan pembuatan Penugasan baru (Bagian 3).
  var isPenugasan = !buatPrefillContext && jenisSelect.value === 'penugasan';
  var modeGroup = document.getElementById('form-assignment-mode-group');
  if (modeGroup) modeGroup.style.display = isPenugasan ? 'block' : 'none';
  var modeSelect = document.getElementById('form-assignment-mode');
  var isDirect = isPenugasan && modeSelect && modeSelect.value === 'direct';
  var targetGroup = document.getElementById('form-target-user-group');
  if (targetGroup) targetGroup.style.display = isDirect ? 'block' : 'none';
}

var formBuatListenersAttached = false;

function attachFormBuatListenersOnce_() {
  if (formBuatListenersAttached) return;
  formBuatListenersAttached = true;

  var jenisSelect = document.getElementById('form-jenis');
  jenisSelect.addEventListener('change', updateJenisIcon);
  jenisSelect.addEventListener('change', updateAssignmentFieldsVisibility);
  jenisSelect.addEventListener('change', updateFormProgress);
  jenisSelect.addEventListener('change', updatePerformedAtFieldVisibility);

  var modeSelectEl = document.getElementById('form-assignment-mode');
  if (modeSelectEl) modeSelectEl.addEventListener('change', updateAssignmentFieldsVisibility);

  var floorSelect = document.getElementById('form-floor');
  floorSelect.addEventListener('change', updateFormProgress);

  // Tampilan baru: Jenis & Lantai dipilih lewat bottom sheet (radio). <select> asli
  // tetap menjadi sumber nilai (id, value, event 'change' tidak berubah).
  enhanceSelectWithSheet_(jenisSelect, function (o) {
    var info = JENIS_PEKERJAAN_BADGE[o.value];
    return info ? info.icon : 'description';
  });
  enhanceSelectWithSheet_(floorSelect, function () { return 'building'; });

  var modeSel = document.getElementById('form-assignment-mode');
  var targetSel = document.getElementById('form-target-user');
  var syncModeIcon = function () {
    var ic = document.getElementById('form-mode-icon');
    if (ic && modeSel) ic.innerHTML = mdIcon(modeSel.value === 'direct' ? 'personCheck' : 'sensors', 18);
  };
  var tIc = document.getElementById('form-target-icon');
  if (tIc) tIc.innerHTML = mdIcon('personCheck', 18);
  if (modeSel) {
    syncModeIcon();
    modeSel.addEventListener('change', syncModeIcon);
    enhanceSelectWithSheet_(modeSel, function (o) { return o.value === 'direct' ? 'personCheck' : 'sensors'; });
  }
  if (targetSel) enhanceSelectWithSheet_(targetSel, function () { return 'account'; });
}

function enhanceSelectWithSheet_(selectEl, iconFor) {
  var wrap = selectEl.closest('.select-field-wrap');
  if (!wrap || wrap._sheetBound) return;
  wrap._sheetBound = true;
  wrap.classList.add('sheet-select');
  var hit = document.createElement('button');
  hit.type = 'button';
  hit.className = 'select-sheet-hit';
  var SHEET_TITLES_ = { 'form-jenis': 'Pilih Jenis', 'form-floor': 'Pilih Lantai', 'form-assignment-mode': 'Pilih Mode Penugasan', 'form-target-user': 'Pilih Petugas Penerima' };
  var sheetTitle = SHEET_TITLES_[selectEl.id] || 'Pilih';
  hit.setAttribute('aria-label', sheetTitle);
  wrap.appendChild(hit);
  hit.addEventListener('click', function () {
    if (selectEl.disabled) return;
    var items = [];
    for (var i = 0; i < selectEl.options.length; i++) {
      (function (o) {
        if (!o.value) return; // placeholder "Pilih lantai" tidak ditampilkan sebagai opsi
        items.push({
          icon: iconFor(o),
          label: String(o.textContent).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }),
          radio: true,
          selected: o.value === selectEl.value,
          onClick: function () {
            selectEl.value = o.value;
            selectEl.dispatchEvent(new Event('change', { bubbles: true }));
          }
        });
      })(selectEl.options[i]);
    }
    openBottomSheet(items, { center: true, title: sheetTitle });
  });
}

/** Overlay "Mengirim data ke server" (form Buat & Penyelesaian). */
function showSendingOverlay_(text) {
  var ov = document.getElementById('sending-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'sending-overlay';
    ov.innerHTML = '<div class="sending-card"><div class="sending-ring"></div><div class="sending-title">Mengirim data ke server</div>' +
      '<div class="sending-bar"><div class="sending-bar-fill"></div></div><div class="sending-sub" id="sending-sub"></div></div>';
    document.body.appendChild(ov);
  }
  document.getElementById('sending-sub').textContent = text || 'Mengunggah laporan & melampirkan foto...';
  ov.classList.add('show');
}
function hideSendingOverlay_() {
  var ov = document.getElementById('sending-overlay');
  if (ov) ov.classList.remove('show');
}


/**
 * PATCH — "Waktu Laporan" (hanya arah Mandiri). Default state tertutup
 * ("Sekarang (otomatis)"), tap "Ubah" membuka picker datetime-local +
 * preview teks format Indonesia lengkap. Reuse JENIS_MANDIRI_SET_ yang
 * sudah ada (dipakai showPekerjaanSuccessCard) dan INDO_DAY_NAMES_
 * (script-jadwal.html, SATU sumber kebenaran nama hari — sudah
 * ter-include lebih dulu baik di index.html maupun buat-cepat.html).
 */
var INDO_MONTH_FULL_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function formatDatetimeLocalInput_(d) {
  function pad(n) { return n < 10 ? '0' + n : n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/** "2026-10-04T20:25" (value datetime-local) -> "Minggu, 04 Oktober 2026 · 20:25". */
function formatPerformedAtPreview_(datetimeLocalValue) {
  var d = new Date(datetimeLocalValue);
  if (isNaN(d.getTime())) return '';
  function pad(n) { return n < 10 ? '0' + n : n; }
  var dayName = INDO_DAY_NAMES_[d.getDay()];
  return dayName + ', ' + pad(d.getDate()) + ' ' + INDO_MONTH_FULL_[d.getMonth()] + ' ' + d.getFullYear() + ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function setPerformedAtBounds_() {
  var input = document.getElementById('form-performed-at');
  if (!input) return;
  var now = new Date();
  var maxStr = formatDatetimeLocalInput_(now);
  var minStr = formatDatetimeLocalInput_(new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000));
  input.max = maxStr;
  input.min = minStr;
}

/** Kembali ke state tertutup ("Sekarang (otomatis)") — input dikosongkan
 * supaya submit handler mengirim performedAt='' (backend default ke
 * `now`, perilaku identik sebelum fitur ini ada). */
function collapsePerformedAt_() {
  var input = document.getElementById('form-performed-at');
  if (input) input.value = '';
  var collapsed = document.getElementById('performed-at-collapsed');
  var expanded = document.getElementById('performed-at-expanded');
  if (collapsed) collapsed.style.display = 'flex';
  if (expanded) expanded.style.display = 'none';
}

function expandPerformedAt_() {
  setPerformedAtBounds_();
  var input = document.getElementById('form-performed-at');
  if (input && !input.value) input.value = formatDatetimeLocalInput_(new Date());
  var collapsed = document.getElementById('performed-at-collapsed');
  var expanded = document.getElementById('performed-at-expanded');
  if (collapsed) collapsed.style.display = 'none';
  if (expanded) expanded.style.display = 'block';
  updatePerformedAtPreview_();
}

function updatePerformedAtPreview_() {
  var input = document.getElementById('form-performed-at');
  var preview = document.getElementById('performed-at-preview');
  if (!input || !preview) return;
  preview.textContent = formatPerformedAtPreview_(input.value);
}

var performedAtListenersAttached_ = false;
function attachPerformedAtListenersOnce_() {
  if (performedAtListenersAttached_) return;
  performedAtListenersAttached_ = true;

  var editBtn = document.getElementById('btn-performed-at-edit');
  if (editBtn) editBtn.addEventListener('click', expandPerformedAt_);

  var resetBtn = document.getElementById('btn-performed-at-reset');
  if (resetBtn) resetBtn.addEventListener('click', collapsePerformedAt_);

  var input = document.getElementById('form-performed-at');
  if (input) input.addEventListener('change', updatePerformedAtPreview_);

  var labelIcon = document.getElementById('performed-at-label-icon');
  if (labelIcon) labelIcon.innerHTML = mdIcon('schedule', 16);
}

function updatePerformedAtFieldVisibility() {
  var jenisSelect = document.getElementById('form-jenis');
  var group = document.getElementById('form-performed-at-group');
  if (!group) return;
  var isMandiri = !buatPrefillContext && JENIS_MANDIRI_SET_.indexOf(jenisSelect.value) !== -1;
  group.style.display = isMandiri ? 'block' : 'none';
  if (isMandiri) {
    attachPerformedAtListenersOnce_();
    setPerformedAtBounds_();
  } else {
    collapsePerformedAt_();
  }
}


/**
 * Tampilan form Buat (mode normal). Mode "Buat Laporan" TIDAK lagi memakai
 * form ini — lihat form Penyelesaian Tugas (#buat-selesai-wrap) di bawah.
 */
function applyBuatModeUI_() {
  var banner = document.getElementById('buat-context-banner');
  if (banner) banner.style.display = 'none';

  var headerTitle = document.getElementById('buat-header-title');
  if (headerTitle) headerTitle.textContent = 'Buat Pekerjaan';

  var jenisSelect = document.getElementById('form-jenis');
  var floorSelect = document.getElementById('form-floor');
  [jenisSelect, floorSelect].forEach(function (el) {
    if (!el) return;
    el.disabled = false;
    el.classList.remove('locked-field', 'locked-field-green');
  });

  var descLabel = document.getElementById('form-description-label');
  var photoLabel = document.getElementById('form-photo-label');
  if (descLabel) descLabel.textContent = 'Keterangan';
  if (photoLabel) photoLabel.textContent = 'Foto Kondisi Awal (opsional, maks. 3)';

  var submitBtn = document.getElementById('btn-submit-report');
  if (submitBtn) submitBtn.innerHTML = mdIcon('upload', 18) + '<span>Simpan & Kirim</span>';
}

/**
 * Dipanggil dari tombol "Buat Laporan" pada kartu Pekerjaan yang sedang
 * DIKERJAKAN (Menu Pekerjaan). Menyimpan SELURUH data pekerjaan sebagai
 * referensi (read-only) lalu membuka form Penyelesaian Tugas di menu Buat.
 * Berlaku untuk kedua arah (Admin → FS dan FS → Admin) — tidak ada jenis
 * yang dipaksa; backend selesaikanPekerjaan() yang memvalidasi hak akses.
 */
function openBuatLaporanForPekerjaan(p) {
  buatPrefillContext = { pekerjaanId: p.pekerjaanId, pekerjaan: p };
  goToPage('buat');
}

function initPekerjaanForm() {
  if (!appBootstrap) return;

  // Mode Penyelesaian Tugas: form terpisah, state terpisah.
  if (buatPrefillContext && document.getElementById('buat-selesai-wrap')) {
    showBuatMode_(true);
    renderSelesaiForm_();
    return;
  }
  buatPrefillContext = null;
  showBuatMode_(false);

  var role = appBootstrap.currentUser.role;

  var allowedJenis = JENIS_ROLE_FILTER[role] || [];
  var jenisSelect = document.getElementById('form-jenis');
  jenisSelect.innerHTML = '';

  var jenisSource = (appBootstrap.jenisPekerjaanList || []).filter(function (j) { return allowedJenis.indexOf(j.value) !== -1; });
  jenisSource.forEach(function (j) {
    var opt = document.createElement('option');
    opt.value = j.value;
    opt.textContent = j.label;
    jenisSelect.appendChild(opt);
  });

  // Lantai
  var floorSelect = document.getElementById('form-floor');
  floorSelect.innerHTML = '<option value="">Pilih lantai</option>';
  (appBootstrap.master.floors || []).forEach(function (f) {
    var opt = document.createElement('option');
    opt.value = f.floor_code;
    opt.textContent = f.floor_name;
    floorSelect.appendChild(opt);
  });

  // Petugas Penerima (Direct Assignment)
  var targetSelect = document.getElementById('form-target-user');
  if (targetSelect) {
    targetSelect.innerHTML = '<option value="">Pilih petugas</option>';
    (appBootstrap.master.fsUsers || []).forEach(function (u) {
      var opt = document.createElement('option');
      opt.value = u.userCode;
      opt.textContent = u.displayName;
      targetSelect.appendChild(opt);
    });
  }

  attachFormBuatListenersOnce_();
  ['form-floor', 'form-description', 'form-target-user'].forEach(function (id) { clearInlineError_(document.getElementById(id)); });

  applyBuatModeUI_();
  updateJenisIcon();
  updateAssignmentFieldsVisibility();
  updatePerformedAtFieldVisibility();
  renderPhotoSlots();
  updateFormProgress();
}


function resetBuatPrefillContext_() {
  buatPrefillContext = null;
}

/**
 * Progres pengisian form — Jenis, Lantai, Keterangan, dan foto
 * masing-masing berkontribusi 25%. Subjek tidak dihitung karena
 * eksplisit opsional.
 */
function updateFormProgress() {
  var progressEl = document.getElementById('form-progress-text');
  if (!progressEl) return;

  var jenis = document.getElementById('form-jenis').value;
  var floor = document.getElementById('form-floor').value;
  var desc = document.getElementById('form-description').value.trim();
  var photoCount = selectedPhotos.filter(Boolean).length;

  var doneCount = 0;
  if (jenis) doneCount++;
  if (floor) doneCount++;
  if (desc) doneCount++;
  if (photoCount > 0) doneCount++;

  var percent = Math.round((doneCount / 4) * 100);
  progressEl.textContent = 'Progres: ' + percent + '% | ' + photoCount + ' Foto Terpilih';
}

// ------------------- PHOTO SLOTS (foto kondisi awal) -------------------


/**
 * PATCH — redesain slot foto berlabel. Kelas 'photo-slot-v2' SENGAJA
 * BARU (bukan 'photo-slot' lama) — 'photo-slot'/'photo-slots' masih
 * dipakai slot gambar Content Management (renderContentImageSlot_,
 * script-jadwal.html), jadi dipisah supaya perubahan ini TIDAK ikut
 * mengubah tampilan form Content Management. Caption per slot MURNI
 * visual/saran urutan pengambilan foto — ketiganya tetap tersimpan
 * generik sebagai array (initial_photos_json/completion_photos_json),
 * tidak ada perbedaan perlakuan data per index.
 */
var PHOTO_SLOT_CAPTIONS_ = ['Foto Kondisi Awal', 'Foto Hasil / Sesudah', 'Foto Detail Tambahan'];
var SELESAI_PHOTO_CAPTIONS_UNUSED_ = 0;

function renderPhotoSlots() {
  var container = document.getElementById('photo-slots');
  container.innerHTML = '';

  for (var i = 0; i < MAX_PHOTOS; i++) {
    var slot = document.createElement('div');
    slot.className = 'photo-slot-v2';

    if (selectedPhotos[i]) {
      var inner = document.createElement('div');
      inner.className = 'photo-thumb-inner';
      var img = document.createElement('img');
      img.src = selectedPhotos[i].previewUrl;
      inner.appendChild(img);
      slot.appendChild(inner);

      inner.addEventListener('click', function (idx) {
        return function () {
          activePhotoSlotIndex = idx;
          openPhotoSourceSheet();
        };
      }(i));

      var removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '\u00d7';
      removeBtn.setAttribute('aria-label', 'Hapus foto');
      removeBtn.addEventListener('click', function (idx) {
        return function (e) {
          e.stopPropagation();
          selectedPhotos.splice(idx, 1);
          renderPhotoSlots();
        };
      }(i));
      slot.appendChild(removeBtn);
    } else {
      slot.innerHTML = '<span class="slot-ico">' + mdIcon('addAPhoto', 24) + '</span><span class="slot-caption">' + (PHOTO_SLOT_CAPTIONS_[i] || '') + '</span>';
      slot.addEventListener('click', function (idx) {
        return function () {
          activePhotoSlotIndex = idx;
          openPhotoSourceSheet();
        };
      }(i));
    }

    container.appendChild(slot);
  }

  updateFormProgress();
}
/**
 * Patch 10.x Bagian 3 — Perbaikan Upload Foto. Kontrol pemilihan sumber
 * dipindah ke level aplikasi lewat Bottom Sheet — "Ambil Foto" memakai
 * atribut capture="environment" (memaksa kamera), "Pilih dari Galeri"
 * tanpa capture (Photo Picker/galeri seperti biasa).
 *
 * Generik lewat parameter targetInputId (default 'photo-file-input') —
 * dipakai bersama oleh form Buat DAN oleh slot gambar Content Management
 * (#content-image-file-input, script-jadwal.html) — satu implementasi,
 * tidak diduplikasi.
 */
function openPhotoSourceSheet(targetInputId) {
  var inputId = targetInputId || 'photo-file-input';
  var ov = document.getElementById('photo-source-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'photo-source-overlay';
    ov.className = 'jk-overlay';
    ov.innerHTML =
      '<div class="jk-modal ps-modal" role="dialog" aria-modal="true">' +
        '<div class="jk-modal-header"><h3 class="ps-title"><span class="ps-title-ico"></span>Pilih Sumber Foto</h3>' +
        '<button class="jk-close" type="button" data-ps-close aria-label="Tutup"></button></div>' +
        '<div class="ps-grid">' +
          '<button type="button" class="ps-tile ps-camera" data-src="camera"><span class="ps-tile-ico"></span><span>Ambil Foto</span></button>' +
          '<button type="button" class="ps-tile ps-gallery" data-src="gallery"><span class="ps-tile-ico"></span><span>Pilih Galeri</span></button>' +
        '</div></div>';
    document.body.appendChild(ov);
    ov.querySelector('.ps-title-ico').innerHTML = mdIcon('addAPhoto', 18);
    ov.querySelector('[data-ps-close]').innerHTML = mdIcon('close', 16);
    ov.querySelector('.ps-camera .ps-tile-ico').innerHTML = mdIcon('photoCamera', 26);
    ov.querySelector('.ps-gallery .ps-tile-ico').innerHTML = mdIcon('photoLibrary', 26);
    ov.addEventListener('click', function (e) {
      if (e.target === ov || e.target.closest('[data-ps-close]')) ov.classList.remove('show');
    });
  }
  ov.querySelector('.ps-camera').onclick = function () { ov.classList.remove('show'); triggerPhotoFileInput_(true, inputId); };
  ov.querySelector('.ps-gallery').onclick = function () { ov.classList.remove('show'); triggerPhotoFileInput_(false, inputId); };
  ov.classList.add('show');
}

function triggerPhotoFileInput_(useCamera, targetInputId) {
  var input = document.getElementById(targetInputId || 'photo-file-input');
  if (useCamera) {
    input.setAttribute('capture', 'environment');
  } else {
    input.removeAttribute('capture');
  }
  input.click();
}

document.getElementById('photo-file-input').addEventListener('change', function (e) {
  var file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  beginAction(null);
  compressImage(file).then(function (result) {
    endAction(null);
    selectedPhotos[activePhotoSlotIndex] = result;
    renderPhotoSlots();
  }).catch(function (err) {
    endAction(null);
    showSnackbar('Gagal memproses foto. Coba foto lain.', 'error');
  });
});

/**
 * Kompresi foto di client (Section 18.2):
 * resize sisi terpanjang maks 1280px, JPEG, kompresi adaptif target ±100KB.
 * Generik — dipakai baik oleh foto kondisi awal maupun foto penuntasan,
 * juga oleh gambar Content Management.
 */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Gagal membaca file')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('Gagal memuat gambar')); };
      img.onload = function () {
        var maxSide = 1280;
        var w = img.width;
        var h = img.height;
        if (w > h && w > maxSide) { h = Math.round(h * (maxSide / w)); w = maxSide; }
        else if (h >= w && h > maxSide) { w = Math.round(w * (maxSide / h)); h = maxSide; }

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        var targetBytes = 100 * 1024;
        var quality = 0.8;
        var dataUrl = canvas.toDataURL('image/jpeg', quality);

        function sizeOf(dUrl) {
          return Math.round((dUrl.length - 'data:image/jpeg;base64,'.length) * 3 / 4);
        }

        var attempts = 0;
        while (sizeOf(dataUrl) > targetBytes && quality > 0.3 && attempts < 8) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          attempts++;
        }

        var base64 = dataUrl.split(',')[1];
        resolve({ base64: base64, mimeType: 'image/jpeg', previewUrl: dataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ------------------- SUBMIT PEKERJAAN -------------------

document.getElementById('btn-submit-report').addEventListener('click', function () {
  var errorEl = document.getElementById('form-report-error');
  errorEl.textContent = '';

  var jenisEl = document.getElementById('form-jenis');
  var floorEl = document.getElementById('form-floor');
  var descEl = document.getElementById('form-description');
  var targetEl = document.getElementById('form-target-user');
  clearFieldErrors([floorEl, descEl, targetEl]);

  var jenis = jenisEl.value;
  var isPenugasan = jenis === 'penugasan';
  var assignmentModeEl = document.getElementById('form-assignment-mode');
  var assignmentMode = isPenugasan && assignmentModeEl ? assignmentModeEl.value : '';

  
var performedAtEl = document.getElementById('form-performed-at');
  var data = {
    jenis: jenis,
    floorCode: floorEl.value,
    subject: document.getElementById('form-subject').value,
    description: descEl.value,
    photos: selectedPhotos.filter(Boolean).map(function (p) {
      return { base64: p.base64, mimeType: p.mimeType };
    }),
    assignmentMode: assignmentMode,
    targetUserCode: (isPenugasan && assignmentMode === 'direct' && targetEl) ? targetEl.value : '',
    performedAt: (performedAtEl && performedAtEl.offsetParent !== null && performedAtEl.value) ? performedAtEl.value : ''
  };


  if (!jenis) { errorEl.textContent = 'Jenis pekerjaan wajib dipilih.'; return; }
  [floorEl, descEl, targetEl].forEach(clearInlineError_);
  var firstBad = null;
  if (!data.floorCode) { setInlineError_(floorEl, 'Lantai wajib dipilih.'); firstBad = firstBad || floorEl; }
  if (!data.description.trim()) { setInlineError_(descEl, 'Keterangan wajib diisi.'); firstBad = firstBad || descEl; }
  if (isPenugasan && assignmentMode === 'direct' && !data.targetUserCode) {
    setInlineError_(targetEl, 'Pilih petugas penerima.'); firstBad = firstBad || targetEl;
  }
  if (firstBad) return;

  var session = loadSession();
  var submitBtn = document.getElementById('btn-submit-report');
  beginAction(submitBtn, 'Menyimpan...');
  showSendingOverlay_('Mengunggah laporan & melampirkan foto...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      hideSendingOverlay_();
      if (!response.success) {
        errorEl.textContent = response.error;
        showSnackbar(response.error, 'error');
        return;
      }
      selectedPhotos = [];
      renderPhotoSlots();
      document.getElementById('form-subject').value = '';
      document.getElementById('form-description').value = '';
      var descCounterEl = document.getElementById('form-description-counter');
      if (descCounterEl) descCounterEl.textContent = '0/500';
      updateFormProgress();

      invalidateAllPekerjaanCaches_();

      showPekerjaanSuccessCard(jenis);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      hideSendingOverlay_();
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    })
    .createPekerjaan(session.accessCode, data);
});

/**
 * Perf — debounce ringan untuk input pencarian.
 */
function debounce_(fn, delayMs) {
  var timer = null;
  return function () {
    var args = arguments;
    var ctx = this;
    clearTimeout(timer);
    timer = setTimeout(function () { fn.apply(ctx, args); }, delayMs);
  };
}

/**
 * Membangun satu kartu operasional gaya "v2": ikon kategori di kiri, badge
 * + meta ber-ikon + judul/keterangan di tengah, thumbnail representatif +
 * overlay jumlah foto di kanan. Dipakai bersama oleh render Pekerjaan
 * (inbox/riwayat/aktivitas) agar satu bahasa visual konsisten.
 */
function createOpCardV2(cfg) {
  var card = document.createElement('div');
  card.className = 'op-card op-card-v2';
  if (cfg.onCardClick) card.style.cursor = 'pointer';

  var color = STATUS_BUBBLE_COLOR[cfg.badgeCls] || STATUS_BUBBLE_COLOR['badge-neutral'];
  var iconBubble = document.createElement('div');
  iconBubble.className = 'op-card-icon-bubble';
  iconBubble.style.background = color.bg;
  iconBubble.style.color = color.fg;
  iconBubble.innerHTML = mdIcon(cfg.iconName, 20);
  card.appendChild(iconBubble);

  var main = document.createElement('div');
  main.className = 'op-card-main';

  var top = document.createElement('div');
  top.className = 'op-card-top';
  (cfg.badges || []).forEach(function (b) {
    var badge = document.createElement('span');
    badge.className = 'badge ' + b.cls;
    badge.textContent = b.label;
    top.appendChild(badge);
  });
  main.appendChild(top);

  var metaRow = document.createElement('div');
  metaRow.className = 'op-card-meta-row';
  (cfg.metaItems || []).forEach(function (m) {
    var item = document.createElement('span');
    item.className = 'op-card-meta-item';
    item.innerHTML = mdIcon(m.icon, 13) + '<span>' + m.text + '</span>';
    metaRow.appendChild(item);
  });
  main.appendChild(metaRow);

  var title = document.createElement('div');
  title.className = 'op-card-title';
  if (cfg.subject) {
    var subjectSpan = document.createElement('span');
    subjectSpan.className = 'op-card-subject';
    subjectSpan.textContent = cfg.subject + ' — ';
    title.appendChild(subjectSpan);
  }
  title.appendChild(document.createTextNode(cfg.description || ''));
  main.appendChild(title);

  var hasBottomRow = (cfg.photos && cfg.photos.length > 0) || (cfg.actions && cfg.actions.length > 0);
  if (hasBottomRow) {
    var bottomRow = document.createElement('div');
    bottomRow.className = 'op-card-bottom-row';

    if (cfg.photos && cfg.photos.length > 0) {
      var chip = document.createElement('span');
      chip.className = 'photo-count-chip';
      chip.innerHTML = mdIcon('photo', 14) + '<span>' + cfg.photos.length + ' Foto</span>';
      bottomRow.appendChild(chip);
    }

    (cfg.actions || []).forEach(function (a) {
      var btn = document.createElement('button');
      btn.className = 'btn-card-action ' + a.cls;
      btn.innerHTML = mdIcon(a.icon, 15) + (a.label ? '<span>' + a.label + '</span>' : '');
      btn.addEventListener('click', function (e) { e.stopPropagation(); a.onClick(); });
      bottomRow.appendChild(btn);
    });

    main.appendChild(bottomRow);
  }

  card.appendChild(main);

  if (cfg.photos && cfg.photos.length > 0) {
    var thumbSide = document.createElement('div');
    thumbSide.className = 'op-card-thumb-side';
    var img = document.createElement('img');
    img.src = cfg.photos[0].thumbUrl || cfg.photos[0].url;
    img.alt = 'Foto dokumentasi';
    img.onerror = function () {
      console.warn('Gagal memuat thumbnail. file_id:', cfg.photos[0].file_id);
      thumbSide.style.display = 'flex';
      thumbSide.style.alignItems = 'center';
      thumbSide.style.justifyContent = 'center';
      thumbSide.style.background = 'var(--md-surface-container)';
      thumbSide.style.color = 'var(--color-text-faint)';
      thumbSide.innerHTML = mdIcon('photo', 22);
    };
    thumbSide.appendChild(img);
    if (cfg.photos.length > 1) {
      var overlay = document.createElement('span');
      overlay.className = 'thumb-count-overlay';
      overlay.textContent = '+' + (cfg.photos.length - 1);
      thumbSide.appendChild(overlay);
    }
    thumbSide.addEventListener('click', function (e) {
      e.stopPropagation();
      cfg.onPhotoClick(0);
    });
    card.appendChild(thumbSide);
  } else if (cfg.showNoPhotoPlaceholder) {
    var placeholder = document.createElement('div');
    placeholder.className = 'no-photo-placeholder';
    placeholder.innerHTML = mdIcon('photo', 18) + '<span>Tanpa foto</span>';
    card.appendChild(placeholder);
  }

  if (cfg.onCardClick) {
    card.addEventListener('click', cfg.onCardClick);
  }

  return card;
}


/**
 * Kartu Menu Pekerjaan (inbox) — gaya visual DISELARASKAN dengan
 * buildPekerjaanListCard_ (Riwayat/Aktivitas, script-jadwal.html) agar

      actionsRow.appendChild(laporBtn);
    }

    main.appendChild(actionsRow);
  }

  card.appendChild(main);

  var side = document.createElement('div');

    placeholder.className = 'no-photo-placeholder';
    placeholder.innerHTML = mdIcon('photo', 18) + '<span>Tidak ada foto</span>';

  return card;

/**
 * PATCH — Jendela waktu hapus dihapus total (keputusan Product Owner).
 * Popup peringatan diperjelas supaya user sadar ini aksi PERMANEN TANPA
 * BATAS WAKTU — bisa menghapus Pekerjaan lama sekalipun, termasuk
 * dampaknya ke statistik periode lalu & Card Telegram yang mungkin jadi
 * tidak ter-update lagi.
 */


function confirmHapusPekerjaan(pekerjaanId, onMutated) {
  showConfirmModal(
    'Hapus pekerjaan ini secara PERMANEN? Foto terkait akan ikut terhapus dari Drive, dan data ini akan hilang dari statistik & rekap. Tindakan ini TIDAK DAPAT DIBATALKAN.',
    function () { doHapusPekerjaan(pekerjaanId, onMutated); },
    'delete',
    true,
    'Menghapus...'
  );
}

function doHapusPekerjaan(pekerjaanId, onMutated) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) {
        showSnackbar(response.error, 'error');
        return;
      }
      showSnackbar('Pekerjaan berhasil dihapus.', 'success');
      invalidateAllPekerjaanCaches_();
      if (onMutated) onMutated();
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal menghapus pekerjaan. Coba lagi.', 'error');
    })
    .hapusPekerjaan(session.accessCode, pekerjaanId);
}

/** "11/10/2026 21:24" -> "Minggu, 11/10/26 • 21:24". */
function formatDetailDateTime_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var parts = String(ddmmyyyyHHmm).split(' ');
  var dp = (parts[0] || '').split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  return formatDateTimeFull_(ddmmyyyyHHmm);
}

/** Refresh daftar Pekerjaan pada halaman yang sedang aktif — dipakai
 * setelah Ubah/Hapus dari Detail (yang bisa dibuka dari Inbox, Riwayat,
 * maupun Aktivitas, jadi tidak tahu di muka harus me-refresh yang mana). */
function refreshCurrentPekerjaanPage_() {
  if (currentPage === 'pekerjaan') loadPekerjaanInbox(true);

  else if (currentPage === 'aktivitas') loadPekerjaanAktivitas(true);

    '</div>' +
    (isMandiri ?

  document.getElementById('pekerjaan-edit-subject').value = p.subject || '';
  document.getElementById('pekerjaan-edit-description').value = p.description || '';

  if (isMandiri) {
    var performedAtEditEl = document.getElementById('pekerjaan-edit-performed-at');
    var nowStr = formatDatetimeLocalInput_(new Date());
    var minStr = formatDatetimeLocalInput_(new Date(Date.now() - 7 * 24 * 60 * 60 * 1000));
    performedAtEditEl.max = nowStr;
    performedAtEditEl.min = minStr;
    performedAtEditEl.value = p.performedAtInput || nowStr;
  }

  document.getElementById('btn-cancel-pekerjaan-edit').addEventListener('click', function () {
    openPekerjaanDetail(p);
  });

  document.getElementById('btn-submit-pekerjaan-edit').addEventListener('click', function () {
    var errorEl = document.getElementById('pekerjaan-edit-error');
    var subjectEl = document.getElementById('pekerjaan-edit-subject');

        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .ubahPekerjaan(session.accessCode, p.pekerjaanId, editData);
  });
}


/**
 * PATCH — Eksekusi Batalkan Laporan Penuntasan. Pola sama persis
 * doLepasPekerjaan/doHapusPekerjaan (busy-mode Confirm Modal).
 */
function doBatalkanPenuntasan_(pekerjaanId) {
  var session = loadSession();
  beginAction(null, 'Membatalkan...');
  google.script.run
    .withSuccessHandler(function (response) {
      hideConfirmModal();
      if (!response.success) {
        var bar = document.getElementById('linear-progress');
        if (bar) bar.classList.remove('show');
        showSnackbar(response.error, 'error');
        return;
      }
      showSnackbar('Laporan penuntasan dibatalkan. Pekerjaan kembali Dikerjakan.', 'success');
      closeActivityDetail();
      invalidateAllPekerjaanCaches_();
      refreshCurrentPekerjaanPage_();
    })
    .withFailureHandler(function () {
      hideConfirmModal();
      endAction(null);
      showSnackbar('Gagal membatalkan laporan penuntasan. Coba lagi.', 'error');
    })
    .batalkanPenuntasanPekerjaan(session.accessCode, pekerjaanId);
}

  });
}


// ============================================================
// KOMENTAR pada Detail Pekerjaan
// ============================================================

function renderKomentarSection_(p, body) {
  var section = document.createElement('div');
  section.className = 'komentar-section';
  section.innerHTML =
    '<div class="komentar-head"><span class="title">Komentar</span>' +
    '<button class="btn-icon" type="button" id="btn-komentar-refresh" aria-label="Muat ulang komentar">' + mdIcon('refresh', 18) + '</button></div>' +
    '<div id="komentar-list"><div class="inline-loading"><span class="spinner-sm"></span>Memuat komentar...</div></div>' +
    '<div id="komentar-form-wrap"></div>';
  body.appendChild(section);

  document.getElementById('btn-komentar-refresh').addEventListener('click', function () { loadKomentar_(p); });
  loadKomentar_(p);
}

function loadKomentar_(p) {
  var session = loadSession();
  var listEl = document.getElementById('komentar-list');
  if (!listEl) return;
  google.script.run
    .withSuccessHandler(function (response) {
      listEl = document.getElementById('komentar-list');
      if (!listEl) return; // Detail sudah ditutup
      if (!response.success) { listEl.innerHTML = '<div class="komentar-empty">' + response.error + '</div>'; return; }
      p.commentCount = response.data.komentar.length;
      renderKomentarList_(p, response.data.komentar);
      renderKomentarForm_(p, response.data.canKirim);
    })
    .withFailureHandler(function () {
      var el = document.getElementById('komentar-list');
      if (el) el.innerHTML = '<div class="komentar-empty">Gagal memuat komentar.</div>';
    })
    .getKomentarList(session.accessCode, p.pekerjaanId);
}

function renderKomentarList_(p, list) {
  var listEl = document.getElementById('komentar-list');
  listEl.innerHTML = '';
  if (!list.length) {
    listEl.innerHTML = '<div class="komentar-empty">Belum ada komentar.</div>';
    return;
  }
  var chat = document.createElement('div');
  chat.className = 'komentar-chat';

  list.forEach(function (k) {
    // Tampilan bubble ala chat: komentar pemilik laporan di kanan, lainnya di kiri.
    var isOwnerReport = !!p.createdBy && k.userCode === p.createdBy;
    var row = document.createElement('div');
    row.className = 'komentar-row ' + (isOwnerReport ? 'right' : 'left');

    var item = document.createElement('div');
    item.className = 'komentar-bubble ' + (isOwnerReport ? 'owner' : 'other');

    var head = document.createElement('div');
    head.className = 'komentar-bubble-head';
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = k.userName;
    head.appendChild(name);

    if (k.canUbah || k.canHapus) {
      var more = document.createElement('button');
      more.type = 'button';
      more.className = 'komentar-more';
      more.setAttribute('aria-label', 'Opsi komentar');
      more.innerHTML = mdIcon('moreHoriz', 18);
      head.appendChild(more);
    }
    item.appendChild(head);

    var text = document.createElement('div');
    text.className = 'komentar-text';
    text.textContent = k.text; // textContent: aman dari HTML injection
    item.appendChild(text);

    var when = document.createElement('div');
    when.className = 'komentar-when';
    when.textContent = k.createdAt + (k.edited ? ' · diedit' : '');
    item.appendChild(when);

    if (k.canUbah || k.canHapus) {
      // Menu opsi "•••": Edit / Hapus lewat bottom sheet (pola yang sama dengan menu lain).
      item.querySelector('.komentar-more').addEventListener('click', function () {
        var opts = [];
        if (k.canUbah) {
          opts.push({ icon: 'edit', label: 'Edit', onClick: function () { startEditKomentar_(p, k, item, text, when); } });
        }
        if (k.canHapus) {
          opts.push({ icon: 'delete', label: 'Hapus', danger: true, onClick: function () {
            showConfirmModal('Hapus komentar ini?', function () { doHapusKomentar_(p, k.komentarId); }, 'delete', true, 'Menghapus...');
          } });
        }
        openBottomSheet(opts);
      });
    }
    row.appendChild(item);
    chat.appendChild(row);
  });
  listEl.appendChild(chat);
}

function startEditKomentar_(p, k, item, textEl, whenEl) {
  var ta = document.createElement('textarea');
  ta.className = 'form-input';
  ta.rows = 3;
  ta.maxLength = 500;
  ta.value = k.text;
  item.replaceChild(ta, textEl);
  var moreBtn = item.querySelector('.komentar-more');
  if (moreBtn) moreBtn.style.display = 'none';

  var actionsEl = document.createElement('div');
  actionsEl.className = 'komentar-actions';
  var save = document.createElement('button');
  save.type = 'button';
  save.textContent = 'Simpan';
  var cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = 'Batal';
  actionsEl.appendChild(save);
  actionsEl.appendChild(cancel);
  item.replaceChild(actionsEl, whenEl);
  ta.focus();

  cancel.addEventListener('click', function () { loadKomentar_(p); });
  save.addEventListener('click', function () {
    if (!ta.value.trim()) { showSnackbar('Komentar tidak boleh kosong.', 'error'); return; }
    var session = loadSession();
    beginAction(save, 'Menyimpan...');
    google.script.run
      .withSuccessHandler(function (response) {
        endAction(save);
        if (!response.success) { showSnackbar(response.error, 'error'); return; }
        invalidateAllPekerjaanCaches_();
        loadKomentar_(p);
      })
      .withFailureHandler(function () {
        endAction(save);
        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .ubahKomentar(session.accessCode, k.komentarId, ta.value);
  });
}

function doHapusKomentar_(p, komentarId) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null); // juga menutup Confirm Modal (busy-mode)
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Komentar dihapus.', 'success');
      invalidateAllPekerjaanCaches_();
      loadKomentar_(p);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal menghapus komentar. Coba lagi.', 'error');
    })
    .hapusKomentar(session.accessCode, komentarId);
}

function renderKomentarForm_(p, canKirim) {
  var wrap = document.getElementById('komentar-form-wrap');
  if (!wrap || wrap.dataset.rendered) return; // render sekali agar teks yang sedang diketik tidak hilang
  wrap.dataset.rendered = '1';
  if (!canKirim) { wrap.innerHTML = '<div class="komentar-empty">Akun Demo hanya dapat melihat komentar.</div>'; return; }

  wrap.innerHTML =
    '<div class="komentar-form">' +
      '<textarea id="komentar-input" class="form-input" rows="1" maxlength="500" placeholder="Tulis komentar..."></textarea>' +
      '<button class="btn-primary" id="btn-komentar-kirim" type="button">Kirim</button>' +
    '</div>';

  document.getElementById('btn-komentar-kirim').addEventListener('click', function () {
    var input = document.getElementById('komentar-input');
    var btn = document.getElementById('btn-komentar-kirim');
    if (!input.value.trim()) return;
    var session = loadSession();
    beginAction(btn, 'Kirim...');
    google.script.run
      .withSuccessHandler(function (response) {
        endAction(btn);
        if (!response.success) { showSnackbar(response.error, 'error'); return; }
        input.value = '';
        invalidateAllPekerjaanCaches_();
        loadKomentar_(p);
      })
      .withFailureHandler(function () {
        endAction(btn);
        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .buatKomentar(session.accessCode, p.pekerjaanId, input.value);
  });
}


/** Baris detail dengan ikon di depan label — reuse .icon-slot. */
function detailRowWithIcon_(iconName, label, value) {
  return '<div class="activity-detail-row">' +
    '<span class="label" style="display:flex; align-items:center; gap:8px;"><span class="icon-slot">' + mdIcon(iconName, 16) + '</span>' + label + '</span>' +
    '<span class="value">' + value + '</span>' +
  '</div>';
}

// ============================================================
// MENU PEKERJAAN — Halaman Inbox (Tahap 4 Cutover, pengganti Task lama)
// ============================================================

var PEKERJAAN_AUTO_REFRESH_MS = 60000;
var pekerjaanAutoRefreshTimer = null;

function stopPekerjaanAutoRefresh() {
  if (pekerjaanAutoRefreshTimer) {
    clearInterval(pekerjaanAutoRefreshTimer);
    pekerjaanAutoRefreshTimer = null;
  }
}

function startPekerjaanAutoRefresh() {
  stopPekerjaanAutoRefresh();
  pekerjaanAutoRefreshTimer = setInterval(function () {
    if (currentPage === 'pekerjaan' && document.visibilityState === 'visible') {
      loadPekerjaanInbox(true);
    }
  }, PEKERJAAN_AUTO_REFRESH_MS);
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && currentPage === 'pekerjaan') {
    loadPekerjaanInbox(true);
  }
});

var currentPekerjaanFilter = 'all';
var PEKERJAAN_FILTERS = [
  { key: 'all', label: 'Semua' },
  { key: 'TERBUKA', label: 'Menunggu Diambil' },
  { key: 'DIKERJAKAN', label: 'Dikerjakan' }
];

function initPekerjaanInboxPage() {
  if (!appBootstrap) return;
  var role = appBootstrap.currentUser.role;
  var isFs = role === 'fs';

  var titleEl = document.getElementById('pekerjaan-header-title');
  if (titleEl) titleEl.textContent = isFs ? 'TUGAS UNTUK ANDA' : 'Menu Pekerjaan';

  var subtitleEl = document.getElementById('pekerjaan-header-subtitle');
  if (subtitleEl) {
    subtitleEl.textContent = (role === 'admin' || role === 'demo')
      ? 'Lapor Kerusakan & Permintaan dari seluruh Facility Support'
      : 'Penugasan yang menunggu atau sedang Anda kerjakan';
  }

  renderPekerjaanFilter_();
  loadPekerjaanInbox();
}

/** Dropdown filter status. Pola & CSS sama dengan filter Aktivitas. */
function renderPekerjaanFilter_() {
  var btn = document.getElementById('btn-pekerjaan-filter');
  if (!btn) return;
  var current = PEKERJAAN_FILTERS.filter(function (f) { return f.key === currentPekerjaanFilter; })[0] || PEKERJAAN_FILTERS[0];
  btn.innerHTML = '<span>' + current.label + '</span>' + mdIcon('chevronDown', 16);
  if (!btn.dataset.bound) {
    btn.dataset.bound = '1';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      openFilterPicker_('Pilih Filter Pekerjaan', PEKERJAAN_FILTERS, currentPekerjaanFilter, function (key) {
        currentPekerjaanFilter = key;
        renderPekerjaanFilter_();
        renderPekerjaanInboxList(pageDataCache.pekerjaanInbox || []);
      });
    });
  }
}

/** Pemilih filter bergaya dialog tengah (radio) — dipakai Pekerjaan & Aktivitas. */
function openFilterPicker_(title, options, currentKey, onPick) {
  openBottomSheet(options.map(function (o) {
    return { icon: 'list', label: String(o.label).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }),
      radio: true, selected: o.key === currentKey, onClick: function () { onPick(o.key); } };
  }), { center: true, title: title });
}


function loadPekerjaanInbox(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.pekerjaanInbox;

  if (cached && !force) {
    renderPekerjaanInboxList(cached);
    return;
  }

  if (!cached) {
  
        renderListSkeleton_('pekerjaan-list', 3, 'Memuat data pekerjaan...');
  }

  google.script.run
    .withSuccessHandler(function (response) {
      var container = document.getElementById('pekerjaan-list');
      if (!response.success) {
        if (!cached) container.innerHTML = '<p>' + response.error + '</p>';
        var bar1 = document.getElementById('linear-progress');
        if (bar1) bar1.classList.remove('show');
        return;
      }
      pageDataCache.pekerjaanInbox = response.data.pekerjaan;
      renderPekerjaanInboxList(response.data.pekerjaan);
      // PATCH — Jaring pengaman: SELALU matikan bar setelah render
      // selesai, apa pun yang memicu loadPekerjaanInbox(true) (Ambil,
      // Lepas, pull-to-refresh, auto-refresh 60 detik, dll). Mencegah
      // bar "menggantung" akibat tumpang-tindih pemanggilan
      // beginAction/endAction dari aksi-aksi yang terjadi berurutan
      // cepat.
      var bar2 = document.getElementById('linear-progress');
      if (bar2) bar2.classList.remove('show');
    })
    .withFailureHandler(function () {
      if (!cached) document.getElementById('pekerjaan-list').innerHTML = '<p>Gagal memuat daftar pekerjaan.</p>';
      var bar3 = document.getElementById('linear-progress');
      if (bar3) bar3.classList.remove('show');
    })
    .getPekerjaanList(session.accessCode, { view: 'inbox' });
}

function renderPekerjaanInboxList(list) {
  var container = document.getElementById('pekerjaan-list');
  container.innerHTML = '';

  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('task', 26) + '</div>Tidak ada pekerjaan di inbox Anda.</div>';
    return;
  }

  if (currentPekerjaanFilter !== 'all') {
    list = list.filter(function (p) { return p.status === currentPekerjaanFilter; });
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('task', 26) + '</div>Tidak ada pekerjaan dengan status ini.</div>';
      return;
    }
  }

  var STATUS_SORT_PRIORITY = { DIKERJAKAN: 0, TERBUKA: 1 };
  list = list.slice().sort(function (a, b) {
    var pa = STATUS_SORT_PRIORITY[a.status] != null ? STATUS_SORT_PRIORITY[a.status] : 2;
    var pb = STATUS_SORT_PRIORITY[b.status] != null ? STATUS_SORT_PRIORITY[b.status] : 2;
    return pa - pb;
  });

  list.forEach(function (p) {
    container.appendChild(buildPekerjaanInboxCard_(p));
  });
}



function doAmbilPekerjaan(pekerjaanId) {
  var session = loadSession();
  beginAction(null, 'Mengambil...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) { showSnackbar(response.error, 'error'); }
      else { showSnackbar('Pekerjaan berhasil diambil.', 'success'); }
      invalidateAllPekerjaanCaches_();
      loadPekerjaanInbox(true);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal mengambil pekerjaan. Coba lagi.', 'error');
    })
    .ambilPekerjaan(session.accessCode, pekerjaanId);
}


/**
 * PATCH — FIX bug "card tidak sinkron setelah Ambil" (status masih
 * tampil 'Menunggu Diambil', tombol Lepas tidak muncul di Detail sampai
 * refresh manual). Akar masalah SEBELUMNYA: hanya tombol & field
 * p.status/p.handledBy yang ditambal manual — badge status di kartu,
 * p.statusLabel, p.canLepas, p.canAmbil TIDAK ikut diperbarui, membuat
 * objek `p` dalam state SEPARUH MATANG yang lalu dipakai Detail
 * (openPekerjaanDetail) sehingga tombol Lepas gagal muncul.
 *
 * FIX: setelah ambilPekerjaan() sukses, panggil getPekerjaanList()
 * ULANG (ringan — 1 row saja secara efektif karena filter di client)
 * untuk mendapat OBJEK PEKERJAAN YANG BENAR-BENAR FRESH dari server
 * (statusLabel/canLepas/canAmbil semua terhitung benar oleh backend,
 * SATU sumber kebenaran — bukan ditambal manual di frontend lagi).
 * Kartu LAMA di-replace total dengan kartu baru hasil
 * buildPekerjaanInboxCard_(freshP) — bukan cuma ubah tombolnya saja.
 */

/** Bar progres kecil di dalam kartu. set(pct) menaikkan bar & teks. */
function attachCardProgress_(cardEl) {
  var main = cardEl && cardEl.querySelector('.list-card-row-main');
  if (!main) return { set: function () {}, remove: function () {} };

  var box = document.createElement('div');
  box.className = 'card-progress';
  box.innerHTML =
    '<div class="card-progress-bar"><div class="card-progress-fill"></div></div>' +
    '<div class="card-progress-text"></div>';
  main.appendChild(box);

  var fill = box.querySelector('.card-progress-fill');
  var text = box.querySelector('.card-progress-text');
  return {
    set: function (pct) {
      fill.style.width = pct + '%';
      text.textContent = 'Mengecek data penugasan... (' + pct + '%)';
    },
    remove: function () { if (box.parentNode) box.parentNode.removeChild(box); }
  };
}

/**
 * Ambil Pekerjaan in-place. Progres kartu mengikuti tahap NYATA:
 * 10% mulai -> 55% pengambilan berhasil di server -> 100% data kartu
 * terbaru diterima. Kartu lalu diganti kartu segar dari server.
 */
function doAmbilPekerjaanInline_(buttonEl, p) {
  var session = loadSession();
  var cardEl = buttonEl.closest('.list-card');
  var progress = attachCardProgress_(cardEl);
  var toastDetail = 'Tugas "' + truncateText_(p.subject || p.description, 40) + '" kini ada di tangan Anda. Tekan Buat Laporan setelah selesai.';

  function toastSuccess() { showSnackbar('Pekerjaan berhasil diambil', 'success', toastDetail); }

  progress.set(10);
  beginAction(buttonEl, 'Mengambil...');
  google.script.run
    .withSuccessHandler(function (response) {
      var bar = document.getElementById('linear-progress');
      if (bar) bar.classList.remove('show');

      if (!response.success) {
        progress.remove();
        if (document.body.contains(buttonEl)) endAction(buttonEl);
        showSnackbar(response.error, 'error');
        return;
      }
      invalidateAllPekerjaanCaches_();
      progress.set(55);

      google.script.run
        .withSuccessHandler(function (listResponse) {
          if (!listResponse.success || !document.body.contains(cardEl)) {
            toastSuccess();
            loadPekerjaanInbox(true);
            return;
          }
          progress.set(100);
          var freshP = listResponse.data.pekerjaan.find(function (row) { return row.pekerjaanId === p.pekerjaanId; });
          setTimeout(function () {
            if (!document.body.contains(cardEl)) { toastSuccess(); loadPekerjaanInbox(true); return; }
            if (!freshP) {
              cardEl.remove();
            } else {
              cardEl.replaceWith(buildPekerjaanInboxCard_(freshP));
            }
            toastSuccess();
          }, 300);
        })
        .withFailureHandler(function () {
          toastSuccess();
          loadPekerjaanInbox(true);
        })
        .getPekerjaanList(session.accessCode, { view: 'inbox' });
    })
    .withFailureHandler(function () {
      var bar = document.getElementById('linear-progress');
      if (bar) bar.classList.remove('show');
      progress.remove();
      if (document.body.contains(buttonEl)) endAction(buttonEl);
      showSnackbar('Gagal mengambil pekerjaan. Coba lagi.', 'error');
    })
    .ambilPekerjaan(session.accessCode, p.pekerjaanId);
}

function doLepasPekerjaan(pekerjaanId) {
  showConfirmModal('Lepas pekerjaan ini agar bisa diambil pihak lain?', function () {
    executeLepasPekerjaan(pekerjaanId);
  }, 'delete', true, 'Melepas...');
}

/**
 * PATCH — FIX bug "popup Lepas tidak pernah tertutup, terlihat freeze".
 * Akar masalah: endAction(null) sengaja TIDAK dipanggil di jalur sukses
 * (patch sebelumnya, untuk cegah race bar loading dengan
 * loadPekerjaanInbox). TAPI endAction() jugalah satu-satunya titik yang
 * otomatis menutup Confirm Modal (hook di script-core.html) — sehingga
 * modal tidak pernah tertutup di jalur ini. FIX: panggil
 * hideConfirmModal() SECARA EKSPLISIT & SEGERA begitu response diterima
 * (terpisah dari urusan bar, yang tetap ditangani loadPekerjaanInbox
 * sendiri seperti sebelumnya — TIDAK diubah).
 */
function executeLepasPekerjaan(pekerjaanId) {
  var session = loadSession();
  beginAction(null, 'Melepas...');
  google.script.run
    .withSuccessHandler(function (response) {
      hideConfirmModal();
      if (!response.success) {
        var bar = document.getElementById('linear-progress');
        if (bar) bar.classList.remove('show');
        showSnackbar(response.error, 'error');
        return;
      }
      showSnackbar('Pekerjaan dilepas kembali.', 'success');
      invalidateAllPekerjaanCaches_();
      loadPekerjaanInbox(true);
    })
    .withFailureHandler(function () {
      hideConfirmModal();
      endAction(null);
      showSnackbar('Gagal melepas pekerjaan. Coba lagi.', 'error');
    })
    .lepasPekerjaan(session.accessCode, pekerjaanId);
}
