<script>
// ============================================================
// PEKERJAAN — FORM "BUAT" (Tahap 4 Cutover — form dinamis pengganti
// form Laporan & form Penugasan terpisah lama)
// ============================================================

var MAX_PHOTOS = 3;
var selectedPhotos = []; // { base64, mimeType, previewUrl } — foto kondisi awal (atau foto penuntasan pada mode "Buat Laporan")
var activePhotoSlotIndex = null;

// 3.1 — Dropdown Jenis difilter PER ROLE di frontend. Validasi "siapa
// boleh membuat" TETAP ditegakkan backend (createPekerjaan) — filter
// ini murni UX, bukan satu-satunya lapisan keamanan.
// PATCH — Admin job desk murni dispatcher: hanya Penugasan. Validasi
// SERVER-SIDE (createPekerjaan, pekerjaan.gs) juga WAJIB diterapkan di
// samping filter dropdown ini — filter ini murni UX.
var JENIS_ROLE_FILTER = {
  admin: ['penugasan'],
  fs: ['lapor_kerusakan', 'permintaan', 'kebersihan', 'perbaikan', 'lainnya'],
  demo: []
};


/**
 * Patch Bug Navigasi & Workflow (Bagian 3) — konteks prefill saat form
 * "Buat" dibuka lewat tombol "Buat Laporan" dari sebuah Pekerjaan yang
 * sedang DIKERJAKAN (lihat openBuatLaporanForPekerjaan()). null berarti
 * form beroperasi dalam mode normal (createPekerjaan). Saat terisi,
 * submit form memanggil selesaikanPekerjaan() TERHADAP pekerjaanId yang
 * sama (bukan membuat Pekerjaan baru) — TIDAK ADA business logic baru,
 * murni memakai ulang endpoint selesaikanPekerjaan yang sudah ada
 * (sebelumnya hanya bisa diakses lewat modal "Selesaikan").
 */
var buatPrefillContext = null;

function updateJenisIcon() {
  var jenisSelect = document.getElementById('form-jenis');
  var info = JENIS_PEKERJAAN_BADGE[jenisSelect.value] || { icon: 'description', cls: 'badge-neutral' };
  var color = STATUS_BUBBLE_COLOR[info.cls] || STATUS_BUBBLE_COLOR['badge-neutral'];
  var iconEl = document.getElementById('form-jenis-icon');
  if (!iconEl) return;
  iconEl.innerHTML = mdIcon(info.icon, 15);
  iconEl.style.background = color.bg;
  iconEl.style.color = color.fg;
}

function updateAssignmentFieldsVisibility() {
  var jenisSelect = document.getElementById('form-jenis');
  // Mode "Buat Laporan" (prefill) selalu menyembunyikan field Mode
  // Penugasan/Petugas Penerima — konteksnya sudah pekerjaan yang ada,
  // bukan pembuatan Penugasan baru (Bagian 3).
  var isPenugasan = !buatPrefillContext && jenisSelect.value === 'penugasan';
  var modeGroup = document.getElementById('form-assignment-mode-group');
  if (modeGroup) modeGroup.style.display = isPenugasan ? 'block' : 'none';
  var modeSelect = document.getElementById('form-assignment-mode');
  var isDirect = isPenugasan && modeSelect && modeSelect.value === 'direct';
  var targetGroup = document.getElementById('form-target-user-group');
  if (targetGroup) targetGroup.style.display = isDirect ? 'block' : 'none';
}

var formBuatListenersAttached = false;

function attachFormBuatListenersOnce_() {
  if (formBuatListenersAttached) return;
  formBuatListenersAttached = true;

  var jenisSelect = document.getElementById('form-jenis');
  jenisSelect.addEventListener('change', updateJenisIcon);
  jenisSelect.addEventListener('change', updateAssignmentFieldsVisibility);
  jenisSelect.addEventListener('change', updateFormProgress);
  jenisSelect.addEventListener('change', updatePerformedAtFieldVisibility);

  var modeSelectEl = document.getElementById('form-assignment-mode');
  if (modeSelectEl) modeSelectEl.addEventListener('change', updateAssignmentFieldsVisibility);

  var floorSelect = document.getElementById('form-floor');
  floorSelect.addEventListener('change', updateFormProgress);

  // Tampilan baru: Jenis & Lantai dipilih lewat bottom sheet (radio). <select> asli
  // tetap menjadi sumber nilai (id, value, event 'change' tidak berubah).
  enhanceSelectWithSheet_(jenisSelect, function (o) {
    var info = JENIS_PEKERJAAN_BADGE[o.value];
    return info ? info.icon : 'description';
  });
  enhanceSelectWithSheet_(floorSelect, function () { return 'building'; });

  var modeSel = document.getElementById('form-assignment-mode');
  var targetSel = document.getElementById('form-target-user');
  var syncModeIcon = function () {
    var ic = document.getElementById('form-mode-icon');
    if (ic && modeSel) ic.innerHTML = mdIcon(modeSel.value === 'direct' ? 'personCheck' : 'sensors', 18);
  };
  var tIc = document.getElementById('form-target-icon');
  if (tIc) tIc.innerHTML = mdIcon('personCheck', 18);
  if (modeSel) {
    syncModeIcon();
    modeSel.addEventListener('change', syncModeIcon);
    enhanceSelectWithSheet_(modeSel, function (o) { return o.value === 'direct' ? 'personCheck' : 'sensors'; });
  }
  if (targetSel) enhanceSelectWithSheet_(targetSel, function () { return 'account'; });
}

function enhanceSelectWithSheet_(selectEl, iconFor) {
  var wrap = selectEl.closest('.select-field-wrap');
  if (!wrap || wrap._sheetBound) return;
  wrap._sheetBound = true;
  wrap.classList.add('sheet-select');
  var hit = document.createElement('button');
  hit.type = 'button';
  hit.className = 'select-sheet-hit';
  var SHEET_TITLES_ = { 'form-jenis': 'Pilih Jenis', 'form-floor': 'Pilih Lantai', 'form-assignment-mode': 'Pilih Mode Penugasan', 'form-target-user': 'Pilih Petugas Penerima' };
  var sheetTitle = SHEET_TITLES_[selectEl.id] || 'Pilih';
  hit.setAttribute('aria-label', sheetTitle);
  wrap.appendChild(hit);
  hit.addEventListener('click', function () {
    if (selectEl.disabled) return;
    var items = [];
    for (var i = 0; i < selectEl.options.length; i++) {
      (function (o) {
        if (!o.value) return; // placeholder "Pilih lantai" tidak ditampilkan sebagai opsi
        items.push({
          icon: iconFor(o),
          label: String(o.textContent).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }),
          radio: true,
          selected: o.value === selectEl.value,
          onClick: function () {
            selectEl.value = o.value;
            selectEl.dispatchEvent(new Event('change', { bubbles: true }));
          }
        });
      })(selectEl.options[i]);
    }
    openBottomSheet(items, { center: true, title: sheetTitle });
  });
}

/** Overlay "Mengirim data ke server" (form Buat & Penyelesaian). */
function showSendingOverlay_(text) {
  var ov = document.getElementById('sending-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'sending-overlay';
    ov.innerHTML = '<div class="sending-card"><div class="sending-ring"></div><div class="sending-title">Mengirim data ke server</div>' +
      '<div class="sending-bar"><div class="sending-bar-fill"></div></div><div class="sending-sub" id="sending-sub"></div></div>';
    document.body.appendChild(ov);
  }
  document.getElementById('sending-sub').textContent = text || 'Mengunggah laporan & melampirkan foto...';
  ov.classList.add('show');
}
function hideSendingOverlay_() {
  var ov = document.getElementById('sending-overlay');
  if (ov) ov.classList.remove('show');
}


/**
 * PATCH — "Waktu Laporan" (hanya arah Mandiri). Default state tertutup
 * ("Sekarang (otomatis)"), tap "Ubah" membuka picker datetime-local +
 * preview teks format Indonesia lengkap. Reuse JENIS_MANDIRI_SET_ yang
 * sudah ada (dipakai showPekerjaanSuccessCard) dan INDO_DAY_NAMES_
 * (script-jadwal.html, SATU sumber kebenaran nama hari — sudah
 * ter-include lebih dulu baik di index.html maupun buat-cepat.html).
 */
var INDO_MONTH_FULL_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function formatDatetimeLocalInput_(d) {
  function pad(n) { return n < 10 ? '0' + n : n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/** "2026-10-04T20:25" (value datetime-local) -> "Minggu, 04 Oktober 2026 · 20:25". */
function formatPerformedAtPreview_(datetimeLocalValue) {
  var d = new Date(datetimeLocalValue);
  if (isNaN(d.getTime())) return '';
  function pad(n) { return n < 10 ? '0' + n : n; }
  var dayName = INDO_DAY_NAMES_[d.getDay()];
  return dayName + ', ' + pad(d.getDate()) + ' ' + INDO_MONTH_FULL_[d.getMonth()] + ' ' + d.getFullYear() + ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function setPerformedAtBounds_() {
  var input = document.getElementById('form-performed-at');
  if (!input) return;
  var now = new Date();
  var maxStr = formatDatetimeLocalInput_(now);
  var minStr = formatDatetimeLocalInput_(new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000));
  input.max = maxStr;
  input.min = minStr;
}

/** Kembali ke state tertutup ("Sekarang (otomatis)") — input dikosongkan
 * supaya submit handler mengirim performedAt='' (backend default ke
 * `now`, perilaku identik sebelum fitur ini ada). */
function collapsePerformedAt_() {
  var input = document.getElementById('form-performed-at');
  if (input) input.value = '';
  var collapsed = document.getElementById('performed-at-collapsed');
  var expanded = document.getElementById('performed-at-expanded');
  if (collapsed) collapsed.style.display = 'flex';
  if (expanded) expanded.style.display = 'none';
}

function expandPerformedAt_() {
  setPerformedAtBounds_();
  var input = document.getElementById('form-performed-at');
  if (input && !input.value) input.value = formatDatetimeLocalInput_(new Date());
  var collapsed = document.getElementById('performed-at-collapsed');
  var expanded = document.getElementById('performed-at-expanded');
  if (collapsed) collapsed.style.display = 'none';
  if (expanded) expanded.style.display = 'block';
  updatePerformedAtPreview_();
}

function updatePerformedAtPreview_() {
  var input = document.getElementById('form-performed-at');
  var preview = document.getElementById('performed-at-preview');
  if (!input || !preview) return;
  preview.textContent = formatPerformedAtPreview_(input.value);
}

var performedAtListenersAttached_ = false;
function attachPerformedAtListenersOnce_() {
  if (performedAtListenersAttached_) return;
  performedAtListenersAttached_ = true;

  var editBtn = document.getElementById('btn-performed-at-edit');
  if (editBtn) editBtn.addEventListener('click', expandPerformedAt_);

  var resetBtn = document.getElementById('btn-performed-at-reset');
  if (resetBtn) resetBtn.addEventListener('click', collapsePerformedAt_);

  var input = document.getElementById('form-performed-at');
  if (input) input.addEventListener('change', updatePerformedAtPreview_);

  var labelIcon = document.getElementById('performed-at-label-icon');
  if (labelIcon) labelIcon.innerHTML = mdIcon('schedule', 16);
}

function updatePerformedAtFieldVisibility() {
  var jenisSelect = document.getElementById('form-jenis');
  var group = document.getElementById('form-performed-at-group');
  if (!group) return;
  var isMandiri = !buatPrefillContext && JENIS_MANDIRI_SET_.indexOf(jenisSelect.value) !== -1;
  group.style.display = isMandiri ? 'block' : 'none';
  if (isMandiri) {
    attachPerformedAtListenersOnce_();
    setPerformedAtBounds_();
  } else {
    collapsePerformedAt_();
  }
}


/**
 * Tampilan form Buat (mode normal). Mode "Buat Laporan" TIDAK lagi memakai
 * form ini — lihat form Penyelesaian Tugas (#buat-selesai-wrap) di bawah.
 */
function applyBuatModeUI_() {
  var banner = document.getElementById('buat-context-banner');
  if (banner) banner.style.display = 'none';

  var headerTitle = document.getElementById('buat-header-title');
  if (headerTitle) headerTitle.textContent = 'Buat Pekerjaan';

  var jenisSelect = document.getElementById('form-jenis');
  var floorSelect = document.getElementById('form-floor');
  [jenisSelect, floorSelect].forEach(function (el) {
    if (!el) return;
    el.disabled = false;
    el.classList.remove('locked-field', 'locked-field-green');
  });

  var descLabel = document.getElementById('form-description-label');
  var photoLabel = document.getElementById('form-photo-label');
  if (descLabel) descLabel.textContent = 'Keterangan';
  if (photoLabel) photoLabel.textContent = 'Foto Kondisi Awal (opsional, maks. 3)';

  var submitBtn = document.getElementById('btn-submit-report');
  if (submitBtn) submitBtn.innerHTML = mdIcon('upload', 18) + '<span>Simpan & Kirim</span>';
}

/**
 * Dipanggil dari tombol "Buat Laporan" pada kartu Pekerjaan yang sedang
 * DIKERJAKAN (Menu Pekerjaan). Menyimpan SELURUH data pekerjaan sebagai
 * referensi (read-only) lalu membuka form Penyelesaian Tugas di menu Buat.
 * Berlaku untuk kedua arah (Admin → FS dan FS → Admin) — tidak ada jenis
 * yang dipaksa; backend selesaikanPekerjaan() yang memvalidasi hak akses.
 */
function openBuatLaporanForPekerjaan(p) {
  buatPrefillContext = { pekerjaanId: p.pekerjaanId, pekerjaan: p };
  goToPage('buat');
}

function initPekerjaanForm() {
  if (!appBootstrap) return;

  // Mode Penyelesaian Tugas: form terpisah, state terpisah.
  if (buatPrefillContext && document.getElementById('buat-selesai-wrap')) {
    showBuatMode_(true);
    renderSelesaiForm_();
    return;
  }
  buatPrefillContext = null;
  showBuatMode_(false);

  var role = appBootstrap.currentUser.role;

  var allowedJenis = JENIS_ROLE_FILTER[role] || [];
  var jenisSelect = document.getElementById('form-jenis');
  jenisSelect.innerHTML = '';

  var jenisSource = (appBootstrap.jenisPekerjaanList || []).filter(function (j) { return allowedJenis.indexOf(j.value) !== -1; });
  jenisSource.forEach(function (j) {
    var opt = document.createElement('option');
    opt.value = j.value;
    opt.textContent = j.label;
    jenisSelect.appendChild(opt);
  });

  // Lantai
  var floorSelect = document.getElementById('form-floor');
  floorSelect.innerHTML = '<option value="">Pilih lantai</option>';
  (appBootstrap.master.floors || []).forEach(function (f) {
    var opt = document.createElement('option');
    opt.value = f.floor_code;
    opt.textContent = f.floor_name;
    floorSelect.appendChild(opt);
  });

  // Petugas Penerima (Direct Assignment)
  var targetSelect = document.getElementById('form-target-user');
  if (targetSelect) {
    targetSelect.innerHTML = '<option value="">Pilih petugas</option>';
    (appBootstrap.master.fsUsers || []).forEach(function (u) {
      var opt = document.createElement('option');
      opt.value = u.userCode;
      opt.textContent = u.displayName;
      targetSelect.appendChild(opt);
    });
  }

  attachFormBuatListenersOnce_();
  attachDraftListenersOnce_();
  // Draft: pulihkan isian (tampilkan catatan hanya bila form masih kosong = baru dibuka/dimuat ulang).
  var wasPristine_ = !draftValue_('form-description').trim() && !draftValue_('form-subject').trim() && !draftValue_('form-floor');
  var draftApplied_ = draftApply_();
  var noteEl_ = draftNoteEl_();
  if (noteEl_ && draftApplied_ && wasPristine_) noteEl_.style.display = 'flex';
  else if (noteEl_ && !draftApplied_) noteEl_.style.display = 'none';
  ['form-floor', 'form-description', 'form-target-user'].forEach(function (id) { clearInlineError_(document.getElementById(id)); });

  applyBuatModeUI_();
  updateJenisIcon();
  updateAssignmentFieldsVisibility();
  updatePerformedAtFieldVisibility();
  renderPhotoSlots();
  updateFormProgress();
}



// ------------------------------------------------------------
// DRAFT OTOMATIS form Buat Pekerjaan (disimpan di perangkat ini saja)
// Isian teks, jenis, lantai, dan penerima tersimpan otomatis supaya tidak hilang bila aplikasi
// tertutup/jaringan putus. Foto TIDAK ikut disimpan (terlalu besar). Dihapus saat berhasil kirim,
// saat Hapus draft, saat keluar (logout), dan otomatis setelah 3 hari.
// ------------------------------------------------------------
var DRAFT_PREFIX_ = 'fa_draft:v1:';
var DRAFT_MAX_AGE_MS_ = 3 * 24 * 60 * 60 * 1000;
var draftApplying_ = false;
var draftTimer_ = null;

function draftKey_() {
  var s = (typeof loadSession === 'function') ? loadSession() : null;
  return (s && s.accessCode) ? DRAFT_PREFIX_ + String(s.accessCode).trim().toUpperCase() : null;
}

function draftRead_() {
  try {
    var k = draftKey_(); if (!k) return null;
    var raw = localStorage.getItem(k); if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || !o.t || (Date.now() - o.t) > DRAFT_MAX_AGE_MS_) { localStorage.removeItem(k); return null; }
    return o;
  } catch (e) { return null; }
}

function draftRemove_() {
  try { var k = draftKey_(); if (k) localStorage.removeItem(k); } catch (e) { /* abaikan */ }
}

function draftClearAll_() {
  try {
    var del = [];
    for (var i = 0; i < localStorage.length; i++) { var key = localStorage.key(i); if (key && key.indexOf(DRAFT_PREFIX_) === 0) del.push(key); }
    del.forEach(function (key) { localStorage.removeItem(key); });
  } catch (e) { /* abaikan */ }
}

function draftValue_(id) { var el = document.getElementById(id); return el ? el.value : ''; }

function draftSaveNow_() {
  if (draftApplying_ || buatPrefillContext) return;   // bukan saat memulihkan / mode Penyelesaian
  if (!document.getElementById('form-jenis')) return;
  var d = {
    t: Date.now(),
    jenis: draftValue_('form-jenis'), floor: draftValue_('form-floor'),
    subject: draftValue_('form-subject'), desc: draftValue_('form-description'),
    mode: draftValue_('form-assignment-mode'), target: draftValue_('form-target-user')
  };
  // Hanya bila ada isian teks/penerima (jenis & lantai saja tidak dihitung sebagai draft).
  if (!(d.subject.trim() || d.desc.trim() || d.target)) { draftRemove_(); return; }
  try { var k = draftKey_(); if (k) localStorage.setItem(k, JSON.stringify(d)); } catch (e) { /* kuota/terblokir: abaikan */ }
}

function draftSaveSoon_() {
  if (draftApplying_) return;
  clearTimeout(draftTimer_);
  draftTimer_ = setTimeout(draftSaveNow_, 500);
}

/** Terapkan draft ke form (dipanggil setelah opsi Jenis/Lantai/Petugas dibangun). Mengembalikan true bila ada draft diterapkan. */
function draftApply_() {
  var d = draftRead_();
  if (!d) return false;
  draftApplying_ = true;
  try {
    function setSel(id, v) {
      var el = document.getElementById(id);
      if (!el || !v) return;
      for (var i = 0; i < el.options.length; i++) { if (el.options[i].value === v) { el.value = v; return; } }
    }
    setSel('form-jenis', d.jenis);
    setSel('form-floor', d.floor);
    setSel('form-assignment-mode', d.mode);
    setSel('form-target-user', d.target);
    var sub = document.getElementById('form-subject'); if (sub && d.subject) sub.value = String(d.subject).slice(0, 100);
    var desc = document.getElementById('form-description');
    if (desc && d.desc) {
      desc.value = String(d.desc).slice(0, 500);
      var cnt = document.getElementById('form-description-counter'); if (cnt) cnt.textContent = desc.value.length + '/500';
    }
  } finally { draftApplying_ = false; }
  return true;
}

function draftNoteEl_() {
  var note = document.getElementById('form-draft-note');
  if (note) return note;
  var card = document.getElementById('buat-form-card');
  if (!card) return null;
  note = document.createElement('div');
  note.id = 'form-draft-note';
  note.className = 'draft-note';
  note.style.display = 'none';
  note.innerHTML = '<span class="draft-note-txt">Draft dipulihkan dari perangkat ini. Foto perlu ditambahkan lagi.</span>' +
    '<button type="button" class="draft-note-btn">Hapus draft</button>';
  note.querySelector('.draft-note-btn').addEventListener('click', function () {
    clearTimeout(draftTimer_);
    draftRemove_();
    ['form-subject', 'form-description'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
    var cnt = document.getElementById('form-description-counter'); if (cnt) cnt.textContent = '0/500';
    var fl = document.getElementById('form-floor'); if (fl) fl.value = '';
    var tg = document.getElementById('form-target-user'); if (tg) tg.value = '';
    note.style.display = 'none';
    initPekerjaanForm();
    showSnackbar('Draft dihapus.', 'info');
  });
  var header = card.querySelector('.card-header-row');
  if (header && header.parentNode === card) card.insertBefore(note, header.nextSibling); else card.insertBefore(note, card.firstChild);
  return note;
}

var draftListenersAttached_ = false;
function attachDraftListenersOnce_() {
  if (draftListenersAttached_) return;
  draftListenersAttached_ = true;
  ['form-jenis', 'form-floor', 'form-subject', 'form-description', 'form-assignment-mode', 'form-target-user'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', draftSaveSoon_);
    el.addEventListener('change', draftSaveSoon_);
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { clearTimeout(draftTimer_); draftSaveNow_(); } });
  window.addEventListener('pagehide', function () { clearTimeout(draftTimer_); draftSaveNow_(); });
}

function resetBuatPrefillContext_() {
  buatPrefillContext = null;
}

/**
 * Progres pengisian form — Jenis, Lantai, Keterangan, dan foto
 * masing-masing berkontribusi 25%. Subjek tidak dihitung karena
 * eksplisit opsional.
 */
function updateFormProgress() {
  var progressEl = document.getElementById('form-progress-text');
  if (!progressEl) return;

  var jenis = document.getElementById('form-jenis').value;
  var floor = document.getElementById('form-floor').value;
  var desc = document.getElementById('form-description').value.trim();
  var photoCount = selectedPhotos.filter(Boolean).length;

  var doneCount = 0;
  if (jenis) doneCount++;
  if (floor) doneCount++;
  if (desc) doneCount++;
  if (photoCount > 0) doneCount++;

  // Audit #10: foto opsional -> progres hanya menghitung kolom wajib (Jenis, Lantai, Keterangan).
  var requiredDone = (jenis ? 1 : 0) + (floor ? 1 : 0) + (desc ? 1 : 0);
  var percent = Math.round((requiredDone / 3) * 100);
  progressEl.textContent = 'Kolom wajib: ' + percent + '% | ' + photoCount + ' Foto (opsional)';
}

// ------------------- PHOTO SLOTS (foto kondisi awal) -------------------


/**
 * PATCH — redesain slot foto berlabel. Kelas 'photo-slot-v2' SENGAJA
 * BARU (bukan 'photo-slot' lama) — 'photo-slot'/'photo-slots' masih
 * dipakai slot gambar Content Management (renderContentImageSlot_,
 * script-jadwal.html), jadi dipisah supaya perubahan ini TIDAK ikut
 * mengubah tampilan form Content Management. Caption per slot MURNI
 * visual/saran urutan pengambilan foto — ketiganya tetap tersimpan
 * generik sebagai array (initial_photos_json/completion_photos_json),
 * tidak ada perbedaan perlakuan data per index.
 */
var PHOTO_SLOT_CAPTIONS_ = ['Foto Kondisi Awal', 'Foto Hasil / Sesudah', 'Foto Detail Tambahan'];
var SELESAI_PHOTO_CAPTIONS_UNUSED_ = 0;

/** Audit #9: konfirmasi hapus foto; slot dikosongkan di tempat (foto lain TIDAK bergeser, caption tetap cocok). */
/** Audit #7: kunci kirim — dipakai ulang saat 'Coba lagi', diganti baru setelah berhasil. */
var createSubmitKeyValue_ = '';
function createSubmitKey_() {
  if (!createSubmitKeyValue_) {
    createSubmitKeyValue_ = Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }
  return createSubmitKeyValue_;
}

/** Audit #13: slot foto bisa difokus & dioperasikan keyboard/pembaca layar. */
function makeSlotAccessible_(slot, caption, filled) {
  slot.setAttribute('role', 'button');
  slot.tabIndex = 0;
  slot.setAttribute('aria-label', (filled ? 'Ganti ' : 'Tambah ') + (caption || 'foto').toLowerCase());

/**
 * Kompresi foto di client (Section 18.2):
 * resize sisi terpanjang maks 1280px, JPEG, kompresi adaptif target ±100KB.
 * Generik — dipakai baik oleh foto kondisi awal maupun foto penuntasan,
 * juga oleh gambar Content Management.
 */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var TARGET = 100 * 1024;
    function sizeOf(d) { return Math.round((d.length - 'data:image/jpeg;base64,'.length) * 3 / 4); }
    function encode(src, sw, sh, maxSide) {
      var w = sw, h = sh;
      if (w > h && w > maxSide) { h = Math.round(h * (maxSide / w)); w = maxSide; }
      else if (h >= w && h > maxSide) { w = Math.round(w * (maxSide / h)); h = maxSide; }
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      // Latar putih: PNG transparan tidak menjadi hitam saat jadi JPEG.
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(src, 0, 0, w, h);
      var quality = 0.8;
      var dataUrl = canvas.toDataURL('image/jpeg', quality);
      var attempts = 0;
      while (sizeOf(dataUrl) > TARGET && quality > 0.3 && attempts < 8) {
        quality -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
        attempts++;
      }
      canvas.width = 0; canvas.height = 0; // lepas memori kanvas
      return dataUrl;
    }
    function finish(src, sw, sh) {
      var d = encode(src, sw, sh, 1280);
      // Foto sangat detail yang masih jauh di atas target: perkecil sedikit lagi.
      if (sizeOf(d) > TARGET * 1.6) d = encode(src, sw, sh, 1024);
      resolve({ base64: d.split(',')[1], mimeType: 'image/jpeg', previewUrl: d });
    }
    // Jalur cadangan (FileReader + <img>) untuk browser tanpa createImageBitmap.
    function viaImage() {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Gagal membaca file')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Gagal memuat gambar')); };
        img.onload = function () {
          try { finish(img, img.width, img.height); } catch (e) { reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    if (window.createImageBitmap) {
      // Jalur cepat: langsung dari berkas (tanpa base64 perantara), orientasi EXIF dihormati.
      createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bmp) {
        try { finish(bmp, bmp.width, bmp.height); } catch (e) { viaImage(); }
        try { bmp.close(); } catch (e2) {}
      }, viaImage);
    } else {
      viaImage();
    }
  });
}

document.getElementById('btn-submit-report').addEventListener('click', function () {

  var floorEl = document.getElementById('form-floor');
  var descEl = document.getElementById('form-description');
  var targetEl = document.getElementById('form-target-user');
  clearFieldErrors([floorEl, descEl, targetEl]);

  var jenis = jenisEl.value;
  var isPenugasan = jenis === 'penugasan';
  var assignmentModeEl = document.getElementById('form-assignment-mode');
  var assignmentMode = isPenugasan && assignmentModeEl ? assignmentModeEl.value : '';

  
var performedAtEl = document.getElementById('form-performed-at');
  var data = {
    jenis: jenis,
    floorCode: floorEl.value,
    subject: document.getElementById('form-subject').value,
    description: descEl.value,

    performedAt: (performedAtEl && performedAtEl.offsetParent !== null && performedAtEl.value) ? performedAtEl.value : ''
  };


  if (!jenis) { errorEl.textContent = 'Jenis pekerjaan wajib dipilih.'; return; }
  [floorEl, descEl, targetEl].forEach(clearInlineError_);
  var firstBad = null;
  if (!data.floorCode) { setInlineError_(floorEl, 'Lantai wajib dipilih.'); firstBad = firstBad || floorEl; }
  if (!data.description.trim()) { setInlineError_(descEl, 'Keterangan wajib diisi.'); firstBad = firstBad || descEl; }
  if (isPenugasan && assignmentMode === 'direct' && !data.targetUserCode) {
    setInlineError_(targetEl, 'Pilih petugas penerima.'); firstBad = firstBad || targetEl;
  }
  if (firstBad) {

    .withFailureHandler(function () {
      endAction(submitBtn);
      hideSendingOverlay_();
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    })
    .createPekerjaan(session.accessCode, data);
});

// ============================================================
// BROWSER STATE CACHE — Patch 6.05 (Performance & Navigation Optimization)
// ============================================================

// PERBAIKAN (audit frontend): dua penanda untuk menolak jawaban server yang basi.
//  sessionEpoch_ naik setiap sesi berakhir/berganti (logout, sesi tidak valid) -> jawaban permintaan
//   milik sesi lama DIABAIKAN sepenuhnya (tidak boleh menulis cache pengguna berikutnya).
//  cacheGen_ naik setiap cache dibatalkan (mutasi) -> jawaban yang dimulai sebelum mutasi tidak
//   boleh menghidupkan kembali data lama di cache.
var sessionEpoch_ = 0;
var cacheGen_ = 0;
function reqGuard_() { return { ep: sessionEpoch_, gen: cacheGen_ }; }

// ------------------------------------------------------------
// CACHE PERSISTEN (localStorage) — "tampil dulu, perbarui di belakang"
// Data terakhir per pengguna disimpan agar halaman langsung terisi saat
// dibuka (mis. setelah aplikasi ditutup). Data TETAP selalu diperbarui dari
// server sesudah tampil — aplikasi tetap wajib online. Kunci memuat kode
// pengguna; semua dihapus saat logout. Kadaluarsa 12 jam.
// ------------------------------------------------------------
var PERSIST_PREFIX_ = 'fa_cache:v1:';
var PERSIST_MAX_AGE_MS_ = 12 * 60 * 60 * 1000;
var FEED_FRESH_MS_ = 60 * 1000; // data memori < 60 dtk dianggap segar (tanpa refetch)

function persistKey_(name) {
  var s = (typeof loadSession === 'function') ? loadSession() : null;
  return (s && s.accessCode) ? PERSIST_PREFIX_ + String(s.accessCode).trim().toUpperCase() + ':' + name : null;
}

function persistGet_(name) {
  try {
    var k = persistKey_(name);
    if (!k) return null;
    var raw = localStorage.getItem(k);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || !o.t || (Date.now() - o.t) > PERSIST_MAX_AGE_MS_) { localStorage.removeItem(k); return null; }
    return o.v;
  } catch (e) { return null; }
}

function persistSet_(name, value) {
  try {
    var k = persistKey_(name);
    if (!k) return;
    localStorage.setItem(k, JSON.stringify({ t: Date.now(), v: value }));
  } catch (e) {
    persistClearAll_(); // kuota penuh/terblokir: bersihkan, jangan ganggu aplikasi
  }
}

function persistRemove_(names) {
  try { (names || []).forEach(function (n) { var k = persistKey_(n); if (k) localStorage.removeItem(k); }); } catch (e) { /* abaikan */ }
}

function persistClearAll_() {
  try {
    var del = [];
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key && key.indexOf(PERSIST_PREFIX_) === 0) del.push(key);
    }
    del.forEach(function (key) { localStorage.removeItem(key); });
  } catch (e) { /* abaikan */ }
}

/** Dua daftar dianggap sama bila isinya identik — untuk melewati render ulang (tanpa kedip / reset scroll). */
function sameFeedList_(a, b) {
  try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; }
}

/** Seluruh cache Pekerjaan basi setelah mutasi apa pun (Create/Ambil/
 * Lepas/Selesaikan/Hapus) — pola event-driven cache Patch 8.0. */
function invalidateAllPekerjaanCaches_() {
  cacheGen_++;
  pageDataCache.pekerjaanInbox = null;
  pageDataCache.pekerjaanRiwayatByKey = {};
  pageDataCache.pekerjaanAktivitas = null;
  pageDataCache.pekerjaanAktivitasByKey = {};
  pageDataCache.dashboard = null;
  persistRemove_(['inbox', 'aktivitas', 'riwayat', 'dashboard']);
}

/**
 * PATCH — Reset TOTAL seluruh pageDataCache, dipanggil SATU-SATUNYA
 * saat logout (handleLogout, script-core.html). Lebih luas dari
 * invalidateAllPekerjaanCaches_() di atas (yang hanya cache Pekerjaan,
 * dipakai event-driven setelah mutasi) — ini mengosongkan SEMUA field
 * termasuk content & jadwalAktif, supaya user berikutnya yang login di
 * tab/browser yang sama tidak pernah melihat data user sebelumnya.
 */
function resetAllPageDataCache_() {

  komentarCache_ = {};
  prefetchDone_ = false;
}

// di server supaya hasilnya akurat atas SELURUH data, bukan hanya yang termuat.

var FEED_PAGE_SIZE_ = 20;

function feedKey_(arah, q) { return (arah || 'all') + '|' + (q || ''); }

/**
 * Menggambar feed + tombol "Muat lagi".
 * entry = { list, total, hasMore }; fetchMore(done, fail) mengambil halaman berikut,
 * menambahkannya ke entry.list, lalu memanggil done(itemBaru).
 */
function renderFeedList_(container, entry, emptyHtml, fetchMore) {
  container.innerHTML = '';
  if (!entry.list || entry.list.length === 0) { container.innerHTML = emptyHtml; return; }
  var frag = document.createDocumentFragment();
  entry.list.forEach(function (p) { frag.appendChild(buildPekerjaanListCard_(p)); });
  container.appendChild(frag);
  appendFeedMore_(container, entry, fetchMore);
}

function appendFeedMore_(container, entry, fetchMore) {
  var old = container.querySelector('.feed-more');
  if (old) old.parentNode.removeChild(old);
  if (!entry.hasMore) return;

  var wrap = document.createElement('div');
  wrap.className = 'feed-more';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'feed-more-btn';
  var remaining = Math.max(0, (entry.total || 0) - entry.list.length);
  btn.textContent = 'Muat lagi' + (remaining ? ' (' + remaining + ' lagi)' : '');
  wrap.appendChild(btn);
  container.appendChild(wrap);

  var busy = false;
  var observer = null;
  function run() {
    if (busy) return;
    busy = true;
    btn.disabled = true;
    btn.textContent = 'Memuat...';
    fetchMore(function (items) {
      if (observer) observer.disconnect();
      if (!wrap.parentNode) return; // daftar sudah digambar ulang
      var frag = document.createDocumentFragment();
      (items || []).forEach(function (p) { frag.appendChild(buildPekerjaanListCard_(p)); });
      container.insertBefore(frag, wrap);
      appendFeedMore_(container, entry, fetchMore);
    }, function () {
      busy = false;
      btn.disabled = false;
      btn.textContent = 'Gagal memuat. Ketuk untuk coba lagi';
    });
  }
  btn.addEventListener('click', run);
  if ('IntersectionObserver' in window) {
    observer = new IntersectionObserver(function (entries) {
      if (entries[0] && entries[0].isIntersecting) run();
    }, { rootMargin: '300px' });
    observer.observe(wrap);
  }
}

/** Satu halaman getPekerjaanList (view aktivitas/riwayat). ok(data) / fail(). */
function fetchFeedPage_(params, ok, fail, retried_) {
  var session = loadSession();
  if (!session) return;
  var g = reqGuard_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (reqDead_(g)) return;                       // sesi sudah berganti
      if (reqStale_(g) && !retried_) {               // ada mutasi saat menunggu: ambil ulang sekali
        fetchFeedPage_(params, ok, fail, true);
        return;
      }
      if (!response || !response.success) { fail(response && response.error); return; }
      ok(response.data);
    })
    .withFailureHandler(function () { if (reqDead_(g)) return; fail(); })
    .getPekerjaanList(session.accessCode, params);
}

/**
 * Perf — debounce ringan untuk input pencarian.
 */
function debounce_(fn, delayMs) {
  var timer = null;
  return function () {
    var args = arguments;
    var ctx = this;
    clearTimeout(timer);
    timer = setTimeout(function () { fn.apply(ctx, args); }, delayMs);
  };
}

/**
 * Membangun satu kartu operasional gaya "v2": ikon kategori di kiri, badge
 * + meta ber-ikon + judul/keterangan di tengah, thumbnail representatif +
 * overlay jumlah foto di kanan. Dipakai bersama oleh render Pekerjaan
 * (inbox/riwayat/aktivitas) agar satu bahasa visual konsisten.
 */
function createOpCardV2(cfg) {
  var card = document.createElement('div');
  card.className = 'op-card op-card-v2';
  if (cfg.onCardClick) card.style.cursor = 'pointer';

  var color = STATUS_BUBBLE_COLOR[cfg.badgeCls] || STATUS_BUBBLE_COLOR['badge-neutral'];
  var iconBubble = document.createElement('div');
  iconBubble.className = 'op-card-icon-bubble';
  iconBubble.style.background = color.bg;
  iconBubble.style.color = color.fg;
  iconBubble.innerHTML = mdIcon(cfg.iconName, 20);
  card.appendChild(iconBubble);

  var main = document.createElement('div');
  main.className = 'op-card-main';

  var top = document.createElement('div');
  top.className = 'op-card-top';
  (cfg.badges || []).forEach(function (b) {
    var badge = document.createElement('span');
    badge.className = 'badge ' + b.cls;
    badge.textContent = b.label;
    top.appendChild(badge);
  });
  main.appendChild(top);

  var metaRow = document.createElement('div');
  metaRow.className = 'op-card-meta-row';
  (cfg.metaItems || []).forEach(function (m) {
    var item = document.createElement('span');
    item.className = 'op-card-meta-item';
    item.innerHTML = mdIcon(m.icon, 13) + '<span>' + m.text + '</span>';
    metaRow.appendChild(item);
  });
  main.appendChild(metaRow);

  var title = document.createElement('div');
  title.className = 'op-card-title';
  if (cfg.subject) {
    var subjectSpan = document.createElement('span');
    subjectSpan.className = 'op-card-subject';
    subjectSpan.textContent = cfg.subject + ' — ';
    title.appendChild(subjectSpan);
  }
  title.appendChild(document.createTextNode(cfg.description || ''));
  main.appendChild(title);

  var hasBottomRow = (cfg.photos && cfg.photos.length > 0) || (cfg.actions && cfg.actions.length > 0);
  if (hasBottomRow) {
    var bottomRow = document.createElement('div');
    bottomRow.className = 'op-card-bottom-row';

    if (cfg.photos && cfg.photos.length > 0) {
      var chip = document.createElement('span');
      chip.className = 'photo-count-chip';
      chip.innerHTML = mdIcon('photo', 14) + '<span>' + cfg.photos.length + ' Foto</span>';
      bottomRow.appendChild(chip);
    }

    (cfg.actions || []).forEach(function (a) {
      var btn = document.createElement('button');
      btn.className = 'btn-card-action ' + a.cls;
      btn.innerHTML = mdIcon(a.icon, 15) + (a.label ? '<span>' + a.label + '</span>' : '');
      btn.addEventListener('click', function (e) { e.stopPropagation(); a.onClick(); });
      bottomRow.appendChild(btn);
    });

    main.appendChild(bottomRow);
  }

  card.appendChild(main);

  if (cfg.photos && cfg.photos.length > 0) {
    var thumbSide = document.createElement('div');
    thumbSide.className = 'op-card-thumb-side';
    var img = document.createElement('img');
    img.src = cfg.photos[0].thumbUrl || cfg.photos[0].url;
    img.alt = 'Foto dokumentasi';
    img.onerror = function () {
      console.warn('Gagal memuat thumbnail. file_id:', cfg.photos[0].file_id);
      thumbSide.style.display = 'flex';
      thumbSide.style.alignItems = 'center';
      thumbSide.style.justifyContent = 'center';
      thumbSide.style.background = 'var(--md-surface-container)';
      thumbSide.style.color = 'var(--color-text-faint)';
      thumbSide.innerHTML = mdIcon('photo', 22);
    };
    thumbSide.appendChild(img);
    if (cfg.photos.length > 1) {
      var overlay = document.createElement('span');
      overlay.className = 'thumb-count-overlay';
      overlay.textContent = '+' + (cfg.photos.length - 1);
      thumbSide.appendChild(overlay);
    }
    thumbSide.addEventListener('click', function (e) {
      e.stopPropagation();
      cfg.onPhotoClick(0);
    });
    card.appendChild(thumbSide);
  } else if (cfg.showNoPhotoPlaceholder) {
    var placeholder = document.createElement('div');
    placeholder.className = 'no-photo-placeholder';
    placeholder.innerHTML = mdIcon('photo', 18) + '<span>Tanpa foto</span>';
    card.appendChild(placeholder);
  }

  if (cfg.onCardClick) {
    card.addEventListener('click', cfg.onCardClick);
  }

  return card;
}

  var session = loadSession();

    .withSuccessHandler(function (response) {

    })
    .hapusPekerjaan(session.accessCode, pekerjaanId);
}

/** "11/10/2026 21:24" -> "Minggu, 11/10/26 • 21:24". */
function formatDetailDateTime_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var parts = String(ddmmyyyyHHmm).split(' ');
  var dp = (parts[0] || '').split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  return formatDateTimeFull_(ddmmyyyyHHmm);
}



// ------------------------------------------------------------
// GARIS WAKTU di Detail Laporan (dibuat -> diambil -> selesai) + durasi tiap tahap.
// Murni tampilan dari field yang sudah ada; tidak mengubah data.
// ------------------------------------------------------------
var TL_MONTHS_ = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function tlEsc_(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
/** "27/10/2026 14:30" (WIB) -> epoch ms; NaN bila tidak valid. */
function tlParseMs_(s) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/.exec(String(s || ''));
  if (!m) return NaN;
  return Date.UTC(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]) - 7 * 3600000;
}
function tlFmt_(s) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/.exec(String(s || ''));
  return m ? (+m[1]) + ' ' + TL_MONTHS_[+m[2] - 1] + ' ' + m[3] + ' · ' + m[4] + ':' + m[5] : '';
}
/** Selisih ms -> "45 mnt", "3 j 20 mnt", "2 hr 4 j"; '' bila tidak masuk akal. */
function tlDur_(ms) {
  if (!isFinite(ms) || ms < 0) return '';
  var m = Math.round(ms / 60000);
  if (m < 1) return 'kurang dari 1 mnt';
  if (m < 60) return m + ' mnt';
  var h = Math.floor(m / 60), rm = m % 60;
  if (h < 24) return h + ' j' + (rm ? ' ' + rm + ' mnt' : '');
  var d = Math.floor(h / 24), rh = h % 24;
  return d + ' hr' + (rh ? ' ' + rh + ' j' : '');
}

/** Kembalikan HTML garis waktu, atau '' bila tidak ada tahap yang berarti. */
function buildDetailTimeline_(p) {
  var ev = [];
  var createdMs = tlParseMs_(p.createdAt);
  var isMandiri = p.arah === 'mandiri';
  ev.push({ icon: 'add', title: isMandiri ? 'Dicatat' : 'Dibuat', who: p.createdByName, at: p.createdAt, ms: createdMs, done: true });

  if (p.arah === 'mandiri') {
    if (p.performedAt && p.performedAt !== p.createdAt) {
      ev.unshift({ icon: 'checkCircle', title: 'Dikerjakan', who: p.createdByName, at: p.performedAt, ms: tlParseMs_(p.performedAt), done: true });
    }
  } else {
    var released = p.status === 'TERBUKA' && p.releasedAt;
    if (released) {
      ev.push({ icon: 'close', title: 'Dilepas', who: p.releasedByName || p.releasedBy, at: p.releasedAt, ms: tlParseMs_(p.releasedAt), done: true });
    }
    if (p.status !== 'TERBUKA' && p.startedAt) {
      ev.push({ icon: 'personAdd', title: 'Diambil', who: p.handledByName, at: p.startedAt, ms: tlParseMs_(p.startedAt), done: true });
    }
    if (p.status === 'SELESAI' && p.completedAt) {
      ev.push({ icon: 'checkCircle', title: 'Selesai', who: p.completedByName || p.handledByName, at: p.completedAt, ms: tlParseMs_(p.completedAt), done: true });
    }
  }
  ev.sort(function (a, b) { return (a.ms || 0) - (b.ms || 0); });

  // Tahap yang sedang berjalan (belum ada kejadian berikutnya).
  var now = Date.now();
  var last = ev[ev.length - 1];
  var pending = '';
  if (p.arah !== 'mandiri') {
    if (p.status === 'TERBUKA') pending = 'Belum diambil · menunggu ' + tlDur_(now - last.ms);
    else if (p.status === 'DIKERJAKAN') pending = 'Sedang dikerjakan · ' + tlDur_(now - last.ms);
  }
  if (ev.length < 2 && !pending) return '';

  var html = '<div class="detail-block detail-timeline"><div class="detail-block-label">' + mdIcon('reminder', 14) + 'Garis Waktu</div><ol class="tl">';
  ev.forEach(function (e, i) {
    var gap = (i > 0 && !isMandiri) ? tlDur_(e.ms - ev[i - 1].ms) : '';
    if (gap) html += '<li class="tl-gap">' + gap + '</li>';
    html += '<li class="tl-item"><span class="tl-dot">' + mdIcon(e.icon, 12) + '</span><div class="tl-body"><b>' + tlEsc_(e.title) + '</b>' +
      '<small>' + tlEsc_((e.who ? e.who + ' · ' : '') + tlFmt_(e.at)) + '</small></div></li>';
  });
  if (pending) html += '<li class="tl-item tl-now"><span class="tl-dot tl-dot-now"></span><div class="tl-body"><b>' + tlEsc_(pending) + '</b></div></li>';
  // Total waktu hingga selesai.
  if (p.status === 'SELESAI' && ev.length > 1 && !isMandiri) {
    var total = tlDur_(ev[ev.length - 1].ms - createdMs);
    if (total) html += '<li class="tl-total">Total: ' + total + ' sejak dibuat</li>';
  }
  return html + '</ol></div>';
}

// Cache komentar per pekerjaan (memori, sesi berjalan): detail yang pernah dibuka
// langsung menampilkan komentar terakhir, lalu diperbarui diam-diam dari server.
var komentarCache_ = {};

function renderKomentarSection_(p, body) {
  var section = document.createElement('div');
  section.className = 'komentar-section';
  section.dataset.pid = p.pekerjaanId;
  section.innerHTML =
    '<div class="komentar-head"><span class="title">Komentar</span>' +
    '<button class="btn-icon" type="button" id="btn-komentar-refresh" aria-label="Muat ulang komentar">' + mdIcon('refresh', 18) + '</button></div>' +
    '<div id="komentar-list"></div>' +
    '<div id="komentar-form-wrap"></div>';
  body.appendChild(section);

  document.getElementById('btn-komentar-refresh').addEventListener('click', function () { loadKomentar_(p); });

  var cached = komentarCache_[p.pekerjaanId];
  var isDemo = !!(appBootstrap && appBootstrap.currentUser && appBootstrap.currentUser.role === 'demo');
  if (cached) {
    // Pernah dibuka: tampil seketika dari cache.
    renderKomentarList_(p, cached.list);
    renderKomentarForm_(p, cached.canKirim);
  } else if (!p.commentCount) {
    // Server sudah memberi tahu jumlah komentar = 0: tidak perlu spinner.
    renderKomentarList_(p, []);
    renderKomentarForm_(p, !isDemo);
  } else {
    document.getElementById('komentar-list').innerHTML = skeletonCommentsHtml_();
  }
  // Cache < 30 dtk: cukup, hemat request. Selain itu verifikasi ke server tanpa menghapus tampilan yang ada.
  if (!(cached && cached.t && (Date.now() - cached.t) < 30000)) loadKomentar_(p);
}

function loadKomentar_(p) {
  var session = loadSession();
  var listEl = document.getElementById('komentar-list');
  if (!listEl) return;
  var hadCache = !!komentarCache_[p.pekerjaanId] || !p.commentCount;
  var gKom = reqGuard_();
  // Panel komentar masih milik laporan ini? (detail bisa sudah ditutup/berganti saat jawaban tiba)
  function samePanel_() {
    var l = document.getElementById('komentar-list');
    var sec = l && l.closest ? l.closest('.komentar-section') : null;
    return !!(l && sec && sec.dataset.pid === String(p.pekerjaanId));
  }
  google.script.run
    .withSuccessHandler(function (response) {
      if (reqDead_(gKom)) return;
      var prev = komentarCache_[p.pekerjaanId];
      if (response.success && !reqStale_(gKom)) {
        komentarCache_[p.pekerjaanId] = { list: response.data.komentar, canKirim: response.data.canKirim, t: Date.now() };
      }
      if (!samePanel_()) return; // Detail sudah ditutup / berpindah laporan lain
      listEl = document.getElementById('komentar-list');
      if (!response.success) {
        if (!hadCache) { listEl.innerHTML = ''; var errEl = document.createElement('div'); errEl.className = 'komentar-empty'; errEl.textContent = response.error || 'Gagal memuat komentar.'; listEl.appendChild(errEl); }
        return;
      }
      p.commentCount = response.data.komentar.length;
      // Tidak berubah -> jangan gambar ulang (tanpa kedip; teks yang sedang diedit aman).
      var unchanged = prev && sameFeedList_(prev.list, response.data.komentar) && listEl.children.length > 0 && !listEl.querySelector('.inline-loading');
      if (!unchanged) renderKomentarList_(p, response.data.komentar);
      renderKomentarForm_(p, response.data.canKirim);
    })
    .withFailureHandler(function () {
      if (reqDead_(gKom) || !samePanel_()) return;
      var el = document.getElementById('komentar-list');
      if (el && !hadCache) el.innerHTML = '<div class="komentar-empty">Gagal memuat komentar.</div>';
    })
    .getKomentarList(session.accessCode, p.pekerjaanId);
}

function renderKomentarList_(p, list) {
  var listEl = document.getElementById('komentar-list');
  listEl.innerHTML = '';
  if (!list.length) {
    listEl.innerHTML = '<div class="komentar-empty">Belum ada komentar.</div>';
    return;
  }
  var chat = document.createElement('div');
  chat.className = 'komentar-chat';

  list.forEach(function (k) {
    // Tampilan bubble ala chat: komentar pemilik laporan di kanan, lainnya di kiri.
    var isOwnerReport = !!p.createdBy && k.userCode === p.createdBy;
    var row = document.createElement('div');
    row.className = 'komentar-row ' + (isOwnerReport ? 'right' : 'left');

    var item = document.createElement('div');
    item.className = 'komentar-bubble ' + (isOwnerReport ? 'owner' : 'other');

    var head = document.createElement('div');
    head.className = 'komentar-bubble-head';
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = k.userName;
    head.appendChild(name);

    if (k.canUbah || k.canHapus) {
      var more = document.createElement('button');
      more.type = 'button';
      more.className = 'komentar-more';
      more.setAttribute('aria-label', 'Opsi komentar');
      more.innerHTML = mdIcon('moreHoriz', 18);
      head.appendChild(more);
    }
    item.appendChild(head);

    var text = document.createElement('div');
    text.className = 'komentar-text';
    text.textContent = k.text; // textContent: aman dari HTML injection
    item.appendChild(text);

    var when = document.createElement('div');
    when.className = 'komentar-when';
    when.textContent = k.createdAt + (k.edited ? ' · diedit' : '');
    item.appendChild(when);

    if (k.canUbah || k.canHapus) {
      // Menu opsi "•••": Edit / Hapus lewat bottom sheet (pola yang sama dengan menu lain).
      item.querySelector('.komentar-more').addEventListener('click', function () {
        var opts = [];
        if (k.canUbah) {
          opts.push({ icon: 'edit', label: 'Edit', onClick: function () { startEditKomentar_(p, k, item, text, when); } });
        }
        if (k.canHapus) {
          opts.push({ icon: 'delete', label: 'Hapus', danger: true, onClick: function () {
            showConfirmModal('Hapus komentar ini?', function () { doHapusKomentar_(p, k.komentarId); }, 'delete', true, 'Menghapus...');
          } });
        }
        openBottomSheet(opts);
      });
    }
    row.appendChild(item);
    chat.appendChild(row);
  });
  listEl.appendChild(chat);
}

function startEditKomentar_(p, k, item, textEl, whenEl) {
  var ta = document.createElement('textarea');
  ta.className = 'form-input';
  ta.rows = 3;
  ta.maxLength = 500;
  ta.value = k.text;
  item.replaceChild(ta, textEl);
  var moreBtn = item.querySelector('.komentar-more');
  if (moreBtn) moreBtn.style.display = 'none';

  var actionsEl = document.createElement('div');
  actionsEl.className = 'komentar-actions';
  var save = document.createElement('button');
  save.type = 'button';
  save.textContent = 'Simpan';
  var cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = 'Batal';
  actionsEl.appendChild(save);
  actionsEl.appendChild(cancel);
  item.replaceChild(actionsEl, whenEl);
  ta.focus();

  cancel.addEventListener('click', function () { loadKomentar_(p); });
  save.addEventListener('click', function () {
    if (!ta.value.trim()) { showSnackbar('Komentar tidak boleh kosong.', 'error'); return; }
    var session = loadSession();
    beginAction(save, 'Menyimpan...');
    google.script.run
      .withSuccessHandler(function (response) {
        endAction(save);
        if (!response.success) { showSnackbar(response.error, 'error'); return; }
        invalidateAllPekerjaanCaches_();
        loadKomentar_(p);
      })
      .withFailureHandler(function () {
        endAction(save);
        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .ubahKomentar(session.accessCode, k.komentarId, ta.value);
  });
}

function doHapusKomentar_(p, komentarId) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null); // juga menutup Confirm Modal (busy-mode)
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Komentar dihapus.', 'success');
      invalidateAllPekerjaanCaches_();
      loadKomentar_(p);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal menghapus komentar. Coba lagi.', 'error');
    })
    .hapusKomentar(session.accessCode, komentarId);
}

function renderKomentarForm_(p, canKirim) {

var PEKERJAAN_AUTO_REFRESH_MS = 30000; // aman: pemeriksaan versi sangat ringan
var pekerjaanAutoRefreshTimer = null;

function stopPekerjaanAutoRefresh() {
  if (pekerjaanAutoRefreshTimer) {
    clearInterval(pekerjaanAutoRefreshTimer);
    pekerjaanAutoRefreshTimer = null;
  }
}

// Polling RINGAN: hanya menanyakan token versi (murah di server). Daftar penuh
// diambil HANYA bila token berubah (ada yang menulis data). Cache Aktivitas &
// Riwayat ikut dianggap basi supaya kunjungan berikutnya mengambil data baru.
var pekerjaanKnownVersion_ = null;

function checkPekerjaanVersion_() {
  var session = loadSession();
  if (!session || typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function (response) {
      if (!response || !response.success) return;
      var v = response.data.version;
      if (pekerjaanKnownVersion_ === null) { pekerjaanKnownVersion_ = v; return; }
      if (v === pekerjaanKnownVersion_) return;
      pekerjaanKnownVersion_ = v;
      pageDataCache.pekerjaanAktivitasByKey = {};
      pageDataCache.pekerjaanRiwayatByKey = {};
      persistRemove_(['inbox', 'aktivitas', 'riwayat']);
      if (currentPage === 'pekerjaan') loadPekerjaanInbox(true);
    })
    .withFailureHandler(function () { /* diam — coba lagi pada siklus berikut */ })
    .getPekerjaanVersion(session.accessCode);
}

function startPekerjaanAutoRefresh() {
  stopPekerjaanAutoRefresh();
  checkPekerjaanVersion_(); // segera: data hasil prefetch/cache mungkin sudah berubah
  pekerjaanAutoRefreshTimer = setInterval(function () {
    if (currentPage === 'pekerjaan' && document.visibilityState === 'visible') {
      checkPekerjaanVersion_();
    }
  }, PEKERJAAN_AUTO_REFRESH_MS);
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && currentPage === 'pekerjaan') {
    checkPekerjaanVersion_();
  }
});

function loadPekerjaanInbox(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.pekerjaanInbox;
  var stale = false;
  if (!cached && !force) {
    // Salinan tersimpan dari kunjungan sebelumnya: tampilkan dulu, lalu perbarui dari server.
    var persisted = persistGet_('inbox');
    if (persisted) { cached = persisted; stale = true; }
  }

  if (cached && !force && !stale) {
    renderPekerjaanInboxList(cached);
    return;
  }

  if (stale) {
    renderPekerjaanInboxList(cached);
    var barStale = document.getElementById('linear-progress');
    if (barStale) barStale.classList.add('show'); // indikator "memperbarui"
  } else if (!cached) {
    renderListSkeleton_('pekerjaan-list', 3, 'Memuat data pekerjaan...');
  }

  var gInbox = reqGuard_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (reqDead_(gInbox)) return;
      if (reqStale_(gInbox)) { loadPekerjaanInbox(true); return; } // mutasi terjadi saat menunggu
      var container = document.getElementById('pekerjaan-list');
      if (!response.success) {
        if (!cached) renderLoadError_(container, 'daftar pekerjaan', function () { loadPekerjaanInbox(true); }, response.error);
        var bar1 = document.getElementById('linear-progress');
        if (bar1) bar1.classList.remove('show');
        return;
      }
      pageDataCache.pekerjaanInbox = response.data.pekerjaan;
      persistSet_('inbox', response.data.pekerjaan);
      if (response.data.version) pekerjaanKnownVersion_ = response.data.version;
      if (!(stale && sameFeedList_(cached, response.data.pekerjaan))) {
        renderPekerjaanInboxList(response.data.pekerjaan);
      }
      // PATCH — Jaring pengaman: SELALU matikan bar setelah render
      // selesai, apa pun yang memicu loadPekerjaanInbox(true) (Ambil,
      // Lepas, pull-to-refresh, polling versi, dll).
      var bar2 = document.getElementById('linear-progress');
      if (bar2) bar2.classList.remove('show');
    })
    .withFailureHandler(function () {
      if (reqDead_(gInbox)) return;
      if (!cached) renderLoadError_(document.getElementById('pekerjaan-list'), 'daftar pekerjaan', function () { loadPekerjaanInbox(true); });
      var bar3 = document.getElementById('linear-progress');
      if (bar3) bar3.classList.remove('show');
    })
    .getPekerjaanList(session.accessCode, { view: 'inbox' });
}

// ------------------------------------------------------------
// PAKET STARTUP — payload bootstrap kini membawa data halaman awal (Beranda,
// jadwal, inbox, Aktivitas & Riwayat halaman 1) dalam SATU request. Diterapkan
// ke cache sebelum halaman digambar, sehingga pemuat halaman tidak perlu
// memanggil server lagi (dan prefetch otomatis dilewati).
// ------------------------------------------------------------
function applyStartupBundle_(bundle) {
  if (!bundle) return;
  var now = Date.now();
  if (bundle.home) {
    pageDataCache.dashboard = bundle.home.dashboard;
    pageDataCache.content = bundle.home.content;
    persistSet_('dashboard', bundle.home.dashboard);
    persistSet_('content', bundle.home.content);
  }
  if (bundle.jadwal) pageDataCache.jadwalAktif = bundle.jadwal;
  if (bundle.inbox) {
    pageDataCache.pekerjaanInbox = bundle.inbox.pekerjaan;
    persistSet_('inbox', bundle.inbox.pekerjaan);
    if (bundle.inbox.version) pekerjaanKnownVersion_ = bundle.inbox.version;
  }
  if (bundle.aktivitas) {
    var ea = { list: bundle.aktivitas.pekerjaan, total: bundle.aktivitas.total, hasMore: bundle.aktivitas.hasMore, t: now };
    pageDataCache.pekerjaanAktivitasByKey[feedKey_('', '')] = ea;
    persistSet_('aktivitas', { list: ea.list, total: ea.total, hasMore: ea.hasMore });
  }
  if (bundle.riwayat) {
    var er = { list: bundle.riwayat.pekerjaan, total: bundle.riwayat.total, hasMore: bundle.riwayat.hasMore, t: now };
    pageDataCache.pekerjaanRiwayatByKey[''] = er;
    persistSet_('riwayat', { list: er.list, total: er.total, hasMore: er.hasMore });
  }
  prefetchDone_ = true; // data awal sudah lengkap -> tidak perlu prefetch terpisah
}

// ------------------------------------------------------------
// PREFETCH — setelah Beranda tampil, halaman 1 Pekerjaan/Aktivitas/Riwayat
// diambil di latar belakang agar tab langsung terisi saat dibuka. Hanya sekali
// per sesi, hanya saat tab terlihat, tidak menimpa data yang sudah ada.
// ------------------------------------------------------------
var prefetchDone_ = false;

function prefetchTabs_() {
  if (prefetchDone_) return;
  prefetchDone_ = true;
  setTimeout(function () {
    var session = loadSession();
    if (!session || document.visibilityState !== 'visible') { prefetchDone_ = false; return; }

    if (!pageDataCache.pekerjaanInbox) {
      var gPre = reqGuard_();
      google.script.run.withSuccessHandler(function (r) {
        if (reqDead_(gPre) || reqStale_(gPre)) return;
        if (!r || !r.success || pageDataCache.pekerjaanInbox) return;
        pageDataCache.pekerjaanInbox = r.data.pekerjaan;
        persistSet_('inbox', r.data.pekerjaan);
        if (r.data.version) pekerjaanKnownVersion_ = r.data.version;
      }).withFailureHandler(function () {}).getPekerjaanList(session.accessCode, { view: 'inbox' });
    }

    var defKey = feedKey_('', '');
    if (!pageDataCache.pekerjaanAktivitasByKey[defKey]) {
      fetchFeedPage_({ view: 'aktivitas', limit: FEED_PAGE_SIZE_, offset: 0 }, function (d) {
        if (pageDataCache.pekerjaanAktivitasByKey[defKey]) return;
        pageDataCache.pekerjaanAktivitasByKey[defKey] = { list: d.pekerjaan, total: d.total, hasMore: d.hasMore, t: Date.now() };
        persistSet_('aktivitas', { list: d.pekerjaan, total: d.total, hasMore: d.hasMore });
      }, function () {});
    }

    var rwKey = '';
    if (!pageDataCache.pekerjaanRiwayatByKey[rwKey]) {
      fetchFeedPage_({ view: 'riwayat', q: '', limit: FEED_PAGE_SIZE_, offset: 0 }, function (d) {
        if (pageDataCache.pekerjaanRiwayatByKey[rwKey]) return;
        pageDataCache.pekerjaanRiwayatByKey[rwKey] = { list: d.pekerjaan, total: d.total, hasMore: d.hasMore, t: Date.now() };
        persistSet_('riwayat', { list: d.pekerjaan, total: d.total, hasMore: d.hasMore });
      }, function () {});
    }
  }, 800);
}

function renderPekerjaanInboxList(list) {
  var container = document.getElementById('pekerjaan-list');
  container.innerHTML = '';

  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('task', 26) + '</div>Tidak ada pekerjaan di inbox Anda.</div>';
    return;
  }

  if (currentPekerjaanFilter !== 'all') {
    list = list.filter(function (p) { return p.status === currentPekerjaanFilter; });
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('task', 26) + '</div>Tidak ada pekerjaan dengan status ini.</div>';
      return;
    }
  }

  var STATUS_SORT_PRIORITY = { DIKERJAKAN: 0, TERBUKA: 1 };
  list = list.slice().sort(function (a, b) {
    var pa = STATUS_SORT_PRIORITY[a.status] != null ? STATUS_SORT_PRIORITY[a.status] : 2;
    var pb = STATUS_SORT_PRIORITY[b.status] != null ? STATUS_SORT_PRIORITY[b.status] : 2;
    return pa - pb;
  });

  list.forEach(function (p) {
    container.appendChild(buildPekerjaanInboxCard_(p));
  });
}



var ambilInFlight_ = {};

function doAmbilPekerjaan(pekerjaanId) {

/**
 * PATCH — FIX bug "card tidak sinkron setelah Ambil" (status masih
 * tampil 'Belum Diambil', tombol Lepas tidak muncul di Detail sampai
 * refresh manual). Akar masalah SEBELUMNYA: hanya tombol & field
 * p.status/p.handledBy yang ditambal manual — badge status di kartu,
 * p.statusLabel, p.canLepas, p.canAmbil TIDAK ikut diperbarui, membuat
 * objek `p` dalam state SEPARUH MATANG yang lalu dipakai Detail
 * (openPekerjaanDetail) sehingga tombol Lepas gagal muncul.
 *
 * FIX: setelah ambilPekerjaan() sukses, panggil getPekerjaanList()
 * ULANG (ringan — 1 row saja secara efektif karena filter di client)
 * untuk mendapat OBJEK PEKERJAAN YANG BENAR-BENAR FRESH dari server
 * (statusLabel/canLepas/canAmbil semua terhitung benar oleh backend,
 * SATU sumber kebenaran — bukan ditambal manual di frontend lagi).
 * Kartu LAMA di-replace total dengan kartu baru hasil
 * buildPekerjaanInboxCard_(freshP) — bukan cuma ubah tombolnya saja.
 */

/** Bar progres kecil di dalam kartu. set(pct) menaikkan bar & teks. */
function attachCardProgress_(cardEl) {
  var main = cardEl && cardEl.querySelector('.list-card-row-main');
  if (!main) return { set: function () {}, remove: function () {} };

  var box = document.createElement('div');
  box.className = 'card-progress';
  box.innerHTML =
    '<div class="card-progress-bar"><div class="card-progress-fill"></div></div>' +
    '<div class="card-progress-text"></div>';
  main.appendChild(box);

  var fill = box.querySelector('.card-progress-fill');
  var text = box.querySelector('.card-progress-text');
  return {
    set: function (pct) {
      fill.style.width = pct + '%';
      text.textContent = 'Mengecek data penugasan... (' + pct + '%)';
    },
    remove: function () { if (box.parentNode) box.parentNode.removeChild(box); }
  };
}

/**
 * Ambil Pekerjaan in-place. Progres kartu mengikuti tahap NYATA:
 * 10% mulai -> 55% pengambilan berhasil di server -> 100% data kartu
 * terbaru diterima. Kartu lalu diganti kartu segar dari server.
 */
function doAmbilPekerjaanInline_(buttonEl, p) {
  var session = loadSession();
  var cardEl = buttonEl.closest('.list-card');
  var listEl = document.getElementById('pekerjaan-list');
  var toastDetail = 'Tugas "' + truncateText_(p.subject || p.description, 40) + '" kini ada di tangan Anda. Tekan Buat Laporan setelah selesai.';
  if (buttonEl.dataset.busy === '1') return;
  buttonEl.dataset.busy = '1';

  // --- UI: mode fokus (card aktif disorot, card lain diburamkan) + progres di bawah tombol ---
  if (listEl) listEl.classList.add('focus-mode');
  cardEl.classList.add('active-focus-card');
  var originalHtml = buttonEl.innerHTML;
  buttonEl.disabled = true;
  buttonEl.classList.add('is-loading');
  buttonEl.innerHTML = '<span>Mengambil</span><span class="dot-flashing"></span>';

  var prog = document.createElement('div');
  prog.className = 'take-progress';
  prog.innerHTML = '<div class="take-progress-bar"><div class="take-progress-fill"></div></div>' +
    '<div class="take-progress-meta"><span class="take-progress-text"></span><span class="take-progress-pct">0%</span></div>';
  buttonEl.parentNode.appendChild(prog);
  var fill = prog.querySelector('.take-progress-fill');
  var txt = prog.querySelector('.take-progress-text');
  var pct = prog.querySelector('.take-progress-pct');
  var cur = 0, creep = null;
  function setP(v, t) { cur = v; fill.style.width = v + '%'; pct.textContent = Math.round(v) + '%'; if (t) txt.textContent = t; }
  function stopCreep() { if (creep) { clearInterval(creep); creep = null; } }
  function endFocus() {
    stopCreep();
    if (listEl) listEl.classList.remove('focus-mode');
    if (cardEl) cardEl.classList.remove('active-focus-card');
  }
  function restoreButton() {
    delete buttonEl.dataset.busy;
    buttonEl.disabled = false;
    buttonEl.classList.remove('is-loading');
    buttonEl.innerHTML = originalHtml;
    if (prog.parentNode) prog.parentNode.removeChild(prog);
    endFocus();
  }
  function toastSuccess() { showSnackbar('Pekerjaan berhasil diambil', 'success', toastDetail); }

  setP(10, 'Mengecek data penugasan...');
  // Merayap pelan selagi menunggu server (maks 60%); fase berikutnya mengikuti respons asli.
  creep = setInterval(function () {
    if (cur < 60) setP(cur + (60 - cur) * 0.12, cur < 30 ? 'Memverifikasi hak akses & lokasi...' : 'Mengunci status tugas...');
  }, 250);

  google.script.run
    .withSuccessHandler(function (response) {
      if (!response.success) {
        restoreButton();
        showSnackbar(response.error, 'error');
        return;
      }
      stopCreep();
      invalidateAllPekerjaanCaches_();
      setP(75, 'Mengunci status tugas...');

      google.script.run
        .withSuccessHandler(function (listResponse) {
          if (!listResponse.success || !document.body.contains(cardEl)) {
            endFocus();
            toastSuccess();
            loadPekerjaanInbox(true);
            return;
          }
          setP(90, 'Menyiapkan lembar kerja...');
          var freshP = listResponse.data.pekerjaan.find(function (row) { return row.pekerjaanId === p.pekerjaanId; });
          setTimeout(function () {
            setP(100, 'Penugasan berhasil diambil!');
            setTimeout(function () {
              if (!document.body.contains(cardEl)) { endFocus(); toastSuccess(); loadPekerjaanInbox(true); return; }
              if (!freshP) {
                cardEl.remove();
                endFocus();
              } else {
                var fresh = buildPekerjaanListCard_(freshP, { actions: true, pulse: true });
                cardEl.replaceWith(fresh);
                endFocus();
              }
              toastSuccess();
            }, 450);
          }, 250);
        })
        .withFailureHandler(function () {
          endFocus();
          toastSuccess();
          loadPekerjaanInbox(true);
        })
        .getPekerjaanList(session.accessCode, { view: 'inbox' });
    })
    .withFailureHandler(function () {
      restoreButton();
      showSnackbar('Gagal mengambil pekerjaan. Coba lagi.', 'error');
    })
    .ambilPekerjaan(session.accessCode, p.pekerjaanId);
}

function doLepasPekerjaan(pekerjaanId) {
  showConfirmModal('Lepas pekerjaan ini agar bisa diambil pihak lain?', function () {
    executeLepasPekerjaan(pekerjaanId);
  }, 'delete', true, 'Melepas...');
}

/**
 * PATCH — FIX bug "popup Lepas tidak pernah tertutup, terlihat freeze".
 * Akar masalah: endAction(null) sengaja TIDAK dipanggil di jalur sukses
 * (patch sebelumnya, untuk cegah race bar loading dengan
 * loadPekerjaanInbox). TAPI endAction() jugalah satu-satunya titik yang
 * otomatis menutup Confirm Modal (hook di script-core.html) — sehingga
 * modal tidak pernah tertutup di jalur ini. FIX: panggil
 * hideConfirmModal() SECARA EKSPLISIT & SEGERA begitu response diterima
 * (terpisah dari urusan bar, yang tetap ditangani loadPekerjaanInbox
 * sendiri seperti sebelumnya — TIDAK diubah).
 */
function executeLepasPekerjaan(pekerjaanId) {
  var session = loadSession();
  beginAction(null, 'Melepas...');
  google.script.run
    .withSuccessHandler(function (response) {
      hideConfirmModal();
      if (!response.success) {
        var bar = document.getElementById('linear-progress');
        if (bar) bar.classList.remove('show');
        showSnackbar(response.error, 'error');
        return;
      }
      showSnackbar('Pekerjaan dilepas kembali.', 'success');
      invalidateAllPekerjaanCaches_();
      loadPekerjaanInbox(true);
    })
    .withFailureHandler(function () {
      hideConfirmModal();
      endAction(null);
      showSnackbar('Gagal melepas pekerjaan. Coba lagi.', 'error');
    })
    .lepasPekerjaan(session.accessCode, pekerjaanId);
}




</script>
