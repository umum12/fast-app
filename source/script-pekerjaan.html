<script>





var MAX_PHOTOS = 3;
var selectedPhotos = []; 
var activePhotoSlotIndex = null;







var JENIS_ROLE_FILTER = {
  admin: ['penugasan'],
  fs: ['lapor_kerusakan', 'permintaan', 'kebersihan', 'perbaikan', 'lainnya'],
  demo: []
};




var buatPrefillContext = null;

function updateJenisIcon() {
  var jenisSelect = document.getElementById('form-jenis');
  var info = JENIS_PEKERJAAN_BADGE[jenisSelect.value] || { icon: 'description', cls: 'badge-neutral' };
  var color = STATUS_BUBBLE_COLOR[info.cls] || STATUS_BUBBLE_COLOR['badge-neutral'];
  var iconEl = document.getElementById('form-jenis-icon');
  if (!iconEl) return;
  iconEl.innerHTML = mdIcon(info.icon, 15);
  iconEl.style.background = color.bg;
  iconEl.style.color = color.fg;
}

function updateAssignmentFieldsVisibility() {
  var jenisSelect = document.getElementById('form-jenis');
  
  
  
  var isPenugasan = !buatPrefillContext && jenisSelect.value === 'penugasan';
  var modeGroup = document.getElementById('form-assignment-mode-group');
  if (modeGroup) modeGroup.style.display = isPenugasan ? 'block' : 'none';
  var modeSelect = document.getElementById('form-assignment-mode');
  var isDirect = isPenugasan && modeSelect && modeSelect.value === 'direct';
  var targetGroup = document.getElementById('form-target-user-group');
  if (targetGroup) targetGroup.style.display = isDirect ? 'block' : 'none';
}

var formBuatListenersAttached = false;

function attachFormBuatListenersOnce_() {
  if (formBuatListenersAttached) return;
  formBuatListenersAttached = true;

  var jenisSelect = document.getElementById('form-jenis');
  jenisSelect.addEventListener('change', updateJenisIcon);
  jenisSelect.addEventListener('change', updateAssignmentFieldsVisibility);
  jenisSelect.addEventListener('change', updateFormProgress);
  jenisSelect.addEventListener('change', updatePerformedAtFieldVisibility);

  var modeSelectEl = document.getElementById('form-assignment-mode');
  if (modeSelectEl) modeSelectEl.addEventListener('change', updateAssignmentFieldsVisibility);

  var floorSelect = document.getElementById('form-floor');
  floorSelect.addEventListener('change', updateFormProgress);
}




var INDO_MONTH_FULL_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function formatDatetimeLocalInput_(d) {
  function pad(n) { return n < 10 ? '0' + n : n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

 
function formatPerformedAtPreview_(datetimeLocalValue) {
  var d = new Date(datetimeLocalValue);
  if (isNaN(d.getTime())) return '';
  function pad(n) { return n < 10 ? '0' + n : n; }
  var dayName = INDO_DAY_NAMES_[d.getDay()];
  return dayName + ', ' + pad(d.getDate()) + ' ' + INDO_MONTH_FULL_[d.getMonth()] + ' ' + d.getFullYear() + ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function setPerformedAtBounds_() {
  var input = document.getElementById('form-performed-at');
  if (!input) return;
  var now = new Date();
  var maxStr = formatDatetimeLocalInput_(now);
  var minStr = formatDatetimeLocalInput_(new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000));
  input.max = maxStr;
  input.min = minStr;
}



function collapsePerformedAt_() {
  var input = document.getElementById('form-performed-at');
  if (input) input.value = '';
  var collapsed = document.getElementById('performed-at-collapsed');
  var expanded = document.getElementById('performed-at-expanded');
  if (collapsed) collapsed.style.display = 'flex';
  if (expanded) expanded.style.display = 'none';
}

function expandPerformedAt_() {
  setPerformedAtBounds_();
  var input = document.getElementById('form-performed-at');
  if (input && !input.value) input.value = formatDatetimeLocalInput_(new Date());
  var collapsed = document.getElementById('performed-at-collapsed');
  var expanded = document.getElementById('performed-at-expanded');
  if (collapsed) collapsed.style.display = 'none';
  if (expanded) expanded.style.display = 'block';
  updatePerformedAtPreview_();
}

function updatePerformedAtPreview_() {
  var input = document.getElementById('form-performed-at');
  var preview = document.getElementById('performed-at-preview');
  if (!input || !preview) return;
  preview.textContent = formatPerformedAtPreview_(input.value);
}

var performedAtListenersAttached_ = false;
function attachPerformedAtListenersOnce_() {
  if (performedAtListenersAttached_) return;
  performedAtListenersAttached_ = true;

  var editBtn = document.getElementById('btn-performed-at-edit');
  if (editBtn) editBtn.addEventListener('click', expandPerformedAt_);

  var resetBtn = document.getElementById('btn-performed-at-reset');
  if (resetBtn) resetBtn.addEventListener('click', collapsePerformedAt_);

  var input = document.getElementById('form-performed-at');
  if (input) input.addEventListener('change', updatePerformedAtPreview_);

  var labelIcon = document.getElementById('performed-at-label-icon');
  if (labelIcon) labelIcon.innerHTML = mdIcon('reminder', 16);
}

function updatePerformedAtFieldVisibility() {
  var jenisSelect = document.getElementById('form-jenis');
  var group = document.getElementById('form-performed-at-group');
  if (!group) return;
  var isMandiri = !buatPrefillContext && JENIS_MANDIRI_SET_.indexOf(jenisSelect.value) !== -1;
  group.style.display = isMandiri ? 'block' : 'none';
  if (isMandiri) {
    attachPerformedAtListenersOnce_();
    setPerformedAtBounds_();
  } else {
    collapsePerformedAt_();
  }
}




function applyBuatModeUI_() {
  var isComplete = !!buatPrefillContext;

  var banner = document.getElementById('buat-context-banner');
  var idEl = document.getElementById('buat-context-pekerjaan-id');
  if (banner) banner.style.display = isComplete ? 'block' : 'none';
  if (idEl && isComplete) idEl.textContent = buatPrefillContext.pekerjaanId;

  var headerTitle = document.getElementById('buat-header-title');
  if (headerTitle) headerTitle.textContent = isComplete ? 'Buat Laporan Pekerjaan' : 'Buat Pekerjaan';

  var jenisSelect = document.getElementById('form-jenis');
  var floorSelect = document.getElementById('form-floor');



    var contextBanner = document.getElementById('buat-context-banner');
  if (contextBanner) {
    contextBanner.style.background = isComplete ? 'var(--status-completed-bg)' : '';
    contextBanner.style.color = isComplete ? 'var(--status-completed-fg)' : '';
  }
  [jenisSelect, floorSelect].forEach(function (el) {
    if (!el) return;
    el.classList.toggle('locked-field-green', isComplete);
  });



  
  [jenisSelect, floorSelect].forEach(function (el) {
    if (!el) return;
    el.disabled = isComplete;
    el.classList.toggle('locked-field', isComplete);
  });

  var descLabel = document.getElementById('form-description-label');
  var photoLabel = document.getElementById('form-photo-label');
  if (descLabel) descLabel.textContent = isComplete ? 'Keterangan Penuntasan' : 'Keterangan';
  if (photoLabel) photoLabel.textContent = isComplete ? 'Foto Penuntasan (opsional, maks. 3)' : 'Foto Kondisi Awal (opsional, maks. 3)';

  var submitBtn = document.getElementById('btn-submit-report');
  if (submitBtn) submitBtn.innerHTML = mdIcon(isComplete ? 'checkCircle' : 'upload', 18) + '<span>' + (isComplete ? 'Kirim Laporan' : 'Simpan & Kirim') + '</span>';
}




function openBuatLaporanForPekerjaan(p) {
  buatPrefillContext = {
    pekerjaanId: p.pekerjaanId,
    jenis: 'penugasan',
    floorCode: p.floorCode,
    subject: p.subject || '',
    description: '' 
  };

function initPekerjaanForm() {
  if (!appBootstrap) return;
  var role = appBootstrap.currentUser.role;

  var allowedJenis = JENIS_ROLE_FILTER[role] || [];
  var jenisSelect = document.getElementById('form-jenis');
  jenisSelect.innerHTML = '';

  var jenisSource = buatPrefillContext
    ? (appBootstrap.jenisPekerjaanList || []).filter(function (j) { return j.value === buatPrefillContext.jenis; })
    : (appBootstrap.jenisPekerjaanList || []).filter(function (j) { return allowedJenis.indexOf(j.value) !== -1; });
  jenisSource.forEach(function (j) {
    var opt = document.createElement('option');
    opt.value = j.value;
    opt.textContent = j.label;
    jenisSelect.appendChild(opt);
  });

  
  var floorSelect = document.getElementById('form-floor');
  floorSelect.innerHTML = '<option value="">Pilih lantai</option>';
  (appBootstrap.master.floors || []).forEach(function (f) {
    var opt = document.createElement('option');
    opt.value = f.floor_code;
    opt.textContent = f.floor_name;
    floorSelect.appendChild(opt);
  });

  
  var targetSelect = document.getElementById('form-target-user');
  if (targetSelect) {
    targetSelect.innerHTML = '<option value="">Pilih petugas</option>';
    (appBootstrap.master.fsUsers || []).forEach(function (u) {
      var opt = document.createElement('option');
      opt.value = u.userCode;
      opt.textContent = u.displayName + ' (' + u.userCode + ')';
      targetSelect.appendChild(opt);
    });
  }

  attachFormBuatListenersOnce_();

  if (buatPrefillContext) {
    jenisSelect.value = buatPrefillContext.jenis;
    floorSelect.value = buatPrefillContext.floorCode;
    document.getElementById('form-subject').value = buatPrefillContext.subject;
    document.getElementById('form-description').value = buatPrefillContext.description;
    var descCounterEl = document.getElementById('form-description-counter');
    if (descCounterEl) descCounterEl.textContent = buatPrefillContext.description.length + '/500';
  }

applyBuatModeUI_();
  updateJenisIcon();
  updateAssignmentFieldsVisibility();
  updatePerformedAtFieldVisibility();
  renderPhotoSlots();
  updateFormProgress();
}


function resetBuatPrefillContext_() {
  buatPrefillContext = null;
}



function updateFormProgress() {
  var progressEl = document.getElementById('form-progress-text');
  if (!progressEl) return;

  var jenis = document.getElementById('form-jenis').value;
  var floor = document.getElementById('form-floor').value;
  var desc = document.getElementById('form-description').value.trim();
  var photoCount = selectedPhotos.filter(Boolean).length;

  var doneCount = 0;
  if (jenis) doneCount++;
  if (floor) doneCount++;
  if (desc) doneCount++;
  if (photoCount > 0) doneCount++;

  var percent = Math.round((doneCount / 4) * 100);
  progressEl.textContent = 'Progres: ' + percent + '% | ' + photoCount + ' Foto Terpilih';
}






var PHOTO_SLOT_CAPTIONS_ = ['Foto Kondisi Awal', 'Foto Hasil / Sesudah', 'Foto Detail Tambahan'];

function renderPhotoSlots() {
  var container = document.getElementById('photo-slots');
  container.innerHTML = '';

  for (var i = 0; i < MAX_PHOTOS; i++) {
    var slot = document.createElement('div');
    slot.className = 'photo-slot-v2';

    if (selectedPhotos[i]) {
      var inner = document.createElement('div');
      inner.className = 'photo-thumb-inner';
      var img = document.createElement('img');
      img.src = selectedPhotos[i].previewUrl;
      inner.appendChild(img);
      slot.appendChild(inner);

      inner.addEventListener('click', function (idx) {
        return function () {
          activePhotoSlotIndex = idx;
          openPhotoSourceSheet();
        };
      }(i));

      var removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '\u00d7';
      removeBtn.setAttribute('aria-label', 'Hapus foto');
      removeBtn.addEventListener('click', function (idx) {
        return function (e) {
          e.stopPropagation();
          selectedPhotos.splice(idx, 1);
          renderPhotoSlots();
        };
      }(i));
      slot.appendChild(removeBtn);
    } else {
      slot.innerHTML = '<span class="plus-icon">+</span><span class="slot-caption">' + (PHOTO_SLOT_CAPTIONS_[i] || '') + '</span>';
      slot.addEventListener('click', function (idx) {
        return function () {
          activePhotoSlotIndex = idx;
          openPhotoSourceSheet();
        };
      }(i));
    }

    container.appendChild(slot);
  }

  updateFormProgress();
}


function openPhotoSourceSheet(targetInputId) {
  var inputId = targetInputId || 'photo-file-input';
  openBottomSheet([
    { icon: 'photoCamera', label: 'Ambil Foto', onClick: function () { triggerPhotoFileInput_(true, inputId); } },
    { icon: 'photo', label: 'Pilih dari Galeri', onClick: function () { triggerPhotoFileInput_(false, inputId); } }
  ]);
}

function triggerPhotoFileInput_(useCamera, targetInputId) {
  var input = document.getElementById(targetInputId || 'photo-file-input');
  if (useCamera) {
    input.setAttribute('capture', 'environment');
  } else {
    input.removeAttribute('capture');
  }
  input.click();
}

document.getElementById('photo-file-input').addEventListener('change', function (e) {
  var file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  beginAction(null);
  compressImage(file).then(function (result) {
    endAction(null);
    selectedPhotos[activePhotoSlotIndex] = result;
    renderPhotoSlots();
  }).catch(function (err) {
    endAction(null);
    showSnackbar('Gagal memproses foto. Coba foto lain.', 'error');
  });
});



function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Gagal membaca file')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('Gagal memuat gambar')); };
      img.onload = function () {
        var maxSide = 1280;
        var w = img.width;
        var h = img.height;
        if (w > h && w > maxSide) { h = Math.round(h * (maxSide / w)); w = maxSide; }
        else if (h >= w && h > maxSide) { w = Math.round(w * (maxSide / h)); h = maxSide; }

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        var targetBytes = 100 * 1024;
        var quality = 0.8;
        var dataUrl = canvas.toDataURL('image/jpeg', quality);

        function sizeOf(dUrl) {
          return Math.round((dUrl.length - 'data:image/jpeg;base64,'.length) * 3 / 4);
        }

        var attempts = 0;
        while (sizeOf(dataUrl) > targetBytes && quality > 0.3 && attempts < 8) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          attempts++;
        }

        var base64 = dataUrl.split(',')[1];
        resolve({ base64: base64, mimeType: 'image/jpeg', previewUrl: dataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}



document.getElementById('btn-submit-report').addEventListener('click', function () {
  var errorEl = document.getElementById('form-report-error');
  errorEl.textContent = '';

  
  
  if (buatPrefillContext) {
    submitBuatLaporanCompletion_();
    return;
  }

  var jenisEl = document.getElementById('form-jenis');
  var floorEl = document.getElementById('form-floor');
  var descEl = document.getElementById('form-description');
  var targetEl = document.getElementById('form-target-user');
  clearFieldErrors([floorEl, descEl, targetEl]);

  var jenis = jenisEl.value;
  var isPenugasan = jenis === 'penugasan';
  var assignmentModeEl = document.getElementById('form-assignment-mode');
  var assignmentMode = isPenugasan && assignmentModeEl ? assignmentModeEl.value : '';

  
var performedAtEl = document.getElementById('form-performed-at');
  var data = {
    jenis: jenis,
    floorCode: floorEl.value,
    subject: document.getElementById('form-subject').value,
    description: descEl.value,
    photos: selectedPhotos.filter(Boolean).map(function (p) {
      return { base64: p.base64, mimeType: p.mimeType };
    }),
    assignmentMode: assignmentMode,
    targetUserCode: (isPenugasan && assignmentMode === 'direct' && targetEl) ? targetEl.value : '',
    performedAt: (performedAtEl && performedAtEl.offsetParent !== null && performedAtEl.value) ? performedAtEl.value : ''
  };


  if (!jenis) { errorEl.textContent = 'Jenis pekerjaan wajib dipilih.'; return; }
  if (!data.floorCode) { showFieldError(floorEl, errorEl, 'Lantai wajib dipilih.'); return; }
  if (!data.description.trim()) { showFieldError(descEl, errorEl, 'Keterangan wajib diisi.'); return; }
  if (isPenugasan && assignmentMode === 'direct' && !data.targetUserCode) {
    showFieldError(targetEl, errorEl, 'Pilih petugas penerima.'); return;
  }

  var session = loadSession();
  var submitBtn = document.getElementById('btn-submit-report');
  beginAction(submitBtn, 'Menyimpan...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      if (!response.success) {
        errorEl.textContent = response.error;
        showSnackbar(response.error, 'error');
        return;
      }
      selectedPhotos = [];
      renderPhotoSlots();
      document.getElementById('form-subject').value = '';
      document.getElementById('form-description').value = '';
      var descCounterEl = document.getElementById('form-description-counter');
      if (descCounterEl) descCounterEl.textContent = '0/500';
      updateFormProgress();

      invalidateAllPekerjaanCaches_();

      showPekerjaanSuccessCard(jenis);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    })
    .createPekerjaan(session.accessCode, data);
});



function submitBuatLaporanCompletion_() {
  var errorEl = document.getElementById('form-report-error');
  var descEl = document.getElementById('form-description');
  var pekerjaanId = buatPrefillContext.pekerjaanId;

  var data = {
    notes: descEl.value,
    photos: selectedPhotos.filter(Boolean).map(function (p) {
      return { base64: p.base64, mimeType: p.mimeType };
    })
  };

  var session = loadSession();
  var submitBtn = document.getElementById('btn-submit-report');
  beginAction(submitBtn, 'Mengirim...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      if (!response.success) {
        errorEl.textContent = response.error;
        showSnackbar(response.error, 'error');
        return;
      }
      resetBuatPrefillContext_();
      selectedPhotos = [];
      renderPhotoSlots();
      document.getElementById('form-subject').value = '';
      document.getElementById('form-description').value = '';
      var descCounterEl = document.getElementById('form-description-counter');
      if (descCounterEl) descCounterEl.textContent = '0/500';
      updateFormProgress();

      invalidateAllPekerjaanCaches_();

      showLaporanSuccessCard_(pekerjaanId);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    })
    .selesaikanPekerjaan(session.accessCode, pekerjaanId, data);
}



var JENIS_MANDIRI_SET_ = ['kebersihan', 'perbaikan', 'lainnya'];

function showPekerjaanSuccessCard(jenis) {
  document.getElementById('buat-form-card').style.display = 'none';
  var isMandiri = JENIS_MANDIRI_SET_.indexOf(jenis) !== -1;
  document.getElementById('buat-success-message').textContent = 'Pekerjaan berhasil dibuat.';
  var subtextEl = document.getElementById('buat-success-subtext');
  if (subtextEl) {
    subtextEl.textContent = isMandiri
      ? 'Pekerjaan ini bersifat mandiri dan otomatis ditandai selesai.'
      : (jenis === 'penugasan'
        ? 'Menunggu diambil oleh Facility Support terkait.'
        : 'Menunggu ditindaklanjuti oleh Administrator.');
  }
  document.getElementById('buat-success-card').style.display = 'block';
}

function showLaporanSuccessCard_(pekerjaanId) {
  document.getElementById('buat-form-card').style.display = 'none';
  document.getElementById('buat-success-message').textContent = 'Laporan berhasil dikirim.';
  var subtextEl = document.getElementById('buat-success-subtext');
  if (subtextEl) subtextEl.textContent = 'Pekerjaan ' + pekerjaanId + ' telah ditandai selesai.';
  document.getElementById('buat-success-card').style.display = 'block';
}

function hidePekerjaanSuccessCard() {
  document.getElementById('buat-success-card').style.display = 'none';
  document.getElementById('buat-form-card').style.display = 'block';
}

document.getElementById('btn-buat-laporan-lagi').addEventListener('click', function () {
  hidePekerjaanSuccessCard();
  initPekerjaanForm();
});


document.getElementById('btn-lihat-riwayat-setelah-submit').addEventListener('click', function () {
  hidePekerjaanSuccessCard();
  
  
  
  
  if (typeof loadRiwayatPekerjaan === 'function') {
    goToPage('jadwal');
  } else {
    window.location.href = (appBootstrap && appBootstrap.webAppUrl) || window.location.href;

function renderSkeleton(containerId, lineCount) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var widths = ['90%', '70%', '85%', '60%'];
  var html = '';
  for (var i = 0; i < (lineCount || 3); i++) {
    html += '<div class="skeleton-line" style="width:' + (widths[i % widths.length]) + ';"></div>';
  }
  el.innerHTML = html;
}



function renderListSkeleton_(containerId, cardCount, message) {
  var el = document.getElementById(containerId);
  if (!el) return;

  var cardHtml =
    '<div class="skeleton-card">' +
      '<div class="skeleton-card-main">' +
        '<div class="skeleton-block skeleton-pill"></div>' +
        '<div class="skeleton-block skeleton-date"></div>' +
        '<div class="skeleton-person-row">' +
          '<div class="skeleton-block skeleton-avatar"></div>' +
          '<div class="skeleton-person-lines">' +
            '<div class="skeleton-block skeleton-line-name"></div>' +
            '<div class="skeleton-block skeleton-line-sub"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="skeleton-block skeleton-thumb"></div>' +
    '</div>';

  var html = '';
  for (var i = 0; i < (cardCount || 3); i++) html += cardHtml;
  html += '<div class="skeleton-caption"><span class="spinner-sm"></span><span>' + (message || 'Memuat data...') + '</span></div>';
  el.innerHTML = html;
}



function debounce_(fn, delayMs) {
  var timer = null;
  return function () {
    var args = arguments;
    var ctx = this;
    clearTimeout(timer);
    timer = setTimeout(function () { fn.apply(ctx, args); }, delayMs);
  };
}






var JENIS_PEKERJAAN_BADGE = {
  kebersihan: { label: 'Kebersihan', cls: 'badge-available', icon: 'broom' },
  perbaikan: { label: 'Perbaikan', cls: 'badge-completed', icon: 'wrench' },
  lainnya: { label: 'Lainnya', cls: 'badge-neutral', icon: 'description' },
  penugasan: { label: 'Penugasan', cls: 'badge-info', icon: 'task' },
  lapor_kerusakan: { label: 'Lapor Kerusakan', cls: 'badge-alert', icon: 'warning' },
  permintaan: { label: 'Permintaan', cls: 'badge-claimed', icon: 'calendarCheck' }
};

var STATUS_PEKERJAAN_BADGE_CLASS = { TERBUKA: 'badge-available', DIKERJAKAN: 'badge-claimed', SELESAI: 'badge-completed' };

var STATUS_BUBBLE_COLOR = {
  'badge-available': { bg: 'var(--status-available-bg)', fg: 'var(--status-available-fg)' },

  main.appendChild(metaRow);

      console.warn('Gagal memuat thumbnail. file_id:', cfg.photos[0].file_id);

      thumbSide.style.alignItems = 'center';
      thumbSide.style.justifyContent = 'center';

      thumbSide.style.color = 'var(--color-text-faint)';
      thumbSide.innerHTML = mdIcon('photo', 22);
    };

      var overlay = document.createElement('span');
      overlay.className = 'thumb-count-overlay';
      overlay.textContent = '+' + (cfg.photos.length - 1);

    placeholder.className = 'no-photo-placeholder';

    card.appendChild(placeholder);

  if (cfg.onCardClick) {
    card.addEventListener('click', cfg.onCardClick);
  }

  return card;

function formatDetailDateTime_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var parts = String(ddmmyyyyHHmm).split(' ');
  var dp = (parts[0] || '').split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  return INDO_DAY_NAMES_[d.getDay()] + ', ' + dp[0] + '/' + dp[1] + '/' + String(dp[2]).slice(-2) + ' \u2022 ' + (parts[1] || '');
}

    '<div class="form-group">' +
      '<label class="form-label">Catatan Penuntasan</label>' +
      '<textarea id="penuntasan-edit-notes" class="form-input" rows="4" maxlength="500"></textarea>' +
    '</div>' +
    '<div class="form-actions-row">' +
      '<button class="btn-outlined" id="btn-cancel-penuntasan-edit" type="button">Batal</button>' +
      '<button class="btn-primary" id="btn-submit-penuntasan-edit" type="button">Simpan</button>' +
    '</div>' +
    '<div class="form-error" id="penuntasan-edit-error"></div>';

  document.getElementById('penuntasan-edit-notes').value = p.completionNotes || '';

  document.getElementById('btn-cancel-penuntasan-edit').addEventListener('click', function () {
    openPekerjaanDetail(p);
  });

  document.getElementById('btn-submit-penuntasan-edit').addEventListener('click', function () {
    var errorEl = document.getElementById('penuntasan-edit-error');
    var notesEl = document.getElementById('penuntasan-edit-notes');
    errorEl.textContent = '';

    if (!notesEl.value.trim()) { errorEl.textContent = 'Catatan penuntasan wajib diisi.'; return; }

    var session = loadSession();
    var submitBtn = document.getElementById('btn-submit-penuntasan-edit');
    beginAction(submitBtn, 'Menyimpan...');
    google.script.run
      .withSuccessHandler(function (response) {
        endAction(submitBtn);
        if (!response.success) { errorEl.textContent = response.error; showSnackbar(response.error, 'error'); return; }
        showSnackbar('Catatan penuntasan berhasil diubah.', 'success');
        closeActivityDetail();
        invalidateAllPekerjaanCaches_();
        refreshCurrentPekerjaanPage_();
      })
      .withFailureHandler(function () {
        endAction(submitBtn);
        errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .ubahPenuntasanPekerjaan(session.accessCode, p.pekerjaanId, { completionNotes: notesEl.value });
  });
}






function renderKomentarSection_(p, body) {
  var section = document.createElement('div');
  section.className = 'komentar-section';
  section.innerHTML =
    '<div class="komentar-head"><span class="title">Komentar</span>' +
    '<button class="btn-icon" type="button" id="btn-komentar-refresh" aria-label="Muat ulang komentar">' + mdIcon('refresh', 18) + '</button></div>' +
    '<div id="komentar-list"><div class="inline-loading"><span class="spinner-sm"></span>Memuat komentar...</div></div>' +
    '<div id="komentar-form-wrap"></div>';
  body.appendChild(section);

  document.getElementById('btn-komentar-refresh').addEventListener('click', function () { loadKomentar_(p); });
  loadKomentar_(p);
}

function loadKomentar_(p) {
  var session = loadSession();
  var listEl = document.getElementById('komentar-list');
  if (!listEl) return;
  google.script.run
    .withSuccessHandler(function (response) {
      listEl = document.getElementById('komentar-list');
      if (!listEl) return; 
      if (!response.success) { listEl.innerHTML = '<div class="komentar-empty">' + response.error + '</div>'; return; }
      p.commentCount = response.data.komentar.length;
      renderKomentarList_(p, response.data.komentar);
      renderKomentarForm_(p, response.data.canKirim);
    })
    .withFailureHandler(function () {
      var el = document.getElementById('komentar-list');
      if (el) el.innerHTML = '<div class="komentar-empty">Gagal memuat komentar.</div>';
    })
    .getKomentarList(session.accessCode, p.pekerjaanId);
}

function renderKomentarList_(p, list) {
  var listEl = document.getElementById('komentar-list');
  listEl.innerHTML = '';
  if (!list.length) {
    listEl.innerHTML = '<div class="komentar-empty">Belum ada komentar.</div>';
    return;
  }
  list.forEach(function (k) {
    var item = document.createElement('div');
    item.className = 'komentar-item';

    var meta = document.createElement('div');
    meta.className = 'komentar-meta';
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = k.userName;
    meta.appendChild(name);
    var when = document.createElement('span');
    when.textContent = k.createdAt + (k.edited ? ' \u00b7 diedit' : '');
    meta.appendChild(when);
    item.appendChild(meta);

    var text = document.createElement('div');
    text.className = 'komentar-text';
    text.textContent = k.text; 
    item.appendChild(text);

    if (k.canUbah || k.canHapus) {
      var actions = document.createElement('div');
      actions.className = 'komentar-actions';
      if (k.canUbah) {
        var editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', function () { startEditKomentar_(p, k, item, text, actions); });
        actions.appendChild(editBtn);
      }
      if (k.canHapus) {
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'danger';
        delBtn.textContent = 'Hapus';
        delBtn.addEventListener('click', function () {
          showConfirmModal('Hapus komentar ini?', function () { doHapusKomentar_(p, k.komentarId); }, 'delete', true, 'Menghapus...');
        });
        actions.appendChild(delBtn);
      }
      item.appendChild(actions);
    }
    listEl.appendChild(item);
  });
}

function startEditKomentar_(p, k, item, textEl, actionsEl) {
  var ta = document.createElement('textarea');
  ta.className = 'form-input';
  ta.rows = 3;
  ta.maxLength = 500;
  ta.value = k.text;
  item.replaceChild(ta, textEl);
  actionsEl.innerHTML = '';

  var save = document.createElement('button');
  save.type = 'button';
  save.textContent = 'Simpan';
  var cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = 'Batal';
  actionsEl.appendChild(save);
  actionsEl.appendChild(cancel);

  cancel.addEventListener('click', function () { loadKomentar_(p); });
  save.addEventListener('click', function () {
    if (!ta.value.trim()) { showSnackbar('Komentar tidak boleh kosong.', 'error'); return; }
    var session = loadSession();
    beginAction(save, 'Menyimpan...');
    google.script.run
      .withSuccessHandler(function (response) {
        endAction(save);
        if (!response.success) { showSnackbar(response.error, 'error'); return; }
        invalidateAllPekerjaanCaches_();
        loadKomentar_(p);
      })
      .withFailureHandler(function () {
        endAction(save);
        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .ubahKomentar(session.accessCode, k.komentarId, ta.value);
  });
}

function doHapusKomentar_(p, komentarId) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null); 
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Komentar dihapus.', 'success');
      invalidateAllPekerjaanCaches_();
      loadKomentar_(p);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal menghapus komentar. Coba lagi.', 'error');
    })
    .hapusKomentar(session.accessCode, komentarId);
}

function renderKomentarForm_(p, canKirim) {
  var wrap = document.getElementById('komentar-form-wrap');
  if (!wrap || wrap.dataset.rendered) return; 
  wrap.dataset.rendered = '1';
  if (!canKirim) { wrap.innerHTML = '<div class="komentar-empty">Akun Demo hanya dapat melihat komentar.</div>'; return; }

  wrap.innerHTML =
    '<div class="komentar-form">' +
      '<textarea id="komentar-input" class="form-input" rows="1" maxlength="500" placeholder="Tulis komentar..."></textarea>' +
      '<button class="btn-primary" id="btn-komentar-kirim" type="button">Kirim</button>' +
    '</div>';

  document.getElementById('btn-komentar-kirim').addEventListener('click', function () {
    var input = document.getElementById('komentar-input');
    var btn = document.getElementById('btn-komentar-kirim');
    if (!input.value.trim()) return;
    var session = loadSession();
    beginAction(btn, 'Kirim...');
    google.script.run
      .withSuccessHandler(function (response) {
        endAction(btn);
        if (!response.success) { showSnackbar(response.error, 'error'); return; }
        input.value = '';
        invalidateAllPekerjaanCaches_();
        loadKomentar_(p);
      })
      .withFailureHandler(function () {
        endAction(btn);
        showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
      })
      .buatKomentar(session.accessCode, p.pekerjaanId, input.value);
  });
}


 
function detailRowWithIcon_(iconName, label, value) {
  return '<div class="activity-detail-row">' +
    '<span class="label" style="display:flex; align-items:center; gap:8px;"><span class="icon-slot">' + mdIcon(iconName, 16) + '</span>' + label + '</span>' +
    '<span class="value">' + value + '</span>' +
  '</div>';
}





var PEKERJAAN_AUTO_REFRESH_MS = 60000;
var pekerjaanAutoRefreshTimer = null;

function stopPekerjaanAutoRefresh() {
  if (pekerjaanAutoRefreshTimer) {
    clearInterval(pekerjaanAutoRefreshTimer);
    pekerjaanAutoRefreshTimer = null;
  }
}

function startPekerjaanAutoRefresh() {
  stopPekerjaanAutoRefresh();
  pekerjaanAutoRefreshTimer = setInterval(function () {
    if (currentPage === 'pekerjaan' && document.visibilityState === 'visible') {
      loadPekerjaanInbox(true);
    }
  }, PEKERJAAN_AUTO_REFRESH_MS);
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && currentPage === 'pekerjaan') {
    loadPekerjaanInbox(true);
  }
});

var currentPekerjaanFilter = 'all';
var PEKERJAAN_FILTERS = [
  { key: 'all', label: 'Semua' },
  { key: 'TERBUKA', label: 'Menunggu Diambil' },
  { key: 'DIKERJAKAN', label: 'Dikerjakan' }
];

function initPekerjaanInboxPage() {
  if (!appBootstrap) return;
  var role = appBootstrap.currentUser.role;
  var isFs = role === 'fs';

  var titleEl = document.getElementById('pekerjaan-header-title');
  if (titleEl) titleEl.textContent = isFs ? 'TUGAS UNTUK ANDA' : 'Menu Pekerjaan';

  var subtitleEl = document.getElementById('pekerjaan-header-subtitle');
  if (subtitleEl) {
    subtitleEl.textContent = (role === 'admin' || role === 'demo')
      ? 'Lapor Kerusakan & Permintaan dari seluruh Facility Support'
      : 'Penugasan yang menunggu atau sedang Anda kerjakan';
  }

  renderPekerjaanFilter_();
  loadPekerjaanInbox();
}

 
function renderPekerjaanFilter_() {
  var btn = document.getElementById('btn-pekerjaan-filter');
  var menu = document.getElementById('pekerjaan-filter-menu');
  if (!btn || !menu) return;

  var current = PEKERJAAN_FILTERS.filter(function (f) { return f.key === currentPekerjaanFilter; })[0] || PEKERJAAN_FILTERS[0];
  var isOpen = menu.style.display === 'block';
  btn.innerHTML = '<span>' + current.label + '</span>' + mdIcon(isOpen ? 'chevronUp' : 'chevronDown', 16);

  menu.innerHTML = '';
  PEKERJAAN_FILTERS.forEach(function (f) {
    var opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'activity-filter-option' + (f.key === currentPekerjaanFilter ? ' active' : '');
    opt.innerHTML = '<span class="opt-dot"></span><span>' + f.label + '</span>';
    opt.addEventListener('click', function (e) {
      e.stopPropagation();
      currentPekerjaanFilter = f.key;
      menu.style.display = 'none';
      renderPekerjaanFilter_();
      renderPekerjaanInboxList(pageDataCache.pekerjaanInbox || []);
    });
    menu.appendChild(opt);
  });

  if (!btn.dataset.bound) {
    btn.dataset.bound = '1';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      renderPekerjaanFilter_();
    });
    document.addEventListener('click', function () {
      if (menu.style.display === 'block') {
        menu.style.display = 'none';
        renderPekerjaanFilter_();
      }
    });
  }
}


function loadPekerjaanInbox(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.pekerjaanInbox;

  if (cached && !force) {
    renderPekerjaanInboxList(cached);
    return;
  }

  if (!cached) {
  
        renderListSkeleton_('pekerjaan-list', 3, 'Memuat data pekerjaan...');
  }

  google.script.run
    .withSuccessHandler(function (response) {
      var container = document.getElementById('pekerjaan-list');
      if (!response.success) {
        if (!cached) container.innerHTML = '<p>' + response.error + '</p>';
        var bar1 = document.getElementById('linear-progress');
        if (bar1) bar1.classList.remove('show');
        return;
      }
      pageDataCache.pekerjaanInbox = response.data.pekerjaan;
      renderPekerjaanInboxList(response.data.pekerjaan);
      
      
      
      
      
      
      var bar2 = document.getElementById('linear-progress');
      if (bar2) bar2.classList.remove('show');
    })
    .withFailureHandler(function () {
      if (!cached) document.getElementById('pekerjaan-list').innerHTML = '<p>Gagal memuat daftar pekerjaan.</p>';
      var bar3 = document.getElementById('linear-progress');
      if (bar3) bar3.classList.remove('show');
    })
    .getPekerjaanList(session.accessCode, { view: 'inbox' });
}

function renderPekerjaanInboxList(list) {
  var container = document.getElementById('pekerjaan-list');
  container.innerHTML = '';

  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('task', 26) + '</div>Tidak ada pekerjaan di inbox Anda.</div>';
    return;
  }

  if (currentPekerjaanFilter !== 'all') {
    list = list.filter(function (p) { return p.status === currentPekerjaanFilter; });
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('task', 26) + '</div>Tidak ada pekerjaan dengan status ini.</div>';
      return;
    }
  }

  var STATUS_SORT_PRIORITY = { DIKERJAKAN: 0, TERBUKA: 1 };
  list = list.slice().sort(function (a, b) {
    var pa = STATUS_SORT_PRIORITY[a.status] != null ? STATUS_SORT_PRIORITY[a.status] : 2;
    var pb = STATUS_SORT_PRIORITY[b.status] != null ? STATUS_SORT_PRIORITY[b.status] : 2;
    return pa - pb;
  });

  list.forEach(function (p) {
    container.appendChild(buildPekerjaanInboxCard_(p));
  });
}



function doAmbilPekerjaan(pekerjaanId) {
  var session = loadSession();
  beginAction(null, 'Mengambil...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) { showSnackbar(response.error, 'error'); }
      else { showSnackbar('Pekerjaan berhasil diambil.', 'success'); }
      invalidateAllPekerjaanCaches_();
      loadPekerjaanInbox(true);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal mengambil pekerjaan. Coba lagi.', 'error');
    })
    .ambilPekerjaan(session.accessCode, pekerjaanId);
}





 
function attachCardProgress_(cardEl) {
  var main = cardEl && cardEl.querySelector('.list-card-row-main');
  if (!main) return { set: function () {}, remove: function () {} };

  var box = document.createElement('div');
  box.className = 'card-progress';
  box.innerHTML =
    '<div class="card-progress-bar"><div class="card-progress-fill"></div></div>' +
    '<div class="card-progress-text"></div>';
  main.appendChild(box);

  var fill = box.querySelector('.card-progress-fill');
  var text = box.querySelector('.card-progress-text');
  return {
    set: function (pct) {
      fill.style.width = pct + '%';
      text.textContent = 'Mengecek data penugasan... (' + pct + '%)';
    },
    remove: function () { if (box.parentNode) box.parentNode.removeChild(box); }
  };
}



function doAmbilPekerjaanInline_(buttonEl, p) {
  var session = loadSession();
  var cardEl = buttonEl.closest('.list-card');
  var progress = attachCardProgress_(cardEl);
  var toastDetail = 'Tugas "' + truncateText_(p.subject || p.description, 40) + '" kini ada di tangan Anda. Tekan Buat Laporan setelah selesai.';

  function toastSuccess() { showSnackbar('Pekerjaan berhasil diambil', 'success', toastDetail); }

  progress.set(10);
  beginAction(buttonEl, 'Mengambil...');
  google.script.run
    .withSuccessHandler(function (response) {
      var bar = document.getElementById('linear-progress');
      if (bar) bar.classList.remove('show');

      if (!response.success) {
        progress.remove();
        if (document.body.contains(buttonEl)) endAction(buttonEl);
        showSnackbar(response.error, 'error');
        return;
      }
      invalidateAllPekerjaanCaches_();
      progress.set(55);

      google.script.run
        .withSuccessHandler(function (listResponse) {
          if (!listResponse.success || !document.body.contains(cardEl)) {
            toastSuccess();
            loadPekerjaanInbox(true);
            return;
          }
          progress.set(100);
          var freshP = listResponse.data.pekerjaan.find(function (row) { return row.pekerjaanId === p.pekerjaanId; });
          setTimeout(function () {
            if (!document.body.contains(cardEl)) { toastSuccess(); loadPekerjaanInbox(true); return; }
            if (!freshP) {
              cardEl.remove();
            } else {
              cardEl.replaceWith(buildPekerjaanInboxCard_(freshP));
            }
            toastSuccess();
          }, 300);
        })
        .withFailureHandler(function () {
          toastSuccess();
          loadPekerjaanInbox(true);
        })
        .getPekerjaanList(session.accessCode, { view: 'inbox' });
    })
    .withFailureHandler(function () {
      var bar = document.getElementById('linear-progress');
      if (bar) bar.classList.remove('show');
      progress.remove();
      if (document.body.contains(buttonEl)) endAction(buttonEl);
      showSnackbar('Gagal mengambil pekerjaan. Coba lagi.', 'error');
    })
    .ambilPekerjaan(session.accessCode, p.pekerjaanId);
}

function doLepasPekerjaan(pekerjaanId) {
  showConfirmModal('Lepas pekerjaan ini agar bisa diambil pihak lain?', function () {
    executeLepasPekerjaan(pekerjaanId);
  }, 'delete', true, 'Melepas...');
}



function executeLepasPekerjaan(pekerjaanId) {
  var session = loadSession();
  beginAction(null, 'Melepas...');
  google.script.run
    .withSuccessHandler(function (response) {
      hideConfirmModal();
      if (!response.success) {
        var bar = document.getElementById('linear-progress');
        if (bar) bar.classList.remove('show');
        showSnackbar(response.error, 'error');
        return;
      }
      showSnackbar('Pekerjaan dilepas kembali.', 'success');
      invalidateAllPekerjaanCaches_();
      loadPekerjaanInbox(true);
    })
    .withFailureHandler(function () {
      hideConfirmModal();
      endAction(null);
      showSnackbar('Gagal melepas pekerjaan. Coba lagi.', 'error');
    })
    .lepasPekerjaan(session.accessCode, pekerjaanId);
}
