<script>
// ============================================================
// FIELD VALIDATION HIGHLIGHT (Sprint 6.02 #5)
// ============================================================

function clearFieldErrors(fieldEls) {
  fieldEls.forEach(function (el) { if (el) el.classList.remove('input-error'); });
}

/** Border merah + pesan kecil tepat di bawah input terkait (hilang sendiri saat diisi/diubah). */
function setInlineError_(fieldEl, message) {
  if (!fieldEl) return;
  var host = fieldEl.closest('.select-field-wrap') || fieldEl;
  host.classList.add('field-invalid');
  var msg = host.parentNode.querySelector(':scope > .field-error-msg[data-for="' + (fieldEl.id || '') + '"]');
  if (!msg) {
    msg = document.createElement('div');
    msg.className = 'field-error-msg';
    msg.setAttribute('data-for', fieldEl.id || '');
    msg.setAttribute('role', 'alert');
    host.insertAdjacentElement('afterend', msg);
    // untuk textarea: pindahkan setelah penghitung karakter bila ada
    var counter = host.nextElementSibling && host.nextElementSibling.nextElementSibling;
    if (counter && counter.classList && counter.classList.contains('char-counter')) counter.insertAdjacentElement('afterend', msg);
  }
  msg.textContent = message;
  var clear = function () { clearInlineError_(fieldEl); };
  if (!fieldEl._inlineErrBound) {
    fieldEl._inlineErrBound = true;
    fieldEl.addEventListener('input', clear);
    fieldEl.addEventListener('change', clear);
  }
  try { host.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
}
function clearInlineError_(fieldEl) {
  if (!fieldEl) return;
  var host = fieldEl.closest('.select-field-wrap') || fieldEl;
  host.classList.remove('field-invalid');
  var scope = host.parentNode;
  var msg = scope && scope.querySelector('.field-error-msg[data-for="' + (fieldEl.id || '') + '"]');
  if (msg) msg.remove();
}

function showFieldError(fieldEl, errorEl, message) {
  if (fieldEl) {
    fieldEl.classList.add('input-error');
    fieldEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (errorEl) errorEl.textContent = message;
}

// ============================================================
// CONFIRM MODAL (Sprint 6.02 #4) — pengganti window.confirm() bawaan
// ============================================================


var pendingConfirmCallback = null;
var confirmModalBusyLabel = 'Memproses...';
var confirmModalIsBusyMode = false;

/**
 * PATCH — FIX bug "popup Reset/Logout freeze". Akar masalah sebelumnya:
 * showConfirmModal() diubah supaya TIDAK auto-close, dengan asumsi
 * SEMUA onConfirm pada akhirnya memanggil endAction() (pola async
 * hapus/lepas). Tapi banyak pemanggil (Reset form, Logout) adalah
 * fungsi SINKRON yang tidak pernah memanggil endAction/hideConfirmModal
 * sama sekali -> modal menggantung selamanya.
 *
 * FIX: busy-mode (loading state di tombol + modal tetap terbuka sampai
 * endAction dipanggil) SEKARANG OPT-IN lewat parameter ke-4 `busyMode`
 * (boolean, default false/undefined). Tanpa parameter ini, perilaku
 * KEMBALI seperti semula: modal langsung tertutup begitu tombol ditekan
 * (aman untuk proses sinkron seperti Reset/Logout). HANYA pemanggil
 * yang eksplisit mengirim busyMode=true (Hapus Pekerjaan/Jadwal/
 * Content, Lepas Pekerjaan — proses async yang pakai beginAction/
 * endAction(null)) yang mendapat loading state di tombol.
 */
function showConfirmModal(message, onConfirm, iconName, busyMode, busyLabel, labels) {
  labels = labels || {};
  pendingConfirmCallback = onConfirm;
  confirmModalIsBusyMode = !!busyMode;
  confirmModalBusyLabel = busyLabel || 'Memproses...';
  document.getElementById('confirm-modal-icon').innerHTML = mdIcon(iconName || 'delete', labels.variant === 'konten' ? 36 : 24);
  var msgEl = document.getElementById('confirm-modal-message');
  if (labels.messageHtml) { msgEl.innerHTML = labels.messageHtml; msgEl.style.display = ''; } // HTML statis dari pemanggil (bukan input pengguna)
  else { msgEl.textContent = message || ''; msgEl.style.display = message ? '' : 'none'; }
  document.getElementById('confirm-modal-cancel').disabled = false;
  document.getElementById('confirm-modal-cancel').innerHTML = '<span>' + (labels.cancel || 'Batal') + '</span>';
  var confirmBtn = document.getElementById('confirm-modal-confirm');
  confirmBtn.disabled = false;
  confirmBtn.innerHTML = mdIcon('checkCircle', 18) + '<span>' + (labels.confirm || 'Ya, Lanjutkan') + '</span>';

  // Mode "rich" (opsional): judul, daftar dampak, dan kotak centang persetujuan.
  // Tombol konfirmasi baru aktif setelah kotak dicentang. Dipakai Hapus Pekerjaan.
  var card = document.querySelector('#confirm-modal-overlay .confirm-modal-card');
  var titleEl = document.getElementById('confirm-modal-title');
  var pointsEl = document.getElementById('confirm-modal-points');
  var checkWrap = document.getElementById('confirm-modal-check');
  var checkbox = document.getElementById('confirm-modal-checkbox');
  var rich = !!(labels.title || labels.points || labels.checkText);
  card.classList.toggle('rich', rich);
  // Varian "konten": ikon besar, latar kabur, kotak persetujuan merah muda (mis. Hapus Konten).
  var modern = labels.variant === 'konten';
  card.classList.toggle('cm-modern', modern);
  document.getElementById('confirm-modal-overlay').classList.toggle('cm-blur', modern);
  titleEl.style.display = labels.title ? '' : 'none';
  titleEl.textContent = labels.title || '';
  pointsEl.style.display = 'none'; pointsEl.textContent = '';
  if (labels.points && labels.points.length) {
    var cap = document.createElement('p'); cap.className = 'confirm-points-caption'; cap.textContent = labels.pointsCaption || 'Dampak tindakan ini:';
    pointsEl.appendChild(cap);
    labels.points.forEach(function (pt) {
      var row = document.createElement('div'); row.className = 'confirm-point';
      var ic = document.createElement('span'); ic.className = 'confirm-point-ico'; ic.innerHTML = mdIcon(pt.icon || 'warning', 18);
      var tx = document.createElement('span');
      (pt.parts || []).forEach(function (part) {
        if (part[1]) { var b = document.createElement('strong'); b.textContent = part[0]; tx.appendChild(b); }
        else tx.appendChild(document.createTextNode(part[0]));
      });
      row.appendChild(ic); row.appendChild(tx); pointsEl.appendChild(row);
    });
    pointsEl.style.display = '';
  }
  checkbox.checked = false;
  checkbox.disabled = false;
  checkWrap.style.display = labels.checkText ? '' : 'none';
  document.getElementById('confirm-modal-check-text').textContent = labels.checkText || '';
  document.getElementById('confirm-modal-checkbox-box').innerHTML = mdIcon('check', 16);
  confirmModalNeedsCheck_ = !!labels.checkText;
  confirmBtn.disabled = confirmModalNeedsCheck_;
  card.classList.toggle('needs-check', confirmModalNeedsCheck_);

  document.getElementById('confirm-modal-overlay').classList.add('show');
}

var confirmModalNeedsCheck_ = false;
document.getElementById('confirm-modal-checkbox').addEventListener('change', function () {
  if (confirmModalIsBusyMode && document.getElementById('confirm-modal-cancel').disabled) return; // sedang memproses
  document.getElementById('confirm-modal-confirm').disabled = confirmModalNeedsCheck_ && !this.checked;
});

function hideConfirmModal() {
  document.getElementById('confirm-modal-overlay').classList.remove('show');
  pendingConfirmCallback = null;
  confirmModalIsBusyMode = false;
}

document.getElementById('confirm-modal-cancel').addEventListener('click', hideConfirmModal);
document.getElementById('confirm-modal-confirm').addEventListener('click', function () {
  var cb = pendingConfirmCallback;
  if (confirmModalNeedsCheck_ && !document.getElementById('confirm-modal-checkbox').checked) return;

  if (!confirmModalIsBusyMode) {
    // Perilaku LAMA (default) — tutup modal dulu, baru jalankan
    // callback. Aman untuk proses sinkron (Reset form, Logout) maupun
    // async yang TIDAK memakai pola beginAction/endAction(null).
    hideConfirmModal();
    if (cb) cb();
    return;
  }

  // Busy mode — tombol jadi loading state, modal TETAP TERBUKA sampai
  // endAction(null) dipanggil pemanggil (lihat hook di endAction di
  // bawah).
  var confirmBtn = document.getElementById('confirm-modal-confirm');
  var cancelBtn = document.getElementById('confirm-modal-cancel');
  confirmBtn.disabled = true;
  cancelBtn.disabled = true;
  document.getElementById('confirm-modal-checkbox').disabled = true;
  confirmBtn.innerHTML = '<span class="btn-loading-dots"><span></span><span></span><span></span></span><span>' + confirmModalBusyLabel + '</span>';

  if (cb) cb();
});

// ============================================================
// BOTTOM SHEET (Patch 7.2) — pengganti pop-up aksi kontekstual per item.
// items: [{ icon, label, danger (opsional), onClick }]
// ============================================================

function openBottomSheet(items, opts) {
  var body = document.getElementById('bottom-sheet-body');
  body.innerHTML = '';
  var overlay = document.getElementById('bottom-sheet-overlay');
  var center = !!(opts && opts.center);
  overlay.classList.toggle('center', center);
  var titleEl = document.getElementById('bottom-sheet-title');
  if (titleEl) { titleEl.textContent = (opts && opts.title) || ''; titleEl.style.display = center && opts.title ? 'block' : 'none'; }
  (items || []).forEach(function (item) {
    var btn = document.createElement('button');
    btn.className = 'bottom-sheet-item' + (item.danger ? ' danger' : '');
    btn.innerHTML = '<span class="bs-icon">' + mdIcon(item.icon, 20) + '</span><span class="bs-label">' + item.label + '</span>' +
      (item.radio ? '<span class="bs-radio' + (item.selected ? ' selected' : '') + '"></span>' : '');
    if (item.selected) btn.classList.add('selected');
    btn.addEventListener('click', function () {
      closeBottomSheet();
      if (item.onClick) item.onClick();
    });
    body.appendChild(btn);
  });
  document.getElementById('bottom-sheet-overlay').classList.add('show');
}

function closeBottomSheet() {
  document.getElementById('bottom-sheet-overlay').classList.remove('show');
}

document.getElementById('bottom-sheet-overlay').addEventListener('click', function (e) {
  if (e.target === this) closeBottomSheet(); // tap backdrop untuk menutup
});

// ============================================================
// Menu Akun (#btn-back-from-akun) & Detail overlay ✕
// ============================================================

function closeActivityDetail() {
  document.getElementById('activity-detail-overlay').classList.remove('show');
}

document.getElementById('btn-close-activity-detail-x').addEventListener('click', closeActivityDetail);
document.getElementById('activity-detail-overlay').addEventListener('click', function (e) {
  if (e.target === this) closeActivityDetail(); // tap backdrop untuk menutup
});

document.getElementById('btn-back-from-akun').addEventListener('click', function () {
  goToPage(lastMainPage); // kembali ke halaman utama sebelum membuka Akun
});

// ============================================================
// SESSION (localStorage) — SDS Section 17
// ============================================================

var SESSION_KEY = 'fs_session';

// Penyimpanan bisa diblokir/penuh (mode privat): dibungkus try/catch dan, bila gagal, sesi
// ditahan di memori agar aplikasi tetap berjalan selama tab terbuka.
var memSession_ = null;

function saveSession(session) {
  memSession_ = session;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) { /* tetap di memori */ }
}

function loadSession() {
  var raw = null;
  try { raw = localStorage.getItem(SESSION_KEY); } catch (e) { raw = null; }
  if (!raw) return memSession_;
  try {
    return JSON.parse(raw);
  } catch (e) {
    return memSession_;
  }
}

function clearSession() {
  memSession_ = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* abaikan */ }
}

// ============================================================
// UI HELPERS (Patch 7.2 — MD3 loading & feedback)
// ============================================================

// ============================================================
// SPLASH SCREEN (loading awal: login & masuk kembali)
// ============================================================
var splashClosing_ = false, splashTimer_ = null, splashPct_ = 0, splashStep_ = 0, splashShownAt_ = 0;
var SPLASH_STEPS_ = ['Menghubungkan ke server...', 'Memeriksa akses petugas...', 'Menyiapkan dasbor & data...'];

function showSplash_() {
  sfxPreload_(); // unduh+decode suara "siap" selagi memuat, agar bunyi tepat saat 100%
  var el = document.getElementById('splash-screen');
  if (!el) return;
  clearInterval(splashTimer_);
  splashClosing_ = false;
  splashPct_ = 8; splashStep_ = 0; splashShownAt_ = Date.now();
  el.classList.remove('hide');
  el.classList.add('show');
  el.setAttribute('data-stage', '1');
  setSplashProgress_(splashPct_, SPLASH_STEPS_[0]);
  // Merayap menuju 90% selagi menunggu server; selesai ditentukan hideSplash_().
  splashTimer_ = setInterval(function () {
    splashPct_ += (90 - splashPct_) * 0.12;
    var step = splashPct_ > 62 ? 2 : (splashPct_ > 28 ? 1 : 0);
    setSplashProgress_(splashPct_, step !== splashStep_ ? SPLASH_STEPS_[(splashStep_ = step)] : null);
  }, 300);
}

/** Tahap logo FS menurut persen: 1 <20, 2 <40, 3 <55, 4 <70, 5 <80, 6 >=80 (shockwave saat masuk tahap 5). */
function splashStage_(pct) { return pct < 20 ? 1 : pct < 40 ? 2 : pct < 55 ? 3 : pct < 70 ? 4 : pct < 80 ? 5 : 6; }
function setSplashStage_(pct) {
  var el = document.getElementById('splash-screen');
  if (!el) return;
  var st = splashStage_(pct), cur = +el.getAttribute('data-stage') || 1;
  if (st === cur) return;
  el.setAttribute('data-stage', String(st));
  if (st >= 5 && cur < 5) {
    var sw = document.getElementById('splash-shock');
    if (sw) { sw.classList.remove('go'); void sw.offsetWidth; sw.classList.add('go'); }
  }
}

function setSplashProgress_(pct, text) {
  setSplashStage_(pct);
  var bar = document.getElementById('splash-bar');
  if (bar) bar.style.width = Math.min(100, pct) + '%';
  var pc = document.getElementById('splash-pct');
  if (pc) pc.textContent = Math.min(100, Math.max(0, Math.round(pct))) + '%';
  var t = document.getElementById('splash-text');
  if (t && text) t.textContent = text;
}

function hideSplash_(ok) {
  var el = document.getElementById('splash-screen');
  if (!el || !el.classList.contains('show')) return;
  if (splashClosing_) return;
  splashClosing_ = true;
  clearInterval(splashTimer_);
  function finish_(wait) {
    // Tampil minimal ~500 ms supaya tidak berkedip, lalu hilang otomatis.
    setTimeout(function () {
      el.classList.add('hide');
      setTimeout(function () { el.classList.remove('show', 'hide'); }, 350);
    }, wait);
  }
  if (!ok) { finish_(Math.max(0, 500 - (Date.now() - splashShownAt_))); return; }
  // Server sudah siap: lanjutkan cepat melalui sisa tahap logo (maks ~0,9 dtk) agar tahap final & denyut terlihat, baru 100%.
  var p = splashPct_;
  var ff = setInterval(function () {
    p = Math.min(100, p + 7);
    setSplashProgress_(p);
    if (p >= 100) {
      clearInterval(ff);
      setSplashProgress_(100, 'Siap digunakan'); sfxFile_('online');
      finish_(Math.max(350, 500 - (Date.now() - splashShownAt_)));
    }
  }, 55);
}

function showSpinner() {
  document.getElementById('global-spinner').style.display = 'flex';
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.add('show');
}

function hideSpinner() {
  document.getElementById('global-spinner').style.display = 'none';
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.remove('show');
}

/**
 * Progress feedback non-blocking untuk operasi lain (simpan laporan,
 * upload foto, hapus laporan, ambil/lepas tugas, buat status, refresh,
 * dsb.) — Linear Progress Indicator di App Bar + tombol pemicu berubah
 * ke status "sedang berjalan" (disabled + label progres) agar aplikasi
 * tidak pernah terasa freeze, tanpa menutup layar dengan overlay.
 */

/**
 * PATCH — spinner lingkaran polos di dalam tombol diganti dot-pulse
 * (3 titik berdenyut bergantian, lihat .btn-loading-dots di
 * styles.html) — terasa lebih hidup dibanding spinner statis berputar,
 * tanpa menambah dependency apa pun.
 */
function beginAction(buttonEl, progressLabel) {
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.add('show');
  if (buttonEl) {
    buttonEl.dataset.actionOriginalHtml = buttonEl.innerHTML;
    buttonEl.disabled = true;
    buttonEl.style.opacity = '0.65';
    if (progressLabel) {
      buttonEl.innerHTML = '<span class="btn-loading-dots"><span></span><span></span><span></span></span><span>' + progressLabel + '</span>';
    }
  }
}


/**
 * PATCH — menutup Confirm Modal otomatis (bila sedang terbuka) setiap
 * endAction() dipanggil. Ini hook TERPUSAT: seluruh fungsi hapus yang
 * SUDAH ADA (doHapusPekerjaan, doHapusJadwal, doHapusContent_, dll)
 * memanggil endAction(null) di withSuccessHandler/withFailureHandler
 * mereka masing-masing — dengan baris ini, modal otomatis ikut tertutup
 * di titik yang sama TANPA perlu mengubah fungsi-fungsi itu satu-satu.
 */

function endAction(buttonEl) {
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.remove('show');
  if (buttonEl) {
    buttonEl.disabled = false;
    buttonEl.style.opacity = '';
    if (buttonEl.dataset.actionOriginalHtml != null) {
      buttonEl.innerHTML = buttonEl.dataset.actionOriginalHtml;
      delete buttonEl.dataset.actionOriginalHtml;
    }
  }
  // PATCH — hanya tutup modal bila memang sedang busy-mode (lihat
  // showConfirmModal). Mencegah hook ini menutup modal yang sebenarnya
  // sudah tidak terkait modal manapun (endAction dipanggil di banyak
  // tempat di luar konteks Confirm Modal, mis. submit form Buat).
  if (confirmModalIsBusyMode) {
    var confirmOverlay = document.getElementById('confirm-modal-overlay');
    if (confirmOverlay && confirmOverlay.classList.contains('show')) {
      hideConfirmModal();
    }
  }
}

var SNACKBAR_ICONS = { success: 'checkCircle', error: 'warning', warning: 'warning', info: 'notification' };
var snackbarTimer = null;

/**
 * type: 'success' | 'error' | 'warning' | 'info' (default 'info').
 * Style/animasi/durasi konsisten di semua tipe (Patch 7.2) — hanya
 * warna aksen & ikon yang membedakan makna pesan.
 */

/**
 * type: 'success' | 'error' | 'warning' | 'info'. Parameter `detail`
 * (opsional) menampilkan baris kedua dan memperbesar toast + durasinya
 * (untuk konfirmasi penting). Pesan lama tanpa detail tidak berubah.
 */
/* ===== Efek suara (Web Audio, disintesis — tanpa file audio) ===== */
var SFX_KEY_ = 'fa_sound';          // 'off' = dimatikan; selain itu aktif (bawaan: aktif)
var sfxCtx_ = null, sfxLastAt_ = 0, sfxVol_ = 1;

function sfxEnabled_() { try { return localStorage.getItem(SFX_KEY_) !== 'off'; } catch (e) { return true; } }

function sfxCtx_get_() {
  if (sfxCtx_) return sfxCtx_;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { sfxCtx_ = new AC(); } catch (e) { sfxCtx_ = null; }
  return sfxCtx_;
}

/** Satu nada: frekuensi (opsional meluncur ke freq2), mulai (detik dari sekarang), durasi, jenis gelombang, kekerasan. */
function sfxTone_(ctx, out, freq, at, dur, type, gain, freq2) {
  var t0 = ctx.currentTime + at;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);       // serangan halus (tanpa "klik")
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);       // peluruhan
  o.connect(g); g.connect(out);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

var SFX_SOUNDS_ = {
  // Laporan terkirim: arpeggio naik yang ceria
  sent: function (c, o) {
    [523.25, 659.25, 783.99].forEach(function (f, i) { sfxTone_(c, o, f, i * 0.085, 0.22, 'triangle', 0.5); });
    sfxTone_(c, o, 1046.5, 0.255, 0.45, 'sine', 0.55);
  },
  // Akses terbatas: dua "bonk" rendah (terdengar menolak, bukan alarm)
  locked: function (c, o) {
    sfxTone_(c, o, 196, 0, 0.16, 'square', 0.16, 165);
    sfxTone_(c, o, 165, 0.17, 0.22, 'square', 0.16, 130);
  },
  // Verifikasi: "ding" lonceng dua nada
  verify: function (c, o) {
    sfxTone_(c, o, 783.99, 0, 0.5, 'sine', 0.5);   sfxTone_(c, o, 1567.98, 0, 0.3, 'sine', 0.12);
    sfxTone_(c, o, 1174.66, 0.11, 0.7, 'sine', 0.5); sfxTone_(c, o, 2349.3, 0.11, 0.4, 'sine', 0.1);
  },
  // Batal verifikasi: dua nada turun yang lembut
  unverify: function (c, o) {
    sfxTone_(c, o, 587.33, 0, 0.2, 'triangle', 0.4);
    sfxTone_(c, o, 440, 0.12, 0.3, 'triangle', 0.4);
  },
  // Komentar terkirim: "blip" pendek
  comment: function (c, o) {
    sfxTone_(c, o, 880, 0, 0.07, 'sine', 0.5, 1320);
    sfxTone_(c, o, 1320, 0.07, 0.1, 'sine', 0.4);
  },
  // Simpan/ubah data: konfirmasi pendek dua nada
  save: function (c, o) {
    sfxTone_(c, o, 880, 0, 0.09, 'triangle', 0.45);
    sfxTone_(c, o, 1108.73, 0.08, 0.16, 'triangle', 0.45);
  },
  // Hapus data: meluncur turun
  del: function (c, o) {
    sfxTone_(c, o, 520, 0, 0.26, 'sine', 0.55, 130);
    sfxTone_(c, o, 260, 0, 0.2, 'triangle', 0.18, 90);
  },
  // Gagal/kesalahan: dua bip rendah
  error: function (c, o) {
    sfxTone_(c, o, 330, 0, 0.11, 'square', 0.13);
    sfxTone_(c, o, 330, 0.15, 0.14, 'square', 0.13);
  }
};

/**
 * Putar efek suara. force=true mengabaikan sakelar (dipakai halaman pratinjau/tombol "Coba").
 * Aman: tanpa dukungan audio / sakelar mati / tab tersembunyi / reduced-motion -> diam, tanpa error.
 */
function sfx_(name, force) {
  try {
    if (!force && (!sfxEnabled_() || document.hidden)) return;
    var fn = SFX_SOUNDS_[name]; if (!fn) return;
    var c = sfxCtx_get_(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    var master = c.createGain();
    master.gain.value = 0.6 * sfxVol_;                   // volume standar (tidak keras, tidak pelan)
    master.connect(c.destination);
    fn(c, master);
    sfxLastAt_ = Date.now();
  } catch (e) { /* suara tidak boleh mengganggu aksi */ }
}

/* ----- Suara dari berkas (mp3 milik tim di folder sounds/) -----
 * Diputar lewat Web Audio (bukan elemen <audio>) agar tidak bermasalah dengan service worker.
 * online = bunyi saat aplikasi "Siap digunakan" (splash 100%); notif = bunyi saat push masuk dan aplikasi terbuka.
 * Berkas tidak ada (mis. versi Apps Script) / diblokir autoplay / sakelar Suara mati -> diam, tanpa error. */
var SFX_FILES_ = { online: { url: 'sounds/ub-online.mp3', vol: 1 }, notif: { url: 'sounds/bbm-fast.mp3', vol: 1 } };
var sfxBuf_ = {}, sfxBufLoading_ = {};

function sfxLoadFile_(name) {
  if (sfxBuf_[name]) return Promise.resolve(sfxBuf_[name]);
  if (sfxBufLoading_[name]) return sfxBufLoading_[name];
  var c = sfxCtx_get_(), f = SFX_FILES_[name];
  if (!c || !f || !window.fetch) return Promise.resolve(null);
  sfxBufLoading_[name] = fetch(f.url).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.arrayBuffer();
  }).then(function (ab) {
    return new Promise(function (res, rej) { c.decodeAudioData(ab, res, rej); });
  }).then(function (buf) { sfxBuf_[name] = buf; delete sfxBufLoading_[name]; return buf; })
    .catch(function () { delete sfxBufLoading_[name]; return null; });
  return sfxBufLoading_[name];
}

/** Siapkan (unduh + decode) berkas suara lebih awal agar bunyi tanpa jeda saat dibutuhkan. */
function sfxPreload_() {
  try { if (sfxEnabled_()) Object.keys(SFX_FILES_).forEach(sfxLoadFile_); } catch (e) {}
}

function sfxFile_(name) {
  try {
    if (!sfxEnabled_() || document.hidden || !SFX_FILES_[name]) return;
    var c = sfxCtx_get_(); if (!c) return;
    sfxLoadFile_(name).then(function (buf) {
      if (!buf) return;
      return (c.state === 'running' ? Promise.resolve() : Promise.resolve(c.resume())).then(function () {
        // Masih diblokir autoplay (belum ada ketukan)? Jangan menunda: bunyi yang telat lebih mengganggu daripada tanpa bunyi.
        if (c.state !== 'running' || document.hidden) return;
        var s = c.createBufferSource(), g = c.createGain();
        s.buffer = buf; g.gain.value = SFX_FILES_[name].vol * sfxVol_;
        s.connect(g); g.connect(c.destination);
        s.start(0);
        sfxLastAt_ = Date.now();
      });
    }).catch(function () {});
  } catch (e) { /* suara tidak boleh mengganggu aplikasi */ }
}

/** Suara untuk snackbar umum (dipakai bila tidak ada suara khusus barusan). */
function sfxForSnackbar_(type, msg) {
  if (type === 'error') return 'error';
  if (type !== 'success') return '';
  if (/dihapus/i.test(msg || '')) return 'del';
  if (/dibatalkan|dilepas/i.test(msg || '')) return 'unverify';
  return 'save';
}

// Peramban (terutama iOS) hanya mengizinkan suara setelah ada ketukan: siapkan/lanjutkan audio di ketukan pertama.
(function () {
  function unlock() {
    try { if (!sfxEnabled_()) return; var c = sfxCtx_get_(); if (c && c.state === 'suspended') c.resume(); } catch (e) {}
  }
  ['pointerdown', 'touchend', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock, { passive: true }); });
})();

// Umpan balik getar singkat (HP yang mendukung). Dimatikan bila localStorage fa_haptic = 'off'.
function haptic_(kind) {
  try {
    if (!navigator.vibrate || localStorage.getItem('fa_haptic') === 'off') return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    navigator.vibrate(kind === 'error' ? [18, 40, 18] : kind === 'success' ? 12 : 8);
  } catch (e) {}
}

function showSnackbar(message, type, detail) {
  // Audit #6: sesi tidak valid (akun dinonaktifkan / kode diganti) -> kembali ke layar login.
  if (typeof message === 'string' && message.indexOf('Sesi tidak valid') === 0 && exitInvalidSession_(message)) return;
  var el = document.getElementById('snackbar');
  var t = type || 'info';
  if (t === 'success' || t === 'error') haptic_(t);
  // Suara umum hanya bila tidak ada suara khusus yang baru saja diputar (mis. verifikasi, laporan terkirim).
  if (Date.now() - sfxLastAt_ > 900) { var sn_ = sfxForSnackbar_(t, typeof message === 'string' ? message : ''); if (sn_) sfx_(sn_); }
  el.className = 'snackbar-' + t + (detail ? ' snackbar-rich' : '');
  el.innerHTML = '';

  var icon = document.createElement('span');
  icon.className = 'snackbar-icon';
  icon.innerHTML = mdIcon(SNACKBAR_ICONS[t] || 'notification', detail ? 24 : 18);
  el.appendChild(icon);

  if (detail) {
    var wrap = document.createElement('span');
    wrap.className = 'snackbar-body';
    var title = document.createElement('span');
    title.className = 'snackbar-title';
    title.textContent = message;
    var sub = document.createElement('span');
    sub.className = 'snackbar-detail';
    sub.textContent = detail; // textContent: aman dari HTML injection
    wrap.appendChild(title);
    wrap.appendChild(sub);
    el.appendChild(wrap);
  } else {
    var msg = document.createElement('span');
    msg.innerHTML = message;
    el.appendChild(msg);
  }

  void el.offsetWidth;
  el.classList.add('show');
  if (snackbarTimer) clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(function () {
    el.classList.remove('show');
  }, detail ? 4500 : 3000);
}

function goToPage(pageKey) {
  // Pindah halaman selalu menutup modal/sheet/picker yang masih terbuka (tidak ada lapisan 'bocor' ke halaman lain).
  closeAllLayers_(true);
  // Auto-refresh Pekerjaan hanya relevan selama halaman Pekerjaan terbuka.
  if (typeof stopPekerjaanAutoRefresh === 'function') stopPekerjaanAutoRefresh();

  // Meninggalkan halaman Buat (mis. lewat nav) tanpa submit/batal
  // eksplisit tetap membatalkan mode "Buat Laporan" (Bagian 3) — supaya
  // kunjungan berikutnya ke Buat selalu mulai dari mode normal.
  if (pageKey !== 'buat' && buatPrefillContext) {
    resetBuatPrefillContext_();
  }

  // Simpan posisi scroll halaman yang sedang ditinggalkan sebelum berpindah.
  if (currentPage) {
    var session = loadSession();
    if (session) {
      session.uiState = session.uiState || {};
      session.uiState.scrollPositions = session.uiState.scrollPositions || {};
      session.uiState.scrollPositions[currentPage] = window.scrollY;
      saveSession(session);
    }
  }

  currentPage = pageKey;
  var appHeaderEl = document.querySelector('header.app-header');
  if (appHeaderEl) appHeaderEl.classList.remove('header-hidden');
  if (pageKey !== 'akun') lastMainPage = pageKey;

  document.querySelectorAll('.page-section').forEach(function (section) {
    section.classList.toggle('active', section.dataset.page === pageKey);
  });

  document.querySelectorAll('.nav-item').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.page === pageKey);
  });

  var session = loadSession();
  if (session) {
    session.uiState = session.uiState || {};
    session.uiState.activePage = pageKey;
    saveSession(session);
  }


  if (pageKey === 'beranda' && appBootstrap && typeof initBerandaPage === 'function') {
    initBerandaPage();
  }
  if (pageKey === 'pekerjaan' && appBootstrap && typeof initPekerjaanInboxPage === 'function') {
    initPekerjaanInboxPage();
    if (typeof startPekerjaanAutoRefresh === 'function') startPekerjaanAutoRefresh();
  }
  if (pageKey === 'buat' && appBootstrap && typeof initPekerjaanForm === 'function') {
    initPekerjaanForm();
  }
  if (pageKey === 'jadwal' && appBootstrap && typeof loadRiwayatPekerjaan === 'function') {
    // "Riwayat" kini berisi Riwayat Pekerjaan (arsip pribadi). Filter &
    // Unduh PDF dipindah ke Aktivitas (3.4).
    loadRiwayatPekerjaan();
  }
  if (pageKey === 'aktivitas' && appBootstrap && typeof loadAktivitasSummary === 'function') {
    // Ringkasan (statistik) + timeline Pekerjaan. Filter & Unduh PDF
    // sekarang di halaman terpisah (/exec?page=pdfrender).
    if (!pekerjaanFilterUIInitialized && typeof initPdfRenderButton_ === 'function') {
      initPdfRenderButton_();
      pekerjaanFilterUIInitialized = true;
    }
    loadAktivitasSummary();
    if (typeof loadPekerjaanAktivitas === 'function') loadPekerjaanAktivitas();
  }


  // Restore posisi scroll halaman yang baru ditampilkan (setelah konten dirender).
  setTimeout(function () {
    var s = loadSession();
    var savedScroll = (s && s.uiState && s.uiState.scrollPositions) ? s.uiState.scrollPositions[pageKey] : 0;
    window.scrollTo(0, savedScroll || 0);
  }, 50);
}

var backNavInstalled_ = false;
var exitingApp_ = false;

function closeTopLayer_() {
  function isShown(id) { var el = document.getElementById(id); return !!(el && el.classList.contains('show')); }
  if (typeof FaDatePicker !== 'undefined' && FaDatePicker.isOpen()) { FaDatePicker.close(); return true; }
  if (window.FASTAPP_UPDATE && window.FASTAPP_UPDATE.dismiss && window.FASTAPP_UPDATE.dismiss()) return true; // dialog pembaruan (GitHub Pages): Back = "Nanti saja"
  if (isShown('photo-viewer')) { closePhotoViewer(); return true; }
  // Sedang mengirim / memuat ulang: Back diabaikan (proses tidak boleh ditinggalkan di tengah jalan).
  if (isShown('sending-overlay') || isShown('reload-overlay')) {
    try { showSnackbar('Sedang memproses, mohon tunggu...', 'info'); } catch (e) {}
    return true;
  }
  if (isShown('photo-source-overlay')) { document.getElementById('photo-source-overlay').classList.remove('show'); return true; }
  if (isShown('confirm-modal-overlay')) {
    var cancelBtn = document.getElementById('confirm-modal-cancel');
    if (cancelBtn && !cancelBtn.disabled) hideConfirmModal(); // sedang memproses: abaikan, jangan tutup
    return true;
  }
  if (isShown('bottom-sheet-overlay')) { closeBottomSheet(); return true; }
  var jkIds = ['chat-overlay', 'jk-picker-overlay', 'jk-form-overlay', 'jk-detail-overlay', 'about-overlay', 'philosophy-overlay'];
  for (var i = 0; i < jkIds.length; i++) {

      if (closeBtn) closeBtn.click(); else document.getElementById(jkIds[i]).classList.remove('show');

  return false;
}

function pushBackGuard_() {
  try { history.pushState({ faGuard: true }, '', location.href); } catch (e) {}
}

function isOurHistoryState_(st) { return !!(st && (st.faGuard || st.faBase)); }

/**
 * Keluar dari aplikasi: mundur melewati SEMUA entri milik kita (dasar + penjaga, termasuk
 * entri sisa dari versi lama yang menumpuk saat halaman dimuat ulang), sehingga satu kali
 * "Ya" cukup. Bila ternyata masih di sini setelah 1,5 dtk (mis. riwayat diblokir peramban),
 * penanda keluar dibatalkan dan penjaga dipasang lagi supaya Back berikutnya tetap bertanya.
 */
function exitAppNow_() {
  exitingApp_ = true;
  try { history.back(); } catch (e) {}
  setTimeout(function () {
    if (!exitingApp_) return;
    exitingApp_ = false;
    var st = null;
    try { st = history.state; } catch (e) {}
    if (!st || !st.faGuard) pushBackGuard_();
  }, 1500);
}

function installBackNavigation_() {
  if (backNavInstalled_) return;
  backNavInstalled_ = true;

  // Muat ulang / dipulihkan Android: entri riwayat saat ini bisa saja sudah berupa "penjaga"
  // buatan sesi sebelumnya. Jangan menimpanya & menambah entri baru (itu yang membuat entri
  // menumpuk dan "Ya" tidak langsung keluar). Cukup pakai apa adanya.
  var cur = null;
  try { cur = history.state; } catch (e) {}
  if (!(cur && cur.faGuard)) {
    try { history.replaceState({ faBase: true }, '', location.href); } catch (e) {}
    // Peramban (Chrome) melewati entri riwayat yang dibuat tanpa interaksi pengguna saat Back
    // ditekan -> Back langsung keluar tanpa popup. Bila belum ada interaksi sama sekali
    // (mis. aplikasi dibuka dari sesi tersimpan), pasang penjaga pada sentuhan pertama.
    var active = true;
    try { active = !navigator.userActivation || navigator.userActivation.hasBeenActive; } catch (e) {}
    if (active) {
      pushBackGuard_();
    } else {
      var arm = function () {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (ev) { window.removeEventListener(ev, arm, true); });
        try { var st = history.state; if (!st || !st.faGuard) pushBackGuard_(); } catch (e) {}
      };
      ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (ev) { window.addEventListener(ev, arm, true); });
    }
  }

  window.addEventListener('popstate', function () {
    if (exitingApp_) {
      // Lanjut mundur selama masih di entri milik kita; berhenti begitu keluar dari tumpukan kita.
      var st = null;
      try { st = history.state; } catch (e) {}
      if (isOurHistoryState_(st)) { try { history.back(); } catch (e2) {} } else { exitingApp_ = false; }
      return;
    }
    // Hanya jalan saat sudah login (aplikasi tampil).
    if (!appBootstrap) return;
    if (closeTopLayer_()) { pushBackGuard_(); return; }

    var homePage = 'beranda'; // halaman utama semua role
    if (currentPage === 'akun' && lastMainPage && lastMainPage !== 'akun') {
      goToPage(lastMainPage); pushBackGuard_(); return;
    }
    if (currentPage && currentPage !== homePage) {
      goToPage(homePage); pushBackGuard_(); return;
    }
    // Di halaman utama: tanya dulu. "Tidak" (atau Back lagi) menutup dialog; aplikasi & data tetap.
    pushBackGuard_();
    showConfirmModal('Keluar dari aplikasi?', function () {
      exitAppNow_();
    }, 'logout', false, null, { confirm: 'Ya', cancel: 'Tidak' });
  });
}

function avatarIdOf_(userCode) {
  var id = userCode ? appAvatars[userCode] : '';
  return (id && AVATAR_BY_ID_[id]) ? id : '';
}

/** Elemen avatar bulat: emoticon bila sudah memilih, huruf inisial bila belum. */
function avatarNode_(userCode, name, size) {
  var id = avatarIdOf_(userCode);
  var el = document.createElement('span');
  el.className = 'av ' + (id ? 'av-img' : 'av-init');
  el.style.width = el.style.height = size + 'px';
  el.setAttribute('aria-hidden', 'true');
  if (id) {
    var img = document.createElement('img');
    img.src = avatarSvgUrl_(id); img.alt = ''; img.draggable = false;
    el.appendChild(img);
  } else {
    el.style.fontSize = Math.round(size * 0.46) + 'px';
    el.textContent = ((name || userCode || '?').trim().charAt(0) || '?').toUpperCase();
  }
  return el;
}

/** Terapkan avatar pengguna yang sedang login ke header & kartu Akun. */
function avatarApplyMine_() {
  var user = appBootstrap && appBootstrap.currentUser;
  if (!user) return;
  var id = avatarIdOf_(user.userCode);
  var initial = ((user.displayName || user.userCode || '?').trim().charAt(0) || '?').toUpperCase();

  var hdr = document.getElementById('header-avatar-initial');
  if (hdr) {
    hdr.textContent = '';
    if (id) { hdr.appendChild(avatarNode_(user.userCode, user.displayName, 40)); } else { hdr.textContent = initial; }
    var btn = hdr.closest('.profile-icon-btn'); if (btn) btn.classList.toggle('has-av', !!id);
  }
  var akun = document.getElementById('akun-avatar');
  if (akun) {
    akun.textContent = '';
    var fill = document.createElement('span'); fill.className = 'av-fill';
    if (id) { var img = document.createElement('img'); img.src = avatarSvgUrl_(id); img.alt = ''; img.draggable = false; fill.appendChild(img); }
    else { fill.textContent = initial; }
    akun.appendChild(fill);
    var badge = document.createElement('span'); badge.className = 'akun-av-badge'; badge.innerHTML = mdIcon('photoCamera', 14);
    akun.appendChild(badge);
  }
}

function setAvatarMap_(map) {
  if (!map || typeof map !== 'object') return;
  appAvatars = map;
  try { localStorage.setItem(AVATAR_STORE_KEY_, JSON.stringify(map)); } catch (e) {}
  avatarApplyMine_();
  if (typeof lcAvatarsRefresh_ === 'function') lcAvatarsRefresh_();   // kartu Riwayat/Aktivitas/Pekerjaan yang sudah tampil
}

function avatarsRefresh_() {
  var s = loadSession(); if (!s || !s.accessCode) return;
  google.script.run
    .withSuccessHandler(function (res) { if (res && res.success && res.data) setAvatarMap_(res.data.avatars); })
    .withFailureHandler(function () {})
    .getAvatarMap(s.accessCode);
}

// ---- Pemilih avatar (halaman Akun) ----
var avatarDraft_ = '';
var avatarSaving_ = false;

function avatarPickerRender_() {
  var grid = document.getElementById('av-grid');
  grid.textContent = '';
  AVATAR_PRESETS_.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'av-tile' + (avatarDraft_ === p.id ? ' sel' : '');
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', avatarDraft_ === p.id ? 'true' : 'false');
    b.setAttribute('aria-label', p.name);
    var img = document.createElement('img'); img.src = avatarSvgUrl_(p.id); img.alt = ''; img.draggable = false;
    var lb = document.createElement('span'); lb.textContent = p.short + ' (' + AVATAR_COLORS_[p.color].label + ')';
    b.appendChild(img); b.appendChild(lb);
    b.addEventListener('click', function () { avatarDraft_ = p.id; avatarPickerRender_(); });
    grid.appendChild(b);
  });
  var user = appBootstrap && appBootstrap.currentUser || {};
  var prev = document.getElementById('av-preview');
  prev.textContent = '';
  if (avatarDraft_) { var im = document.createElement('img'); im.src = avatarSvgUrl_(avatarDraft_); im.alt = ''; prev.appendChild(im); prev.className = 'av av-img'; }
  else { prev.className = 'av av-init'; prev.textContent = ((user.displayName || user.userCode || '?').trim().charAt(0) || '?').toUpperCase(); }
  document.getElementById('av-preview-name').textContent = avatarDraft_ ? AVATAR_BY_ID_[avatarDraft_].name : 'Huruf inisial';
  document.getElementById('av-reset').classList.toggle('sel', !avatarDraft_);
}

function openAvatarPicker_() {
  var user = appBootstrap && appBootstrap.currentUser;
  if (!user) return;
  if (user.role === 'demo') { if (typeof showSnackbar === 'function') showSnackbar('Akun Demo tidak dapat mengubah avatar.', 'info'); return; }
  avatarDraft_ = avatarIdOf_(user.userCode);
  avatarPickerRender_();
  document.getElementById('avatar-overlay').classList.add('show');
}

function closeAvatarPicker_() {
  if (avatarSaving_) return;
  document.getElementById('avatar-overlay').classList.remove('show');
}

(function initAvatarPicker_() {
  var ov = document.getElementById('avatar-overlay');
  if (!ov) return;
  document.getElementById('av-close').innerHTML = mdIcon('close', 18);
  document.getElementById('av-close').addEventListener('click', closeAvatarPicker_);
  document.getElementById('av-cancel').addEventListener('click', closeAvatarPicker_);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeAvatarPicker_(); });
  document.getElementById('av-reset').addEventListener('click', function () { avatarDraft_ = ''; avatarPickerRender_(); });
  var akunBtn = document.getElementById('akun-avatar');
  if (akunBtn) akunBtn.addEventListener('click', openAvatarPicker_);
  document.getElementById('av-apply').addEventListener('click', function () {
    var user = appBootstrap && appBootstrap.currentUser, s = loadSession();
    if (!user || !s || avatarSaving_) return;
    if (avatarDraft_ === avatarIdOf_(user.userCode)) { closeAvatarPicker_(); return; }
    var btn = this; avatarSaving_ = true; btn.disabled = true; btn.textContent = 'Menyimpan…';
    function done_() { avatarSaving_ = false; btn.disabled = false; btn.textContent = 'Terapkan'; }
    google.script.run
      .withSuccessHandler(function (res) {
        done_();
        if (!res || !res.success) { if (typeof showSnackbar === 'function') showSnackbar((res && res.error) || 'Gagal menyimpan avatar.', 'error'); return; }
        setAvatarMap_(res.data.avatars);
        closeAvatarPicker_();
        if (typeof showSnackbar === 'function') showSnackbar('Avatar diperbarui.', 'success');
      })
      .withFailureHandler(function () { done_(); if (typeof showSnackbar === 'function') showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error'); })
      .ubahAvatar(s.accessCode, avatarDraft_);
  });
})();

function renderApp(bootstrap, session) {
  appBootstrap = bootstrap;

  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display = 'block';

  var user = bootstrap.currentUser;
  document.getElementById('header-username').textContent = user.displayName;
  if (bootstrap.avatars) setAvatarMap_(bootstrap.avatars); else avatarsRefresh_();

  document.getElementById('akun-nama').textContent = user.displayName;
  avatarApplyMine_(); // header + kartu Akun (emoticon atau inisial)
  document.getElementById('akun-kode').textContent = user.userCode;   // Kode User (ID permanen)
  var loginCodeEl = document.getElementById('akun-login-code');       // Password Login (login_code yang dipakai masuk)
  if (loginCodeEl) loginCodeEl.textContent = (session && session.accessCode) || ((loadSession() || {}).accessCode) || '—';
  document.getElementById('akun-role').textContent = ROLE_LABELS[user.role] || user.role;


  renderNav(bootstrap.navItems);

  // Patch 8.x (2.3) — halaman default kini ditentukan server
  // (bootstrap.defaultPage), dikirim bersama respons login/bootstrap.
  // Fallback ke perhitungan role tetap dijaga untuk kompatibilitas.
  var defaultPage = 'beranda'; // semua role (termasuk FS) mulai dari Beranda; abaikan nilai lama dari server
  var lastPage = (session.uiState && session.uiState.activePage) || defaultPage;
  // Tautan lama / launcher: index.html#buat -> langsung ke menu Buat.
  try {
    var hashPage = /^#(buat|pekerjaan)$/.exec(location.hash);
    if (hashPage) {
      lastPage = hashPage[1];   // #buat: tautan lama/launcher; #pekerjaan: ketukan notifikasi saat aplikasi tertutup
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) {}
  goToPage(lastPage);
  installBackNavigation_();


  if (user.role !== 'demo') {
    document.getElementById('btn-submit-report').style.display = '';
  } else {
    document.getElementById('btn-submit-report').style.display = 'none';
  }

  // Auto-logout 30 menit tidak ada aktivitas — mulai/reset hitungan
  // mundur begitu user berhasil masuk (login baru atau resume sesi).
  resetInactivityTimer();
}

// ============================================================
// KETUKAN NOTIFIKASI saat aplikasi sudah terbuka: service worker (sw.js) mengirim pesan, kita pindah halaman.
// ============================================================
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e && e.data;
    // Push masuk saat aplikasi terbuka & terlihat: service worker menyenyapkan nada sistem, kita bunyikan nada tim.
    if (d && d.type === 'FASTAPP_PUSH') { if (document.visibilityState === 'visible') sfxFile_('notif'); return; }
    if (!d || d.type !== 'FASTAPP_GOTO' || !appBootstrap) return;
    var m = /#(pekerjaan)$/.exec(String(d.url || ''));
    if (m) goToPage(m[1]);
  });
}

// AUTH FLOW
// ============================================================

// Dipakai HANYA untuk resume sesi dari localStorage (tanpa form login) —
// login baru langsung dapat payload bootstrap penuh, lihat handleLogin().
var BOOTSTRAP_MAX_ATTEMPTS_ = 3;
var BOOTSTRAP_WATCHDOG_MS_ = 20000; // satu percobaan tidak boleh menggantung lebih lama dari ini
var bootstrapSeq_ = 0;
var bootstrapInFlight_ = false;
var bootstrapSession_ = null;

function attemptBootstrap(session, attempt) {
  attempt = attempt || 1;
  bootstrapSession_ = session;
  bootstrapInFlight_ = true;
  var seq = ++bootstrapSeq_;
  var bootEpoch_ = sessionEpoch_;
  var finished = false;
  hideBootstrapError_();
  if (attempt === 1) showSplash_();

  function fail(delayMs) {
    if (finished || seq !== bootstrapSeq_) return;
    finished = true;
    clearTimeout(watchdog);
    if (attempt < BOOTSTRAP_MAX_ATTEMPTS_) {
      setTimeout(function () { if (seq === bootstrapSeq_) attemptBootstrap(session, attempt + 1); }, delayMs);
    } else {
      bootstrapInFlight_ = false;
      showBootstrapError_();
    }
  }
  // Setelah aplikasi dibuka kembali, koneksi lama kadang mati dan permintaan menggantung diam-diam.
  var watchdog = setTimeout(function () { fail(0); }, BOOTSTRAP_WATCHDOG_MS_);

  google.script.run
    .withSuccessHandler(function (response) {
      if (finished || seq !== bootstrapSeq_) return; // jawaban basi dari percobaan yang sudah ditinggalkan
      if (bootEpoch_ !== sessionEpoch_) return;      // sesi berakhir/berganti saat menunggu
      // Gagal SEMENTARA (error server, pembatasan, sibuk): jangan hapus sesi — coba lagi, lalu layar "Coba lagi".
      // Sesi hanya dihapus bila server menolak kode itu sendiri (tidak valid / dinonaktifkan).
      if (!response || (!response.success && !isSessionRejection_(response))) { fail(1200 * attempt); return; }
      finished = true;
      clearTimeout(watchdog);
      bootstrapInFlight_ = false;
      if (response.success) {
        if (response.data.bundle) { applyStartupBundle_(response.data.bundle); response.data.bundle = null; }
        renderApp(response.data, session);
        hideSplash_(true);
      } else {
        hideSplash_(false);
        // Sesi tidak valid lagi (mis. user dinonaktifkan) — Final A3.
        clearSession();
        document.getElementById('screen-app').style.display = 'none';
        document.getElementById('screen-login').style.display = 'flex';
        document.getElementById('login-error').textContent = response.error;
      }
    })
    .withFailureHandler(function () { fail(1200 * attempt); })
    .getBootstrapData(session.accessCode, true);
}

/** true bila server menolak KODE AKSES (sesi tidak valid / kode tidak ditemukan / akun nonaktif). */
function isSessionRejection_(response) {
  return !!(response && response.success === false && /^(sesi tidak valid|kode akses)/i.test(String(response.error || '')));
}

/** Layar pemulihan: tidak pernah menyisakan layar kosong/macet saat server tak terjangkau. */
function showBootstrapError_() {
  hideSplash_(false);
  var box = document.getElementById('bootstrap-error');
  if (!box) {
    box = document.createElement('div');
    box.id = 'bootstrap-error';
    box.className = 'boot-error';
    box.setAttribute('role', 'alert');
    box.innerHTML =
      '<div class="boot-error-card">' +
        '<div class="error-state-icon">' + mdIcon('warning', 24) + '</div>' +
        '<div class="error-state-title">Tidak dapat terhubung ke server</div>' +
        '<div class="error-state-detail">Periksa koneksi internet Anda, lalu coba lagi. Data Anda aman.</div>' +
        '<button type="button" class="btn-primary error-state-btn" id="btn-boot-retry">Coba lagi</button>' +
        '<button type="button" class="boot-error-link" id="btn-boot-login">Masuk ulang</button>' +
      '</div>';
    document.body.appendChild(box);
    document.getElementById('btn-boot-retry').addEventListener('click', retryBootstrap_);
    document.getElementById('btn-boot-login').addEventListener('click', function () {
      hideBootstrapError_();
      clearSession();
      document.getElementById('screen-login').style.display = 'flex';
    });
  }
  box.classList.add('show');
}

function hideBootstrapError_() {
  var box = document.getElementById('bootstrap-error');
  if (box) box.classList.remove('show');
}

function retryBootstrap_() {
  var session = bootstrapSession_ || loadSession();
  if (session && session.accessCode) attemptBootstrap(session, 1);
}

// Dibuka kembali dari latar belakang / jaringan pulih: pulihkan otomatis tanpa perlu Clear All.
function resumeBootstrapIfNeeded_() {
  var box = document.getElementById('bootstrap-error');
  var errorShown = !!(box && box.classList.contains('show'));
  if (errorShown) { retryBootstrap_(); return; }
  if (bootstrapInFlight_ && Date.now() - splashShownAt_ > 6000) retryBootstrap_(); // permintaan lama kemungkinan mati
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') resumeBootstrapIfNeeded_(); });
window.addEventListener('pageshow', function (e) { if (e.persisted) resumeBootstrapIfNeeded_(); });
window.addEventListener('online', resumeBootstrapIfNeeded_);

/**
 * Patch 8.x (Bagian 2.3) — loginByAccessCode() sekarang mengembalikan
 * seluruh payload bootstrap sekaligus (user, master data, navItems,
 * jenisPekerjaanList, default page), jadi login TIDAK LAGI memanggil
 * getBootstrapData() secara terpisah setelahnya. Startup = SATU
 * request, bukan dua berurutan.
 */
function handleLogin() {
  var input = document.getElementById('input-access-code');
  var errorEl = document.getElementById('login-error');
  var code = input.value.trim().toUpperCase();

  errorEl.textContent = '';

  if (!code) {
    errorEl.textContent = 'Kode akses wajib diisi.';
    return;
  }

  showSplash_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (!response.success) {
        hideSplash_(false);
        errorEl.textContent = response.error;
        return;
      }

      var user = response.data.currentUser;
      var session = {
        accessCode: code,           // kode LOGIN yang diketik (bisa diganti Admin)
        userCode: user.userCode,    // ID permanen user (bukan kredensial)
        role: user.role,
        displayName: user.displayName,
        uiState: {}
      };
      saveSession(session);
      if (response.data.bundle) { applyStartupBundle_(response.data.bundle); response.data.bundle = null; }
      renderApp(response.data, session);
      hideSplash_(true);
    })
    .withFailureHandler(function (error) {
      hideSplash_(false);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
    })
    .loginByAccessCode(code, true);
}


/**
 * PATCH — FIX bug cache browser "nyangkut" antar akun: pageDataCache
 * (script-pekerjaan.html) hidup di memori JS, TIDAK otomatis kosong
 * saat logout. Tanpa reset ini, user B yang login di tab/browser yang
 * sama persis setelah user A logout masih melihat data cache milik
 * user A (Pekerjaan/Riwayat/Aktivitas/Jadwal/Content/Dashboard) sampai
 * salah satu cache itu di-invalidate lewat aksi atau force-refresh.
 * resetAllPageDataCache_() didefinisikan di script-pekerjaan.html.
 */
/**
 * Menutup SEMUA lapisan (modal, sheet, picker, penampil foto, chat). Dipakai di setiap jalur keluar sesi
 * (Keluar, sesi tidak valid, auto-logout) agar tidak ada overlay tertinggal di atas layar login.
 * passiveOnly=true (dipakai goToPage): hanya lapisan yang aman ditutup saat pindah halaman — konfirmasi,
 * "Mengirim", dan "Muat ulang" TIDAK disentuh karena sedang menjalankan proses.
 */
function closeAllLayers_(passiveOnly) {
  function t(fn) { try { fn(); } catch (e) {} }
  t(function () { if (typeof FaDatePicker !== 'undefined' && FaDatePicker.isOpen()) FaDatePicker.close(); });
  t(function () { if (window.FaChatUi) FaChatUi.close(); });
  t(closePhotoViewer);
  t(closeBottomSheet);
  t(function () { if (typeof closeJadwalForm === 'function') closeJadwalForm(); });
  ['jk-picker-overlay', 'jk-form-overlay', 'jk-detail-overlay', 'about-overlay', 'philosophy-overlay',
   'activity-detail-overlay', 'photo-source-overlay', 'chat-overlay'].forEach(function (id) {
    var o = document.getElementById(id); if (o) o.classList.remove('show');
  });

/**

/**
 * Muat Ulang Data dengan determinate progress. TIDAK reload halaman.
 * Progres = langkah yang benar-benar selesai (1 reset cache + N

 * pageDataCache sehingga halaman yang dibuka sesudahnya sudah segar.
 */
var reloadRunning = false;

function setReloadTitle_(state) {
  var t = document.getElementById('reload-title');
  if (!t) return;
  if (state === 'done') t.innerHTML = mdIcon('checkCircle', 18) + '<span>Data Tersinkron</span>';
  else if (state === 'error') t.innerHTML = mdIcon('close', 18) + '<span>Sinkronisasi Gagal</span>';
  else t.innerHTML = '<span class="spin-ico">' + mdIcon('sync', 18) + '</span><span>Menyinkronkan Data</span>';
  t.className = 'reload-title ' + (state || 'run');
}

function setReloadProgress_(done, total, text, isError) {
  var fill = document.getElementById('reload-bar-fill');
  fill.style.width = Math.round((done / total) * 100) + '%';
  fill.classList.toggle('error', !!isError);
  document.getElementById('reload-step-text').textContent = text;
  var pct = document.getElementById('reload-percent');
  if (pct) pct.textContent = isError ? '' : Math.round((done / total) * 100) + '%';
  setReloadTitle_(isError ? 'error' : (done >= total ? 'done' : 'run'));
}

function closeReloadOverlay_() {
  document.getElementById('reload-overlay').classList.remove('show');
  reloadRunning = false;
}

function runReloadAppData_() {
  if (reloadRunning) return;
  var session = loadSession();
  if (!session) return;
  reloadRunning = true;
  var ac = session.accessCode;

  // Satu request (paket startup) menggantikan 4 request terpisah sebelumnya.
  var steps = [
    { label: 'Memuat data aplikasi...',
      run: function (ok, fail) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getBootstrapData(ac, true); },
      apply: function (d) {
        var bundle = d.bundle; d.bundle = null;
        appBootstrap = d;
        applyStartupBundle_(bundle);
      } }
  ];
  var total = steps.length + 1; // +1 = reset cache lokal

  document.getElementById('reload-actions').style.display = 'none';
  document.getElementById('reload-overlay').classList.add('show');

  resetAllPageDataCache_();
  setReloadProgress_(1, total, 'Cache lokal dibersihkan', false);

  function fail(message) {
    setReloadProgress_(0, total, message || 'Gagal memuat data.', true);
    document.getElementById('reload-bar-fill').style.width = '100%';
    document.getElementById('reload-actions').style.display = 'flex';
  }

  // Keempat permintaan dijalankan PARALEL (saling independen) — waktu total
  // ~ permintaan terlama, bukan jumlah keempatnya.
  var finished = 1;
  var failed = false;
  function finishAll() {
    setReloadProgress_(total, total, 'Selesai', false);
    setTimeout(function () {
      closeReloadOverlay_();
      if (typeof goToPage === 'function') goToPage(currentPage);
      showSnackbar('Data berhasil diperbarui.', 'success');
    }, 400);
  }
  setReloadProgress_(1, total, 'Memuat data...', false);
  steps.forEach(function (step) {
    step.run(function (response) {
      if (failed) return;
      if (!response || !response.success) { failed = true; fail((response && response.error) || 'Gagal memuat data.'); return; }
      step.apply(response.data);
      finished++;
      if (finished >= total) finishAll();
      else setReloadProgress_(finished, total, 'Memuat data (' + (finished - 1) + '/' + (total - 1) + ')...', false);
    }, function () {
      if (failed) return;
      failed = true;
      fail('Gagal terhubung ke server. Periksa koneksi Anda.');
    });
  });
}

// ============================================================
// HEADER HIDE ON SCROLL (seperti Twitter/Facebook)
// ============================================================
// Scroll turun -> header disembunyikan. Scroll naik -> muncul lagi.
// Selalu tampil saat berada di dekat puncak halaman. THRESHOLD
// mencegah header berkedip karena gerakan scroll yang sangat kecil.

(function setupHideOnScrollHeader() {
  var header = document.querySelector('header.app-header');
  if (!header) return;

  var THRESHOLD = 8;
  var ALWAYS_SHOW_TOP = 60;
  var lastY = 0;
  var ticking = false;

  // Posisi scroll dari elemen mana pun yang sedang dipakai browser.
  function currentY(target) {
    if (target && target !== document && target !== window && typeof target.scrollTop === 'number') {
      return target.scrollTop;
    }
    return window.pageYOffset ||
      document.documentElement.scrollTop ||
      document.body.scrollTop || 0;
  }

  function update(y) {
    if (y <= ALWAYS_SHOW_TOP) {
      header.classList.remove('header-hidden');
    } else if (Math.abs(y - lastY) > THRESHOLD) {
      header.classList.toggle('header-hidden', y > lastY);
    }
    lastY = y < 0 ? 0 : y;
    ticking = false;
  }

  // capture:true menangkap scroll dari elemen mana pun (scroll tidak
  // bubbling), jadi tetap bekerja walau yang scroll bukan window.
  document.addEventListener('scroll', function (e) {
    if (ticking) return;
    ticking = true;
    var y = currentY(e.target);
    window.requestAnimationFrame(function () { update(y); });
  }, { passive: true, capture: true });
})();

<script>
// ============================================================
// TAMPILAN — tema (terang/gelap/otomatis) & ukuran teks.
// Disimpan di perangkat (localStorage, aman bila diblokir). Penerapan awal
// ada di <head> index.html agar tidak berkedip.

(function () {

    var m = get_('fs_theme', 'light');

    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    // Audit #18: warna bilah status browser mengikuti tema.

    if (!tc) { tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = '#1F4E9C'; document.head.appendChild(tc); }

  }
  function applyFont_() {

    document.documentElement.setAttribute('data-fs', f === 'lg' || f === 'xl' ? f : 'normal');
  }
  function paint_() {
    var t = get_('fs_theme', 'light'), f = get_('fs_fontsize', 'normal'), sd = get_('fa_sound', 'on') === 'off' ? 'off' : 'on';
    [['seg-theme', t], ['seg-fs', f], ['seg-snd', sd]].forEach(function (p) {

      });
    });
  }

    var box = document.getElementById(id);

    box.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-v]');
      if (!b) return;

    });
  }

  bind_('seg-fs', 'fs_fontsize', applyFont_);

var FaDatePicker = (function () {
  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

      '</div>';

    els.next.addEventListener('click', function () { cur.view = new Date(cur.view.getFullYear(), cur.view.getMonth() + 1, 1); render(); });

  function render() {
    var y = cur.view.getFullYear(), m = cur.view.getMonth();
    els.month.textContent = MONTHS[m] + ' ' + y;
    els.selected.textContent = cur.temp ? (cur.temp.getDate() + ' ' + MON_SHORT[cur.temp.getMonth()] + ' ' + cur.temp.getFullYear()) : 'Belum dipilih';
    els.grid.textContent = '';
    var lead = (new Date(y, m, 1).getDay() + 6) % 7; // Senin = 0
    var dim = new Date(y, m + 1, 0).getDate();
    var prevDim = new Date(y, m, 0).getDate();
    var i, today = new Date();
    for (i = lead - 1; i >= 0; i--) { var o = document.createElement('div'); o.className = 'fa-date-out'; o.textContent = prevDim - i; els.grid.appendChild(o); }
    for (var day = 1; day <= dim; day++) {
      (function (day) {
        var d = new Date(y, m, day), dow = d.getDay();
        var b = document.createElement('button'); b.type = 'button'; b.textContent = day;
        b.className = 'fa-date-day' + ((dow === 0 || dow === 6) ? ' red' : '') + (same(d, today) ? ' is-today' : '') + (same(d, cur.temp) ? ' is-sel' : '');
        b.setAttribute('aria-label', longText(d)); b.setAttribute('aria-pressed', same(d, cur.temp) ? 'true' : 'false');
        b.addEventListener('click', function () { cur.temp = d; render(); });
        els.grid.appendChild(b);
      })(day);
    }
    var total = lead + dim, slots = (total > 35 ? 42 : 35) - total;
    for (i = 1; i <= slots; i++) { var n = document.createElement('div'); n.className = 'fa-date-out'; n.textContent = i; els.grid.appendChild(n); }
  }

  function isOpen() { return !!ov && ov.classList.contains('show'); }
  function close() { if (ov) ov.classList.remove('show'); cur && cur.trigger && cur.trigger.focus && cur.trigger.focus({ preventScroll: true }); }

  function setVal(input, v) { valueDesc.set.call(input, v); }
  function commit(v) {
    var input = cur.input;
    input.value = v; // lewat setter terpasang -> label ikut diperbarui
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
    if (cur.opts.onChange) { try { cur.opts.onChange(v); } catch (e) {} }
    close();
  }

  function open(input, opts, trigger) {
    build();
    var d = parse(input.value);
    var base = d || new Date();
    cur = { input: input, opts: opts, trigger: trigger, temp: d, view: new Date(base.getFullYear(), base.getMonth(), 1) };
    els.clear.style.display = opts.clearable ? '' : 'none';
    render();
    ov.classList.add('show');
    var sel = els.grid.querySelector('.is-sel') || els.grid.querySelector('.is-today');
    try { (sel || els.ok).focus({ preventScroll: true }); } catch (e) {}
  }

  function attach(input, opts) {
    if (!input || input._faDate) return;
    opts = opts || {};
    input._faDate = true;
    var trigger = opts.trigger, auto = null;
    if (input.type === 'date') input.type = 'hidden';
    if (!trigger) {
      auto = document.createElement('div');
      auto.className = 'form-input fa-date-trigger is-empty';
      auto.setAttribute('role', 'button'); auto.tabIndex = 0;
      var tx = document.createElement('span'); tx.className = 'fa-date-text';
      auto.appendChild(tx);
      var ic = document.createElement('span'); ic.className = 'fa-date-ico'; ic.appendChild(icon('calendar_month', 20)); auto.appendChild(ic);
      if (input.style.marginTop) auto.style.marginTop = input.style.marginTop;
      if (input.style.display === 'none') auto.style.display = 'none';
      input.parentNode.insertBefore(auto, input);
      trigger = auto; input._faTrigger = auto;
    }
    function refresh() {
      if (!auto) return;
      var d = parse(input.value);
      auto.querySelector('.fa-date-text').textContent = d ? longText(d) : (opts.placeholder || 'Pilih tanggal');
      auto.classList.toggle('is-empty', !d);
    }
    Object.defineProperty(input, 'value', {
      configurable: true,
      get: function () { return valueDesc.get.call(this); },
      set: function (v) { valueDesc.set.call(this, v); refresh(); }
    });
    function go(e) { if (e) e.preventDefault(); open(input, opts, trigger); }
    trigger.addEventListener('click', go);
    trigger.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') go(e); });
    refresh();
  }

  function setVisible(input, show) { if (input && input._faTrigger) input._faTrigger.style.display = show ? '' : 'none'; }

  return { attach: attach, setVisible: setVisible, close: close, isOpen: isOpen };
})();
</script>
