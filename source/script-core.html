<script>
// ============================================================
// FIELD VALIDATION HIGHLIGHT (Sprint 6.02 #5)
// ============================================================

function clearFieldErrors(fieldEls) {
  fieldEls.forEach(function (el) { if (el) el.classList.remove('input-error'); });
}

/** Border merah + pesan kecil tepat di bawah input terkait (hilang sendiri saat diisi/diubah). */
function setInlineError_(fieldEl, message) {
  if (!fieldEl) return;
  var host = fieldEl.closest('.select-field-wrap') || fieldEl;
  host.classList.add('field-invalid');
  var msg = host.parentNode.querySelector(':scope > .field-error-msg[data-for="' + (fieldEl.id || '') + '"]');
  if (!msg) {
    msg = document.createElement('div');
    msg.className = 'field-error-msg';
    msg.setAttribute('data-for', fieldEl.id || '');
    msg.setAttribute('role', 'alert');
    host.insertAdjacentElement('afterend', msg);
    // untuk textarea: pindahkan setelah penghitung karakter bila ada
    var counter = host.nextElementSibling && host.nextElementSibling.nextElementSibling;
    if (counter && counter.classList && counter.classList.contains('char-counter')) counter.insertAdjacentElement('afterend', msg);
  }
  msg.textContent = message;
  var clear = function () { clearInlineError_(fieldEl); };
  if (!fieldEl._inlineErrBound) {
    fieldEl._inlineErrBound = true;
    fieldEl.addEventListener('input', clear);
    fieldEl.addEventListener('change', clear);
  }
  try { host.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
}
function clearInlineError_(fieldEl) {
  if (!fieldEl) return;
  var host = fieldEl.closest('.select-field-wrap') || fieldEl;
  host.classList.remove('field-invalid');
  var scope = host.parentNode;
  var msg = scope && scope.querySelector('.field-error-msg[data-for="' + (fieldEl.id || '') + '"]');
  if (msg) msg.remove();
}

function showFieldError(fieldEl, errorEl, message) {
  if (fieldEl) {
    fieldEl.classList.add('input-error');
    fieldEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (errorEl) errorEl.textContent = message;
}

// ============================================================
// CONFIRM MODAL (Sprint 6.02 #4) — pengganti window.confirm() bawaan
// ============================================================


var pendingConfirmCallback = null;
var confirmModalBusyLabel = 'Memproses...';
var confirmModalIsBusyMode = false;

/**
 * PATCH — FIX bug "popup Reset/Logout freeze". Akar masalah sebelumnya:
 * showConfirmModal() diubah supaya TIDAK auto-close, dengan asumsi
 * SEMUA onConfirm pada akhirnya memanggil endAction() (pola async
 * hapus/lepas). Tapi banyak pemanggil (Reset form, Logout) adalah
 * fungsi SINKRON yang tidak pernah memanggil endAction/hideConfirmModal
 * sama sekali -> modal menggantung selamanya.
 *
 * FIX: busy-mode (loading state di tombol + modal tetap terbuka sampai
 * endAction dipanggil) SEKARANG OPT-IN lewat parameter ke-4 `busyMode`
 * (boolean, default false/undefined). Tanpa parameter ini, perilaku
 * KEMBALI seperti semula: modal langsung tertutup begitu tombol ditekan
 * (aman untuk proses sinkron seperti Reset/Logout). HANYA pemanggil
 * yang eksplisit mengirim busyMode=true (Hapus Pekerjaan/Jadwal/
 * Content, Lepas Pekerjaan — proses async yang pakai beginAction/
 * endAction(null)) yang mendapat loading state di tombol.
 */
function showConfirmModal(message, onConfirm, iconName, busyMode, busyLabel) {
  pendingConfirmCallback = onConfirm;
  confirmModalIsBusyMode = !!busyMode;
  confirmModalBusyLabel = busyLabel || 'Memproses...';
  document.getElementById('confirm-modal-icon').innerHTML = mdIcon(iconName || 'delete', 24);
  document.getElementById('confirm-modal-message').textContent = message;
  document.getElementById('confirm-modal-cancel').disabled = false;
  document.getElementById('confirm-modal-cancel').innerHTML = '<span>Batal</span>';
  var confirmBtn = document.getElementById('confirm-modal-confirm');
  confirmBtn.disabled = false;
  confirmBtn.innerHTML = mdIcon('checkCircle', 18) + '<span>Ya, Lanjutkan</span>';
  document.getElementById('confirm-modal-overlay').classList.add('show');
}

function hideConfirmModal() {
  document.getElementById('confirm-modal-overlay').classList.remove('show');
  pendingConfirmCallback = null;
  confirmModalIsBusyMode = false;
}

document.getElementById('confirm-modal-cancel').addEventListener('click', hideConfirmModal);
document.getElementById('confirm-modal-confirm').addEventListener('click', function () {
  var cb = pendingConfirmCallback;

  if (!confirmModalIsBusyMode) {
    // Perilaku LAMA (default) — tutup modal dulu, baru jalankan
    // callback. Aman untuk proses sinkron (Reset form, Logout) maupun
    // async yang TIDAK memakai pola beginAction/endAction(null).
    hideConfirmModal();
    if (cb) cb();
    return;
  }

  // Busy mode — tombol jadi loading state, modal TETAP TERBUKA sampai
  // endAction(null) dipanggil pemanggil (lihat hook di endAction di
  // bawah).
  var confirmBtn = document.getElementById('confirm-modal-confirm');
  var cancelBtn = document.getElementById('confirm-modal-cancel');
  confirmBtn.disabled = true;
  cancelBtn.disabled = true;
  confirmBtn.innerHTML = '<span class="btn-loading-dots"><span></span><span></span><span></span></span><span>' + confirmModalBusyLabel + '</span>';

  if (cb) cb();
});

// ============================================================
// BOTTOM SHEET (Patch 7.2) — pengganti pop-up aksi kontekstual per item.
// items: [{ icon, label, danger (opsional), onClick }]
// ============================================================

function openBottomSheet(items, opts) {
  var body = document.getElementById('bottom-sheet-body');
  body.innerHTML = '';
  var overlay = document.getElementById('bottom-sheet-overlay');
  var center = !!(opts && opts.center);
  overlay.classList.toggle('center', center);
  var titleEl = document.getElementById('bottom-sheet-title');
  if (titleEl) { titleEl.textContent = (opts && opts.title) || ''; titleEl.style.display = center && opts.title ? 'block' : 'none'; }
  (items || []).forEach(function (item) {
    var btn = document.createElement('button');
    btn.className = 'bottom-sheet-item' + (item.danger ? ' danger' : '');
    btn.innerHTML = '<span class="bs-icon">' + mdIcon(item.icon, 20) + '</span><span class="bs-label">' + item.label + '</span>' +
      (item.radio ? '<span class="bs-radio' + (item.selected ? ' selected' : '') + '"></span>' : '');
    if (item.selected) btn.classList.add('selected');
    btn.addEventListener('click', function () {
      closeBottomSheet();
      if (item.onClick) item.onClick();
    });
    body.appendChild(btn);
  });
  document.getElementById('bottom-sheet-overlay').classList.add('show');
}

function closeBottomSheet() {
  document.getElementById('bottom-sheet-overlay').classList.remove('show');
}

document.getElementById('bottom-sheet-overlay').addEventListener('click', function (e) {
  if (e.target === this) closeBottomSheet(); // tap backdrop untuk menutup
});

// ============================================================
// SESSION (localStorage) — SDS Section 17
// ============================================================

var SESSION_KEY = 'fs_session';

function saveSession(session) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function loadSession() {
  var raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

// ============================================================
// SPLASH SCREEN (loading awal: login & masuk kembali)
// ============================================================
var splashTimer_ = null, splashPct_ = 0, splashStep_ = 0, splashShownAt_ = 0;
var SPLASH_STEPS_ = ['Menghubungkan ke server...', 'Memverifikasi akses petugas...', 'Menyiapkan dasbor & data...'];

function showSplash_() {
  var el = document.getElementById('splash-screen');
  if (!el) return;
  clearInterval(splashTimer_);
  splashPct_ = 8; splashStep_ = 0; splashShownAt_ = Date.now();
  el.classList.remove('hide');
  el.classList.add('show');
  setSplashProgress_(splashPct_, SPLASH_STEPS_[0]);
  // Merayap menuju 90% selagi menunggu server; selesai ditentukan hideSplash_().
  splashTimer_ = setInterval(function () {
    splashPct_ += (90 - splashPct_) * 0.12;
    var step = splashPct_ > 62 ? 2 : (splashPct_ > 28 ? 1 : 0);
    setSplashProgress_(splashPct_, step !== splashStep_ ? SPLASH_STEPS_[(splashStep_ = step)] : null);
  }, 300);
}

function setSplashProgress_(pct, text) {
  var bar = document.getElementById('splash-bar');
  if (bar) bar.style.width = Math.min(100, pct) + '%';
  var t = document.getElementById('splash-text');
  if (t && text) t.textContent = text;
}

function hideSplash_(ok) {
  var el = document.getElementById('splash-screen');
  if (!el || !el.classList.contains('show')) return;
  clearInterval(splashTimer_);
  if (ok) setSplashProgress_(100, 'Siap digunakan');
  // Tampil minimal ~500 ms supaya tidak berkedip, lalu hilang otomatis.
  var wait = Math.max(ok ? 250 : 0, 500 - (Date.now() - splashShownAt_));
  setTimeout(function () {
    el.classList.add('hide');
    setTimeout(function () { el.classList.remove('show', 'hide'); }, 350);
  }, wait);
}

function showSpinner() {
  document.getElementById('global-spinner').style.display = 'flex';
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.add('show');
}

function hideSpinner() {
  document.getElementById('global-spinner').style.display = 'none';
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.remove('show');
}

/**
 * Progress feedback non-blocking untuk operasi lain (simpan laporan,
 * upload foto, hapus laporan, ambil/lepas tugas, buat status, refresh,
 * dsb.) — Linear Progress Indicator di App Bar + tombol pemicu berubah
 * ke status "sedang berjalan" (disabled + label progres) agar aplikasi
 * tidak pernah terasa freeze, tanpa menutup layar dengan overlay.
 */

/**
 * PATCH — spinner lingkaran polos di dalam tombol diganti dot-pulse
 * (3 titik berdenyut bergantian, lihat .btn-loading-dots di
 * styles.html) — terasa lebih hidup dibanding spinner statis berputar,
 * tanpa menambah dependency apa pun.
 */
function beginAction(buttonEl, progressLabel) {
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.add('show');
  if (buttonEl) {
    buttonEl.dataset.actionOriginalHtml = buttonEl.innerHTML;
    buttonEl.disabled = true;
    buttonEl.style.opacity = '0.65';
    if (progressLabel) {
      buttonEl.innerHTML = '<span class="btn-loading-dots"><span></span><span></span><span></span></span><span>' + progressLabel + '</span>';
    }
  }
}


/**
 * PATCH — menutup Confirm Modal otomatis (bila sedang terbuka) setiap
 * endAction() dipanggil. Ini hook TERPUSAT: seluruh fungsi hapus yang
 * SUDAH ADA (doHapusPekerjaan, doHapusJadwal, doHapusContent_, dll)
 * memanggil endAction(null) di withSuccessHandler/withFailureHandler
 * mereka masing-masing — dengan baris ini, modal otomatis ikut tertutup
 * di titik yang sama TANPA perlu mengubah fungsi-fungsi itu satu-satu.
 */

function endAction(buttonEl) {
  var bar = document.getElementById('linear-progress');
  if (bar) bar.classList.remove('show');
  if (buttonEl) {
    buttonEl.disabled = false;
    buttonEl.style.opacity = '';
    if (buttonEl.dataset.actionOriginalHtml != null) {
      buttonEl.innerHTML = buttonEl.dataset.actionOriginalHtml;
      delete buttonEl.dataset.actionOriginalHtml;
    }
  }
  // PATCH — hanya tutup modal bila memang sedang busy-mode (lihat
  // showConfirmModal). Mencegah hook ini menutup modal yang sebenarnya
  // sudah tidak terkait modal manapun (endAction dipanggil di banyak
  // tempat di luar konteks Confirm Modal, mis. submit form Buat).
  if (confirmModalIsBusyMode) {
    var confirmOverlay = document.getElementById('confirm-modal-overlay');
    if (confirmOverlay && confirmOverlay.classList.contains('show')) {
      hideConfirmModal();
    }
  }
}

var SNACKBAR_ICONS = { success: 'checkCircle', error: 'warning', warning: 'warning', info: 'notification' };
var snackbarTimer = null;

/**
 * type: 'success' | 'error' | 'warning' | 'info' (default 'info').
 * Style/animasi/durasi konsisten di semua tipe (Patch 7.2) — hanya
 * warna aksen & ikon yang membedakan makna pesan.
 */

/**
 * type: 'success' | 'error' | 'warning' | 'info'. Parameter `detail`
 * (opsional) menampilkan baris kedua dan memperbesar toast + durasinya
 * (untuk konfirmasi penting). Pesan lama tanpa detail tidak berubah.
 */
function showSnackbar(message, type, detail) {
  var el = document.getElementById('snackbar');
  var t = type || 'info';
  el.className = 'snackbar-' + t + (detail ? ' snackbar-rich' : '');
  el.innerHTML = '';

  var icon = document.createElement('span');
  icon.className = 'snackbar-icon';
  icon.innerHTML = mdIcon(SNACKBAR_ICONS[t] || 'notification', detail ? 24 : 18);
  el.appendChild(icon);

  if (detail) {
    var wrap = document.createElement('span');
    wrap.className = 'snackbar-body';
    var title = document.createElement('span');
    title.className = 'snackbar-title';
    title.textContent = message;
    var sub = document.createElement('span');
    sub.className = 'snackbar-detail';
    sub.textContent = detail; // textContent: aman dari HTML injection
    wrap.appendChild(title);
    wrap.appendChild(sub);
    el.appendChild(wrap);
  } else {
    var msg = document.createElement('span');
    msg.innerHTML = message;
    el.appendChild(msg);
  }

  void el.offsetWidth;
  el.classList.add('show');
  if (snackbarTimer) clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(function () {
    el.classList.remove('show');
  }, detail ? 4500 : 3000);
}

function mdIcon(name, size) {
  var s = size || 20;
  var sym = MD_SYMBOLS[name] || name;
  return '<span class="material-symbols-outlined" aria-hidden="true" style="font-size:' + s + 'px">' + sym + '</span>';
}

function mdSymbol_(sym, size) {
  return '<span class="material-symbols-outlined" aria-hidden="true" style="font-size:' + (size || 22) + 'px">' + sym + '</span>';
}

(function () {
  function ready() { document.documentElement.classList.add('icons-ready'); }
  function iconFontLoaded() {
    var ok = false;
    document.fonts.forEach(function (f) {
      if (String(f.family).replace(/["']/g, '') === 'Material Symbols Outlined' && f.status === 'loaded') ok = true;
    });
    return ok;
  }
  try {
    var check = function () { if (iconFontLoaded()) ready(); };
    document.fonts.addEventListener('loadingdone', check);
    document.fonts.load('24px "Material Symbols Outlined"', 'home').then(check, function () {});
    document.fonts.ready.then(check);
  } catch (e) { ready(); }
})();


function renderNav(navItems) {
  var bottomContainer = document.getElementById('bottom-nav-container');
  var sidebarContainer = document.getElementById('sidebar-nav-container');
  bottomContainer.innerHTML = '';
  sidebarContainer.innerHTML = '';

  navItems.forEach(function (item) {
    var icon = NAV_ICONS[item.key] || '';

    var bBtn = document.createElement('button');
    bBtn.className = 'nav-item' + (item.key === 'buat' ? ' nav-fab' : '');
    bBtn.dataset.page = item.key;
    bBtn.innerHTML = item.key === 'buat'
      ? '<span class="nav-fab-circle">' + mdSymbol_('add', 28) + '</span><span class="nav-label">' + item.label + '</span>'
      : '<span class="nav-icon">' + icon + '</span><span class="nav-label">' + item.label + '</span>';
    bBtn.addEventListener('click', function () { goToPage(item.key); });
    bottomContainer.appendChild(bBtn);

    sBtn.className = 'nav-item';
    sBtn.dataset.page = item.key;
    sBtn.innerHTML = '<span class="nav-icon">' + icon + '</span><span class="nav-label">' + item.label + '</span>';
    sBtn.addEventListener('click', function () { goToPage(item.key); });
    sidebarContainer.appendChild(sBtn);
  });
}

/**
 * Perf/UX — fungsi start/stopPekerjaanAutoRefresh() didefinisikan di
 * script-pekerjaan.html (bersama loadPekerjaanInbox()). Aman dipanggil
 * dari sini karena seluruh file include() digabung menjadi SATU blok
 * <script>, sehingga function declaration ter-hoist lintas file.
 */

function goToPage(pageKey) {
  // Auto-refresh Pekerjaan hanya relevan selama halaman Pekerjaan terbuka.
  if (typeof stopPekerjaanAutoRefresh === 'function') stopPekerjaanAutoRefresh();

  // Meninggalkan halaman Buat (mis. lewat nav) tanpa submit/batal
  // eksplisit tetap membatalkan mode "Buat Laporan" (Bagian 3) — supaya
  // kunjungan berikutnya ke Buat selalu mulai dari mode normal.
  if (pageKey !== 'buat' && buatPrefillContext) {
    resetBuatPrefillContext_();
  }

  // Simpan posisi scroll halaman yang sedang ditinggalkan sebelum berpindah.
  if (currentPage) {
    var session = loadSession();
    if (session) {
      session.uiState = session.uiState || {};
      session.uiState.scrollPositions = session.uiState.scrollPositions || {};
      session.uiState.scrollPositions[currentPage] = window.scrollY;
      saveSession(session);
    }
  }

  currentPage = pageKey;
  var appHeaderEl = document.querySelector('header.app-header');
  if (appHeaderEl) appHeaderEl.classList.remove('header-hidden');
  if (pageKey !== 'akun') lastMainPage = pageKey;

  document.querySelectorAll('.page-section').forEach(function (section) {
    section.classList.toggle('active', section.dataset.page === pageKey);
  });

  document.querySelectorAll('.nav-item').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.page === pageKey);
  });

  var session = loadSession();
  if (session) {
    session.uiState = session.uiState || {};
    session.uiState.activePage = pageKey;
    saveSession(session);
  }


  if (pageKey === 'beranda' && appBootstrap && typeof initBerandaPage === 'function') {
    initBerandaPage();
  }
  if (pageKey === 'pekerjaan' && appBootstrap && typeof initPekerjaanInboxPage === 'function') {
    initPekerjaanInboxPage();
    if (typeof startPekerjaanAutoRefresh === 'function') startPekerjaanAutoRefresh();
  }
  if (pageKey === 'buat' && appBootstrap && typeof initPekerjaanForm === 'function') {
    initPekerjaanForm();
  }
  if (pageKey === 'jadwal' && appBootstrap && typeof loadRiwayatPekerjaan === 'function') {
    // "Riwayat" kini berisi Riwayat Pekerjaan (arsip pribadi). Filter &
    // Unduh PDF dipindah ke Aktivitas (3.4).
    loadRiwayatPekerjaan();
  }
  if (pageKey === 'aktivitas' && appBootstrap && typeof loadAktivitasSummary === 'function') {
    // Ringkasan (statistik) + timeline Pekerjaan. Filter & Unduh PDF
    // sekarang di halaman terpisah (/exec?page=pdfrender).
    if (!pekerjaanFilterUIInitialized && typeof initPdfRenderButton_ === 'function') {
      initPdfRenderButton_();
      pekerjaanFilterUIInitialized = true;
    }
    loadAktivitasSummary();
    if (typeof loadPekerjaanAktivitas === 'function') loadPekerjaanAktivitas();
  }


  // Restore posisi scroll halaman yang baru ditampilkan (setelah konten dirender).
  setTimeout(function () {
    var s = loadSession();
    var savedScroll = (s && s.uiState && s.uiState.scrollPositions) ? s.uiState.scrollPositions[pageKey] : 0;
    window.scrollTo(0, savedScroll || 0);
  }, 50);
}

function renderApp(bootstrap, session) {
  appBootstrap = bootstrap;

  document.getElementById('screen-login').style.display = 'none';

  var user = bootstrap.currentUser;

  document.getElementById('akun-nama').textContent = user.displayName;
  var avatarEl = document.getElementById('akun-avatar');
  if (avatarEl) avatarEl.textContent = ((user.displayName || user.userCode || '?').trim().charAt(0) || '?').toUpperCase();
  document.getElementById('akun-kode').textContent = user.userCode;
  document.getElementById('akun-role').textContent = ROLE_LABELS[user.role] || user.role;


  renderNav(bootstrap.navItems);

  // Patch 8.x (2.3) — halaman default kini ditentukan server
  // (bootstrap.defaultPage), dikirim bersama respons login/bootstrap.
  // Fallback ke perhitungan role tetap dijaga untuk kompatibilitas.
  var defaultPage = bootstrap.defaultPage || (user.role === 'fs' ? 'buat' : 'beranda');
  var lastPage = (session.uiState && session.uiState.activePage) || defaultPage;
  // Tautan lama / launcher: index.html#buat -> langsung ke menu Buat.
  try {
    if (location.hash === '#buat') {
      lastPage = 'buat';
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) {}
  goToPage(lastPage);


  if (user.role !== 'demo') {
    document.getElementById('btn-submit-report').style.display = '';
  } else {
    document.getElementById('btn-submit-report').style.display = 'none';
  }

  // Auto-logout 30 menit tidak ada aktivitas — mulai/reset hitungan
  // mundur begitu user berhasil masuk (login baru atau resume sesi).
  resetInactivityTimer();
}

// ============================================================
// AUTH FLOW
// ============================================================

// Dipakai HANYA untuk resume sesi dari localStorage (tanpa form login) —
// login baru langsung dapat payload bootstrap penuh, lihat handleLogin().
function attemptBootstrap(session) {
  showSplash_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (response.success) {
        renderApp(response.data, session);
        hideSplash_(true);
      } else {
        hideSplash_(false);
        // Sesi tidak valid lagi (mis. user dinonaktifkan) — Final A3.
        clearSession();
        document.getElementById('screen-app').style.display = 'none';
        document.getElementById('screen-login').style.display = 'flex';
        document.getElementById('login-error').textContent = response.error;
      }
    })
    .withFailureHandler(function (error) {
      hideSplash_(false);
      showSnackbar('Gagal terhubung ke server. Periksa koneksi internet Anda.', 'error');
    })
    .getBootstrapData(session.accessCode);
}

/**
 * Patch 8.x (Bagian 2.3) — loginByAccessCode() sekarang mengembalikan
 * seluruh payload bootstrap sekaligus (user, master data, navItems,
 * jenisPekerjaanList, default page), jadi login TIDAK LAGI memanggil
 * getBootstrapData() secara terpisah setelahnya. Startup = SATU
 * request, bukan dua berurutan.
 */
function handleLogin() {
  var input = document.getElementById('input-access-code');
  var errorEl = document.getElementById('login-error');
  var code = input.value.trim().toUpperCase();

  errorEl.textContent = '';

  if (!code) {
    errorEl.textContent = 'Kode akses wajib diisi.';
    return;
  }

  showSplash_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (!response.success) {
        hideSplash_(false);
        errorEl.textContent = response.error;
        return;
      }

      var user = response.data.currentUser;
      var session = {
        accessCode: user.userCode,
        role: user.role,
        displayName: user.displayName,
        uiState: {}
      };
      saveSession(session);
      renderApp(response.data, session);
      hideSplash_(true);
    })
    .withFailureHandler(function (error) {
      hideSplash_(false);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
    })
    .loginByAccessCode(code);
}


/**
 * PATCH — FIX bug cache browser "nyangkut" antar akun: pageDataCache
 * (script-pekerjaan.html) hidup di memori JS, TIDAK otomatis kosong
 * saat logout. Tanpa reset ini, user B yang login di tab/browser yang
 * sama persis setelah user A logout masih melihat data cache milik
 * user A (Pekerjaan/Riwayat/Aktivitas/Jadwal/Content/Dashboard) sampai
 * salah satu cache itu di-invalidate lewat aksi atau force-refresh.
 * resetAllPageDataCache_() didefinisikan di script-pekerjaan.html.
 */
function handleLogout() {
  stopInactivityTimer();
  clearSession();
  if (typeof resetAllPageDataCache_ === 'function') resetAllPageDataCache_();
  appBootstrap = null;
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('input-access-code').value = '';
}

// ============================================================
// AUTO-LOGOUT SETELAH 30 MENIT TIDAK ADA AKTIVITAS
// ============================================================

// Sesi tidak kedaluwarsa otomatis — berlaku sampai pengguna menekan Keluar
// (atau akun dinonaktifkan). 0 = tanpa batas; isi milidetik bila ingin auto-logout.
var INACTIVITY_TIMEOUT_MS = 0;
var inactivityTimer = null;

function stopInactivityTimer() {
  if (inactivityTimer) {
    clearTimeout(inactivityTimer);
    inactivityTimer = null;
  }
}

function resetInactivityTimer() {
  // Hanya aktif selagi user benar-benar sedang login.
  if (document.getElementById('screen-app').style.display === 'none') return;
  stopInactivityTimer();
  if (!INACTIVITY_TIMEOUT_MS) return;
  inactivityTimer = setTimeout(handleInactivityLogout, INACTIVITY_TIMEOUT_MS);
}


function handleInactivityLogout() {
  stopInactivityTimer();
  clearSession();
  if (typeof resetAllPageDataCache_ === 'function') resetAllPageDataCache_();
  appBootstrap = null;
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('input-access-code').value = '';
  document.getElementById('login-error').textContent = 'Sesi berakhir otomatis karena 30 menit tidak ada aktivitas. Silakan masuk kembali.';
}


// Aktivitas apa pun mereset hitungan mundur — dipasang sekali secara
// global, resetInactivityTimer() sendiri yang memeriksa apakah user
// sedang login sebelum menjadwalkan ulang.
['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
  document.addEventListener(evt, resetInactivityTimer, { passive: true });
});

// ============================================================
// LOGIN & LOGOUT BUTTON LISTENERS
// ============================================================

document.getElementById('btn-login').addEventListener('click', handleLogin);
document.getElementById('input-access-code').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') handleLogin();
});
(function setupAkunExtras_() {
  var lo = document.getElementById('btn-logout');
  if (lo) lo.innerHTML = mdIcon('logout', 24);
  var ov = document.getElementById('about-overlay');
  var more = document.getElementById('btn-about-more');
  var closeB = document.getElementById('btn-about-close');
  if (closeB) closeB.innerHTML = mdIcon('close', 16);
  if (!ov || !more) return;
  more.addEventListener('click', function () { ov.classList.add('show'); });
  closeB.addEventListener('click', function () { ov.classList.remove('show'); });
  ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('show'); });
})();

document.getElementById('btn-logout').addEventListener('click', function () {
  showConfirmModal('Keluar dari aplikasi? Anda perlu memasukkan kode akses lagi untuk masuk kembali.', function () {
    handleLogout();
  }, 'logout');
});

/**
 * PATCH — Jaring pengaman manual: reset pageDataCache + reload halaman
 * penuh. Reload penuh (bukan sekadar reset variabel) juga memastikan
 * Service Worker/browser cache HTML/JS/CSS (bila ada) ikut ter-refresh,
 * bukan hanya data runtime.
 */

/**
 * Muat Ulang Data dengan determinate progress. TIDAK reload halaman.
 * Progres = langkah yang benar-benar selesai (1 reset cache + N
 * panggilan server berurutan). Hasil langsung diisikan ke
 * pageDataCache sehingga halaman yang dibuka sesudahnya sudah segar.
 */
var reloadRunning = false;

function setReloadTitle_(state) {
  var t = document.getElementById('reload-title');
  if (!t) return;
  if (state === 'done') t.innerHTML = mdIcon('checkCircle', 18) + '<span>Data Tersinkron</span>';
  else if (state === 'error') t.innerHTML = mdIcon('close', 18) + '<span>Sinkronisasi Gagal</span>';
  else t.innerHTML = '<span class="spin-ico">' + mdIcon('sync', 18) + '</span><span>Menyinkronkan Data</span>';
  t.className = 'reload-title ' + (state || 'run');
}

function setReloadProgress_(done, total, text, isError) {
  var fill = document.getElementById('reload-bar-fill');
  fill.style.width = Math.round((done / total) * 100) + '%';
  fill.classList.toggle('error', !!isError);
  document.getElementById('reload-step-text').textContent = text;
  var pct = document.getElementById('reload-percent');
  if (pct) pct.textContent = isError ? '' : Math.round((done / total) * 100) + '%';
  setReloadTitle_(isError ? 'error' : (done >= total ? 'done' : 'run'));
}

function closeReloadOverlay_() {
  document.getElementById('reload-overlay').classList.remove('show');
  reloadRunning = false;
}

function runReloadAppData_() {
  if (reloadRunning) return;
  var session = loadSession();
  if (!session) return;
  reloadRunning = true;
  var ac = session.accessCode;

  var steps = [
    { label: 'Memuat data akun & master...',
      run: function (ok, fail) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getBootstrapData(ac); },
      apply: function (d) { appBootstrap = d; } },
    { label: 'Memuat pekerjaan...',
      run: function (ok, fail) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getPekerjaanList(ac, { view: 'inbox' }); },
      apply: function (d) { pageDataCache.pekerjaanInbox = d.pekerjaan; } },
    { label: 'Memuat riwayat & aktivitas...',
      run: function (ok, fail) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getPekerjaanList(ac, { view: 'aktivitas' }); },
      apply: function (d) { pageDataCache.pekerjaanAktivitas = d.pekerjaan; } },
    { label: 'Memuat beranda & statistik...',
      run: function (ok, fail) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getHomeBootstrap(ac); },
      apply: function (d) { pageDataCache.dashboard = d.dashboard; pageDataCache.content = d.content; } }
  ];
  var total = steps.length + 1; // +1 = reset cache lokal

  document.getElementById('reload-actions').style.display = 'none';
  document.getElementById('reload-overlay').classList.add('show');

  resetAllPageDataCache_();
  setReloadProgress_(1, total, 'Cache lokal dibersihkan', false);

  function fail(message) {
    setReloadProgress_(0, total, message || 'Gagal memuat data.', true);
    document.getElementById('reload-bar-fill').style.width = '100%';
    document.getElementById('reload-actions').style.display = 'flex';
  }

  function runStep(i) {
    if (i >= steps.length) {
      setReloadProgress_(total, total, 'Selesai', false);
      setTimeout(function () {
        closeReloadOverlay_();
        if (typeof goToPage === 'function') goToPage(currentPage);
        showSnackbar('Data berhasil diperbarui.', 'success');
      }, 400);
      return;
    }
    setReloadProgress_(i + 1, total, steps[i].label, false);
    steps[i].run(function (response) {
      if (!response || !response.success) { fail((response && response.error) || 'Gagal memuat data.'); return; }
      steps[i].apply(response.data);
      runStep(i + 1);
    }, function () {
      fail('Gagal terhubung ke server. Periksa koneksi Anda.');
    });
  }

  runStep(0);
}

var btnReloadAppData = document.getElementById('btn-reload-app-data');
if (btnReloadAppData) {
  btnReloadAppData.innerHTML = '<span class="sync-ico">' + mdIcon('refresh', 18) + '</span><span>Muat Ulang Data</span>';
  btnReloadAppData.addEventListener('click', runReloadAppData_);
}
var btnReloadRetry = document.getElementById('btn-reload-retry');
if (btnReloadRetry) btnReloadRetry.addEventListener('click', function () { reloadRunning = false; runReloadAppData_(); });
var btnReloadClose = document.getElementById('btn-reload-close');
if (btnReloadClose) btnReloadClose.addEventListener('click', closeReloadOverlay_);
// ============================================================
// HEADER HIDE ON SCROLL (seperti Twitter/Facebook)
// ============================================================
// Scroll turun -> header disembunyikan. Scroll naik -> muncul lagi.
// Selalu tampil saat berada di dekat puncak halaman. THRESHOLD
// mencegah header berkedip karena gerakan scroll yang sangat kecil.

(function setupHideOnScrollHeader() {
  var header = document.querySelector('header.app-header');
  if (!header) return;

  var THRESHOLD = 8;
  var ALWAYS_SHOW_TOP = 60;
  var lastY = 0;
  var ticking = false;

  // Posisi scroll dari elemen mana pun yang sedang dipakai browser.
  function currentY(target) {
    if (target && target !== document && target !== window && typeof target.scrollTop === 'number') {
      return target.scrollTop;
    }
    return window.pageYOffset ||
      document.documentElement.scrollTop ||
      document.body.scrollTop || 0;
  }

  function update(y) {
    if (y <= ALWAYS_SHOW_TOP) {
      header.classList.remove('header-hidden');
    } else if (Math.abs(y - lastY) > THRESHOLD) {
      header.classList.toggle('header-hidden', y > lastY);
    }
    lastY = y < 0 ? 0 : y;
    ticking = false;
  }

  // capture:true menangkap scroll dari elemen mana pun (scroll tidak
  // bubbling), jadi tetap bekerja walau yang scroll bukan window.
  document.addEventListener('scroll', function (e) {
    if (ticking) return;
    ticking = true;
    var y = currentY(e.target);
    window.requestAnimationFrame(function () { update(y); });
  }, { passive: true, capture: true });
})();


</script>
