<script>
// ============================================================
// RIWAYAT — Arsip Pribadi Pekerjaan (Tahap 4 Cutover, pengganti
// Riwayat Laporan lama; Filter & Unduh PDF DIPINDAH ke Aktivitas)
// ============================================================

var riwayatReqSeq_ = 0;

// Filter Riwayat (tampilan saja; difilter di server sebelum paginasi).
var riwayatFilter_ = { jenis: '', floorCode: '', range: '', status: '', peran: '' };

function currentRiwayatQuery_() { return (document.getElementById('reports-search').value || '').trim(); }

function applyRiwayatSearchAndRender() { loadRiwayatPekerjaan(); }

document.getElementById('reports-search').addEventListener('input', debounce_(applyRiwayatSearchAndRender, 350));

function pad2_(n) { return (n < 10 ? '0' : '') + n; }
function ymd_(d) { return d.getFullYear() + '-' + pad2_(d.getMonth() + 1) + '-' + pad2_(d.getDate()); }

var RIWAYAT_RANGES_ = [
  { key: '', label: 'Semua tanggal' },
  { key: 'today', label: 'Hari ini' },
  { key: '7d', label: '7 hari terakhir' },
  { key: '30d', label: '30 hari terakhir' },
  { key: 'month', label: 'Bulan ini' }
];
var RIWAYAT_STATUS_ = [
  { key: '', label: 'Semua status' },
  { key: 'BELUM_SELESAI', label: 'Belum selesai' },
  { key: 'TERBUKA', label: 'Belum Diambil' },
  { key: 'DIKERJAKAN', label: 'Dikerjakan' },
  { key: 'SELESAI', label: 'Selesai' }
];
var RIWAYAT_PERAN_ = [
  { key: '', label: 'Semua peran' },
  { key: 'dibuat', label: 'Saya buat' },
  { key: 'ditangani', label: 'Saya tangani' }
];

/** Rentang tanggal -> { dateFrom, dateTo } (yyyy-MM-dd, zona waktu perangkat). */
function riwayatRangeDates_(key) {
  // Audit #15: patokan tanggal = WIB (sama dengan server), bukan jam perangkat.
  var now = new Date(Date.now() + 7 * 3600000 + new Date().getTimezoneOffset() * 60000), to = ymd_(now), from = '';
  if (key === 'today') from = to;
  else if (key === '7d') from = ymd_(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6));
  else if (key === '30d') from = ymd_(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29));
  else if (key === 'month') from = ymd_(new Date(now.getFullYear(), now.getMonth(), 1));
  else return {};
  return { dateFrom: from, dateTo: to };
}

/** Parameter server dari filter aktif (hanya yang terisi). */
function riwayatFilterParams_() {
  var f = riwayatFilter_, p = {};
  if (f.jenis) p.jenis = f.jenis;
  if (f.floorCode) p.floorCode = f.floorCode;
  if (f.status) p.status = f.status;
  if (f.peran) p.peran = f.peran;
  var r = riwayatRangeDates_(f.range);
  if (r.dateFrom) { p.dateFrom = r.dateFrom; p.dateTo = r.dateTo; }
  return p;
}

function riwayatFilterCount_() {
  var f = riwayatFilter_, n = 0;
  ['jenis', 'floorCode', 'range', 'status', 'peran'].forEach(function (k) { if (f[k]) n++; });
  return n;
}

function riwayatOptionLabel_(opts, key) {
  var o = opts.filter(function (x) { return x.key === key; })[0];
  return o ? o.label : '';
}

function riwayatJenisOptions_() {
  var out = [{ key: '', label: 'Semua jenis' }];
  Object.keys(JENIS_PEKERJAAN_BADGE).forEach(function (k) { out.push({ key: k, label: JENIS_PEKERJAAN_BADGE[k].label }); });
  return out;
}

function riwayatFloorOptions_() {
  var out = [{ key: '', label: 'Semua lantai' }];
  ((appBootstrap && appBootstrap.master && appBootstrap.master.floors) || []).forEach(function (f) {
    out.push({ key: f.floor_code, label: f.floor_name });
  });
  return out;
}

/** Baris chip filter: setiap chip membuka pemilih yang sama dengan filter Aktivitas. */
function renderRiwayatFilterRow_() {
  var row = document.getElementById('riwayat-filter-row');
  if (!row) return;
  var role = appBootstrap && appBootstrap.currentUser ? appBootstrap.currentUser.role : '';
  var jenisOpts = riwayatJenisOptions_(), floorOpts = riwayatFloorOptions_();
  var defs = [
    { k: 'jenis', title: 'Pilih Jenis', all: 'Jenis', opts: jenisOpts },
    { k: 'floorCode', title: 'Pilih Lantai', all: 'Lantai', opts: floorOpts },
    { k: 'range', title: 'Pilih Tanggal', all: 'Tanggal', opts: RIWAYAT_RANGES_ },
    { k: 'status', title: 'Pilih Status', all: 'Status', opts: RIWAYAT_STATUS_ }
  ];
  var subEl = document.getElementById('reports-card-subtitle');
  if (subEl) subEl.textContent = role === 'fs' ? 'Pekerjaan yang Anda buat atau tangani' : 'Penugasan yang Anda buat';
  // "Peran" hanya bermakna untuk FS (Riwayat FS = dibuat ATAU ditangani).
  if (role === 'fs') defs.push({ k: 'peran', title: 'Peran Saya', all: 'Peran', opts: RIWAYAT_PERAN_ });
  row.innerHTML = '';
  defs.forEach(function (d) {
    var val = riwayatFilter_[d.k];
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'rw-chip' + (val ? ' active' : '');
    b.setAttribute('data-filter', d.k);
    b.innerHTML = '<span>' + (val ? riwayatOptionLabel_(d.opts, val) : d.all) + '</span>' + mdIcon('chevronDown', 14);
    b.addEventListener('click', function () {
      openFilterPicker_(d.title, d.opts, val, function (key) {
        riwayatFilter_[d.k] = key;
        renderRiwayatFilterRow_();
        loadRiwayatPekerjaan();
      });
    });
    row.appendChild(b);
  });
  if (riwayatFilterCount_() > 0) {
    var r = document.createElement('button');
    r.type = 'button'; r.className = 'rw-chip rw-chip-reset'; r.setAttribute('data-filter', 'reset');
    r.innerHTML = mdIcon('close', 14) + '<span>Reset</span>';
    r.addEventListener('click', function () {
      riwayatFilter_ = { jenis: '', floorCode: '', range: '', status: '', peran: '' };
      renderRiwayatFilterRow_();
      loadRiwayatPekerjaan();
    });
    row.appendChild(r);
  }
}

/** Kunci cache: pencarian + filter aktif ('' = tampilan bawaan, boleh disimpan permanen). */
function riwayatCacheKey_(q) {
  var f = riwayatFilter_;
  var fk = [f.jenis, f.floorCode, f.range, f.status, f.peran].join('|');
  return fk === '||||' ? q.toLowerCase() : q.toLowerCase() + '#' + fk;
}

function loadRiwayatPekerjaan(force) {
  var session = loadSession();
  if (!session) return;

  var titleEl = document.getElementById('reports-card-title');
  if (titleEl && appBootstrap) {
    var role = appBootstrap.currentUser.role;
    if (role === 'demo') {
      titleEl.textContent = 'Riwayat Pekerjaan (Semua)';
    } else if (role === 'admin') {
      titleEl.textContent = 'Riwayat Penugasan Saya';
    } else {
      titleEl.textContent = 'Riwayat Pekerjaan Saya';
    }
  }

  renderRiwayatFilterRow_();
  var q = currentRiwayatQuery_();
  var cacheKey = riwayatCacheKey_(q);
  var container = document.getElementById('my-reports-list');
  var cached = pageDataCache.pekerjaanRiwayatByKey[cacheKey];

  if (!cached && !force && cacheKey === '') {
    var pc = persistGet_('riwayat');
    if (pc) {
      cached = { list: pc.list, total: pc.total, hasMore: pc.hasMore, t: 0 };
      pageDataCache.pekerjaanRiwayatByKey[cacheKey] = cached;
    }
  }

  var fresh = cached && (Date.now() - (cached.t || 0)) < FEED_FRESH_MS_;
  if (cached && !force && fresh) { renderRiwayatFeed_(cached, q, cacheKey); return; }

  var alreadyShown = cached && container.dataset.feedKey === cacheKey;
  if (cached && !alreadyShown) renderRiwayatFeed_(cached, q, cacheKey);
  else if (!cached) renderListSkeleton_('my-reports-list', 3, q ? 'Mencari riwayat...' : 'Memuat riwayat pekerjaan...');

  var seq = ++riwayatReqSeq_;
  fetchFeedPage_(riwayatParams_(q, 0), function (data) {
    if (seq !== riwayatReqSeq_) return;
    if (cacheKey === '') persistSet_('riwayat', { list: data.pekerjaan, total: data.total, hasMore: data.hasMore });
    if (cached && container.dataset.feedKey === cacheKey &&
        sameFeedList_(cached.list.slice(0, data.pekerjaan.length), data.pekerjaan) && cached.total === data.total) {
      cached.t = Date.now();
      return;
    }
    var entry = { list: data.pekerjaan, total: data.total, hasMore: data.hasMore, t: Date.now() };
    pageDataCache.pekerjaanRiwayatByKey[cacheKey] = entry;
    renderRiwayatFeed_(entry, q, cacheKey);
  }, function (err) {
    if (seq !== riwayatReqSeq_ || cached) return;
    renderLoadError_(container, 'riwayat', function () { loadRiwayatPekerjaan(true); }, err);
  });
}

/** Parameter satu halaman Riwayat (filter aktif ikut dikirim). */
function riwayatParams_(q, offset, fprm) {
  var p = { view: 'riwayat', q: q, limit: FEED_PAGE_SIZE_, offset: offset };
  var extra = fprm || riwayatFilterParams_();
  for (var k in extra) p[k] = extra[k];
  return p;
}

function renderRiwayatFeed_(entry, q, cacheKey) {
  document.getElementById('my-reports-list').dataset.feedKey = cacheKey;
  var empty = (q || riwayatFilterCount_() > 0)
    ? '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('description', 26) + '</div>Tidak ada riwayat yang cocok.</div>'
    : '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('description', 26) + '</div>Belum ada riwayat pekerjaan.<br>' +
      '<button class="btn-primary" id="empty-state-buat-pekerjaan">Buat Pekerjaan Sekarang</button></div>';
  // Kartu Riwayat memakai fungsi yang SAMA PERSIS dengan Aktivitas
  // (buildPekerjaanListCard_) supaya identik by construction.
  renderFeedList_(document.getElementById('my-reports-list'), entry, empty, function (done, fail) {
    fetchFeedPage_(riwayatParams_(q, entry.list.length), function (data) {
      if (pageDataCache.pekerjaanRiwayatByKey[cacheKey] !== entry) { return; }
      entry.list = entry.list.concat(data.pekerjaan);
      entry.total = data.total;
      entry.hasMore = data.hasMore;
      done(data.pekerjaan);
    }, fail);
  });
  var ctaBtn = document.getElementById('empty-state-buat-pekerjaan');
  if (ctaBtn) ctaBtn.addEventListener('click', function () { goToPage('buat'); });
}

// ============================================================
// JADWAL PIKET (Collaborative Schedule) — Patch 10.x Bagian 2
// ============================================================

// Warna mengikuti logo header: biru (#1F4E9C) untuk Piket, merah (#D6312B) untuk Ketidakhadiran,
// hijau (#9CC247) untuk Tim Lengkap.
var JK_PIKET_ = { bg: 'var(--jk-piket-bg)', fg: 'var(--jk-piket-fg)' };
var JK_ABSEN_ = { bg: 'var(--jk-absen-bg)', fg: 'var(--jk-absen-fg)' };
var JADWAL_JENIS_COLOR = {
  piket_sabtu: JK_PIKET_, piket_minggu: JK_PIKET_, piket_libur_nasional: JK_PIKET_, tugas_khusus: JK_PIKET_,
  libur_pengganti: JK_ABSEN_,
  cuti: JK_ABSEN_, izin: JK_ABSEN_, sakit: JK_ABSEN_, alpa: JK_ABSEN_
};
// Kubu pada form: PIKET vs ABSEN (Libur Pengganti ikut kubu ABSEN)
var JK_PIKET_JENIS_ = ['piket_sabtu', 'piket_minggu', 'piket_libur_nasional', 'tugas_khusus'];
function jkKubuOfJenis_(jenis) { return JK_PIKET_JENIS_.indexOf(jenis) !== -1 || String(jenis).indexOf('piket') === 0 ? 'piket' : 'absen'; }
var INDO_MONTH_LONG_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
/** "2026-10-20" -> "Selasa, 20 Oktober 2026". */
function formatJadwalDateFull_(dateStr) {
  var parts = (dateStr || '').split('-');
  if (parts.length !== 3) return dateStr || '';
  var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  return INDO_DAY_NAMES_[d.getDay()] + ', ' + d.getDate() + ' ' + INDO_MONTH_LONG_[d.getMonth()] + ' ' + d.getFullYear();
}

var INDO_DAY_NAMES_ = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
var INDO_MONTH_SHORT_ = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

/**
 * Memecah sebuah Date menjadi komponen kalender/jam SECARA EKSPLISIT
 * dalam 'Asia/Jakarta' (lewat Intl.DateTimeFormat, bukan getter lokal),
 * dipakai SATU SUMBER KEBENARAN oleh seluruh fungsi format tanggal/waktu
 * ISO di frontend — konsisten dengan APP_TIMEZONE backend, apa pun
 * timezone perangkat pengguna.
 */
function getJakartaDateParts_(date) {
  var formatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jakarta',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false,
    weekday: 'short'
  });
  var map = {};
  formatter.formatToParts(date).forEach(function (p) {
    if (p.type !== 'literal') map[p.type] = p.value;
  });
  var hour = map.hour === '24' ? '00' : map.hour;
  var jsWeekdayIndex = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(map.weekday);
  return {
    year: map.year,
    monthIndex: parseInt(map.month, 10) - 1,
    day: map.day,
    hour: hour,
    minute: map.minute,
    dayOfWeekIndex: jsWeekdayIndex !== -1 ? jsWeekdayIndex : new Date(date).getDay()
  };
}

/** 'YYYY-MM-DD' -> "Minggu, 26 Jul 2026" (parse manual, hindari geser
 * zona waktu). */
function formatJadwalDateLong_(dateStr) {
  var parts = (dateStr || '').split('-');
  if (parts.length !== 3) return dateStr || '';
  var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  var dayName = INDO_DAY_NAMES_[d.getDay()];
  return dayName + ', ' + String(d.getDate()).padStart(2, '0') + ' ' + INDO_MONTH_SHORT_[d.getMonth()] + ' ' + d.getFullYear();
}

/** ISO timestamp -> "17 Jul 2026, 10:30" DALAM ZONA WAKTU Asia/Jakarta. */
function formatJadwalTimestamp_(isoString) {
  if (!isoString) return '';
  var d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  var parts = getJakartaDateParts_(d);
  return parts.day + ' ' + INDO_MONTH_SHORT_[parts.monthIndex] + ' ' + parts.year + ', ' + parts.hour + ':' + parts.minute;
}

var jadwalFormEditId = null; // null = mode tambah; terisi = mode ubah
var jadwalFormListenersAttached = false;

function initJadwalPiketSection() {
  if (!appBootstrap) return;
  var role = appBootstrap.currentUser.role;
  var isDemo = role === 'demo';
  var isAdmin = role === 'admin';

  document.getElementById('btn-toggle-jadwal-form').style.display = isDemo ? 'none' : 'flex';
  document.getElementById('btn-jadwal-piket-audit').style.display = isAdmin ? 'flex' : 'none';

  if (!jadwalFormListenersAttached) {
    jadwalFormListenersAttached = true;

    var jenisSelect = document.getElementById('jadwal-form-jenis');
    (appBootstrap.jadwalJenisList || []).forEach(function (j) {
      var opt = document.createElement('option');
      opt.value = j.value;
      opt.textContent = j.label;
      jenisSelect.appendChild(opt);
    });

    var userSelect = document.getElementById('jadwal-form-user');
    (appBootstrap.master.fsUsers || []).forEach(function (u) {
      var opt = document.createElement('option');
      opt.value = u.userCode;
      opt.textContent = u.displayName;
      userSelect.appendChild(opt);
    });
  }

  // Opsi "saya sendiri" (mis. Administrator yang bukan anggota daftar FS)
  var me = appBootstrap.currentUser;
  var uSel = document.getElementById('jadwal-form-user');
  var hasMe = Array.prototype.some.call(uSel.options, function (o) { return o.value === me.userCode; });
  if (!hasMe) {
    var meOpt = document.createElement('option');
    meOpt.value = me.userCode;
    meOpt.textContent = me.displayName;
    uSel.appendChild(meOpt);
  }
  jkSyncLabels_();
  loadJadwalAktif();
}

document.getElementById('btn-toggle-jadwal-form').addEventListener('click', function () {
  openJadwalForm(null);
});

document.getElementById('btn-cancel-jadwal-form').addEventListener('click', function () {
  closeJadwalForm();
});

// ---- Modal tengah (Jadwal Kolaborasi) ----
function jkShow_(id) { document.getElementById(id).classList.add('show'); }
function jkHide_(id) { document.getElementById(id).classList.remove('show'); }

function jkInitIcons_() {
  var nodes = document.querySelectorAll('.jk-overlay [data-jk-close]');
  for (var i = 0; i < nodes.length; i++) nodes[i].innerHTML = mdIcon('close', 16);
  var arrows = document.querySelectorAll('.jk-arrow');
  for (var j = 0; j < arrows.length; j++) arrows[j].innerHTML = mdIcon('chevronDown', 16);
  document.getElementById('jk-detail-overlay').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-jk-close]')) jkHide_('jk-detail-overlay');
  });
  document.getElementById('jk-form-overlay').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-jk-close]')) closeJadwalForm();
  });
  document.getElementById('jk-picker-overlay').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-jk-close]')) jkHide_('jk-picker-overlay');
  });
}
jkInitIcons_();

var jkKubuJenis = 'piket';
var jkKubuPetugas = 'saya';

function jkMe_() { return appBootstrap.currentUser; }

function jkSyncLabels_() {
  var js = document.getElementById('jadwal-form-jenis');
  var us = document.getElementById('jadwal-form-user');
  var jl = document.getElementById('jk-jenis-label');
  var ul = document.getElementById('jk-user-label');
  jl.textContent = js.selectedIndex >= 0 && js.options[js.selectedIndex] ? js.options[js.selectedIndex].textContent : 'Pilih jenis';
  var hasUser = !!us.value;
  ul.textContent = hasUser ? us.options[us.selectedIndex].textContent + (jkKubuPetugas === 'saya' ? ' (Saya)' : '') : 'Pilih petugas';
  ul.classList.toggle('is-placeholder', !hasUser);
  var d = document.getElementById('jadwal-form-date').value;
  var dt = document.getElementById('jk-date-text');
  dt.textContent = d ? formatJadwalDateFull_(d) : 'Pilih tanggal';
  dt.classList.toggle('is-placeholder', !d);
  // tombol kubu
  document.getElementById('jk-kubu-piket').classList.toggle('active', jkKubuJenis === 'piket');
  document.getElementById('jk-kubu-absen').classList.toggle('active', jkKubuJenis === 'absen');
  document.getElementById('jk-kubu-saya').classList.toggle('active', jkKubuPetugas === 'saya');
  document.getElementById('jk-kubu-lain').classList.toggle('active', jkKubuPetugas === 'lain');
  var ou = document.getElementById('jk-open-user');
  ou.classList.toggle('is-locked', jkKubuPetugas === 'saya');
  ou.dataset.kubu = jkKubuPetugas;
  document.getElementById('jk-open-jenis').dataset.kubu = jkKubuJenis;
}

function jkSetKubuJenis_(k) {
  jkKubuJenis = k;
  var sel = document.getElementById('jadwal-form-jenis');
  var all = (appBootstrap.jadwalJenisList || []).filter(function (j) { return jkKubuOfJenis_(j.value) === k; });
  if (all.length && !all.some(function (j) { return j.value === sel.value; })) sel.value = all[0].value;
  jkSyncLabels_();
}

function jkSetKubuPetugas_(k) {
  jkKubuPetugas = k;
  var us = document.getElementById('jadwal-form-user');
  if (k === 'saya') us.value = jkMe_().userCode;
  else if (us.value === jkMe_().userCode) us.value = '';
  us.dispatchEvent(new Event('change', { bubbles: true }));
  jkSyncLabels_();
}

/** Pemilih bergaya modal tengah; select asli tetap menjadi sumber nilai. */
function jkOpenPicker_(selectId, title) {
  var sel = document.getElementById(selectId);
  if (selectId === 'jadwal-form-jenis') title = jkKubuJenis === 'piket' ? 'PILIH JADWAL PIKET' : 'PILIH JADWAL KETIDAKHADIRAN';
  document.getElementById('jk-picker-title').textContent = title;
  var list = document.getElementById('jk-picker-list');
  list.innerHTML = '';
  list.className = 'jk-picker-list' + (selectId === 'jadwal-form-jenis' ? (jkKubuJenis === 'absen' ? ' theme-red' : ' theme-blue') : '');
  Array.prototype.forEach.call(sel.options, function (opt) {
    if (!opt.value) return;
    if (selectId === 'jadwal-form-jenis' && jkKubuOfJenis_(opt.value) !== jkKubuJenis) return;
    if (selectId === 'jadwal-form-user' && opt.value === jkMe_().userCode) return;
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'jk-picker-item' + (opt.value === sel.value ? ' selected' : '');
    var label = document.createElement('span');
    label.textContent = opt.textContent;
    var radio = document.createElement('span');
    radio.className = 'jk-radio';
    item.appendChild(label);
    item.appendChild(radio);
    item.addEventListener('click', function () {
      sel.value = opt.value;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      jkSyncLabels_();
      jkHide_('jk-picker-overlay');
    });
    list.appendChild(item);
  });
  jkShow_('jk-picker-overlay');
}

document.getElementById('jk-kubu-piket').addEventListener('click', function () { jkSetKubuJenis_('piket'); });
document.getElementById('jk-kubu-absen').addEventListener('click', function () { jkSetKubuJenis_('absen'); });
document.getElementById('jk-kubu-saya').addEventListener('click', function () { jkSetKubuPetugas_('saya'); });
document.getElementById('jk-kubu-lain').addEventListener('click', function () { jkSetKubuPetugas_('lain'); });
document.getElementById('jadwal-form-date').addEventListener('input', jkSyncLabels_);
// Pemilih tanggal kustom (awal pekan Senin, Sabtu/Minggu merah) menggantikan pemilih bawaan peramban.
FaDatePicker.attach(document.getElementById('jadwal-form-date'), { trigger: document.getElementById('jk-date-wrap') });
FaDatePicker.attach(document.getElementById('content-form-rule-date'));
FaDatePicker.attach(document.getElementById('content-form-start'));
FaDatePicker.attach(document.getElementById('content-form-end'));
document.getElementById('jk-date-ico').innerHTML = mdIcon('calendar', 16);

document.getElementById('jk-open-jenis').addEventListener('click', function () { jkOpenPicker_('jadwal-form-jenis', 'Pilih Jenis Jadwal'); });
document.getElementById('jk-open-user').addEventListener('click', function () { if (jkKubuPetugas === 'lain') jkOpenPicker_('jadwal-form-user', 'Pilih Petugas Lain'); });

function jkSetErr_(inputEl, errId, msg) {
  inputEl.classList.add('field-invalid');
  document.getElementById(errId).textContent = msg;
}
function jkClearErrs_() {
  ['jk-date-wrap', 'jk-open-user'].forEach(function (id) { document.getElementById(id).classList.remove('field-invalid'); });
  document.getElementById('jadwal-err-date').textContent = '';
  document.getElementById('jadwal-err-user').textContent = '';
}
document.getElementById('jadwal-form-date').addEventListener('input', function () {
  document.getElementById('jk-date-wrap').classList.remove('field-invalid');
  document.getElementById('jadwal-err-date').textContent = '';
});
document.getElementById('jadwal-form-user').addEventListener('change', function () {
  document.getElementById('jk-open-user').classList.remove('field-invalid');
  document.getElementById('jadwal-err-user').textContent = '';
});

// presetDate (opsional, "YYYY-MM-DD"): dipakai saat form dibuka dari kolom tanggal Kalender.
function openJadwalForm(entry, presetDate) {
  jadwalFormEditId = entry ? entry.jadwalId : null;
  document.getElementById('jadwal-form-heading').textContent = entry ? 'Ubah Jadwal' : 'Tambah Jadwal';
  document.getElementById('jadwal-form-date').value = entry ? entry.tanggal : (presetDate || todayDateStr_());
  var jenisVal = entry ? entry.jenis : JK_PIKET_JENIS_[0];
  if (!entry && presetDate) {
    // Jenis awal yang cocok dengan harinya (Piket Sabtu/Minggu hanya valid pada hari itu).
    var pdow = new Date(presetDate + 'T00:00:00Z').getUTCDay();
    jenisVal = pdow === 6 ? 'piket_sabtu' : (pdow === 0 ? 'piket_minggu' : 'tugas_khusus');
  }
  document.getElementById('jadwal-form-jenis').value = jenisVal;
  jkKubuJenis = jkKubuOfJenis_(jenisVal);
  var isSelf = !entry || entry.userCode === jkMe_().userCode;
  jkKubuPetugas = isSelf ? 'saya' : 'lain';
  document.getElementById('jadwal-form-user').value = isSelf ? jkMe_().userCode : entry.userCode;
  document.getElementById('jadwal-form-notes').value = entry ? entry.catatan : '';
  document.getElementById('jadwal-form-error').textContent = '';
  jkClearErrs_();
  jkSyncLabels_();
  jkShow_('jk-form-overlay');
}

function closeJadwalForm() {
  jadwalFormEditId = null;
  jkHide_('jk-picker-overlay');
  jkHide_('jk-form-overlay');
  document.getElementById('jadwal-form-error').textContent = '';
}

document.getElementById('btn-submit-jadwal').addEventListener('click', function () {
  var errorEl = document.getElementById('jadwal-form-error');
  errorEl.textContent = '';

  var data = {
    tanggal: document.getElementById('jadwal-form-date').value,
    jenis: document.getElementById('jadwal-form-jenis').value,
    userCode: document.getElementById('jadwal-form-user').value,
    catatan: document.getElementById('jadwal-form-notes').value
  };

  jkClearErrs_();
  var bad = false;
  if (!data.tanggal) { jkSetErr_(document.getElementById('jk-date-wrap'), 'jadwal-err-date', 'Tanggal wajib diisi.'); bad = true; }
  if (!data.userCode) { jkSetErr_(document.getElementById('jk-open-user'), 'jadwal-err-user', 'Petugas wajib dipilih.'); bad = true; }
  var hariWajib = { piket_sabtu: [6, 'Sabtu'], piket_minggu: [0, 'Minggu'] }[data.jenis];
  if (!bad && hariWajib) {
    var dp = data.tanggal.split('-');
    if (new Date(+dp[0], +dp[1] - 1, +dp[2]).getDay() !== hariWajib[0]) {
      jkSetErr_(document.getElementById('jk-date-wrap'), 'jadwal-err-date', 'Piket ' + hariWajib[1] + ' harus dipilih pada hari ' + hariWajib[1] + '.');
      bad = true;
    }
  }
  if (bad) return;

  var session = loadSession();
  var editId = jadwalFormEditId;
  var submitBtn = document.getElementById('btn-submit-jadwal');
  beginAction(submitBtn, 'Menyimpan...');

  var call = google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      if (!response.success) { errorEl.textContent = response.error; showSnackbar(response.error, 'error'); return; }
      showSnackbar(editId ? 'Jadwal berhasil diubah.' : 'Jadwal berhasil ditambahkan.', 'success');
      closeJadwalForm();
      pageDataCache.jadwalAktif = null;
      loadJadwalAktif(true);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    });

  if (editId) {
    call.ubahJadwal(session.accessCode, editId, data);
  } else {
    call.buatJadwal(session.accessCode, data);
  }
});


function confirmHapusJadwal(jadwalId) {
  showConfirmModal('Hapus entri jadwal ini?', function () {
    doHapusJadwal(jadwalId);
  }, 'delete', true, 'Menghapus...');
}

function doHapusJadwal(jadwalId) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Jadwal berhasil dihapus.', 'success');
      pageDataCache.jadwalAktif = null;
      loadJadwalAktif(true);
    })
    .withFailureHandler(function () {

function loadJadwalAktif(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.jadwalAktif;
  if (cached && !force) {
    renderJadwalPiket_(cached);
    return;
  }

  if (!cached) {
    document.getElementById('jadwal-piket-summary').innerHTML = skeletonJadwalHtml_();
  }

  var gJad = reqGuard_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (reqDead_(gJad)) return;
      if (!response.success) {
        if (!cached) document.getElementById('jadwal-piket-summary').textContent = response.error;
        return;
      }
      if (!reqStale_(gJad)) pageDataCache.jadwalAktif = response.data.jadwal;
      renderJadwalPiket_(response.data.jadwal);
    })
    .withFailureHandler(function () {
      if (!cached) document.getElementById('jadwal-piket-summary').textContent = 'Gagal memuat jadwal.';
    })
    .getJadwalAktif(session.accessCode);
}

function jkDateStrOffset_(days) {
  var d = new Date();
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function jkWindowDays_() { return (appBootstrap && appBootstrap.scheduleDisplayWindowDays) || 28; }
function jkArchiveDays_() { return (appBootstrap && appBootstrap.scheduleArchiveDays) || 30; }

/** Jadwal ke depan saja (hari ini s.d. 4 minggu) — dipakai Tabel, ringkasan, dan hitungan. */
function filterJadwalDalamJendela_(list) {
  var today = todayDateStr_();
  var endStr = jkDateStrOffset_(jkWindowDays_());
  return (list || []).filter(function (e) { return e.tanggal >= today && e.tanggal <= endStr; });
}

/** Jadwal 1 bulan ke belakang (arsip, hanya-baca di Kalender) + 4 minggu ke depan. */
function filterJadwalDenganArsip_(list) {
  var startStr = jkDateStrOffset_(-jkArchiveDays_());
  var endStr = jkDateStrOffset_(jkWindowDays_());
  return (list || []).filter(function (e) { return e.tanggal >= startStr && e.tanggal <= endStr; });
}

function renderJadwalPiket_(fullList) {
  jkWindowList_ = filterJadwalDalamJendela_(fullList);
  jkAllList_ = filterJadwalDenganArsip_(fullList);
  jkRender_();
}


// ============================================================
// JADWAL KOLABORASI — tampilan Kalender mingguan, filter, dan salin ke WhatsApp
// (hanya frontend; data & hak akses tidak berubah)
// ============================================================
var jkView_ = 'kalender';          // 'kalender' | 'tabel'
var jkWeekIdx_ = 0;                // minggu ke-n dalam jendela (0 = minggu yang memuat hari ini)
var jkFilter_ = { mine: false, user: '' };
var jkWindowList_ = [];            // entri hari ini s.d. 4 minggu ke depan (belum difilter)
var jkAllList_ = [];               // jkWindowList_ + arsip 1 bulan ke belakang (untuk Kalender)
try { var jkSavedView_ = localStorage.getItem('fa_jk_view'); if (jkSavedView_ === 'tabel' || jkSavedView_ === 'kalender') jkView_ = jkSavedView_; } catch (e) { /* abaikan */ }

function jkUtc_(s) { var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function jkYmd_(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad2_(d.getUTCMonth() + 1) + '-' + pad2_(d.getUTCDate()); }
function jkMondayMs_(s) { var ms = jkUtc_(s); var dow = new Date(ms).getUTCDay(); return ms - ((dow + 6) % 7) * 86400000; }
function jkShortDate_(ms) { var d = new Date(ms); return d.getUTCDate() + ' ' + INDO_MONTH_SHORT_[d.getUTCMonth()]; }

/** Daftar entri setelah filter "Saya"/petugas. */
function jkFiltered_(withArchive) {
  var me = appBootstrap && appBootstrap.currentUser ? appBootstrap.currentUser.userCode : '';
  return (withArchive ? jkAllList_ : jkWindowList_).filter(function (e) {
    if (jkFilter_.mine) return e.userCode === me;
    if (jkFilter_.user) return e.userCode === jkFilter_.user;
    return true;
  });
}

/** Jumlah minggu (Senin–Minggu) yang menutupi jendela tampilan. */
function jkWeekCount_() {
  var windowDays = jkWindowDays_();
  var start = jkMondayMs_(todayDateStr_());
  var end = jkUtc_(todayDateStr_()) + windowDays * 86400000;
  return Math.max(1, Math.floor((end - start) / (7 * 86400000)) + 1);
}

/** Indeks minggu paling awal yang boleh dilihat (negatif = arsip). */
function jkWeekMin_() {
  var startMs = jkMondayMs_(todayDateStr_());
  var archMs = jkMondayMs_(jkDateStrOffset_(-jkArchiveDays_()));
  return -Math.max(0, Math.round((startMs - archMs) / (7 * 86400000)));
}

function jkSortEntries_(a, b) {
  var ka = jkKubuOfJenis_(a.jenis) === 'piket' ? 0 : 1, kb = jkKubuOfJenis_(b.jenis) === 'piket' ? 0 : 1;
  if (ka !== kb) return ka - kb;
  return String(a.userName).localeCompare(String(b.userName));
}

function jkRender_() {
  if (jkFilter_.user && !jkWindowList_.some(function (e) { return e.userCode === jkFilter_.user; })) jkFilter_.user = '';
  var list = jkFiltered_();
  var counts = { piket: 0, absen: 0, libur: 0 };
  list.forEach(function (e) {
    if (e.jenis === 'libur_pengganti') counts.libur++;
    else if (jkKubuOfJenis_(e.jenis) === 'piket') counts.piket++;
    else counts.absen++;
  });
  var windowDays = jkWindowDays_();
  var filtered = jkFilter_.mine || jkFilter_.user;
  document.getElementById('jadwal-piket-summary').innerHTML =
    '<div class="jk-info">' +
      '<span>' + mdIcon('reminder', 16) + Math.round(windowDays / 7) + ' minggu ke depan</span>' +
      '<span>' + mdIcon('description', 16) + list.length + (filtered ? ' jadwal (terfilter)' : ' jadwal aktif') + '</span>' +
    '</div>';

  jkRenderToolbar_();

  var tableWrap = document.getElementById('jadwal-piket-table');
  var cal = document.getElementById('jadwal-piket-cal');
  var emptyEl = document.getElementById('jadwal-piket-empty');
  if (jkView_ === 'tabel') {
    cal.style.display = 'none';
    renderJadwalTable_(list, counts);
  } else {
    tableWrap.style.display = 'none';
    if (emptyEl) emptyEl.style.display = 'none';
    jkRenderCounts_(list.length ? counts : null, tableWrap);
    cal.style.display = '';
    jkRenderCalendar_(jkFiltered_(true));
  }
}

function jkRenderCounts_(counts, beforeEl) {
  var countsBar = document.getElementById('jk-counts');
  if (!counts) { if (countsBar) countsBar.style.display = 'none'; return; }
  if (!countsBar) {
    countsBar = document.createElement('div');
    countsBar.id = 'jk-counts';
    countsBar.className = 'jk-counts';
    beforeEl.parentNode.insertBefore(countsBar, beforeEl);
  }
  countsBar.style.display = '';
  countsBar.innerHTML =
    '<div class="jk-count"><span class="jk-count-ico piket">' + mdIcon('shield', 20) + '</span><span class="jk-count-txt">' + counts.piket + ' Piket</span></div>' +
    '<span class="jk-count-sep">•</span>' +
    '<div class="jk-count"><span class="jk-count-txt">' + (counts.absen + counts.libur) + ' Ketidakhadiran</span><span class="jk-count-ico hadir">' + mdIcon('personCheck', 20) + '</span></div>';
}

function jkRenderToolbar_() {
  var bar = document.getElementById('jk-toolbar');
  if (!bar) return;
  var role = appBootstrap && appBootstrap.currentUser ? appBootstrap.currentUser.role : '';
  bar.style.display = '';
  bar.innerHTML = '';

  var row1 = document.createElement('div');
  row1.className = 'jk-tb-row';
  var seg = document.createElement('div');
  seg.className = 'jk-seg';
  seg.setAttribute('role', 'group');
  seg.setAttribute('aria-label', 'Tampilan jadwal');
  [['kalender', 'Kalender'], ['tabel', 'Tabel']].forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'jk-seg-btn' + (jkView_ === v[0] ? ' active' : '');
    b.setAttribute('aria-pressed', jkView_ === v[0] ? 'true' : 'false');
    b.textContent = v[1];
    b.addEventListener('click', function () {
      if (jkView_ === v[0]) return;
      jkView_ = v[0];
      try { localStorage.setItem('fa_jk_view', jkView_); } catch (e) { /* abaikan */ }
      jkRender_();
    });
    seg.appendChild(b);
  });
  row1.appendChild(seg);

  var copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'jk-copy-btn';
  copyBtn.setAttribute('aria-label', 'Salin jadwal untuk WhatsApp');
  copyBtn.innerHTML = mdIcon('copy', 16) + '<span>Salin</span>';
  copyBtn.addEventListener('click', jkCopySchedule_);
  row1.appendChild(copyBtn);
  bar.appendChild(row1);

  var row2 = document.createElement('div');
  row2.className = 'jk-tb-row jk-fchips';
  function chip(label, active, onClick, withArrow) {
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'jk-fchip' + (active ? ' active' : '');
    c.setAttribute('aria-pressed', active ? 'true' : 'false');
    c.innerHTML = '<span></span>' + (withArrow ? mdIcon('chevronDown', 16) : '');
    c.firstChild.textContent = label;
    c.addEventListener('click', onClick);
    row2.appendChild(c);
  }
  chip('Semua', !jkFilter_.mine && !jkFilter_.user, function () { jkFilter_ = { mine: false, user: '' }; jkRender_(); });
  if (role !== 'demo') {
    chip('Jadwal Saya', jkFilter_.mine, function () { jkFilter_ = { mine: true, user: '' }; jkRender_(); });
  }
  // Petugas: hanya yang punya jadwal dalam jendela (daftar pendek & relevan).
  var seen = {}, people = [];
  jkWindowList_.forEach(function (e) { if (!seen[e.userCode]) { seen[e.userCode] = 1; people.push({ key: e.userCode, label: e.userName }); } });
  people.sort(function (a, b) { return String(a.label).localeCompare(String(b.label)); });
  if (people.length > 1) {
    var cur = people.filter(function (p) { return p.key === jkFilter_.user; })[0];
    chip(cur ? cur.label : 'Petugas', !!cur, function () {
      if (typeof openFilterPicker_ !== 'function') return;
      openFilterPicker_('Pilih Petugas', [{ key: '', label: 'Semua petugas' }].concat(people), jkFilter_.user, function (key) {
        jkFilter_ = { mine: false, user: key };
        jkRender_();
      });
    }, true);
  }
  bar.appendChild(row2);
}

function jkRenderCalendar_(list) {
  var cal = document.getElementById('jadwal-piket-cal');
  cal.innerHTML = '';
  var weeks = jkWeekCount_();
  if (jkWeekIdx_ > weeks - 1) jkWeekIdx_ = weeks - 1;
  var minIdx = jkWeekMin_();
  if (jkWeekIdx_ < minIdx) jkWeekIdx_ = minIdx;
  var startMs = jkMondayMs_(todayDateStr_()) + jkWeekIdx_ * 7 * 86400000;
  var endMs = startMs + 6 * 86400000;

  var nav = document.createElement('div');
  nav.className = 'jk-cal-nav';
  var prev = document.createElement('button');
  prev.type = 'button'; prev.className = 'jk-cal-navbtn'; prev.setAttribute('aria-label', 'Minggu sebelumnya');
  prev.innerHTML = mdIcon('chevronLeft', 22); prev.disabled = jkWeekIdx_ <= minIdx;
  prev.addEventListener('click', function () { jkWeekIdx_--; jkRender_(); });
  var next = document.createElement('button');
  next.type = 'button'; next.className = 'jk-cal-navbtn'; next.setAttribute('aria-label', 'Minggu berikutnya');
  next.innerHTML = mdIcon('chevronRight', 22); next.disabled = jkWeekIdx_ >= weeks - 1;
  next.addEventListener('click', function () { jkWeekIdx_++; jkRender_(); });
  var label = document.createElement('div');
  label.className = 'jk-cal-label';
  label.textContent = jkShortDate_(startMs) + ' – ' + jkShortDate_(endMs) + (jkWeekIdx_ === 0 ? ' · Minggu ini' : (jkWeekIdx_ < 0 ? ' · Arsip' : ''));
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  cal.appendChild(nav);

  var byDay = {};
  list.forEach(function (e) { (byDay[e.tanggal] = byDay[e.tanggal] || []).push(e); });
  var allByDay = {};
  jkWindowList_.forEach(function (e) { (allByDay[e.tanggal] = allByDay[e.tanggal] || []).push(e); });
  var filtered = !!(jkFilter_.mine || jkFilter_.user);
  var today = todayDateStr_();
  var dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  var canAddFromCal = !!(appBootstrap && appBootstrap.currentUser && appBootstrap.currentUser.role !== 'demo');

  for (var i = 0; i < 7; i++) {
    var ms = startMs + i * 86400000;
    var ds = jkYmd_(ms);
    var dow = new Date(ms).getUTCDay();
    var row = document.createElement('div');
    row.className = 'jk-cal-day' + (ds === today ? ' is-today' : '') + (dow === 0 || dow === 6 ? ' is-weekend' : '') + (ds < today ? ' is-past' : '');

    var dateCol = document.createElement('div');
    dateCol.className = 'jk-cal-date';
    var dn = document.createElement('span'); dn.className = 'dn'; dn.textContent = dayNames[dow];
    var dd = document.createElement('span'); dd.className = 'dd'; dd.textContent = new Date(ms).getUTCDate();
    dateCol.appendChild(dn); dateCol.appendChild(dd);
    row.appendChild(dateCol);

    var items = document.createElement('div');
    items.className = 'jk-cal-items';
    var entries = (byDay[ds] || []).slice().sort(jkSortEntries_);
    // "Tim Lengkap" (sama aturan dengan Carousel): hari kerja Senin–Jumat, belum lewat, tanpa
    // ketidakhadiran/libur pengganti dan bukan libur nasional. Tidak ditampilkan saat filter aktif
    // (data tim disaring sehingga tidak bisa dipastikan).
    var showLengkap = !filtered && ds >= today && dow >= 1 && dow <= 5 && !(allByDay[ds] || []).some(function (e) {
      return jkKubuOfJenis_(e.jenis) === 'absen' || e.jenis === 'piket_libur_nasional';
    });
    if (showLengkap) {
      var ok = document.createElement('span');
      ok.className = 'jk-chip jk-chip-ok';
      ok.innerHTML = mdIcon('personCheck', 16);
      var okt = document.createElement('b'); okt.textContent = 'Tim Lengkap';
      ok.appendChild(okt);
      items.appendChild(ok);
    }
    if (!entries.length && !showLengkap) {
      var em = document.createElement('span');
      em.className = 'jk-cal-empty';
      em.textContent = ds < today ? '' : '—';
      items.appendChild(em);
    }
    entries.forEach(function (e) {
      var colors = JADWAL_JENIS_COLOR[e.jenis] || { bg: 'var(--status-neutral-bg)', fg: 'var(--status-neutral-fg)' };
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'jk-chip ' + (jkKubuOfJenis_(e.jenis) === 'piket' ? 'k-piket' : 'k-absen');
      chip.style.background = colors.bg;
      chip.style.color = colors.fg;
      var nm = document.createElement('b'); nm.textContent = e.userName;
      var jn = document.createElement('small'); jn.textContent = e.jenisLabel;
      chip.appendChild(nm); chip.appendChild(jn);
      chip.addEventListener('click', function () { openJadwalDetail_(e); });
      items.appendChild(chip);
    });
    row.appendChild(items);
    // Klik kolom tanggal -> form Tambah Jadwal dengan tanggal terisi. Tidak untuk Demo dan minggu Arsip (hanya dilihat).
    if (canAddFromCal && jkWeekIdx_ >= 0) {
      row.classList.add('is-addable');
      var addBtn = document.createElement('button');
      addBtn.type = 'button'; addBtn.className = 'jk-cal-add';
      addBtn.setAttribute('aria-label', 'Tambah jadwal tanggal ' + ds);
      addBtn.innerHTML = mdIcon('add', 18);
      row.appendChild(addBtn);
      (function (dateStr) {
        row.addEventListener('click', function (ev) {
          if (ev.target.closest && ev.target.closest('button.jk-chip')) return; // chip jadwal membuka Detail, bukan form baru (chip "Tim Lengkap" hanya info)
          openJadwalForm(null, dateStr);
        });
      })(ds);
    }
    cal.appendChild(row);
  }

  var weekHas = list.some(function (e) { return e.tanggal >= jkYmd_(startMs) && e.tanggal <= jkYmd_(endMs); });
  if (!weekHas && jkWeekIdx_ < 0) {
    var ah = document.createElement('div');
    ah.className = 'jk-cal-hint';
    ah.textContent = 'Tidak ada jadwal pada minggu arsip ini.';
    cal.appendChild(ah);
  } else if (jkWeekIdx_ < 0) {
    var an = document.createElement('div');
    an.className = 'jk-cal-hint';
    an.textContent = 'Arsip: jadwal yang sudah lewat (hanya dilihat).';
    cal.appendChild(an);
  }
  if (!list.length && jkWeekIdx_ >= 0) {
    var hint = document.createElement('div');
    hint.className = 'jk-cal-hint';
    hint.textContent = (jkFilter_.mine || jkFilter_.user) ? 'Tidak ada jadwal yang cocok dengan filter.' : 'Belum ada jadwal dalam beberapa minggu ke depan.';
    cal.appendChild(hint);
  }
}

/** Teks siap tempel ke WhatsApp untuk periode yang sedang dilihat (minggu di Kalender, seluruh jendela di Tabel). */
function jkBuildShareText_() {
  var list = jkFiltered_();
  var title, from = null, to = null;
  if (jkView_ === 'kalender') {
    var startMs = jkMondayMs_(todayDateStr_()) + jkWeekIdx_ * 7 * 86400000;
    from = jkYmd_(startMs); to = jkYmd_(startMs + 6 * 86400000);
    title = jkShortDate_(startMs) + ' – ' + jkShortDate_(startMs + 6 * 86400000);
    list = jkFiltered_(true).filter(function (e) { return e.tanggal >= from && e.tanggal <= to; });
  } else {
    var windowDays = jkWindowDays_();
    title = Math.round(windowDays / 7) + ' minggu ke depan';
  }
  var who = jkFilter_.mine ? ' (Jadwal Saya)' : '';
  if (jkFilter_.user) {
    var m = list.concat(jkAllList_).filter(function (e) { return e.userCode === jkFilter_.user; })[0];
    who = m ? ' (' + m.userName + ')' : '';
  }
  if (!list.length) return '';

  var days = {};
  list.forEach(function (e) { (days[e.tanggal] = days[e.tanggal] || []).push(e); });
  var lines = ['*Jadwal Kolaborasi' + who + '*', title, ''];
  Object.keys(days).sort().forEach(function (ds) {
    lines.push('*' + formatJadwalDateFull_(ds) + '*');
    var byJenis = {}, order = [];
    days[ds].slice().sort(jkSortEntries_).forEach(function (e) {
      if (!byJenis[e.jenis]) { byJenis[e.jenis] = { label: e.jenisLabel, names: [] }; order.push(e.jenis); }
      byJenis[e.jenis].names.push(e.userName + (e.catatan ? ' (' + String(e.catatan).replace(/\s+/g, ' ').trim() + ')' : ''));
    });
    order.forEach(function (j) { lines.push('• ' + byJenis[j].label + ': ' + byJenis[j].names.join(', ')); });
    lines.push('');
  });
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines.join('\n');
}

function jkCopyText_(text, done) {
  function legacy() {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(!!ok);
    } catch (e) { done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, legacy);
  } else { legacy(); }
}

var RICHTEXT_ALLOWED_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, A: 1, BR: 1 };

function sanitizeRichContentHtml_(html) {
  var template = document.createElement('template');
  template.innerHTML = html || '';

  var walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT, null);
  var toUnwrap = [];
  var node = walker.currentNode;
  while (node) {
    if (node.nodeType === 1) {
      var tag = node.tagName;
      if (!RICHTEXT_ALLOWED_TAGS[tag]) {
        toUnwrap.push(node);
      } else {
        Array.prototype.slice.call(node.attributes).forEach(function (attr) {
          if (tag === 'A' && attr.name === 'href') return;
          node.removeAttribute(attr.name);
        });
        if (tag === 'A') {
          var href = node.getAttribute('href') || '';
          if (!/^https?:\/\//i.test(href)) node.removeAttribute('href');
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        }
      }
    }
    node = walker.nextNode();
  }
  toUnwrap.forEach(function (el) {
    var parent = el.parentNode;
    while (el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
  });

  return template.innerHTML;
}

function wrapContentSelection_(tag) {
  var ta = document.getElementById('content-form-body');
  var start = ta.selectionStart, end = ta.selectionEnd;
  var value = ta.value;
  var selected = value.slice(start, end);
  var before = '<' + tag + '>';
  var after = '</' + tag + '>';
  ta.value = value.slice(0, start) + before + selected + after + value.slice(end);
  var cursor = start + before.length + selected.length + after.length;
  ta.focus();
  ta.setSelectionRange(cursor, cursor);
  updateContentPreview_();
}

function insertContentEmoji_(emoji) {
  var ta = document.getElementById('content-form-body');
  var start = ta.selectionStart, end = ta.selectionEnd;
  var value = ta.value;
  ta.value = value.slice(0, start) + emoji + value.slice(end);
  var cursor = start + emoji.length;
  ta.focus();
  ta.setSelectionRange(cursor, cursor);
  updateContentPreview_();
}

function openContentForm_(entry) {
  contentFormEditId = entry ? entry.contentId : null;
  document.getElementById('content-form-heading').textContent = entry ? 'Ubah Konten' : 'Tambah Konten';
  document.getElementById('content-form-type').value = entry ? entry.contentType : ((appBootstrap.contentTypeList || [])[0] || {}).value || '';
  document.getElementById('content-form-title').value = entry ? entry.title : '';
  document.getElementById('content-form-body').value = entry ? entry.content : '';
  updateContentPreview_();

  var scheduleMode = (entry && entry.scheduleRule) ? 'scheduled' : '';
  document.getElementById('content-form-schedule-mode').value = scheduleMode;
  document.getElementById('content-form-rule-group').style.display = scheduleMode === 'scheduled' ? 'block' : 'none';
  document.getElementById('content-form-rule-day').style.display = 'none';
  FaDatePicker.setVisible(document.getElementById('content-form-rule-date'), false);
  document.getElementById('content-form-rule-type').value = 'DAILY';
  if (scheduleMode === 'scheduled') {
    var rule = entry.scheduleRule;
    if (rule.indexOf('WEEKLY:') === 0) {
      document.getElementById('content-form-rule-type').value = 'WEEKLY';
      document.getElementById('content-form-rule-day').value = rule.split(':')[1];
      document.getElementById('content-form-rule-day').style.display = 'block';
    } else if (rule.indexOf('DATE:') === 0) {
      document.getElementById('content-form-rule-type').value = 'DATE';
      document.getElementById('content-form-rule-date').value = rule.split(':')[1];
      FaDatePicker.setVisible(document.getElementById('content-form-rule-date'), true);
    }
  }

  document.getElementById('content-form-start').value = entry ? entry.startDate : '';
  document.getElementById('content-form-end').value = entry ? entry.endDate : '';

  contentFormImage = (entry && entry.imageUrl) ? { previewUrl: entry.imageUrl, base64: null } : null;
  contentFormImageWasRemoved = false;
  renderContentImageSlot_();

  contentFormPdf = (entry && entry.pdfUrl) ? { fileName: 'Dokumen PDF (tersimpan)', base64: null } : null;
  contentFormPdfWasRemoved = false;
  renderContentPdfSlot_();

  document.getElementById('content-form-error').textContent = '';
  document.getElementById('content-link-input-row').style.display = 'none';
  document.getElementById('content-form-panel').style.display = 'block';

    x.innerHTML = mdIcon('close', 16);

}

function closeContentForm_() {

  document.getElementById('content-form-error').textContent = '';
}

function submitContentForm_() {
  var errorEl = document.getElementById('content-form-error');
  errorEl.textContent = '';

  var title = document.getElementById('content-form-title').value;
  var body = document.getElementById('content-form-body').value;
  var startDate = document.getElementById('content-form-start').value;
  var endDate = document.getElementById('content-form-end').value;

  if (!title.trim()) { errorEl.textContent = 'Judul wajib diisi.'; return; }
  if (!body.trim()) { errorEl.textContent = 'Isi konten wajib diisi.'; return; }
  if (!startDate) { errorEl.textContent = 'Tanggal mulai wajib diisi.'; return; }
  if (!endDate) { errorEl.textContent = 'Tanggal berakhir wajib diisi.'; return; }

  var data = {
    contentType: document.getElementById('content-form-type').value,
    title: title,
    content: body,
    scheduleRule: buildContentScheduleRule_(),
    startDate: startDate,
    endDate: endDate
  };

  if (contentFormImage && contentFormImage.base64) {
    data.image = { base64: contentFormImage.base64, mimeType: contentFormImage.mimeType };
  } else if (!contentFormImage && contentFormImageWasRemoved) {
    data.removeImage = true;
  }

  if (contentFormPdf && contentFormPdf.base64) {
    data.pdf = { base64: contentFormPdf.base64, mimeType: contentFormPdf.mimeType };
  } else if (!contentFormPdf && contentFormPdfWasRemoved) {
    data.removePdf = true;
  }

  var session = loadSession();
  var editId = contentFormEditId;
  var submitBtn = document.getElementById('btn-submit-content');
  beginAction(submitBtn, 'Menyimpan...');

  var call = google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      if (!response.success) { errorEl.textContent = response.error; showSnackbar(response.error, 'error'); return; }
      showSnackbar(editId ? 'Konten berhasil diubah.' : 'Konten berhasil ditambahkan.', 'success');
      closeContentForm_();
      pageDataCache.content = null; persistRemove_(['content']);
      loadContentAktif(true);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    });

  if (editId) {
    call.ubahContent(session.accessCode, editId, data);
  } else {
    call.buatContent(session.accessCode, data);
  }
}

function doHapusContent_(contentId) {
  var session = loadSession();

    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Konten berhasil dihapus.', 'success');
      pageDataCache.content = null; persistRemove_(['content']);
      loadContentAktif(true);
    })
    .withFailureHandler(function () {

    .hapusContent(session.accessCode, contentId);

function loadContentAktif(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.content;
  if (cached && !force) {
    renderContentBanner_(cached);
    if (appBootstrap.currentUser.role === 'admin') renderContentManagementList_(cached);
    return;
  }

  var gCont = reqGuard_();
  google.script.run
    .withSuccessHandler(function (response) {
      if (reqDead_(gCont)) return;
      if (!response.success) return;
      if (!reqStale_(gCont)) {
        pageDataCache.content = response.data.content;
        persistSet_('content', response.data.content);
      }
      renderContentBanner_(response.data.content);
      if (appBootstrap.currentUser.role === 'admin') renderContentManagementList_(response.data.content);
    })
    .withFailureHandler(function () {})
    .getContentAktif(session.accessCode);
}

var contentCarouselTimer_ = null;

/** Beranda: pengumuman tayang ditampilkan sebagai carousel (geser, panah, titik, autoplay 5 dtk). */
function renderContentBanner_(list) {
  var container = document.getElementById('content-banner-container');
  if (contentCarouselTimer_) { clearInterval(contentCarouselTimer_); contentCarouselTimer_ = null; }
  container.innerHTML = '';

  var items = (list || []).filter(function (c) { return c.status === 'tayang'; });
  if (items.length === 0) return;

  var wrap = document.createElement('div');
  wrap.className = 'cc-wrap';
  var viewport = document.createElement('div');
  viewport.className = 'cc-viewport';
  var track = document.createElement('div');
  track.className = 'cc-track';

  items.forEach(function (c) {
    var typeInfo = CONTENT_TYPE_BADGE[c.contentType] || { cls: 'badge-neutral', icon: 'description' };
    var tone = c.contentType === 'warning' ? 'red' : (c.contentType === 'information' ? 'lime' : 'blue');
    var slide = document.createElement('div');
    slide.className = 'cc-slide tone-' + tone + (c.contentType === 'warning' ? ' is-warning' : '');

    var head = document.createElement('div');
    head.className = 'cc-head';
    var iconBox = document.createElement('span');
    iconBox.className = 'cc-icon';
    iconBox.innerHTML = mdIcon(typeInfo.icon || 'description', 20);
    var badge = document.createElement('span');
    badge.className = 'cc-badge';
    badge.textContent = c.contentTypeLabel;
    head.appendChild(iconBox);
    head.appendChild(badge);
    slide.appendChild(head);

    var title = document.createElement('div');
    title.className = 'cc-title';
    title.textContent = c.title;
    slide.appendChild(title);

    var msg = document.createElement('div');
    msg.className = 'cc-message reminder-message';
    msg.innerHTML = sanitizeRichContentHtml_(c.content);
    slide.appendChild(msg);

    if (c.imageUrl) {
      var img = document.createElement('img');
      img.className = 'content-card-image';
      img.src = c.imageUrl;
      img.alt = c.title;
      img.addEventListener('click', function () { openPhotoViewer([c.imageUrl], 0); });
      slide.appendChild(img);
    }
    if (c.pdfUrl) {
      var link = document.createElement('a');
      link.className = 'content-card-pdf-link';
      link.href = c.pdfUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      link.innerHTML = mdIcon('description', 14) + '<span>Buka PDF</span>';
      slide.appendChild(link);
    }
    track.appendChild(slide);
  });
  viewport.appendChild(track);
  wrap.appendChild(viewport);

  var n = items.length, idx = 0;
  if (n > 1) {
    var prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'cc-nav cc-prev'; prev.setAttribute('aria-label', 'Sebelumnya');
    prev.innerHTML = mdIcon('chevronLeft', 18);
    var next = document.createElement('button');
    next.type = 'button'; next.className = 'cc-nav cc-next'; next.setAttribute('aria-label', 'Berikutnya');
    next.innerHTML = mdIcon('chevronRight', 18);
    var foot = document.createElement('div');
    foot.className = 'cc-foot';

    var dots = document.createElement('div');
    dots.className = 'cc-dots';
    items.forEach(function (_, i) {
      var d = document.createElement('button');
      d.type = 'button'; d.setAttribute('aria-label', 'Slide ' + (i + 1));
      d.addEventListener('click', function () { go(i, true); });
      dots.appendChild(d);
    });
    foot.appendChild(prev); foot.appendChild(dots); foot.appendChild(next);
    wrap.appendChild(foot);

    var go = function (i, user) {
      idx = (i + n) % n;
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
      Array.prototype.forEach.call(dots.children, function (d, k) { d.className = k === idx ? 'active' : ''; });
      if (user) restart();
    };
    var restart = function () {
      if (contentCarouselTimer_) clearInterval(contentCarouselTimer_);
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      contentCarouselTimer_ = setInterval(function () {
        if (!document.body.contains(wrap)) { clearInterval(contentCarouselTimer_); contentCarouselTimer_ = null; return; }
        if (touching) return;
        go(idx + 1);
      }, 5000);
    };
    prev.addEventListener('click', function () { go(idx - 1, true); });
    next.addEventListener('click', function () { go(idx + 1, true); });

    // Geser (swipe) di layar sentuh
    var sx = null, touching = false;
    viewport.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; touching = true; }, { passive: true });
    viewport.addEventListener('touchcancel', function () { touching = false; sx = null; }, { passive: true });
    viewport.addEventListener('touchend', function (e) {
      touching = false;
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1), true);
    });
    go(0);
    restart();
  }
  container.appendChild(wrap);
}

/** Potong teks ke maksimal `maxLen` karakter + "..." bila lebih panjang. */
function truncateText_(text, maxLen) {
  if (!text) return '';
  var str = String(text);
  return str.length > maxLen ? str.substring(0, maxLen) + '...' : str;
}

/** "17/07/2026 10:30" -> "Kamis, 17 Juli 2026 | 10:30". */
function formatDateTimeFull_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var parts = String(ddmmyyyyHHmm).split(' ');
  var dp = (parts[0] || '').split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  var out = INDO_DAY_NAMES_[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + ' ' + INDO_MONTH_LONG_[d.getMonth()] + ' ' + d.getFullYear();
  return parts[1] ? out + ' | ' + parts[1].substring(0, 5) : out;
}

/** "17/07/2026 10:30" -> "Kam, 17 Jul 2026". */
function formatAktivitasDateShort_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var datePart = String(ddmmyyyyHHmm).split(' ')[0];
  var dp = datePart.split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  return INDO_DAY_NAMES_[d.getDay()].substring(0, 3) + ', ' + dp[0] + ' ' + INDO_MONTH_SHORT_[d.getMonth()] + ' ' + dp[2];
}

/** Warna avatar inisial (stabil per nama). */
var LC_AVATAR_TONES_ = [['#e0e7ff', '#4338ca'], ['#ccfbf1', '#0f766e'], ['#fef3c7', '#b45309'], ['#ffe4e6', '#be123c'], ['#e0f2fe', '#0369a1'], ['#ede9fe', '#6d28d9']];
function lcAvatarTone_(name) {
  var h = 0, str = String(name || '');
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 997;
  return LC_AVATAR_TONES_[h % LC_AVATAR_TONES_.length];
}

/**
 * Galeri foto adaptif pada kartu: 0 = placeholder, 1 = lebar penuh, 2 = dua kolom, 3 = tiga kolom,
 * >3 = tiga thumbnail dengan "+N" pada thumbnail terakhir. Ketuk thumbnail membuka penampil foto.
 */
function buildLcGallery_(photos, urls) {
  var wrap = document.createElement('div');
  var n = photos.length;
  if (n === 0) {
    wrap.className = 'lc-gallery lc-gallery-empty';
    wrap.innerHTML = mdIcon('photo', 18) + '<span>Tidak ada lampiran foto</span>';
    return wrap;
  }
  var shown = Math.min(n, 3);
  wrap.className = 'lc-gallery lc-g' + shown;
  for (var i = 0; i < shown; i++) {
    (function (idx) {
      var cell = document.createElement('div');
      cell.className = 'lc-thumb';
      var img = document.createElement('img');
      img.src = photos[idx].thumbUrl || photos[idx].url;
      img.alt = 'Foto ' + (idx + 1);
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = function () { cell.classList.add('lc-broken'); img.style.display = 'none'; cell.insertAdjacentHTML('beforeend', mdIcon('photo', 22)); };
      cell.appendChild(img);
      if (idx === 2 && n > 3) {
        var more = document.createElement('div');
        more.className = 'lc-more';
        more.textContent = '+' + (n - 3);
        cell.appendChild(more);
      }
      cell.addEventListener('click', function (e) { e.stopPropagation(); openPhotoViewer(urls, idx); });
      wrap.appendChild(cell);
    })(i);
  }
  return wrap;
}

/**
 * Kartu daftar Pekerjaan (badge-pill+dot, tanggal, avatar+nama+
 * keterangan, thumbnail/placeholder+chevron) — SATU fungsi dipakai
 * BERSAMA oleh Aktivitas dan Riwayat.
 */
function buildPekerjaanListCard_(p, opts) {
  opts = opts || {};
  var jenisInfo = JENIS_PEKERJAAN_BADGE[p.jenis] || { label: p.jenis, cls: 'badge-neutral', icon: 'description' };
  var statusCls = STATUS_PEKERJAAN_BADGE_CLASS[p.status] || 'badge-neutral';

  var officer = (p.status === 'TERBUKA') ? p.createdByName : (p.handledByName || p.createdByName);
  var photos = pilihFotoKartu_(p);
  var floorText = p.zoneCode ? (p.floorName + ' · ' + p.zoneCode) : (p.floorName || '');

  var card = document.createElement('div');
  card.className = 'list-card list-card-row lc2';

  var main = document.createElement('div');
  main.className = 'list-card-row-main';

  var badgeRow = document.createElement('div');
  badgeRow.className = 'op-card-top';
  badgeRow.innerHTML =
    '<span class="badge-pill lc-jenis ' + jenisInfo.cls + '">' + mdIcon(jenisInfo.icon || 'description', 14) + '<span>' + jenisInfo.label + '</span></span>' +
    '<span class="badge badge-status-pulse ' + statusCls + '"><span class="dot pulse"></span>' + p.statusLabel + '</span>' +
    (p.assignmentMode === 'direct' && p.targetUserCode ? '<span class="badge badge-info">Direct \u2192 ' + escapeHtmlJk_(p.targetUserName || p.targetUserCode) + '</span>' : '');
  main.appendChild(badgeRow);

  // Arah Mandiri: utamakan performedAt (kapan pekerjaan BENAR-BENAR dilakukan).
  var displayDate = (p.arah === 'mandiri' && p.performedAt) ? p.performedAt : (p.completedAt || p.startedAt || p.createdAt);
  var dtParts = String(formatDateTimeFull_(displayDate) || '').split(' | ');

  // Petugas (kiri) dan tanggal/jam (kanan) dalam satu baris -> kartu lebih ringkas.
  var whoRow = document.createElement('div');
  whoRow.className = 'lc-who';
  var tone = lcAvatarTone_(officer);
  var dateShort = escapeHtmlJk_(formatAktivitasDateShort_(displayDate) || dtParts[0] || '');
  var timeText = dtParts[1] ? escapeHtmlJk_(dtParts[1]) + ' WIB' : '';
  whoRow.innerHTML =
    '<div class="lc-person">' +
      '<span class="lc-avatar" style="background:' + tone[0] + ';color:' + tone[1] + ';">' + escapeHtmlJk_(String(officer || '?').trim().charAt(0).toUpperCase() || '?') + '</span>' +
      '<div class="lc-who-text"><span class="lc-name">' + escapeHtmlJk_(officer || '') + '</span>' +
      (floorText ? '<span class="lc-floor">' + mdIcon('location', 13) + '<span>' + escapeHtmlJk_(floorText) + '</span></span>' : '') + '</div>' +
    '</div>' +
    '<div class="lc-when" title="' + escapeHtmlJk_(dtParts[0] || '') + '"><span class="lc-date">' + dateShort + '</span>' + (timeText ? '<span class="lc-time">' + timeText + '</span>' : '') + '</div>';
  main.appendChild(whoRow);

  var descText = p.completionNotes || p.description || '';
  if (descText) {
    var desc = document.createElement('p');
    desc.className = 'lc-desc';
    desc.textContent = descText;
    main.appendChild(desc);
  }

  var photoUrls = photos.map(function (photo) { return photo.url; });
  main.appendChild(buildLcGallery_(photos, photoUrls));

  var foot = document.createElement('div');
  foot.className = 'lc-foot';
  var commentText = p.commentCount > 0 ? (p.commentCount + ' Komentar') : 'Belum ada komentar';
  foot.innerHTML =
    '<div class="lc-foot-info"><span>' + (photos.length > 0 ? (photos.length + ' Foto Lampiran') : 'Tanpa Foto') + '</span>' +
    '<span class="lc-bar">|</span><span class="lc-comment">' + mdIcon('chatBubble', 14) + '<span>' + commentText + '</span></span></div>' +
    '<span class="lc-detail">Lihat Detail' + mdIcon('chevronRight', 16) + '</span>';
  main.appendChild(foot);

  var pendingActions = null;
  if (opts.actions && typeof buildPekerjaanActionRow_ === 'function') {
    var actionsRow = buildPekerjaanActionRow_(p, opts);
    if (actionsRow) pendingActions = actionsRow;
  }

  card.appendChild(main);
  if (pendingActions) { card.classList.add('has-actions'); card.appendChild(pendingActions); }

  card.addEventListener('click', function () { openPekerjaanDetail(p, { actions: !!opts.actions }); });
  return card;
}

</script>
<script>
// ============================================================
// RUANG DISKUSI — chat grup sederhana (chat.gs). Build First, Harden Later:
// polling 8 dtk hanya saat modal terbuka & tab terlihat; cek "pesan baru"
// ringan tiap 90 dtk di luar modal (balasan kecil lewat sinceTs).
// ============================================================
(function () {
  var card = document.getElementById('chat-card');
  var overlay = document.getElementById('chat-overlay');
  if (!card || !overlay) return;
  var listEl = document.getElementById('chat-list');
  var inputEl = document.getElementById('chat-input');
  var sendBtn = document.getElementById('chat-send');
  var noteEl = document.getElementById('chat-note');
  var composeEl = document.getElementById('chat-compose');
  var dotEl = document.getElementById('chat-unread');
  var SEEN_KEY = 'fa_chat_seen_ts';
  var POLL_OPEN_MS = 8000, POLL_IDLE_MS = 90000;
  var lastTs = 0, hasRender = false, inFlight = false, pollTimer = null, idleTimer = null, sending = false;

  document.getElementById('chat-card-icon').innerHTML = mdIcon('forum', 22);
  document.getElementById('chat-head-ico').innerHTML = mdIcon('forum', 22);
  document.getElementById('chat-close').innerHTML = mdIcon('close', 18);
  document.getElementById('chat-card-go').innerHTML = mdIcon('chevronRight', 22);
  sendBtn.innerHTML = mdIcon('send', 20);

  function seenTs_() { try { return Number(localStorage.getItem(SEEN_KEY)) || 0; } catch (e) { return 0; } }
  function markSeen_(ts) { try { if (ts) localStorage.setItem(SEEN_KEY, String(ts)); } catch (e) {} dotEl.style.display = 'none'; }
  function isOpen_() { return overlay.classList.contains('show'); }
  function ac_() { var s = loadSession(); return s && s.accessCode; }

  function fmtTime_(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function dayKey_(ts) { var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel_(ts) {
    var d = new Date(ts), n = new Date();
    if (dayKey_(ts) === dayKey_(n.getTime())) return 'Hari ini';
    if (dayKey_(ts) === dayKey_(n.getTime() - 86400000)) return 'Kemarin';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  function render_(msgs, forceBottom) {
    var nearBottom = (listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight) < 80;
    listEl.textContent = '';
    if (!msgs.length) {
      var em = document.createElement('div'); em.className = 'chat-empty'; em.textContent = 'Belum ada pesan. Mulai percakapan!';
      listEl.appendChild(em);
    }
    var prevDay = '';
    msgs.forEach(function (m) {
      var dk = dayKey_(m.ts);
      if (dk !== prevDay) {
        prevDay = dk;
        var dl = document.createElement('div'); dl.className = 'chat-day'; dl.textContent = dayLabel_(m.ts); listEl.appendChild(dl);
      }
      var row = document.createElement('div'); row.className = 'chat-msg' + (m.mine ? ' mine' : '');
      if (!m.mine) { var nm = document.createElement('span'); nm.className = 'chat-name'; nm.textContent = m.name || m.userCode; row.appendChild(nm); }
      var b = document.createElement('div'); b.className = 'chat-bubble'; b.textContent = m.text; row.appendChild(b);
      var t = document.createElement('span'); t.className = 'chat-time'; t.textContent = fmtTime_(m.ts); row.appendChild(t);
      listEl.appendChild(row);
    });
    if (forceBottom || nearBottom || !hasRender) listEl.scrollTop = listEl.scrollHeight;
    hasRender = true;
  }

  function applyCanSend_(can) {
    composeEl.style.display = can ? 'flex' : 'none';
    noteEl.textContent = can ? '' : 'Akun Demo hanya dapat membaca.';
  }

  function handle_(res, forceBottom) {
    if (!res || !res.success) return false;
    var d = res.data;
    applyCanSend_(d.canSend);
    if (d.changed) { render_(d.messages || [], forceBottom); }
    lastTs = d.lastTs || lastTs;
    if (isOpen_()) markSeen_(lastTs);
    return true;
  }

  function fetch_(forceBottom) {
    var ac = ac_(); if (!ac || inFlight) return;
    inFlight = true;
    google.script.run
      .withSuccessHandler(function (res) { inFlight = false; handle_(res, forceBottom); })
      .withFailureHandler(function () { inFlight = false; })
      .getGroupChatMessages(ac, hasRender ? lastTs : null);
  }

  function schedulePoll_() {
    clearTimeout(pollTimer);
    if (!isOpen_()) return;
    pollTimer = setTimeout(function () {
      if (document.visibilityState === 'visible') fetch_(false);
      schedulePoll_();
    }, POLL_OPEN_MS);
  }

  function open_() {
    if (!ac_()) return;
    overlay.classList.add('show');
    hasRender = false; // render penuh saat dibuka
    listEl.textContent = '';
    var l = document.createElement('div'); l.className = 'chat-empty'; l.textContent = 'Memuat...'; listEl.appendChild(l);
    fetch_(true); schedulePoll_();
  }
  function close_() {
    overlay.classList.remove('show');
    clearTimeout(pollTimer);
    markSeen_(lastTs);
  }

  function send_() {
    if (sending) return;
    var text = inputEl.value.trim();
    if (!text) return;
    var ac = ac_(); if (!ac) return;
    sending = true; sendBtn.disabled = true; noteEl.textContent = '';
    google.script.run
      .withSuccessHandler(function (res) {
        sending = false; sendBtn.disabled = false;
        if (res && res.success) { inputEl.value = ''; handle_(res, true); inputEl.focus(); }
        else noteEl.textContent = (res && res.error) || 'Gagal mengirim pesan.';
      })
      .withFailureHandler(function () { sending = false; sendBtn.disabled = false; noteEl.textContent = 'Gagal mengirim pesan. Periksa koneksi.'; })
      .sendGroupChatMessage(ac, text);
  }

  // Titik merah "pesan baru" (ringan; hanya saat terlihat dan sudah login).
  function idleCheck_() {
    if (isOpen_() || document.visibilityState !== 'visible') return;
    var ac = ac_(); if (!ac) return;
    try { idleCall_(ac); } catch (e) {}
  }
  function idleCall_(ac) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || isOpen_()) return;
        var d = res.data;
        if (d.lastTs) { lastTs = d.lastTs; }
        var seen = seenTs_();
        if (!seen && d.lastTs) { /* pengguna baru: jangan tandai merah untuk riwayat lama */ markSeen_(d.lastTs); return; }
        dotEl.style.display = (d.lastTs && d.lastTs > seen) ? '' : 'none';
      })
      .withFailureHandler(function () {})
      .getGroupChatMessages(ac, seenTs_() || null);
  }
  setTimeout(idleCheck_, 3500);
  idleTimer = setInterval(idleCheck_, POLL_IDLE_MS);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (isOpen_()) { fetch_(false); schedulePoll_(); } else idleCheck_();
  });

  card.addEventListener('click', open_);
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open_(); } });
  document.getElementById('chat-close').addEventListener('click', close_);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close_(); });
  sendBtn.addEventListener('click', send_);
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send_(); } });
})();
</script>
