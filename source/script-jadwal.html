<script>
// ============================================================
// RIWAYAT — Arsip Pribadi Pekerjaan (Tahap 4 Cutover, pengganti
// Riwayat Laporan lama; Filter & Unduh PDF DIPINDAH ke Aktivitas)
// ============================================================

var riwayatReqSeq_ = 0;

function currentRiwayatQuery_() { return (document.getElementById('reports-search').value || '').trim(); }

function applyRiwayatSearchAndRender() { loadRiwayatPekerjaan(); }

document.getElementById('reports-search').addEventListener('input', debounce_(applyRiwayatSearchAndRender, 350));

function loadRiwayatPekerjaan(force) {
  var session = loadSession();
  if (!session) return;

  var titleEl = document.getElementById('reports-card-title');
  if (titleEl && appBootstrap) {
    var role = appBootstrap.currentUser.role;
    if (role === 'demo') {
      titleEl.textContent = 'Riwayat Pekerjaan (Semua)';
    } else if (role === 'admin') {
      titleEl.textContent = 'Riwayat Penugasan Saya';
    } else {
      titleEl.textContent = 'Riwayat Pekerjaan Saya';
    }
  }

  var q = currentRiwayatQuery_();
  var cacheKey = q.toLowerCase();
  var container = document.getElementById('my-reports-list');
  var cached = pageDataCache.pekerjaanRiwayatByKey[cacheKey];

  if (!cached && !force && cacheKey === '') {
    var pc = persistGet_('riwayat');
    if (pc) {
      cached = { list: pc.list, total: pc.total, hasMore: pc.hasMore, t: 0 };
      pageDataCache.pekerjaanRiwayatByKey[cacheKey] = cached;
    }
  }

  var fresh = cached && (Date.now() - (cached.t || 0)) < FEED_FRESH_MS_;
  if (cached && !force && fresh) { renderRiwayatFeed_(cached, q, cacheKey); return; }

  var alreadyShown = cached && container.dataset.feedKey === cacheKey;
  if (cached && !alreadyShown) renderRiwayatFeed_(cached, q, cacheKey);
  else if (!cached) renderListSkeleton_('my-reports-list', 3, q ? 'Mencari riwayat...' : 'Memuat riwayat pekerjaan...');

  var seq = ++riwayatReqSeq_;
  fetchFeedPage_({ view: 'riwayat', q: q, limit: FEED_PAGE_SIZE_, offset: 0 }, function (data) {
    if (seq !== riwayatReqSeq_) return;
    if (cacheKey === '') persistSet_('riwayat', { list: data.pekerjaan, total: data.total, hasMore: data.hasMore });
    if (cached && container.dataset.feedKey === cacheKey &&
        sameFeedList_(cached.list.slice(0, data.pekerjaan.length), data.pekerjaan) && cached.total === data.total) {
      cached.t = Date.now();
      return;
    }
    var entry = { list: data.pekerjaan, total: data.total, hasMore: data.hasMore, t: Date.now() };
    pageDataCache.pekerjaanRiwayatByKey[cacheKey] = entry;
    renderRiwayatFeed_(entry, q, cacheKey);
  }, function (err) {
    if (seq !== riwayatReqSeq_ || cached) return;
    renderLoadError_(container, 'riwayat', function () { loadRiwayatPekerjaan(true); }, err);
  });
}

function renderRiwayatFeed_(entry, q, cacheKey) {
  document.getElementById('my-reports-list').dataset.feedKey = cacheKey;
  var empty = q
    ? '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('description', 26) + '</div>Tidak ada riwayat yang cocok.</div>'
    : '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('description', 26) + '</div>Belum ada riwayat pekerjaan.<br>' +
      '<button class="btn-primary" id="empty-state-buat-pekerjaan">Buat Pekerjaan Sekarang</button></div>';
  // Kartu Riwayat memakai fungsi yang SAMA PERSIS dengan Aktivitas
  // (buildPekerjaanListCard_) supaya identik by construction.
  renderFeedList_(document.getElementById('my-reports-list'), entry, empty, function (done, fail) {
    fetchFeedPage_({ view: 'riwayat', q: q, limit: FEED_PAGE_SIZE_, offset: entry.list.length }, function (data) {
      if (pageDataCache.pekerjaanRiwayatByKey[cacheKey] !== entry) { return; }
      entry.list = entry.list.concat(data.pekerjaan);
      entry.total = data.total;
      entry.hasMore = data.hasMore;
      done(data.pekerjaan);
    }, fail);
  });
  var ctaBtn = document.getElementById('empty-state-buat-pekerjaan');
  if (ctaBtn) ctaBtn.addEventListener('click', function () { goToPage('buat'); });
}

// ============================================================
// JADWAL PIKET (Collaborative Schedule) — Patch 10.x Bagian 2
// ============================================================

var JK_PURPLE_ = { bg: 'var(--status-info-bg)', fg: 'var(--status-info-fg)' };
var JK_RED_ = { bg: 'var(--status-alert-bg)', fg: 'var(--status-alert-fg)' };
var JK_GREEN_ = { bg: 'var(--status-completed-bg)', fg: 'var(--status-completed-fg)' };
var JADWAL_JENIS_COLOR = {
  piket_sabtu: JK_PURPLE_, piket_minggu: JK_PURPLE_, piket_libur_nasional: JK_PURPLE_, tugas_khusus: JK_PURPLE_,
  libur_pengganti: JK_GREEN_,
  cuti: JK_RED_, izin: JK_RED_, sakit: JK_RED_, alpa: JK_RED_
};
// Kubu pada form: PIKET vs ABSEN (Libur Pengganti ikut kubu ABSEN)
var JK_PIKET_JENIS_ = ['piket_sabtu', 'piket_minggu', 'piket_libur_nasional', 'tugas_khusus'];
function jkKubuOfJenis_(jenis) { return JK_PIKET_JENIS_.indexOf(jenis) !== -1 || String(jenis).indexOf('piket') === 0 ? 'piket' : 'absen'; }
var INDO_MONTH_LONG_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
/** "2026-10-20" -> "Selasa, 20 Oktober 2026". */
function formatJadwalDateFull_(dateStr) {
  var parts = (dateStr || '').split('-');
  if (parts.length !== 3) return dateStr || '';
  var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  return INDO_DAY_NAMES_[d.getDay()] + ', ' + d.getDate() + ' ' + INDO_MONTH_LONG_[d.getMonth()] + ' ' + d.getFullYear();
}

var INDO_DAY_NAMES_ = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
var INDO_MONTH_SHORT_ = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

/**
 * Memecah sebuah Date menjadi komponen kalender/jam SECARA EKSPLISIT
 * dalam 'Asia/Jakarta' (lewat Intl.DateTimeFormat, bukan getter lokal),
 * dipakai SATU SUMBER KEBENARAN oleh seluruh fungsi format tanggal/waktu
 * ISO di frontend — konsisten dengan APP_TIMEZONE backend, apa pun
 * timezone perangkat pengguna.
 */
function getJakartaDateParts_(date) {
  var formatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jakarta',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false,
    weekday: 'short'
  });
  var map = {};
  formatter.formatToParts(date).forEach(function (p) {
    if (p.type !== 'literal') map[p.type] = p.value;
  });
  var hour = map.hour === '24' ? '00' : map.hour;
  var jsWeekdayIndex = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(map.weekday);
  return {
    year: map.year,
    monthIndex: parseInt(map.month, 10) - 1,
    day: map.day,
    hour: hour,
    minute: map.minute,
    dayOfWeekIndex: jsWeekdayIndex !== -1 ? jsWeekdayIndex : new Date(date).getDay()
  };
}

/** 'YYYY-MM-DD' -> "Minggu, 26 Jul 2026" (parse manual, hindari geser
 * zona waktu). */
function formatJadwalDateLong_(dateStr) {
  var parts = (dateStr || '').split('-');
  if (parts.length !== 3) return dateStr || '';
  var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  var dayName = INDO_DAY_NAMES_[d.getDay()];
  return dayName + ', ' + String(d.getDate()).padStart(2, '0') + ' ' + INDO_MONTH_SHORT_[d.getMonth()] + ' ' + d.getFullYear();
}

/** ISO timestamp -> "17 Jul 2026, 10:30" DALAM ZONA WAKTU Asia/Jakarta. */
function formatJadwalTimestamp_(isoString) {
  if (!isoString) return '';
  var d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  var parts = getJakartaDateParts_(d);
  return parts.day + ' ' + INDO_MONTH_SHORT_[parts.monthIndex] + ' ' + parts.year + ', ' + parts.hour + ':' + parts.minute;
}

var jadwalFormEditId = null; // null = mode tambah; terisi = mode ubah
var jadwalFormListenersAttached = false;

function initJadwalPiketSection() {
  if (!appBootstrap) return;
  var role = appBootstrap.currentUser.role;
  var isDemo = role === 'demo';
  var isAdmin = role === 'admin';

  document.getElementById('btn-toggle-jadwal-form').style.display = isDemo ? 'none' : 'flex';
  document.getElementById('btn-jadwal-piket-audit').style.display = isAdmin ? 'flex' : 'none';

  if (!jadwalFormListenersAttached) {
    jadwalFormListenersAttached = true;

    var jenisSelect = document.getElementById('jadwal-form-jenis');
    (appBootstrap.jadwalJenisList || []).forEach(function (j) {
      var opt = document.createElement('option');
      opt.value = j.value;
      opt.textContent = j.label;
      jenisSelect.appendChild(opt);
    });

    var userSelect = document.getElementById('jadwal-form-user');
    (appBootstrap.master.fsUsers || []).forEach(function (u) {
      var opt = document.createElement('option');
      opt.value = u.userCode;
      opt.textContent = u.displayName;
      userSelect.appendChild(opt);
    });
  }

  // Opsi "saya sendiri" (mis. Administrator yang bukan anggota daftar FS)
  var me = appBootstrap.currentUser;
  var uSel = document.getElementById('jadwal-form-user');
  var hasMe = Array.prototype.some.call(uSel.options, function (o) { return o.value === me.userCode; });
  if (!hasMe) {
    var meOpt = document.createElement('option');
    meOpt.value = me.userCode;
    meOpt.textContent = me.displayName;
    uSel.appendChild(meOpt);
  }
  jkSyncLabels_();
  loadJadwalAktif();
}

document.getElementById('btn-toggle-jadwal-form').addEventListener('click', function () {
  openJadwalForm(null);
});

document.getElementById('btn-cancel-jadwal-form').addEventListener('click', function () {
  closeJadwalForm();
});

// ---- Modal tengah (Jadwal Kolaborasi) ----
function jkShow_(id) { document.getElementById(id).classList.add('show'); }
function jkHide_(id) { document.getElementById(id).classList.remove('show'); }

function jkInitIcons_() {
  var nodes = document.querySelectorAll('.jk-overlay [data-jk-close]');
  for (var i = 0; i < nodes.length; i++) nodes[i].innerHTML = mdIcon('close', 16);
  var arrows = document.querySelectorAll('.jk-arrow');
  for (var j = 0; j < arrows.length; j++) arrows[j].innerHTML = mdIcon('chevronDown', 16);
  document.getElementById('jk-detail-overlay').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-jk-close]')) jkHide_('jk-detail-overlay');
  });
  document.getElementById('jk-form-overlay').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-jk-close]')) closeJadwalForm();
  });
  document.getElementById('jk-picker-overlay').addEventListener('click', function (e) {
    if (e.target === this || e.target.closest('[data-jk-close]')) jkHide_('jk-picker-overlay');
  });
}
jkInitIcons_();

var jkKubuJenis = 'piket';
var jkKubuPetugas = 'saya';

function jkMe_() { return appBootstrap.currentUser; }

function jkSyncLabels_() {
  var js = document.getElementById('jadwal-form-jenis');
  var us = document.getElementById('jadwal-form-user');
  var jl = document.getElementById('jk-jenis-label');
  var ul = document.getElementById('jk-user-label');
  jl.textContent = js.selectedIndex >= 0 && js.options[js.selectedIndex] ? js.options[js.selectedIndex].textContent : 'Pilih jenis';
  var hasUser = !!us.value;
  ul.textContent = hasUser ? us.options[us.selectedIndex].textContent + (jkKubuPetugas === 'saya' ? ' (Saya)' : '') : 'Pilih petugas';
  ul.classList.toggle('is-placeholder', !hasUser);
  var d = document.getElementById('jadwal-form-date').value;
  var dt = document.getElementById('jk-date-text');
  dt.textContent = d ? formatJadwalDateFull_(d) : 'Pilih tanggal';
  dt.classList.toggle('is-placeholder', !d);
  // tombol kubu
  document.getElementById('jk-kubu-piket').classList.toggle('active', jkKubuJenis === 'piket');
  document.getElementById('jk-kubu-absen').classList.toggle('active', jkKubuJenis === 'absen');
  document.getElementById('jk-kubu-saya').classList.toggle('active', jkKubuPetugas === 'saya');
  document.getElementById('jk-kubu-lain').classList.toggle('active', jkKubuPetugas === 'lain');
  var ou = document.getElementById('jk-open-user');
  ou.classList.toggle('is-locked', jkKubuPetugas === 'saya');
  ou.dataset.kubu = jkKubuPetugas;
  document.getElementById('jk-open-jenis').dataset.kubu = jkKubuJenis;
}

function jkSetKubuJenis_(k) {
  jkKubuJenis = k;
  var sel = document.getElementById('jadwal-form-jenis');
  var all = (appBootstrap.jadwalJenisList || []).filter(function (j) { return jkKubuOfJenis_(j.value) === k; });
  if (all.length && !all.some(function (j) { return j.value === sel.value; })) sel.value = all[0].value;
  jkSyncLabels_();
}

function jkSetKubuPetugas_(k) {
  jkKubuPetugas = k;
  var us = document.getElementById('jadwal-form-user');
  if (k === 'saya') us.value = jkMe_().userCode;
  else if (us.value === jkMe_().userCode) us.value = '';
  us.dispatchEvent(new Event('change', { bubbles: true }));
  jkSyncLabels_();
}

/** Pemilih bergaya modal tengah; select asli tetap menjadi sumber nilai. */
function jkOpenPicker_(selectId, title) {
  var sel = document.getElementById(selectId);
  if (selectId === 'jadwal-form-jenis') title = jkKubuJenis === 'piket' ? 'PILIH JADWAL PIKET' : 'PILIH JADWAL KETIDAKHADIRAN';
  document.getElementById('jk-picker-title').textContent = title;
  var list = document.getElementById('jk-picker-list');
  list.innerHTML = '';
  list.className = 'jk-picker-list' + (selectId === 'jadwal-form-jenis' && jkKubuJenis === 'absen' ? ' theme-rose' : '');
  Array.prototype.forEach.call(sel.options, function (opt) {
    if (!opt.value) return;
    if (selectId === 'jadwal-form-jenis' && jkKubuOfJenis_(opt.value) !== jkKubuJenis) return;
    if (selectId === 'jadwal-form-user' && opt.value === jkMe_().userCode) return;
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'jk-picker-item' + (opt.value === sel.value ? ' selected' : '');
    var label = document.createElement('span');
    label.textContent = opt.textContent;
    var radio = document.createElement('span');
    radio.className = 'jk-radio';
    item.appendChild(label);
    item.appendChild(radio);
    item.addEventListener('click', function () {
      sel.value = opt.value;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      jkSyncLabels_();
      jkHide_('jk-picker-overlay');
    });
    list.appendChild(item);
  });
  jkShow_('jk-picker-overlay');
}

document.getElementById('jk-kubu-piket').addEventListener('click', function () { jkSetKubuJenis_('piket'); });
document.getElementById('jk-kubu-absen').addEventListener('click', function () { jkSetKubuJenis_('absen'); });
document.getElementById('jk-kubu-saya').addEventListener('click', function () { jkSetKubuPetugas_('saya'); });
document.getElementById('jk-kubu-lain').addEventListener('click', function () { jkSetKubuPetugas_('lain'); });
document.getElementById('jadwal-form-date').addEventListener('input', jkSyncLabels_);
document.getElementById('jadwal-form-date').addEventListener('click', function () {
  try { if (this.showPicker) this.showPicker(); } catch (e) {}
});
document.getElementById('jk-date-ico').innerHTML = mdIcon('calendar', 16);

document.getElementById('jk-open-jenis').addEventListener('click', function () { jkOpenPicker_('jadwal-form-jenis', 'Pilih Jenis Jadwal'); });
document.getElementById('jk-open-user').addEventListener('click', function () { if (jkKubuPetugas === 'lain') jkOpenPicker_('jadwal-form-user', 'Pilih Petugas Lain'); });

function jkSetErr_(inputEl, errId, msg) {
  inputEl.classList.add('field-invalid');
  document.getElementById(errId).textContent = msg;
}
function jkClearErrs_() {
  ['jk-date-wrap', 'jk-open-user'].forEach(function (id) { document.getElementById(id).classList.remove('field-invalid'); });
  document.getElementById('jadwal-err-date').textContent = '';
  document.getElementById('jadwal-err-user').textContent = '';
}
document.getElementById('jadwal-form-date').addEventListener('input', function () {
  document.getElementById('jk-date-wrap').classList.remove('field-invalid');
  document.getElementById('jadwal-err-date').textContent = '';
});
document.getElementById('jadwal-form-user').addEventListener('change', function () {
  document.getElementById('jk-open-user').classList.remove('field-invalid');
  document.getElementById('jadwal-err-user').textContent = '';
});

function openJadwalForm(entry) {
  jadwalFormEditId = entry ? entry.jadwalId : null;
  document.getElementById('jadwal-form-heading').textContent = entry ? 'Ubah Jadwal' : 'Tambah Jadwal';
  document.getElementById('jadwal-form-date').value = entry ? entry.tanggal : todayDateStr_();
  var jenisVal = entry ? entry.jenis : JK_PIKET_JENIS_[0];
  document.getElementById('jadwal-form-jenis').value = jenisVal;
  jkKubuJenis = jkKubuOfJenis_(jenisVal);
  var isSelf = !entry || entry.userCode === jkMe_().userCode;
  jkKubuPetugas = isSelf ? 'saya' : 'lain';
  document.getElementById('jadwal-form-user').value = isSelf ? jkMe_().userCode : entry.userCode;
  document.getElementById('jadwal-form-notes').value = entry ? entry.catatan : '';
  document.getElementById('jadwal-form-error').textContent = '';
  jkClearErrs_();
  jkSyncLabels_();
  jkShow_('jk-form-overlay');
}

function closeJadwalForm() {
  jadwalFormEditId = null;
  jkHide_('jk-picker-overlay');
  jkHide_('jk-form-overlay');
  document.getElementById('jadwal-form-error').textContent = '';
}

document.getElementById('btn-submit-jadwal').addEventListener('click', function () {
  var errorEl = document.getElementById('jadwal-form-error');
  errorEl.textContent = '';

  var data = {
    tanggal: document.getElementById('jadwal-form-date').value,
    jenis: document.getElementById('jadwal-form-jenis').value,
    userCode: document.getElementById('jadwal-form-user').value,
    catatan: document.getElementById('jadwal-form-notes').value
  };

  jkClearErrs_();
  var bad = false;
  if (!data.tanggal) { jkSetErr_(document.getElementById('jk-date-wrap'), 'jadwal-err-date', 'Tanggal wajib diisi.'); bad = true; }
  if (!data.userCode) { jkSetErr_(document.getElementById('jk-open-user'), 'jadwal-err-user', 'Petugas wajib dipilih.'); bad = true; }
  if (bad) return;

  var session = loadSession();
  var editId = jadwalFormEditId;
  var submitBtn = document.getElementById('btn-submit-jadwal');
  beginAction(submitBtn, 'Menyimpan...');

  var call = google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      if (!response.success) { errorEl.textContent = response.error; showSnackbar(response.error, 'error'); return; }
      showSnackbar(editId ? 'Jadwal berhasil diubah.' : 'Jadwal berhasil ditambahkan.', 'success');
      closeJadwalForm();
      pageDataCache.jadwalAktif = null;
      loadJadwalAktif(true);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    });

  if (editId) {
    call.ubahJadwal(session.accessCode, editId, data);
  } else {
    call.buatJadwal(session.accessCode, data);
  }
});


function confirmHapusJadwal(jadwalId) {
  showConfirmModal('Hapus entri jadwal ini?', function () {
    doHapusJadwal(jadwalId);
  }, 'delete', true, 'Menghapus...');
}

function doHapusJadwal(jadwalId) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Jadwal berhasil dihapus.', 'success');
      pageDataCache.jadwalAktif = null;
      loadJadwalAktif(true);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal menghapus jadwal. Coba lagi.', 'error');
    })
    .hapusJadwal(session.accessCode, jadwalId);
}

function loadJadwalAktif(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.jadwalAktif;
  if (cached && !force) {
    renderJadwalPiket_(cached);
    return;
  }

  if (!cached) {
    document.getElementById('jadwal-piket-summary').innerHTML = '<div class="inline-loading"><span class="spinner-sm"></span>Memuat jadwal...</div>';
  }

  google.script.run
    .withSuccessHandler(function (response) {
      if (!response.success) {
        if (!cached) document.getElementById('jadwal-piket-summary').textContent = response.error;
        return;
      }
      pageDataCache.jadwalAktif = response.data.jadwal;
      renderJadwalPiket_(response.data.jadwal);
    })
    .withFailureHandler(function () {
      if (!cached) document.getElementById('jadwal-piket-summary').textContent = 'Gagal memuat jadwal.';
    })
    .getJadwalAktif(session.accessCode);
}

function filterJadwalDalamJendela_(list) {
  var today = todayDateStr_();
  var windowDays = (appBootstrap && appBootstrap.scheduleDisplayWindowDays) || 21;
  var end = new Date();
  end.setDate(end.getDate() + windowDays);
  var endStr = end.getFullYear() + '-' + String(end.getMonth() + 1).padStart(2, '0') + '-' + String(end.getDate()).padStart(2, '0');
  return (list || []).filter(function (e) { return e.tanggal >= today && e.tanggal <= endStr; });
}

function renderJadwalPiket_(fullList) {
  var inWindow = filterJadwalDalamJendela_(fullList);
  var windowDays = (appBootstrap && appBootstrap.scheduleDisplayWindowDays) || 21;
  var windowWeeks = Math.round(windowDays / 7);

  var counts = { piket: 0, absen: 0, libur: 0 };
  inWindow.forEach(function (e) {
    if (e.jenis === 'libur_pengganti') counts.libur++;
    else if (jkKubuOfJenis_(e.jenis) === 'piket') counts.piket++;
    else counts.absen++;
  });

  document.getElementById('jadwal-piket-summary').innerHTML =
    '<div class="jk-info">' +
      '<span>' + mdIcon('reminder', 16) + windowWeeks + ' minggu ke depan</span>' +
      '<span>' + mdIcon('description', 16) + inWindow.length + ' jadwal aktif</span>' +
    '</div>';

  renderJadwalTable_(inWindow, counts);
}

function renderJadwalTable_(list, counts) {
  var container = document.getElementById('jadwal-piket-table');
  container.innerHTML = '';
  var emptyEl = document.getElementById('jadwal-piket-empty');

  if (!list || list.length === 0) {
    container.style.display = 'none';

}

var RICHTEXT_ALLOWED_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, A: 1, BR: 1 };

function sanitizeRichContentHtml_(html) {
  var template = document.createElement('template');
  template.innerHTML = html || '';

  var walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT, null);
  var toUnwrap = [];
  var node = walker.currentNode;
  while (node) {
    if (node.nodeType === 1) {
      var tag = node.tagName;
      if (!RICHTEXT_ALLOWED_TAGS[tag]) {
        toUnwrap.push(node);
      } else {
        Array.prototype.slice.call(node.attributes).forEach(function (attr) {
          if (tag === 'A' && attr.name === 'href') return;
          node.removeAttribute(attr.name);
        });
        if (tag === 'A') {
          var href = node.getAttribute('href') || '';
          if (!/^https?:\/\//i.test(href)) node.removeAttribute('href');
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        }
      }
    }
    node = walker.nextNode();
  }
  toUnwrap.forEach(function (el) {
    var parent = el.parentNode;
    while (el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
  });

  return template.innerHTML;
}

function attachContentFormListenersOnce_() {

  });

    document.getElementById('content-form-rule-date').style.display = this.value === 'DATE' ? 'block' : 'none';
  });

      contentFormImageWasRemoved = false;
      renderContentImageSlot_();
    }).catch(function () {
      endAction(null);
      showSnackbar('Gagal memproses gambar. Coba lagi.', 'error');

    if (file.type !== 'application/pdf') { showSnackbar('File harus berformat PDF.', 'error'); return; }

      contentFormPdfWasRemoved = false;
      renderContentPdfSlot_();

    reader.onerror = function () { showSnackbar('Gagal membaca file PDF.', 'error'); };
    reader.readAsDataURL(file);

function wrapContentSelection_(tag) {
  var ta = document.getElementById('content-form-body');
  var start = ta.selectionStart, end = ta.selectionEnd;
  var value = ta.value;
  var selected = value.slice(start, end);
  var before = '<' + tag + '>';
  var after = '</' + tag + '>';
  ta.value = value.slice(0, start) + before + selected + after + value.slice(end);
  var cursor = start + before.length + selected.length + after.length;
  ta.focus();
  ta.setSelectionRange(cursor, cursor);
  updateContentPreview_();
}

function insertContentEmoji_(emoji) {
  var ta = document.getElementById('content-form-body');
  var start = ta.selectionStart, end = ta.selectionEnd;
  var value = ta.value;
  ta.value = value.slice(0, start) + emoji + value.slice(end);
  var cursor = start + emoji.length;
  ta.focus();
  ta.setSelectionRange(cursor, cursor);
  updateContentPreview_();
}

function updateContentPreview_() {
  var preview = document.getElementById('content-form-preview');

function openContentForm_(entry) {
  contentFormEditId = entry ? entry.contentId : null;
  document.getElementById('content-form-heading').textContent = entry ? 'Ubah Konten' : 'Tambah Konten';
  document.getElementById('content-form-type').value = entry ? entry.contentType : ((appBootstrap.contentTypeList || [])[0] || {}).value || '';
  document.getElementById('content-form-title').value = entry ? entry.title : '';
  document.getElementById('content-form-body').value = entry ? entry.content : '';
  updateContentPreview_();

  var scheduleMode = (entry && entry.scheduleRule) ? 'scheduled' : '';
  document.getElementById('content-form-schedule-mode').value = scheduleMode;
  document.getElementById('content-form-rule-group').style.display = scheduleMode === 'scheduled' ? 'block' : 'none';
  document.getElementById('content-form-rule-day').style.display = 'none';
  document.getElementById('content-form-rule-date').style.display = 'none';
  document.getElementById('content-form-rule-type').value = 'DAILY';
  if (scheduleMode === 'scheduled') {
    var rule = entry.scheduleRule;
    if (rule.indexOf('WEEKLY:') === 0) {
      document.getElementById('content-form-rule-type').value = 'WEEKLY';
      document.getElementById('content-form-rule-day').value = rule.split(':')[1];
      document.getElementById('content-form-rule-day').style.display = 'block';
    } else if (rule.indexOf('DATE:') === 0) {
      document.getElementById('content-form-rule-type').value = 'DATE';
      document.getElementById('content-form-rule-date').value = rule.split(':')[1];
      document.getElementById('content-form-rule-date').style.display = 'block';
    }
  }

  document.getElementById('content-form-start').value = entry ? entry.startDate : '';
  document.getElementById('content-form-end').value = entry ? entry.endDate : '';

  contentFormImage = (entry && entry.imageUrl) ? { previewUrl: entry.imageUrl, base64: null } : null;
  contentFormImageWasRemoved = false;
  renderContentImageSlot_();

  contentFormPdf = (entry && entry.pdfUrl) ? { fileName: 'Dokumen PDF (tersimpan)', base64: null } : null;
  contentFormPdfWasRemoved = false;
  renderContentPdfSlot_();

  document.getElementById('content-form-error').textContent = '';
  document.getElementById('content-link-input-row').style.display = 'none';
  document.getElementById('content-form-panel').style.display = 'block';
  var cfPanel = document.getElementById('content-form-panel');
  cfPanel.scrollTop = 0;
  if (!document.getElementById('content-form-x')) {
    var x = document.createElement('button');
    x.type = 'button'; x.id = 'content-form-x'; x.className = 'jk-close cf-close'; x.setAttribute('aria-label', 'Tutup');
    x.innerHTML = mdIcon('close', 16);
    x.addEventListener('click', function () { var b = document.getElementById('btn-cancel-content-form'); if (b) b.click(); });
    cfPanel.insertBefore(x, cfPanel.firstChild);
  }
}

function closeContentForm_() {
  contentFormEditId = null;
  document.getElementById('content-form-panel').style.display = 'none';
  document.getElementById('content-form-error').textContent = '';
}

function submitContentForm_() {
  var errorEl = document.getElementById('content-form-error');
  errorEl.textContent = '';

  var title = document.getElementById('content-form-title').value;
  var body = document.getElementById('content-form-body').value;
  var startDate = document.getElementById('content-form-start').value;
  var endDate = document.getElementById('content-form-end').value;

  if (!title.trim()) { errorEl.textContent = 'Judul wajib diisi.'; return; }
  if (!body.trim()) { errorEl.textContent = 'Isi konten wajib diisi.'; return; }
  if (!startDate) { errorEl.textContent = 'Tanggal mulai wajib diisi.'; return; }
  if (!endDate) { errorEl.textContent = 'Tanggal berakhir wajib diisi.'; return; }

  var data = {
    contentType: document.getElementById('content-form-type').value,
    title: title,
    content: body,
    scheduleRule: buildContentScheduleRule_(),
    startDate: startDate,
    endDate: endDate
  };

  if (contentFormImage && contentFormImage.base64) {
    data.image = { base64: contentFormImage.base64, mimeType: contentFormImage.mimeType };
  } else if (!contentFormImage && contentFormImageWasRemoved) {
    data.removeImage = true;
  }

  if (contentFormPdf && contentFormPdf.base64) {
    data.pdf = { base64: contentFormPdf.base64, mimeType: contentFormPdf.mimeType };
  } else if (!contentFormPdf && contentFormPdfWasRemoved) {
    data.removePdf = true;
  }

  var session = loadSession();
  var editId = contentFormEditId;
  var submitBtn = document.getElementById('btn-submit-content');
  beginAction(submitBtn, 'Menyimpan...');

  var call = google.script.run
    .withSuccessHandler(function (response) {
      endAction(submitBtn);
      if (!response.success) { errorEl.textContent = response.error; showSnackbar(response.error, 'error'); return; }
      showSnackbar(editId ? 'Konten berhasil diubah.' : 'Konten berhasil ditambahkan.', 'success');
      closeContentForm_();
      pageDataCache.content = null; persistRemove_(['content']);
      loadContentAktif(true);
    })
    .withFailureHandler(function () {
      endAction(submitBtn);
      errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      showSnackbar('Gagal terhubung ke server. Coba lagi.', 'error');
    });

  if (editId) {
    call.ubahContent(session.accessCode, editId, data);
  } else {
    call.buatContent(session.accessCode, data);
  }
}


function confirmHapusContent_(contentId) {
  showConfirmModal('Hapus konten ini?', function () { doHapusContent_(contentId); }, 'delete', true, 'Menghapus...');
}

function doHapusContent_(contentId) {
  var session = loadSession();
  beginAction(null, 'Menghapus...');
  google.script.run
    .withSuccessHandler(function (response) {
      endAction(null);
      if (!response.success) { showSnackbar(response.error, 'error'); return; }
      showSnackbar('Konten berhasil dihapus.', 'success');
      pageDataCache.content = null; persistRemove_(['content']);
      loadContentAktif(true);
    })
    .withFailureHandler(function () {
      endAction(null);
      showSnackbar('Gagal menghapus konten. Coba lagi.', 'error');
    })
    .hapusContent(session.accessCode, contentId);
}

function loadContentAktif(force) {
  var session = loadSession();
  if (!session) return;

  var cached = pageDataCache.content;
  if (cached && !force) {
    renderContentBanner_(cached);
    if (appBootstrap.currentUser.role === 'admin') renderContentManagementList_(cached);
    return;
  }

  google.script.run
    .withSuccessHandler(function (response) {
      if (!response.success) return;
      pageDataCache.content = response.data.content;
      persistSet_('content', response.data.content);
      renderContentBanner_(response.data.content);
      if (appBootstrap.currentUser.role === 'admin') renderContentManagementList_(response.data.content);
    })
    .withFailureHandler(function () {})
    .getContentAktif(session.accessCode);
}

var contentCarouselTimer_ = null;

/** Beranda: pengumuman tayang ditampilkan sebagai carousel (geser, panah, titik, autoplay 5 dtk). */
function renderContentBanner_(list) {
  var container = document.getElementById('content-banner-container');
  if (contentCarouselTimer_) { clearInterval(contentCarouselTimer_); contentCarouselTimer_ = null; }
  container.innerHTML = '';

  var items = (list || []).filter(function (c) { return c.status === 'tayang'; });
  if (items.length === 0) return;

  var wrap = document.createElement('div');
  wrap.className = 'cc-wrap';
  var viewport = document.createElement('div');
  viewport.className = 'cc-viewport';
  var track = document.createElement('div');
  track.className = 'cc-track';

  items.forEach(function (c) {
    var typeInfo = CONTENT_TYPE_BADGE[c.contentType] || { cls: 'badge-neutral', icon: 'description' };
    var tone = c.contentType === 'warning' ? 'red' : (c.contentType === 'information' ? 'lime' : 'blue');
    var slide = document.createElement('div');
    slide.className = 'cc-slide tone-' + tone + (c.contentType === 'warning' ? ' is-warning' : '');

    var head = document.createElement('div');
    head.className = 'cc-head';
    var iconBox = document.createElement('span');
    iconBox.className = 'cc-icon';
    iconBox.innerHTML = mdIcon(typeInfo.icon || 'description', 20);
    var badge = document.createElement('span');
    badge.className = 'cc-badge';
    badge.textContent = c.contentTypeLabel;
    head.appendChild(iconBox);
    head.appendChild(badge);
    slide.appendChild(head);

    var title = document.createElement('div');
    title.className = 'cc-title';
    title.textContent = c.title;
    slide.appendChild(title);

    var msg = document.createElement('div');
    msg.className = 'cc-message reminder-message';
    msg.innerHTML = sanitizeRichContentHtml_(c.content);
    slide.appendChild(msg);

    if (c.imageUrl) {
      var img = document.createElement('img');
      img.className = 'content-card-image';
      img.src = c.imageUrl;
      img.alt = c.title;
      img.addEventListener('click', function () { openPhotoViewer([c.imageUrl], 0); });
      slide.appendChild(img);
    }
    if (c.pdfUrl) {
      var link = document.createElement('a');
      link.className = 'content-card-pdf-link';
      link.href = c.pdfUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      link.innerHTML = mdIcon('description', 14) + '<span>Buka PDF</span>';
      slide.appendChild(link);
    }
    track.appendChild(slide);
  });
  viewport.appendChild(track);
  wrap.appendChild(viewport);

  var n = items.length, idx = 0;
  if (n > 1) {
    var prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'cc-nav cc-prev'; prev.setAttribute('aria-label', 'Sebelumnya');
    prev.innerHTML = mdIcon('chevronLeft', 18);
    var next = document.createElement('button');
    next.type = 'button'; next.className = 'cc-nav cc-next'; next.setAttribute('aria-label', 'Berikutnya');
    next.innerHTML = mdIcon('chevronRight', 18);
    var foot = document.createElement('div');
    foot.className = 'cc-foot';

    var dots = document.createElement('div');
    dots.className = 'cc-dots';
    items.forEach(function (_, i) {
      var d = document.createElement('button');
      d.type = 'button'; d.setAttribute('aria-label', 'Slide ' + (i + 1));
      d.addEventListener('click', function () { go(i, true); });
      dots.appendChild(d);
    });
    foot.appendChild(prev); foot.appendChild(dots); foot.appendChild(next);
    wrap.appendChild(foot);

    var go = function (i, user) {
      idx = (i + n) % n;
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
      Array.prototype.forEach.call(dots.children, function (d, k) { d.className = k === idx ? 'active' : ''; });
      if (user) restart();
    };
    var restart = function () {
      if (contentCarouselTimer_) clearInterval(contentCarouselTimer_);
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      contentCarouselTimer_ = setInterval(function () {
        if (!document.body.contains(wrap)) { clearInterval(contentCarouselTimer_); contentCarouselTimer_ = null; return; }
        if (touching) return;
        go(idx + 1);
      }, 5000);
    };
    prev.addEventListener('click', function () { go(idx - 1, true); });
    next.addEventListener('click', function () { go(idx + 1, true); });

    // Geser (swipe) di layar sentuh
    var sx = null, touching = false;
    viewport.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; touching = true; }, { passive: true });
    viewport.addEventListener('touchcancel', function () { touching = false; sx = null; }, { passive: true });
    viewport.addEventListener('touchend', function (e) {
      touching = false;
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1), true);
    });
    go(0);
    restart();
  }
  container.appendChild(wrap);
}

function renderContentManagementList_(list) {
  var container = document.getElementById('content-management-list');
  container.innerHTML = '';
  // Konten otomatis sistem (piket, dll.) hanya tampil di Carousel; daftar kelola ini khusus konten buatan Admin.
  list = (list || []).filter(function (c) { return c.source !== 'system'; });

  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('description', 26) + '</div>Belum ada konten.</div>';
    return;
  }

  var wrap = document.createElement('div');
  wrap.className = 'cm-table-wrap';
  var table = document.createElement('table');
  table.className = 'cm-table';
  table.innerHTML = '<thead><tr><th>Jenis &amp; Judul</th><th>Status</th><th class="cm-period">Periode</th><th>Aksi</th></tr></thead>';
  var tbody = document.createElement('tbody');

  list.forEach(function (c) {
    var tr = document.createElement('tr');
    var typeInfo = CONTENT_TYPE_BADGE[c.contentType] || { cls: 'badge-neutral' };

    var tdTitle = document.createElement('td');
    tdTitle.className = 'cm-col-title';
    var typeBadge = document.createElement('span');
    typeBadge.className = 'badge ' + typeInfo.cls;
    typeBadge.textContent = c.contentTypeLabel;
    tdTitle.appendChild(typeBadge);
    var t = document.createElement('div');
    t.className = 'cm-title';
    t.textContent = c.title;
    tdTitle.appendChild(t);
    var pin = document.createElement('div');
    pin.className = 'cm-period-inline';
    pin.textContent = c.startDate + ' \u2013 ' + c.endDate;
    tdTitle.appendChild(pin);
    tr.appendChild(tdTitle);

    var tdStatus = document.createElement('td');
    var st = document.createElement('span');
    st.className = 'cm-status cm-' + c.status;
    st.innerHTML = '<span class="dot' + (c.status === 'tayang' ? ' pulse' : '') + '"></span>';
    var stText = document.createElement('span');
    stText.textContent = c.statusLabel;
    st.appendChild(stText);
    tdStatus.appendChild(st);
    tr.appendChild(tdStatus);

    var tdPeriod = document.createElement('td');
    tdPeriod.className = 'cm-period';
    tdPeriod.textContent = c.startDate + ' – ' + c.endDate;
    tr.appendChild(tdPeriod);

    var tdAct = document.createElement('td');
    var actions = document.createElement('div');
    actions.className = 'cm-actions';
    var editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'cm-btn';
    editBtn.innerHTML = mdIcon('edit', 14) + '<span class="cm-lbl">Ubah</span>';
    editBtn.addEventListener('click', function () { openContentForm_(c); });
    var deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'cm-btn cm-danger';
    deleteBtn.innerHTML = mdIcon('delete', 14) + '<span class="cm-lbl">Hapus</span>';
    deleteBtn.addEventListener('click', function () { confirmHapusContent_(c.contentId); });
    actions.appendChild(editBtn); actions.appendChild(deleteBtn);
    tdAct.appendChild(actions);
    tr.appendChild(tdAct);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);
}

// ============================================================
// KARTU BERSAMA PEKERJAAN (Riwayat & Aktivitas) — buildPekerjaanListCard_
// ============================================================
// Ditempatkan di sini (bukan di script-aktivitas.html) karena dipakai
// LEBIH DULU oleh loadRiwayatPekerjaan() di atas — menghindari referensi
// ke fungsi yang belum ter-include saat file ini dieksekusi lebih awal
// dari script-aktivitas.html. Perilaku IDENTIK dengan index.html lama.

/** Potong teks ke maksimal `maxLen` karakter + "..." bila lebih panjang. */
function truncateText_(text, maxLen) {
  if (!text) return '';
  var str = String(text);
  return str.length > maxLen ? str.substring(0, maxLen) + '...' : str;
}

/** "17/07/2026 10:30" -> "Kamis, 17 Juli 2026 | 10:30". */
function formatDateTimeFull_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var parts = String(ddmmyyyyHHmm).split(' ');
  var dp = (parts[0] || '').split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  var out = INDO_DAY_NAMES_[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + ' ' + INDO_MONTH_LONG_[d.getMonth()] + ' ' + d.getFullYear();
  return parts[1] ? out + ' | ' + parts[1].substring(0, 5) : out;
}

/** "17/07/2026 10:30" -> "Kam, 17 Jul 2026". */
function formatAktivitasDateShort_(ddmmyyyyHHmm) {
  if (!ddmmyyyyHHmm) return '';
  var datePart = String(ddmmyyyyHHmm).split(' ')[0];
  var dp = datePart.split('/');
  if (dp.length !== 3) return ddmmyyyyHHmm;
  var d = new Date(parseInt(dp[2], 10), parseInt(dp[1], 10) - 1, parseInt(dp[0], 10));
  if (isNaN(d.getTime())) return ddmmyyyyHHmm;
  return INDO_DAY_NAMES_[d.getDay()].substring(0, 3) + ', ' + dp[0] + ' ' + INDO_MONTH_SHORT_[d.getMonth()] + ' ' + dp[2];
}

/**
 * Kartu daftar Pekerjaan (badge-pill+dot, tanggal, avatar+nama+
 * keterangan, thumbnail/placeholder+chevron) — SATU fungsi dipakai
 * BERSAMA oleh Aktivitas dan Riwayat.
 */
function buildPekerjaanListCard_(p, opts) {
  opts = opts || {};
  var jenisInfo = JENIS_PEKERJAAN_BADGE[p.jenis] || { label: p.jenis, cls: 'badge-neutral', icon: 'description' };
  var statusCls = STATUS_PEKERJAAN_BADGE_CLASS[p.status] || 'badge-neutral';

  var officer = (p.status === 'TERBUKA') ? p.createdByName : (p.handledByName || p.createdByName);
  var photos = pilihFotoKartu_(p);
  var floorText = p.zoneCode ? (p.floorName + ' · ' + p.zoneCode) : (p.floorName || '');

  var card = document.createElement('div');
  card.className = 'list-card list-card-row';

  var main = document.createElement('div');
  main.className = 'list-card-row-main';

  var badgeRow = document.createElement('div');
  badgeRow.className = 'op-card-top';
  badgeRow.innerHTML =
    '<span class="badge-pill ' + jenisInfo.cls + '"><span class="dot"></span>' + jenisInfo.label + '</span>' +
    '<span class="badge badge-status-pulse ' + statusCls + '"><span class="dot pulse"></span>' + p.statusLabel + '</span>' +
    (p.assignmentMode === 'direct' && p.targetUserCode ? '<span class="badge badge-info">Direct \u2192 ' + (p.targetUserName || p.targetUserCode) + '</span>' : '');
  main.appendChild(badgeRow);

  // Arah Mandiri: utamakan performedAt (kapan pekerjaan BENAR-BENAR dilakukan).
  var displayDate = (p.arah === 'mandiri' && p.performedAt) ? p.performedAt : (p.completedAt || p.startedAt || p.createdAt);

  var dateRow = document.createElement('div');
  dateRow.className = 'list-card-date-line';
  dateRow.innerHTML =
    '<span class="list-card-date"><span class="icon-slot">' + mdIcon('calendar', 16) + '</span><span>' + formatDateTimeFull_(displayDate) + '</span></span>';
  main.appendChild(dateRow);

  var personRow = document.createElement('div');
  personRow.className = 'list-card-person-row';
  var avatar = document.createElement('span');
  avatar.className = 'avatar-circle';
  avatar.style.background = 'var(--status-info-bg)';
  avatar.style.color = 'var(--status-info-fg)';
  avatar.innerHTML = mdIcon('account', 18);
  personRow.appendChild(avatar);
  var personText = document.createElement('div');
  personText.className = 'list-card-person-text';
  personText.innerHTML = '<div class="name-line"><span class="name">' + officer + '</span>' +
    (floorText ? '<span class="name-floor">' + mdIcon('location', 12) + floorText + '</span>' : '') + '</div>' +
    '<div class="subtext subtext-full">' + escapeHtmlJk_(p.completionNotes || p.description || '') + '</div>';
  personRow.appendChild(personText);
  main.appendChild(personRow);

  var pendingActions = null;
  if (opts.actions && typeof buildPekerjaanActionRow_ === 'function') {
    var actionsRow = buildPekerjaanActionRow_(p, opts);
    if (actionsRow) pendingActions = actionsRow;
  }

  card.appendChild(main);

  var side = document.createElement('div');
  side.className = 'list-card-row-side';

  var thumbSide = document.createElement('div');
  thumbSide.className = photos.length > 0 ? 'op-card-thumb-side' : 'op-card-thumb-side no-photo';
  if (photos.length > 0) {
    var img = document.createElement('img');
    img.src = photos[0].thumbUrl || photos[0].url;
    img.alt = 'Foto dokumentasi';
    thumbSide.appendChild(img);
    thumbSide.addEventListener('click', function (e) {
      e.stopPropagation();
      openPhotoViewer(photos.map(function (photo) { return photo.url; }), 0);
    });
  } else {
    thumbSide.innerHTML = '<div class="no-photo-inner">' + mdIcon('photo', 18) + '<span>Tidak ada foto</span></div>';
  }
  var chips = '';
  if (p.commentCount > 0) chips += '<span class="thumb-chip">' + mdIcon('chatBubble', 11) + p.commentCount + '</span>';
  if (photos.length > 0) chips += '<span class="thumb-chip">' + mdIcon('photo', 11) + photos.length + '</span>';
  if (chips) {
    var chipWrap = document.createElement('div');
    chipWrap.className = 'thumb-chips';
    chipWrap.innerHTML = chips;
    thumbSide.appendChild(chipWrap);
  }
  side.appendChild(thumbSide);

  var chevron = document.createElement('span');
  chevron.className = 'list-card-chevron';
  chevron.innerHTML = mdIcon('chevronRight', 18);
  side.appendChild(chevron);

  card.appendChild(side);
  if (pendingActions) { card.classList.add('has-actions'); card.appendChild(pendingActions); }

  card.addEventListener('click', function () { openPekerjaanDetail(p, { actions: !!opts.actions }); });
  return card;
}
