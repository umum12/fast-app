<script>
// ============================================================
// AKTIVITAS — Timeline Operasional Seluruh Tim (Tahap 4 Cutover)
// ============================================================

var currentActivityFilter = 'all';
var ACTIVITY_TABS = [
  { key: 'all', label: 'Semua' },
  { key: 'mandiri', label: 'Mandiri' },
  { key: 'admin_ke_fs', label: 'Penugasan' },
  { key: 'fs_ke_admin', label: 'Lapor/Permintaan' }
];



/**
 * PATCH: tab filter diganti dropdown "Filter: <label> v". Logika
 * filter (currentActivityFilter, renderAktivitasFiltered) TIDAK
 * berubah, hanya tampilan pemilihnya.
 */
function renderActivityTabs() {
  var btn = document.getElementById('btn-activity-filter');
  if (!btn) return;
  var current = ACTIVITY_TABS.filter(function (t) { return t.key === currentActivityFilter; })[0] || ACTIVITY_TABS[0];
  btn.innerHTML = '<span>Filter: ' + current.label + '</span>' + mdIcon('chevronDown', 16);
  if (!btn.dataset.bound) {
    btn.dataset.bound = '1';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      openFilterPicker_('Pilih Filter Aktivitas', ACTIVITY_TABS, currentActivityFilter, function (key) {
        currentActivityFilter = key;
        renderActivityTabs();
        renderAktivitasFiltered();
      });
    });
  }
}


var aktivitasReqSeq_ = 0;

// Chip cepat di bawah kolom cari: Hari ini / 7 hari terakhir (kelompok tanggal) dan Belum selesai (status).
// Dapat dimatikan dengan mengetuk lagi. Memengaruhi daftar dari server (bukan hanya yang termuat).
var activityQuick_ = { range: '', status: '' };
var ACTIVITY_QUICK_ = [
  { group: 'range', value: 'today', label: 'Hari ini' },
  { group: 'range', value: '7d', label: '7 hari terakhir' },
  { group: 'status', value: 'BELUM_SELESAI', label: 'Belum selesai' }
];

function renderActivityQuick_() {
  var row = document.getElementById('activity-quick-row');
  if (!row) return;
  row.innerHTML = '';
  ACTIVITY_QUICK_.forEach(function (d) {
    var active = activityQuick_[d.group] === d.value;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'rw-chip' + (active ? ' active' : '');
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
    b.setAttribute('data-quick', d.value);
    b.textContent = d.label;
    b.addEventListener('click', function () {
      activityQuick_[d.group] = active ? '' : d.value;
      renderActivityQuick_();
      renderAktivitasFiltered();
    });
    row.appendChild(b);
  });
}

function currentAktivitasParams_() {
  var q = (document.getElementById('activity-search').value || '').trim();
  var arah = currentActivityFilter === 'all' ? '' : currentActivityFilter;
  var extra = {};
  if (activityQuick_.status) extra.status = activityQuick_.status;
  if (activityQuick_.range && typeof riwayatRangeDates_ === 'function') {
    var r = riwayatRangeDates_(activityQuick_.range);
    if (r.dateFrom) { extra.dateFrom = r.dateFrom; extra.dateTo = r.dateTo; }
  }
  // Kunci cache memuat filter cepat (tanggal memakai nama rentang, bukan tanggal, agar stabil).
  var qk = (activityQuick_.range || activityQuick_.status) ? '#' + activityQuick_.range + '|' + activityQuick_.status : '';
  return { arah: arah, q: q, extra: extra, key: feedKey_(arah, q.toLowerCase()) + qk };
}

function aktivitasFetchParams_(prm, offset) {
  var p = { view: 'aktivitas', arah: prm.arah, q: prm.q, limit: FEED_PAGE_SIZE_, offset: offset };
  for (var k in prm.extra) p[k] = prm.extra[k];
  return p;
}

function loadPekerjaanAktivitas(force) {
  var session = loadSession();
  if (!session) return;
  renderActivityTabs();
  renderActivityQuick_();

  var prm = currentAktivitasParams_();
  var container = document.getElementById('activity-feed-list');
  var isDefault = prm.key === feedKey_('', '');
  var cached = pageDataCache.pekerjaanAktivitasByKey[prm.key];

  if (!cached && !force && isDefault) {
    // Salinan tersimpan: tampilkan dulu (t:0 = dianggap basi, tetap diperbarui dari server).
    var pc = persistGet_('aktivitas');
    if (pc) {
      cached = { list: pc.list, total: pc.total, hasMore: pc.hasMore, t: 0 };
      pageDataCache.pekerjaanAktivitasByKey[prm.key] = cached;
    }
  }

  var fresh = cached && (Date.now() - (cached.t || 0)) < FEED_FRESH_MS_;
  if (cached && !force && fresh) { renderAktivitasFeed_(cached, prm); return; }

  var alreadyShown = cached && container.dataset.feedKey === prm.key;
  if (cached && !alreadyShown) renderAktivitasFeed_(cached, prm);
  else if (!cached) renderListSkeleton_('activity-feed-list', 3, prm.q ? 'Mencari aktivitas...' : 'Memuat aktivitas tim...');

  var seq = ++aktivitasReqSeq_;
  fetchFeedPage_(aktivitasFetchParams_(prm, 0), function (data) {
    if (seq !== aktivitasReqSeq_) return; // filter/pencarian sudah berganti
    if (isDefault) persistSet_('aktivitas', { list: data.pekerjaan, total: data.total, hasMore: data.hasMore });
    // Tidak berubah -> cukup tandai segar, tanpa gambar ulang (tanpa kedip, scroll tetap).
    if (cached && container.dataset.feedKey === prm.key &&
        sameFeedList_(cached.list.slice(0, data.pekerjaan.length), data.pekerjaan) && cached.total === data.total) {
      cached.t = Date.now();
      return;
    }
    var entry = { list: data.pekerjaan, total: data.total, hasMore: data.hasMore, t: Date.now() };
    pageDataCache.pekerjaanAktivitasByKey[prm.key] = entry;
    renderAktivitasFeed_(entry, prm);
  }, function (err) {
    if (seq !== aktivitasReqSeq_ || cached) return;
    renderLoadError_(container, 'aktivitas', function () { loadPekerjaanAktivitas(true); }, err);
  });
}

function renderAktivitasFeed_(entry, prm) {
  document.getElementById('activity-feed-list').dataset.feedKey = prm.key;
  renderFeedList_(document.getElementById('activity-feed-list'), entry,
    '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('inbox', 26) + '</div>' + ((prm.q || activityQuick_.range || activityQuick_.status) ? 'Tidak ada aktivitas yang cocok.' : 'Belum ada aktivitas.') + '</div>',
    function (done, fail) {
      fetchFeedPage_(aktivitasFetchParams_(prm, entry.list.length), function (data) {
        if (pageDataCache.pekerjaanAktivitasByKey[prm.key] !== entry) { return; } // cache sudah diganti
        entry.list = entry.list.concat(data.pekerjaan);
        entry.total = data.total;
        entry.hasMore = data.hasMore;
        done(data.pekerjaan);
      }, fail);
    }, { verifikasi: true });
}

// Filter & pencarian kini dijalankan di server (akurat atas seluruh data).
function renderAktivitasFiltered() { loadPekerjaanAktivitas(); }

document.getElementById('activity-search').addEventListener('input', debounce_(renderAktivitasFiltered, 350));

// ------------------- FILTER & UNDUH PDF (dipindah dari Riwayat, 3.4) -------------------

/**
 * PATCH — Halaman PDF Terpisah. Menggantikan initPekerjaanFilterUI()
 * lama (panel filter inline di Aktivitas). Tombol di sini HANYA
 * membuka /exec?page=pdfrender di tab baru — seluruh filter & opsi
 * unduh (ke perangkat / ke Drive) sekarang di halaman itu.
 */

/**
 * PATCH — Tombol PDF kini tersedia untuk SEMUA role (sebelumnya
 * Admin/Demo saja). Aman karena backend (getFilteredPekerjaanRiwayatRows_,
 * pekerjaan.gs) sudah otomatis membatasi data FS hanya ke Pekerjaan
 * miliknya sendiri (created_by/handled_by) — tidak ada perubahan Hak
 * Akses, murni membuka akses UI ke endpoint yang sudah aman per-role.
 */


function initPdfRenderButton_() {
  if (!appBootstrap) return;

  var btn = document.getElementById('btn-open-pdf-render');
  if (btn) {
    btn.style.display = 'inline-flex';
    btn.innerHTML = mdIcon('download', 16) + '<span>Download PDF</span>';
    btn.addEventListener('click', function () {
      window.open(appBootstrap.webAppUrl + '?page=pdfrender', '_blank');
    });
  }

  var btnStat = document.getElementById('btn-open-statistik');
  if (btnStat) {
    btnStat.style.display = 'inline-flex';
    btnStat.innerHTML = mdIcon('stats', 16) + '<span>Statistik</span>';
    btnStat.addEventListener('click', function () {
      window.open(appBootstrap.webAppUrl + '?page=statistik', '_blank');
    });
  }

  // Ringkasan collapsible; status diingat di localStorage (per perangkat).
  var toggle = document.getElementById('btn-toggle-ringkasan');
  var body = document.getElementById('ringkasan-body');
  if (!toggle || !body) return;

  function applyState(open) {
    body.style.display = open ? 'block' : 'none';
    toggle.innerHTML = mdIcon(open ? 'chevronUp' : 'chevronDown', 18);
    try { localStorage.setItem('fs_ringkasan_open', open ? '1' : '0'); } catch (e) {}
  }

  var saved = null;
  try { saved = localStorage.getItem('fs_ringkasan_open'); } catch (e) {}
  var isOpen = saved !== '0';
  applyState(isOpen);

  toggle.addEventListener('click', function () {
    isOpen = !isOpen;
    applyState(isOpen);
  });
}

// ============================================================
// PHOTO VIEWER — pinch-to-zoom (menuju titik jari), pan, double-tap/klik dua kali,
// zoom roda mouse, inersia geser, geser antar foto, tarik ke bawah untuk menutup.
// Satu mesin Pointer Events untuk sentuh dan mouse. API publik tidak berubah:
// openPhotoViewer(urls, index), closePhotoViewer().
// ============================================================

var viewerPhotos = [];
var viewerIndex = 0;
var viewerScale = 1;

var PV_MAX_SCALE_ = 5;
var PV_DOUBLE_TAP_SCALE_ = 2.5;
var pvState_ = { s: 1, x: 0, y: 0 };

function pvImg_() { return document.getElementById('viewer-img'); }
function pvBox_() { return document.getElementById('photo-viewer'); }

function pvApply_(snap) {
  var img = pvImg_();
  img.classList.toggle('pv-snap', !!snap);
  img.style.transform = 'translate3d(' + pvState_.x + 'px,' + pvState_.y + 'px,0) scale(' + pvState_.s + ')';
  viewerScale = pvState_.s;
  pvUpdateCounter_();
}

function pvUpdateCounter_() {
  var c = document.getElementById('viewer-counter');
  if (!c) return;
  var txt = (viewerIndex + 1) + ' / ' + viewerPhotos.length;
  if (pvState_.s > 1.05) txt += ' · ' + (Math.round(pvState_.s * 10) / 10) + '×';
  c.textContent = txt;
}

/** Batas geser agar tepi foto tidak lewat dari layar (0 bila foto lebih kecil dari layar). */
function pvBounds_(s) {
  var img = pvImg_(), box = pvBox_();
  return {
    x: Math.max(0, (img.clientWidth * s - box.clientWidth) / 2),
    y: Math.max(0, (img.clientHeight * s - box.clientHeight) / 2)
  };
}

function pvClamp_(v, b) { return Math.max(-b, Math.min(b, v)); }

/** Selama gerakan: lewat batas ditahan (karet) alih-alih terpotong keras. */
function pvRubber_(v, b) {
  if (v > b) return b + (v - b) * 0.35;
  if (v < -b) return -b + (v + b) * 0.35;
  return v;
}

function pvReset_(snap) {
  pvState_.s = 1; pvState_.x = 0; pvState_.y = 0;
  pvApply_(snap);
}

/** Setelah gerakan: kembalikan ke batas yang sah (animasi singkat). */
function pvSettle_() {
  var s = Math.max(1, Math.min(PV_MAX_SCALE_, pvState_.s));
  var b = pvBounds_(s);
  pvState_.s = s;
  pvState_.x = pvClamp_(pvState_.x, b.x);
  pvState_.y = pvClamp_(pvState_.y, b.y);
  if (s === 1) { pvState_.x = 0; pvState_.y = 0; }
  pvApply_(true);
}

/** Zoom ke skala baru dengan titik (fx, fy) — relatif terhadap pusat layar — tetap di bawah jari. */
function pvZoomAt_(newScale, fx, fy, snap) {
  var st = pvState_;
  var qx = (fx - st.x) / st.s, qy = (fy - st.y) / st.s;
  st.s = newScale;
  st.x = fx - newScale * qx;
  st.y = fy - newScale * qy;
  var b = pvBounds_(newScale);
  st.x = pvClamp_(st.x, b.x); st.y = pvClamp_(st.y, b.y);
  if (newScale <= 1) { st.x = 0; st.y = 0; }
  pvApply_(snap);
}

function openPhotoViewer(urls, startIndex) {
  viewerPhotos = urls;
  viewerIndex = startIndex || 0;
  updateViewerImage();
  document.getElementById('photo-viewer').classList.add('show');
}

function closePhotoViewer() {
  document.getElementById('photo-viewer').classList.remove('show');
  pvBox_().style.background = '';
}

var PHOTO_VIEWER_PLACEHOLDER =
  'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
    '<rect width="200" height="200" fill="#374151"/>' +
    '<text x="50%" y="50%" fill="#9ca3af" font-size="14" text-anchor="middle" dy=".3em">Foto tidak dapat dimuat</text>' +
    '</svg>'
  );

function updateViewerImage() {
  var img = pvImg_();
  img.onerror = function () {
    console.warn('Gagal memuat foto di Photo Viewer. URL:', viewerPhotos[viewerIndex]);
    img.onerror = null;
    img.src = PHOTO_VIEWER_PLACEHOLDER;
  };
  img.draggable = false;
  img.src = viewerPhotos[viewerIndex];
  pvReset_(false);
  // Muat diam-diam foto tetangga supaya geser terasa instan.
  [viewerIndex - 1, viewerIndex + 1].forEach(function (i) {
    if (i >= 0 && i < viewerPhotos.length) { try { (new Image()).src = viewerPhotos[i]; } catch (e) {} }
  });
}

function pvGo_(delta) {
  var n = viewerIndex + delta;
  if (n < 0 || n >= viewerPhotos.length) return false;
  viewerIndex = n;
  updateViewerImage();
  return true;
}

document.getElementById('viewer-close').addEventListener('click', closePhotoViewer);

(function setupViewerGestures() {
  var box = pvBox_();
  var img = pvImg_();
  var pointers = {};            // id -> {x, y}
  var mode = '';                // '' | 'pan' | 'pinch' | 'swipe' | 'dismiss'
  var start = null;             // {x, y, t, sx, sy} untuk 1 jari
  var pinch = null;             // {dist, scale, qx, qy}
  var vel = { x: 0, y: 0, t: 0, px: 0, py: 0 };
  var lastTap = { t: 0, x: 0, y: 0 };
  var raf = 0;

  function count() { return Object.keys(pointers).length; }
  function pts() { return Object.keys(pointers).map(function (k) { return pointers[k]; }); }
  function center() { var r = box.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  function stopInertia() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  function beginSingle(p) {
    start = { x: p.x, y: p.y, t: Date.now(), sx: pvState_.x, sy: pvState_.y };
    vel = { x: 0, y: 0, t: Date.now(), px: p.x, py: p.y };
    mode = pvState_.s > 1.02 ? 'pan' : '';
  }

  function beginPinch() {
    var a = pts(), c = center();
    var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
    var fx = (a[0].x + a[1].x) / 2 - c.x, fy = (a[0].y + a[1].y) / 2 - c.y;
    pinch = { dist: d, scale: pvState_.s, qx: (fx - pvState_.x) / pvState_.s, qy: (fy - pvState_.y) / pvState_.s };
    mode = 'pinch';
  }

  box.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.viewer-close')) return;
    stopInertia();
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    pvImg_().classList.remove('pv-snap');
    if (count() === 1) beginSingle(pointers[e.pointerId]);
    else if (count() === 2) beginPinch();
  });

  box.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var c = center();

    if (mode === 'pinch' && count() >= 2) {
      var a = pts();
      var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      var fx = (a[0].x + a[1].x) / 2 - c.x, fy = (a[0].y + a[1].y) / 2 - c.y;
      var s = pinch.scale * (d / pinch.dist);
      // karet pada skala di luar batas
      if (s < 1) s = Math.max(0.6, 1 - (1 - s) * 0.5);
      else if (s > PV_MAX_SCALE_) s = PV_MAX_SCALE_ + (s - PV_MAX_SCALE_) * 0.3;
      pvState_.s = s;
      var b = pvBounds_(Math.max(1, s));
      pvState_.x = pvRubber_(fx - s * pinch.qx, b.x);
      pvState_.y = pvRubber_(fy - s * pinch.qy, b.y);
      pvApply_(false);
      e.preventDefault();
      return;
    }

    if (count() !== 1 || !start) return;
    var p = pointers[e.pointerId];
    var dx = p.x - start.x, dy = p.y - start.y;
    var now = Date.now();
    if (now - vel.t > 0) {
      vel.x = (p.x - vel.px) / Math.max(1, now - vel.t);
      vel.y = (p.y - vel.py) / Math.max(1, now - vel.t);
      vel.t = now; vel.px = p.x; vel.py = p.y;
    }

    if (mode === 'pan') {
      var bb = pvBounds_(pvState_.s);
      pvState_.x = pvRubber_(start.sx + dx, bb.x);
      pvState_.y = pvRubber_(start.sy + dy, bb.y);
      pvApply_(false);
      return;
    }

    // Skala 1: tentukan arah gerakan sekali (geser antar foto / tarik ke bawah untuk menutup).
    if (!mode && Math.hypot(dx, dy) > 10) mode = Math.abs(dx) > Math.abs(dy) ? 'swipe' : (dy > 0 ? 'dismiss' : 'swipe-v');
    if (mode === 'swipe') {
      var atEdge = (dx > 0 && viewerIndex === 0) || (dx < 0 && viewerIndex === viewerPhotos.length - 1);
      pvState_.x = atEdge ? dx * 0.3 : dx;
      pvState_.y = 0;
      pvApply_(false);
    } else if (mode === 'dismiss') {
      pvState_.x = dx * 0.4; pvState_.y = dy;
      pvApply_(false);
      box.style.background = 'rgba(0,0,0,' + Math.max(0.25, 0.92 - dy / 500) + ')';
    }
  }, { passive: false });

  function inertia() {
    var last = Date.now();
    function step() {
      var now = Date.now(), dt = Math.min(32, now - last); last = now;
      var b = pvBounds_(pvState_.s);
      pvState_.x = pvClamp_(pvState_.x + vel.x * dt, b.x);
      pvState_.y = pvClamp_(pvState_.y + vel.y * dt, b.y);
      var f = Math.pow(0.94, dt / 16);
      vel.x *= f; vel.y *= f;
      pvApply_(false);
      if (Math.abs(vel.x) > 0.02 || Math.abs(vel.y) > 0.02) raf = requestAnimationFrame(step); else raf = 0;
    }
    raf = requestAnimationFrame(step);
  }

  function endPointer(e) {
    if (!pointers[e.pointerId]) return;
    var p = pointers[e.pointerId];
    delete pointers[e.pointerId];
    try { box.releasePointerCapture(e.pointerId); } catch (err) {}
    var n = count();

    if (mode === 'pinch') {
      if (n < 2) {
        pvSettle_();
        // jari yang tersisa melanjutkan sebagai geser
        if (n === 1) { var rest = pts()[0]; beginSingle(rest); mode = pvState_.s > 1.02 ? 'pan' : 'skip'; }
        else mode = '';
      }
      return;
    }
    if (n !== 0) return;

    var dx = p.x - (start ? start.x : p.x), dy = p.y - (start ? start.y : p.y);
    var dur = Date.now() - (start ? start.t : Date.now());
    var moved = Math.hypot(dx, dy);
    var m = mode; mode = '';

    if (m === 'swipe') {
      var fast = Math.abs(vel.x) > 0.5;
      if ((Math.abs(dx) > box.clientWidth * 0.2 || fast) && pvGo_(dx < 0 ? 1 : -1)) return;
      pvSettle_(); return;
    }
    if (m === 'dismiss') {
      box.style.background = '';
      if (dy > 110 || vel.y > 0.6) { closePhotoViewer(); pvReset_(false); } else pvSettle_();
      return;
    }
    if (m === 'pan') {
      if (moved > 6) {
        var recent = Date.now() - vel.t < 80;
        if (recent && (Math.abs(vel.x) > 0.05 || Math.abs(vel.y) > 0.05)) { pvSettle_(); inertia(); return; }
      }
      pvSettle_();
      if (moved > 6) return;
    }
    if (m === 'skip') return;

    // Ketukan (bukan geser): dua ketukan cepat = zoom masuk/keluar di titik ketukan.
    if (moved < 8 && dur < 300) {
      var now = Date.now(), c = center();
      if (now - lastTap.t < 300 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
        lastTap.t = 0;
        if (pvState_.s > 1.05) pvZoomAt_(1, 0, 0, true);
        else pvZoomAt_(PV_DOUBLE_TAP_SCALE_, p.x - c.x, p.y - c.y, true);
      } else {
        lastTap = { t: now, x: p.x, y: p.y };
      }
    } else if (pvState_.s !== 1) { pvSettle_(); }
  }
  box.addEventListener('pointerup', endPointer);
  box.addEventListener('pointercancel', function (e) { endPointer(e); mode = ''; pvSettle_(); });

  // Mouse/trackpad: roda = zoom ke posisi kursor.
  box.addEventListener('wheel', function (e) {
    if (!box.classList.contains('show')) return;
    e.preventDefault();
    stopInertia();
    var c = center();
    var f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018));
    var s = Math.max(1, Math.min(PV_MAX_SCALE_, pvState_.s * f));
    pvZoomAt_(s, e.clientX - c.x, e.clientY - c.y, false);
  }, { passive: false });

  // Papan ketik: panah = foto sebelumnya/berikutnya, + / - zoom, 0 = reset.
  document.addEventListener('keydown', function (ev) {
    if (!box.classList.contains('show')) return;
    if (ev.key === 'ArrowRight') pvGo_(1);
    else if (ev.key === 'ArrowLeft') pvGo_(-1);
    else if (ev.key === '+' || ev.key === '=') pvZoomAt_(Math.min(PV_MAX_SCALE_, pvState_.s * 1.4), 0, 0, true);
    else if (ev.key === '-') pvZoomAt_(Math.max(1, pvState_.s / 1.4), 0, 0, true);
    else if (ev.key === '0') pvReset_(true);
  });

  // Ubah ukuran/rotasi layar: pastikan posisi tetap dalam batas.
  window.addEventListener('resize', function () { if (box.classList.contains('show')) pvSettle_(); });
  img.addEventListener('dragstart', function (e) { e.preventDefault(); });
})();

// ============================================================
// PULL TO REFRESH (Sprint 6.02 #6) — hanya Beranda & Pekerjaan
// ============================================================

(function setupPullToRefresh() {
  var PULL_THRESHOLD = 70;
  var PULL_MAX_VISUAL = 100;
  var pullStartY = null;
  var pullDistance = 0;
  var indicator = document.getElementById('pull-indicator');
  var indicatorText = document.getElementById('pull-indicator-text');

  function pullablePage() {
    var pv = document.getElementById('photo-viewer');
    if (pv && pv.classList.contains('show')) return false; // penampil foto memakai geser sendiri
    return currentPage === 'beranda' || currentPage === 'pekerjaan' || currentPage === 'jadwal' || currentPage === 'aktivitas';
  }

  document.addEventListener('touchstart', function (e) {
    if (pullablePage() && window.scrollY === 0) {
      pullStartY = e.touches[0].clientY;
    } else {
      pullStartY = null;
    }
    pullDistance = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (pullStartY === null) return;
    pullDistance = e.touches[0].clientY - pullStartY;
    if (pullDistance > 0 && window.scrollY === 0) {
      var visual = Math.min(pullDistance, PULL_MAX_VISUAL);
      indicator.style.transform = 'translate(-50%, ' + (visual - 60) + 'px)';
      indicatorText.textContent = pullDistance > PULL_THRESHOLD ? 'Lepas untuk refresh' : 'Tarik untuk refresh';
    }
  }, { passive: true });

  document.addEventListener('touchend', function () {
    if (pullStartY !== null && pullDistance > PULL_THRESHOLD) {
      if (currentPage === 'pekerjaan') {
        loadPekerjaanInbox(true);
      } else if (currentPage === 'beranda') {
        loadHomeBootstrap(true);
      } else if (currentPage === 'jadwal') {
        loadRiwayatPekerjaan(true);
      } else if (currentPage === 'aktivitas') {
        loadAktivitasSummary(true);
        loadPekerjaanAktivitas(true);
      }
      indicatorText.textContent = 'Memperbarui...';
      setTimeout(function () {
        indicator.style.transform = 'translate(-50%, -60px)';
      }, 500);
      pullStartY = null;
      pullDistance = 0;
      return;
    }
    indicator.style.transform = 'translate(-50%, -60px)';
    pullStartY = null;
    pullDistance = 0;
  });
})();

// RIPPLE EFFECT (Patch 7.2)
// ============================================================
function attachRipple(el) {
  if (!el || el.dataset.rippleAttached) return;
  el.dataset.rippleAttached = '1';
  el.classList.add('ripple-surface');
  el.addEventListener('click', function (e) {
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = ((e.clientX || (rect.left + rect.width / 2)) - rect.left - size / 2) + 'px';
    ripple.style.top = ((e.clientY || (rect.top + rect.height / 2)) - rect.top - size / 2) + 'px';
    el.appendChild(ripple);
    setTimeout(function () { ripple.remove(); }, 500);
  });
}

document.querySelectorAll('.fab, .btn-primary').forEach(attachRipple);
