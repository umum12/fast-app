<script>
// ============================================================
// AKTIVITAS — Timeline Operasional Seluruh Tim (Tahap 4 Cutover)
// ============================================================

var currentActivityFilter = 'all';
var ACTIVITY_TABS = [
  { key: 'all', label: 'Semua' },
  { key: 'mandiri', label: 'Mandiri' },
  { key: 'admin_ke_fs', label: 'Penugasan' },
  { key: 'fs_ke_admin', label: 'Lapor/Permintaan' }
];



/**
 * PATCH: tab filter diganti dropdown "Filter: <label> v". Logika
 * filter (currentActivityFilter, renderAktivitasFiltered) TIDAK
 * berubah, hanya tampilan pemilihnya.
 */
function renderActivityTabs() {
  var btn = document.getElementById('btn-activity-filter');
  if (!btn) return;
  var current = ACTIVITY_TABS.filter(function (t) { return t.key === currentActivityFilter; })[0] || ACTIVITY_TABS[0];
  btn.innerHTML = '<span>Filter: ' + current.label + '</span>' + mdIcon('chevronDown', 16);
  if (!btn.dataset.bound) {
    btn.dataset.bound = '1';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      openFilterPicker_('Pilih Filter Aktivitas', ACTIVITY_TABS, currentActivityFilter, function (key) {
        currentActivityFilter = key;
        renderActivityTabs();
        renderAktivitasFiltered();
      });
    });
  }
}


var aktivitasReqSeq_ = 0;

function currentAktivitasParams_() {
  var q = (document.getElementById('activity-search').value || '').trim();
  var arah = currentActivityFilter === 'all' ? '' : currentActivityFilter;
  return { arah: arah, q: q, key: feedKey_(arah, q.toLowerCase()) };
}

function loadPekerjaanAktivitas(force) {
  var session = loadSession();
  if (!session) return;
  renderActivityTabs();

  var prm = currentAktivitasParams_();
  var container = document.getElementById('activity-feed-list');
  var isDefault = prm.key === feedKey_('', '');
  var cached = pageDataCache.pekerjaanAktivitasByKey[prm.key];

  if (!cached && !force && isDefault) {
    // Salinan tersimpan: tampilkan dulu (t:0 = dianggap basi, tetap diperbarui dari server).
    var pc = persistGet_('aktivitas');
    if (pc) {
      cached = { list: pc.list, total: pc.total, hasMore: pc.hasMore, t: 0 };
      pageDataCache.pekerjaanAktivitasByKey[prm.key] = cached;
    }
  }

  var fresh = cached && (Date.now() - (cached.t || 0)) < FEED_FRESH_MS_;
  if (cached && !force && fresh) { renderAktivitasFeed_(cached, prm); return; }

  var alreadyShown = cached && container.dataset.feedKey === prm.key;
  if (cached && !alreadyShown) renderAktivitasFeed_(cached, prm);
  else if (!cached) renderListSkeleton_('activity-feed-list', 3, prm.q ? 'Mencari aktivitas...' : 'Memuat aktivitas tim...');

  var seq = ++aktivitasReqSeq_;
  fetchFeedPage_({ view: 'aktivitas', arah: prm.arah, q: prm.q, limit: FEED_PAGE_SIZE_, offset: 0 }, function (data) {
    if (seq !== aktivitasReqSeq_) return; // filter/pencarian sudah berganti
    if (isDefault) persistSet_('aktivitas', { list: data.pekerjaan, total: data.total, hasMore: data.hasMore });
    // Tidak berubah -> cukup tandai segar, tanpa gambar ulang (tanpa kedip, scroll tetap).
    if (cached && container.dataset.feedKey === prm.key &&
        sameFeedList_(cached.list.slice(0, data.pekerjaan.length), data.pekerjaan) && cached.total === data.total) {
      cached.t = Date.now();
      return;
    }
    var entry = { list: data.pekerjaan, total: data.total, hasMore: data.hasMore, t: Date.now() };
    pageDataCache.pekerjaanAktivitasByKey[prm.key] = entry;
    renderAktivitasFeed_(entry, prm);
  }, function (err) {
    if (seq !== aktivitasReqSeq_ || cached) return;
    renderLoadError_(container, 'aktivitas', function () { loadPekerjaanAktivitas(true); }, err);
  });
}

function renderAktivitasFeed_(entry, prm) {
  document.getElementById('activity-feed-list').dataset.feedKey = prm.key;
  renderFeedList_(document.getElementById('activity-feed-list'), entry,
    '<div class="empty-state"><div class="empty-state-icon">' + mdIcon('inbox', 26) + '</div>' + (prm.q ? 'Tidak ada aktivitas yang cocok.' : 'Belum ada aktivitas.') + '</div>',
    function (done, fail) {
      fetchFeedPage_({ view: 'aktivitas', arah: prm.arah, q: prm.q, limit: FEED_PAGE_SIZE_, offset: entry.list.length }, function (data) {
        if (pageDataCache.pekerjaanAktivitasByKey[prm.key] !== entry) { return; } // cache sudah diganti
        entry.list = entry.list.concat(data.pekerjaan);
        entry.total = data.total;
        entry.hasMore = data.hasMore;
        done(data.pekerjaan);
      }, fail);
    });
}

// Filter & pencarian kini dijalankan di server (akurat atas seluruh data).
function renderAktivitasFiltered() { loadPekerjaanAktivitas(); }

document.getElementById('activity-search').addEventListener('input', debounce_(renderAktivitasFiltered, 350));

function initPdfRenderButton_() {
  if (!appBootstrap) return;

  var btn = document.getElementById('btn-open-pdf-render');
  if (btn) {
    btn.style.display = 'inline-flex';
    btn.innerHTML = mdIcon('download', 16) + '<span>Download PDF</span>';
    btn.addEventListener('click', function () {
      window.open(appBootstrap.webAppUrl + '?page=pdfrender', '_blank');
    });
  }

  var btnStat = document.getElementById('btn-open-statistik');
  if (btnStat) {
    btnStat.style.display = 'inline-flex';
    btnStat.innerHTML = mdIcon('stats', 16) + '<span>Statistik</span>';
    btnStat.addEventListener('click', function () {
      window.open(appBootstrap.webAppUrl + '?page=statistik', '_blank');
    });
  }

  // Ringkasan collapsible; status diingat di localStorage (per perangkat).
  var toggle = document.getElementById('btn-toggle-ringkasan');
  var body = document.getElementById('ringkasan-body');
  if (!toggle || !body) return;

  function applyState(open) {
    body.style.display = open ? 'block' : 'none';
    toggle.innerHTML = mdIcon(open ? 'chevronUp' : 'chevronDown', 18);
    try { localStorage.setItem('fs_ringkasan_open', open ? '1' : '0'); } catch (e) {}
  }

  var saved = null;
  try { saved = localStorage.getItem('fs_ringkasan_open'); } catch (e) {}
  var isOpen = saved !== '0';
  applyState(isOpen);

  toggle.addEventListener('click', function () {
    isOpen = !isOpen;
    applyState(isOpen);
  });
}

// ============================================================
// PHOTO VIEWER (Section 18.4) — pinch zoom, double-tap zoom, swipe, close
// ============================================================

var viewerPhotos = [];
var viewerIndex = 0;
var viewerScale = 1;

function openPhotoViewer(urls, startIndex) {
  viewerPhotos = urls;
  viewerIndex = startIndex || 0;
  viewerScale = 1;
  updateViewerImage();
  document.getElementById('photo-viewer').classList.add('show');
}

function closePhotoViewer() {
  document.getElementById('photo-viewer').classList.remove('show');
}

var PHOTO_VIEWER_PLACEHOLDER =
  'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
    '<rect width="200" height="200" fill="#374151"/>' +
    '<text x="50%" y="50%" fill="#9ca3af" font-size="14" text-anchor="middle" dy=".3em">Foto tidak dapat dimuat</text>' +
    '</svg>'
  );

function updateViewerImage() {
  var img = document.getElementById('viewer-img');
  img.onerror = function () {
    console.warn('Gagal memuat foto di Photo Viewer. URL:', viewerPhotos[viewerIndex]);
    img.onerror = null;
    img.src = PHOTO_VIEWER_PLACEHOLDER;
  };
  img.src = viewerPhotos[viewerIndex];
  viewerScale = 1;
  img.style.transform = 'scale(1)';
  document.getElementById('viewer-counter').textContent =
    (viewerIndex + 1) + ' / ' + viewerPhotos.length;
}

document.getElementById('viewer-close').addEventListener('click', closePhotoViewer);

(function setupViewerGestures() {
  var img = document.getElementById('viewer-img');
  var touchStartX = 0, touchStartY = 0;
  var lastTapTime = 0;
  var pinchStartDist = null;
  var pinchStartScale = 1;

  function distance(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  img.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinchStartDist = distance(e.touches[0], e.touches[1]);
      pinchStartScale = viewerScale;
    } else if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  });

  img.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinchStartDist) {
      var newDist = distance(e.touches[0], e.touches[1]);
      var scale = pinchStartScale * (newDist / pinchStartDist);
      viewerScale = Math.min(4, Math.max(1, scale));
      img.style.transform = 'scale(' + viewerScale + ')';
      e.preventDefault();
    }
  }, { passive: false });

  img.addEventListener('touchend', function (e) {
    if (e.changedTouches.length === 1 && viewerScale === 1) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0 && viewerIndex < viewerPhotos.length - 1) {
          viewerIndex++;
          updateViewerImage();
        } else if (dx > 0 && viewerIndex > 0) {
          viewerIndex--;
          updateViewerImage();
        }
        return;
      }

      var now = new Date().getTime();
      if (now - lastTapTime < 300) {
        // Double tap
        viewerScale = viewerScale > 1 ? 1 : 2.5;
        img.style.transform = 'scale(' + viewerScale + ')';
      }
      lastTapTime = now;
    }
    pinchStartDist = null;
  });
})();

// ============================================================
// PULL TO REFRESH (Sprint 6.02 #6) — hanya Beranda & Pekerjaan
// ============================================================

(function setupPullToRefresh() {
  var PULL_THRESHOLD = 70;
  var PULL_MAX_VISUAL = 100;
  var pullStartY = null;
  var pullDistance = 0;
  var indicator = document.getElementById('pull-indicator');
  var indicatorText = document.getElementById('pull-indicator-text');

  function pullablePage() {
    return currentPage === 'beranda' || currentPage === 'pekerjaan' || currentPage === 'jadwal' || currentPage === 'aktivitas';
  }

  document.addEventListener('touchstart', function (e) {
    if (pullablePage() && window.scrollY === 0) {
      pullStartY = e.touches[0].clientY;
    } else {
      pullStartY = null;
    }
    pullDistance = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (pullStartY === null) return;
    pullDistance = e.touches[0].clientY - pullStartY;
    if (pullDistance > 0 && window.scrollY === 0) {
      var visual = Math.min(pullDistance, PULL_MAX_VISUAL);
      indicator.style.transform = 'translate(-50%, ' + (visual - 60) + 'px)';
      indicatorText.textContent = pullDistance > PULL_THRESHOLD ? 'Lepas untuk refresh' : 'Tarik untuk refresh';
    }
  }, { passive: true });

  document.addEventListener('touchend', function () {
    if (pullStartY !== null && pullDistance > PULL_THRESHOLD) {
      if (currentPage === 'pekerjaan') {
        loadPekerjaanInbox(true);
      } else if (currentPage === 'beranda') {
        loadHomeBootstrap(true);
      } else if (currentPage === 'jadwal') {
        loadRiwayatPekerjaan(true);
      } else if (currentPage === 'aktivitas') {
        loadAktivitasSummary(true);
        loadPekerjaanAktivitas(true);
      }
      indicatorText.textContent = 'Memperbarui...';
      setTimeout(function () {
        indicator.style.transform = 'translate(-50%, -60px)';
      }, 500);
      pullStartY = null;
      pullDistance = 0;
      return;
    }
    indicator.style.transform = 'translate(-50%, -60px)';
    pullStartY = null;
    pullDistance = 0;
  });
})();

// ============================================================
// RIPPLE EFFECT (Patch 7.2)
// ============================================================
function attachRipple(el) {
  if (!el || el.dataset.rippleAttached) return;
  el.dataset.rippleAttached = '1';
  el.classList.add('ripple-surface');
  el.addEventListener('click', function (e) {
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = ((e.clientX || (rect.left + rect.width / 2)) - rect.left - size / 2) + 'px';
    ripple.style.top = ((e.clientY || (rect.top + rect.height / 2)) - rect.top - size / 2) + 'px';
    el.appendChild(ripple);
    setTimeout(function () { ripple.remove(); }, 500);
  });
}

document.querySelectorAll('.fab, .btn-primary').forEach(attachRipple);
