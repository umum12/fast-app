<script>
  // ============================================================
  // SESSION — memakai fs_session yang sama dengan aplikasi utama
  // ============================================================
  var SESSION_KEY = 'fs_session';

  function loadSession() {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function showLoginError(msg) { document.getElementById('login-error').textContent = msg; }

  function handleLogin() {
    var code = document.getElementById('input-access-code').value.trim().toUpperCase();
    if (!code) { showLoginError('Kode akses wajib diisi.'); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({ accessCode: code }));
    currentAccessCode = code;
    fetchPeriod(currentPeriod, true);
  }

  document.getElementById('btn-login').addEventListener('click', handleLogin);
  document.getElementById('input-access-code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleLogin();
  });

  // ============================================================
  // STATE
  // ============================================================
  var currentAccessCode = null;
  var currentPeriod = 'mingguan';
  var currentGran = 'harian';
  var currentData = null;
  var dashboardCache = {};
  var reqSeq = 0;

  var PERIOD_TABS = [
    { key: 'mingguan', label: '7 Hari' },
    { key: 'bulanan', label: '30 Hari' },
    { key: 'tahunan', label: '12 Bulan' },
    { key: 'all', label: 'Semua' }
  ];
  var GRANS = [
    { key: 'harian', label: 'Harian', unit: 'hari', sub: '30 hari terakhir' },
    { key: 'mingguan', label: 'Mingguan', unit: 'minggu', sub: '12 minggu terakhir (awal minggu Senin)' },
    { key: 'bulanan', label: 'Bulanan', unit: 'bulan', sub: '12 bulan terakhir' }
  ];
  var STATUS_LABEL_ = { TERBUKA: 'Belum Diambil', DIKERJAKAN: 'Belum selesai' };

  function esc_(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function num_(n) { return Number(n || 0).toLocaleString('id-ID'); }
  function pct_(n, total) { return total > 0 ? Math.round(n / total * 100) : 0; }
  function pctTxt_(n, total) { return pct_(n, total) + '%'; }
  function $(id) { return document.getElementById(id); }
  function icon_(name) { return '<span class="ms">' + name + '</span>'; }
  function col_(i) { return 'var(--c' + ((i % 7) + 1) + ')'; }

  // Menit -> "45 mnt" / "3 j 20 mnt" / "2 hr 4 j"
  function durasi_(m) {
    m = Math.max(0, Math.round(m));
    if (m < 60) return m + ' mnt';
    var h = Math.floor(m / 60), rm = m % 60;
    if (h < 24) return h + ' j' + (rm ? ' ' + rm + ' mnt' : '');
    var d = Math.floor(h / 24), rh = h % 24;
    return d + ' hr' + (rh ? ' ' + rh + ' j' : '');
  }

  // Selisih terhadap periode lalu — NETRAL (bukan baik/buruk)
  function deltaChip_(cur, prev) {
    if (prev == null) return '';
    if (prev === 0) return cur > 0 ? '<span class="delta">' + icon_('trending_up') + 'Baru</span>' : '<span class="delta">' + icon_('trending_flat') + 'Tetap</span>';
    var d = Math.round((cur - prev) / prev * 100);
    if (d === 0) return '<span class="delta">' + icon_('trending_flat') + 'Tetap</span>';
    return '<span class="delta">' + icon_(d > 0 ? 'trending_up' : 'trending_down') + (d > 0 ? '+' : '−') + Math.abs(d) + '%</span>';
  }

  // ============================================================
  // PERIODE & FETCH
  // ============================================================
  function renderPeriodTabs() {
    var c = $('period-tabs');
    c.innerHTML = '';
    PERIOD_TABS.forEach(function (tab) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (tab.key === currentPeriod ? ' active' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', tab.key === currentPeriod ? 'true' : 'false');
      b.textContent = tab.label;
      b.addEventListener('click', function () {
        if (currentPeriod === tab.key) return;
        currentPeriod = tab.key;
        setSnapMsg_('', '');
        renderPeriodTabs();
        fetchPeriod(tab.key, false);
      });
      c.appendChild(b);
    });
  }

  function skeleton_() {
    var s = '<div class="kpi-grid">';
    for (var i = 0; i < 4; i++) s += '<div class="kpi"><div class="sk" style="height:14px;width:70%"></div><div class="sk" style="height:30px;width:50%;margin:10px 0 8px"></div><div class="sk" style="height:12px;width:60%"></div></div>';
    s += '</div>';
    for (var j = 0; j < 3; j++) s += '<div class="card"><div class="sk" style="height:16px;width:45%;margin-bottom:14px"></div><div class="sk" style="height:110px"></div></div>';
    return s;
  }

  function fetchPeriod(period, isManualLogin) {
    $('screen-login').style.display = 'none';
    $('screen-dashboard').style.display = 'block';
    if (dashboardCache[period]) { renderDashboard(dashboardCache[period]); return; }
    $('dash-body').innerHTML = skeleton_();
    var seq = ++reqSeq;
    google.script.run
      .withSuccessHandler(function (response) {
        if (seq !== reqSeq) return; // respons periode lama diabaikan
        if (!response || !response.success) {
          if (isManualLogin) {
            $('screen-dashboard').style.display = 'none';
            $('screen-login').style.display = 'flex';
            showLoginError((response && response.error) || 'Gagal memuat.');
          } else {
            $('screen-dashboard').style.display = 'none';
            $('screen-login').style.display = 'flex';
          }
          return;
        }
        dashboardCache[period] = response.data;
        renderDashboard(response.data);
      })
      .withFailureHandler(function () {
        if (seq !== reqSeq) return;
        if (isManualLogin) {
          $('screen-dashboard').style.display = 'none';
          $('screen-login').style.display = 'flex';
          showLoginError('Gagal terhubung ke server. Coba lagi.');
        } else {
          $('dash-body').innerHTML = '<div class="card"><div class="empty">Gagal memuat data. Coba lagi.</div></div>';
        }
      })
      .getStatistikDashboard(currentAccessCode, period);
  }

  // ============================================================
  // RENDER
  // ============================================================
  function renderDashboard(data) {
    currentData = data;
    $('generated-at').textContent = data.snapshotAt || data.generatedAt || '-';
    var srcMap = { terjadwal: ' \u00b7 otomatis harian', manual: ' \u00b7 diperbarui manual', awal: ' \u00b7 snapshot pertama' };
    $('snap-src').textContent = srcMap[data.snapshotSource] || '';
    $('range-label').textContent = data.rangeLabel || '';
    var hasNew = !!data.ringkasan;
    var html = '';
    html += kpiHtml_(data);
    if (hasNew) html += validasiHtml_(data);
    html += '<div id="card-tren"></div>';
    if (hasNew && data.ringkasan.prev) html += perbandinganHtml_(data);
    html += '<div class="sec-title">Distribusi aktivitas</div>';
    html += '<div class="dist-grid">' + arahHtml_(data) + lantaiHtml_(data) + kategoriHtml_(data) + personelHtml_(data) + '</div>';
    html += '<div class="sec-title">Rincian kategori</div>' + tabelHtml_(data);
    html += '<div class="sec-title">Tindak lanjut &amp; layanan</div>' + staleHtml_(data) + layananHtml_(data);
    $('dash-body').innerHTML = html;
    renderTren_();
  }

  // ---- Ringkasan ----
  function kpiHtml_(data) {
    var r = data.ringkasan;
    var total = r ? r.total : data.totalPekerjaanPeriode;
    var prev = r && r.prev;
    var st = data.insight && data.insight.stale;
    var follow = st ? (st.terbukaCount + st.dikerjakanCount) : null;
    function card(cls, ico, label, val, sub) {
      return '<div class="kpi ' + cls + '"><div class="kpi-top">' + icon_(ico) + esc_(label) + '</div><div class="kpi-v">' + val + '</div><div class="kpi-s">' + sub + '</div></div>';
    }
    var cmp = function (cur, pv) { return pv != null ? deltaChip_(cur, pv) + ' <span>vs periode lalu</span>' : ''; };
    var out = '<section class="kpi-grid">';
    out += card('k-total', 'assignment', 'Total laporan', num_(total), cmp(total, prev ? prev.total : null) || 'pada periode ini');
    out += card('k-valid', 'verified', 'Tervalidasi', r ? num_(r.tervalidasi) : '—', r ? (cmp(r.tervalidasi, prev ? prev.tervalidasi : null) || pctTxt_(r.tervalidasi, r.selesai) + ' dari laporan selesai') : 'belum tersedia');
    out += card('k-wait', 'hourglass_top', 'Menunggu validasi', r ? num_(r.menunggu) : '—', r ? (cmp(r.menunggu, prev ? prev.menunggu : null) || pctTxt_(r.menunggu, r.selesai) + ' dari laporan selesai') : 'belum tersedia');
    out += card('k-follow', 'warning', 'Perlu tindak lanjut', follow == null ? '—' : num_(follow), follow == null ? '' : 'terbuka &gt; ' + st.terbukaHours + ' j atau berjalan &gt; ' + st.dikerjakanHours + ' j');
    return out + '</section>';
  }

  function validasiHtml_(data) {
    var r = data.ringkasan, base = r.selesai;
    var parts = [
      { n: r.tervalidasiAdmin, name: 'Divalidasi Admin', c: 'var(--color-primary)' },
      { n: r.tervalidasiOtomatis, name: 'Validasi otomatis', c: 'var(--color-accent)' },
      { n: r.menunggu, name: 'Menunggu validasi', c: 'var(--color-warn)' }
    ];
    var bar = '', lg = '';
    parts.forEach(function (p) {
      bar += '<span style="width:' + (base ? p.n / base * 100 : 0) + '%;background:' + p.c + '"></span>';
      lg += '<div class="lg-row"><span class="lg-dot" style="background:' + p.c + '"></span><span class="lg-name">' + p.name + '</span><span class="lg-val">' + num_(p.n) + '</span><span class="lg-pct">' + pctTxt_(p.n, base) + '</span></div>';
    });
    return '<div class="card"><div class="card-head"><div><h2>' + icon_('verified') + 'Status Validasi</h2><p class="sub">Dari ' + num_(base) + ' laporan selesai pada periode ini</p></div></div>' +
      (base ? '<div class="stack" role="img" aria-label="Komposisi status validasi">' + bar + '</div><div class="legend">' + lg + '</div>' : '<div class="empty">Belum ada laporan selesai pada periode ini.</div>') + '</div>';
  }

  // ---- Tren ----
  function trendSeries_() {
    var d = currentData;
    if (d.trendSet && d.trendSet[currentGran]) return d.trendSet[currentGran];
    return d.trend || [];
  }

  function renderTren_() {
    var host = $('card-tren');
    if (!host) return;
    var hasSet = !!(currentData.trendSet);
    var g = GRANS.filter(function (x) { return x.key === currentGran; })[0];
    var series = trendSeries_();
    var max = 0, sum = 0;
    series.forEach(function (b) { sum += b.count; if (b.count > max) max = b.count; });
    var n = series.length;
    var showVal = n <= 12;
    var step = n > 14 ? 5 : (n > 8 ? 2 : 1);
    var cols = 'grid-template-columns:repeat(' + n + ',minmax(0,1fr))';
    var bars = '', labels = '';
    series.forEach(function (b, i) {
      var h = max ? Math.max(b.count ? 4 : 0, Math.round(b.count / max * 100)) : 0;
      bars += '<button type="button" class="tcol' + (b.count ? '' : ' zero') + '" data-i="' + i + '" aria-label="' + esc_(b.label) + ': ' + b.count + ' laporan">' +
        '<span class="tval">' + (showVal && b.count ? b.count : '') + '</span><span class="tbar" style="height:' + h + '%"></span></button>';
      labels += '<span>' + ((n - 1 - i) % step === 0 ? esc_(b.label) : '') + '</span>';
    });
    var gran = '';
    if (hasSet) {
      gran = '<div class="gran" role="tablist" aria-label="Granularitas tren">';
      GRANS.forEach(function (x) { gran += '<button type="button" class="seg-btn' + (x.key === currentGran ? ' active' : '') + '" data-g="' + x.key + '">' + x.label + '</button>'; });
      gran += '</div>';
    }
    host.innerHTML = '<div class="card"><div class="card-head"><div><h2>' + icon_('bar_chart') + 'Tren Aktivitas</h2><p class="sub">' + (hasSet ? g.sub : esc_(currentData.rangeLabel || '')) + '</p></div>' + gran + '</div>' +
      (sum ? '<div class="tchart" style="' + cols + '">' + bars + '</div><div class="tlabels" style="' + cols + '">' + labels + '</div>' +
        '<div class="treadout" id="treadout">Ketuk batang untuk melihat rinciannya.</div>' +
        '<div class="tstats"><span>Total<br><b>' + num_(sum) + '</b></span><span>Rata-rata per ' + (hasSet ? g.unit : 'bucket') + '<br><b>' + (Math.round(sum / n * 10) / 10).toLocaleString('id-ID') + '</b></span></div>'
        : '<div class="empty">Belum ada aktivitas pada rentang ini.</div>') + '</div>';
    host.querySelectorAll('.gran .seg-btn').forEach(function (b) {
      b.addEventListener('click', function () { currentGran = b.getAttribute('data-g'); renderTren_(); });
    });
    host.querySelectorAll('.tcol').forEach(function (b) {
      b.addEventListener('click', function () {
        host.querySelectorAll('.tcol.sel').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        var it = series[parseInt(b.getAttribute('data-i'), 10)];
        $('treadout').innerHTML = '<b>' + esc_(it.label) + '</b> &mdash; ' + num_(it.count) + ' laporan (' + pctTxt_(it.count, sum) + ' dari total grafik)';
      });
    });
  }

  // ---- Perbandingan ----
  function perbandinganHtml_(data) {
    var r = data.ringkasan, p = r.prev;
    var rows = [
      ['Total laporan', r.total, p.total],
      ['Tervalidasi', r.tervalidasi, p.tervalidasi],
      ['Menunggu validasi', r.menunggu, p.menunggu]
    ];
    var out = '';
    rows.forEach(function (x) {
      var mx = Math.max(x[1], x[2], 1);
      out += '<div class="cmp-row"><div class="cmp-h"><span>' + x[0] + '</span>' + deltaChip_(x[1], x[2]) + '</div>' +
        '<div class="cmp-line"><span>Periode ini</span><div class="cmp-track"><div class="cmp-fill now" style="width:' + x[1] / mx * 100 + '%"></div></div><span class="cmp-n">' + num_(x[1]) + '</span></div>' +
        '<div class="cmp-line"><span>Periode lalu</span><div class="cmp-track"><div class="cmp-fill prev" style="width:' + x[2] / mx * 100 + '%"></div></div><span class="cmp-n">' + num_(x[2]) + '</span></div></div>';
    });
    return '<div class="card"><div class="card-head"><div><h2>' + icon_('calendar_month') + 'Perbandingan Antarperiode</h2><p class="sub">Periode ini dibanding rentang sama panjang tepat sebelumnya</p></div></div><div class="cmp">' + out + '</div></div>';
  }

  // ---- Distribusi ----
  function donutHtml_(items, totalLabel) {
    var total = items.reduce(function (a, x) { return a + x.value; }, 0);
    if (!total) return '<div class="empty">Belum ada data pada periode ini.</div>';
    var acc = 0, stops = [];
    items.forEach(function (x, i) {
      var from = acc / total * 100; acc += x.value; var to = acc / total * 100;
      stops.push(col_(i) + ' ' + from + '% ' + to + '%');
    });
    var lg = '';
    items.forEach(function (x, i) {
      lg += '<div class="lg-row"><span class="lg-dot" style="background:' + col_(i) + '"></span><span class="lg-name">' + esc_(x.label) + '</span><span class="lg-val">' + num_(x.value) + '</span><span class="lg-pct">' + pctTxt_(x.value, total) + '</span></div>';
    });
    return '<div class="donut-row"><div class="donut" style="background:conic-gradient(' + stops.join(',') + ')" role="img" aria-label="Diagram distribusi"><div class="donut-hole"><b>' + num_(total) + '</b><small>' + totalLabel + '</small></div></div><div class="legend">' + lg + '</div></div>';
  }

  function arahHtml_(data) {
    if (!data.perArah) return '';
    var items = data.perArah.filter(function (x) { return x.total > 0; }).map(function (x) { return { label: x.label, value: x.total }; });
    return '<div class="card"><div class="card-head"><div><h2>' + icon_('handshake') + 'Jenis Laporan</h2><p class="sub">Mandiri, penugasan Admin, dan lapor/permintaan</p></div></div>' + donutHtml_(items, 'Laporan') + '</div>';
  }

  function lantaiHtml_(data) {
    var items = (data.perLantai || []).map(function (x) { return { label: x.label, value: x.total }; });
    return '<div class="card"><div class="card-head"><div><h2>' + icon_('apartment') + 'Per Lantai</h2><p class="sub">Persebaran laporan berdasarkan lokasi</p></div></div>' + donutHtml_(items, 'Laporan') + '</div>';
  }

  function kategoriHtml_(data) {
    var list = (data.perJenis || []).filter(function (x) { return x.total > 0; });
    var total = list.reduce(function (a, x) { return a + x.total; }, 0);
    var mx = Math.max.apply(null, list.map(function (x) { return x.total; }).concat([1]));
    var body = '';
    list.forEach(function (x, i) {
      body += '<div><div class="hb-top"><span class="hb-name">' + esc_(x.label) + '</span><span class="hb-num">' + num_(x.total) + '<small>' + pctTxt_(x.total, total) + '</small></span></div>' +
        '<div class="hb-track"><div class="hb-fill" style="width:' + x.total / mx * 100 + '%;background:' + col_(i) + '"></div></div></div>';
    });
    return '<div class="card"><div class="card-head"><div><h2>' + icon_('inventory_2') + 'Kategori Pekerjaan</h2><p class="sub">Jumlah laporan dan persentase per kategori</p></div></div>' +
      (list.length ? '<div class="hbars">' + body + '</div>' : '<div class="empty">Belum ada data pada periode ini.</div>') + '</div>';
  }

  function personelHtml_(data) {
    var list = data.personel;
    if (!list && data.ranking) { // server lama: urutkan abjad, buang skor/ranking
      list = data.ranking.map(function (r) { return { displayName: r.displayName, totalLaporanMandiri: r.totalLaporanMandiri, totalPenugasanSelesai: r.totalPenugasanSelesai, total: r.totalGabungan }; })
        .sort(function (a, b) { return String(a.displayName).localeCompare(String(b.displayName), 'id'); });
    }
    list = list || [];
    var total = list.reduce(function (a, x) { return a + x.total; }, 0);
    var mx = Math.max.apply(null, list.map(function (x) { return x.total; }).concat([1]));
    var body = '';
    list.forEach(function (x) {
      body += '<div><div class="hb-top"><span class="hb-name">' + esc_(x.displayName) + '</span><span class="hb-num">' + num_(x.total) + '<small>' + pctTxt_(x.total, total) + '</small></span></div>' +
        '<div class="hb-track"><div class="hb-fill" style="width:' + x.totalLaporanMandiri / mx * 100 + '%;background:var(--c1)"></div><div class="hb-fill" style="width:' + x.totalPenugasanSelesai / mx * 100 + '%;background:var(--c2)"></div></div>' +
        '<div class="hb-sub">' + num_(x.totalLaporanMandiri) + ' mandiri &middot; ' + num_(x.totalPenugasanSelesai) + ' penugasan selesai</div></div>';
    });
    return '<div class="card wide"><div class="card-head"><div><h2>' + icon_('group') + 'Per Personel</h2><p class="sub">Laporan mandiri + penugasan selesai</p></div></div>' +
      (list.length ? '<div class="hbars">' + body + '</div>' : '<div class="empty">Belum ada data personel.</div>') +
      '<div class="note">' + icon_('info') + '<span>Disusun berdasarkan abjad. Jumlah laporan dipengaruhi jadwal, lokasi, dan jenis tugas sehingga bukan ukuran kinerja.</span></div></div>';
  }

  // ---- Tabel ----
  function tabelHtml_(data) {
    var list = (data.perJenis || []).filter(function (x) { return x.total > 0 || (x.prevTotal || 0) > 0; });
    if (!list.length) return '<div class="card"><div class="empty">Belum ada data pada periode ini.</div></div>';
    var total = 0, selesai = 0, valid = 0, prevT = 0, hasPrev = false;
    var rows = '';
    list.forEach(function (x) {
      total += x.total; selesai += x.selesai; valid += (x.tervalidasi || 0);
      if (x.prevTotal != null) { hasPrev = true; prevT += x.prevTotal; }
      rows += '<tr><td>' + esc_(x.label) + '</td><td>' + num_(x.total) + '</td><td>' + '%PCT%' + '</td><td>' + num_(x.selesai) + '</td><td>' + (x.tervalidasi != null ? num_(x.tervalidasi) : '—') + '</td><td class="dl">' + (x.prevTotal != null ? deltaPlain_(x.total, x.prevTotal) : '—') + '</td></tr>';
    });
    // isi persentase setelah total diketahui
    var i = 0;
    rows = rows.replace(/%PCT%/g, function () { var v = list[i++]; return pctTxt_(v.total, total); });
    return '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategori</th><th>Total</th><th>%</th><th>Selesai</th><th>Valid</th><th>Δ</th></tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td>Jumlah</td><td>' + num_(total) + '</td><td>100%</td><td>' + num_(selesai) + '</td><td>' + num_(valid) + '</td><td class="dl">' + (hasPrev ? deltaPlain_(total, prevT) : '—') + '</td></tr></tfoot></table></div></div>';
  }

  function deltaPlain_(cur, prev) {
    if (prev === 0) return cur > 0 ? 'Baru' : '0%';
    var d = Math.round((cur - prev) / prev * 100);
    return d === 0 ? '0%' : (d > 0 ? '+' : '−') + Math.abs(d) + '%';
  }

  // ---- Tindak lanjut & layanan ----
  function staleHtml_(data) {
    var st = data.insight && data.insight.stale;
    if (!st) return '';
    var head = '<div class="card"><div class="card-head"><div><h2>' + icon_('warning') + 'Perlu Tindak Lanjut</h2><p class="sub">Belum Diambil &gt; ' + st.terbukaHours + ' jam, atau belum selesai &gt; ' + st.dikerjakanHours + ' jam (semua periode)</p></div></div>';
    if (!st.items.length) return head + '<div class="ok-row">' + icon_('check_circle') + 'Semua pekerjaan tertangani tepat waktu.</div></div>';
    var html = head + '<div class="stale-chips"><span class="chip amber">' + st.terbukaCount + ' Belum Diambil</span><span class="chip rose">' + st.dikerjakanCount + ' belum selesai</span></div>';
    st.items.forEach(function (it) {
      var tone = it.status === 'DIKERJAKAN' ? 'rose' : 'amber';
      var meta = [STATUS_LABEL_[it.status] || it.status, it.lantai, it.handler].filter(Boolean).join(' · ');
      html += '<div class="stale-item"><div class="stale-main"><div class="stale-subj">' + esc_(it.subject || '(tanpa subjek)') + '</div><div class="stale-meta">' + esc_(meta) + '</div></div><span class="stale-age ' + tone + '">' + esc_(it.ageLabel) + '</span></div>';
    });
    var more = st.terbukaCount + st.dikerjakanCount - st.items.length;
    if (more > 0) html += '<div class="stale-meta" style="padding-top:8px;">+ ' + more + ' pekerjaan lainnya</div>';
    return html + '</div>';
  }

  function layananHtml_(data) {
    var ins = data.insight || {}, r = ins.respons || {}, p = ins.penyelesaian || {};
    function tile(l, v, s) { return '<div class="ins-tile"><div class="ins-l">' + l + '</div><div class="ins-v">' + v + '</div><div class="ins-s">' + s + '</div></div>'; }
    return '<div class="card"><div class="card-head"><div><h2>' + icon_('schedule') + 'Waktu Layanan</h2><p class="sub">Rata-rata pekerjaan kolaboratif pada periode ini</p></div></div><div class="ins-grid">' +
      tile('Rata-rata diambil', r.avgMenit != null ? durasi_(r.avgMenit) : '—', r.n ? 'sejak dibuat (' + r.n + ' pekerjaan)' : 'belum ada data') +
      tile('Rata-rata selesai', p.avgMenit != null ? durasi_(p.avgMenit) : '—', p.n ? 'sejak mulai dikerjakan (' + p.n + ')' : 'belum ada data') + '</div></div>';
  }

  // ============================================================
  // PERBARUI SNAPSHOT — membaca ulang seluruh sheet di server
  // ============================================================
  var refreshing = false;

  function setSnapMsg_(text, cls) {
    var el = $('snap-msg');
    el.textContent = text || '';
    el.className = 'snap-msg' + (cls ? ' ' + cls : '');
  }

  function refreshSnapshot_() {
    if (refreshing || !currentAccessCode) return;
    refreshing = true;
    var period = currentPeriod;
    var btn = $('btn-refresh');
    btn.disabled = true; btn.classList.add('busy');
    $('btn-refresh-txt').textContent = 'Memperbarui\u2026';
    setSnapMsg_('Membaca seluruh data, mohon tunggu sebentar.', '');
    function done_() {
      refreshing = false;
      btn.disabled = false; btn.classList.remove('busy');
      $('btn-refresh-txt').textContent = 'Perbarui';
    }
    google.script.run
      .withSuccessHandler(function (response) {
        done_();
        if (!response || !response.success) {
          setSnapMsg_((response && response.error) || 'Gagal memperbarui statistik.', 'err');
          return;
        }
        dashboardCache = {};                        // periode lain ikut basi
        dashboardCache[period] = response.data;
        reqSeq++;                                   // abaikan respons lama yang masih jalan
        if (currentPeriod === period) renderDashboard(response.data);
        setSnapMsg_('Statistik diperbarui.', 'ok');
        setTimeout(function () { if ($('snap-msg').classList.contains('ok')) setSnapMsg_('', ''); }, 4000);
      })
      .withFailureHandler(function () {
        done_();
        setSnapMsg_('Gagal terhubung ke server. Coba lagi.', 'err');
      })
      .refreshStatistikSnapshot(currentAccessCode, period);
  }

  $('btn-refresh').addEventListener('click', refreshSnapshot_);

  // ============================================================
  // INIT
  // ============================================================
  renderPeriodTabs();
