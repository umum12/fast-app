<script>
/**
 * script-push.html — Notifikasi Push (PWA GitHub Pages)
 *
 * File BARU. Di-include di index.html SETELAH script-aktivitas.
 * - Kartu "Notifikasi" di menu Akun: Aktifkan / Kirim Tes / Matikan.
 * - Hanya aktif di versi GitHub Pages (ada window.FASTAPP_CONFIG dari
 *   config.js) DAN Firebase sudah diisi di firebase-config.js. Di /exec
 *   (Apps Script) kartu tersembunyi — service worker tidak bisa jalan di sana.
 * - SDK Firebase dimuat dinamis hanya saat dibutuhkan (Aktifkan / sinkron).
 * - Service worker (sw.js) yang menampilkan notifikasi; file ini hanya
 *   mengurus izin, token, dan pendaftaran token ke server.
 */
var PushUI = (function () {
  var SDK_VERSION = '10.14.1';
  var LS_ON = 'fs_push_on';          // '1' bila pengguna mengaktifkan di perangkat ini
  var LS_TOKEN = 'fs_push_token';
  var LS_SYNC = 'fs_push_sync';      // 'KODE|timestamp' — sinkron token ke akun yang login
  var SYNC_EVERY_MS = 24 * 60 * 60 * 1000;

  var accessCode = '';
  var busy = false;
  var sdkPromise = null;

  function cfg() { return window.FASTAPP_FIREBASE || {}; }
  function ls(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val);
    } catch (e) {}
    return null;
  }
  function el(id) { return document.getElementById(id); }

  function isGitHubMode() { return !!window.FASTAPP_CONFIG; }
  function isConfigured() { var c = cfg(); return !!(c.apiKey && c.projectId && c.messagingSenderId && c.appId && c.vapidKey); }
  function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
  function browserSupports() { return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }

  function deviceLabel() {
    var ua = navigator.userAgent || '';
    var os = /android/i.test(ua) ? 'Android' : isIos() ? 'iOS' : /windows/i.test(ua) ? 'Windows' : /mac/i.test(ua) ? 'Mac' : /linux/i.test(ua) ? 'Linux' : 'Perangkat';
    var br = /edg\//i.test(ua) ? 'Edge' : /chrome|crios/i.test(ua) ? 'Chrome' : /safari/i.test(ua) ? 'Safari' : /firefox|fxios/i.test(ua) ? 'Firefox' : 'Browser';
    return os + ' · ' + br + (isStandalone() ? ' (PWA)' : '');
  }

  // ---------- panggilan backend (google.script.run / adapter) ----------
  function call(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || 'Gagal terhubung ke server.'));
      });
      runner[fnName].apply(runner, args);
    });
  }
  function unwrap(res, fallbackMsg) {
    if (res && res.success) return res.data;
    throw new Error((res && res.error) || fallbackMsg || 'Permintaan gagal.');
  }

  // ---------- SDK Firebase (dimuat dinamis) ----------
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Gagal memuat komponen notifikasi (cek koneksi internet).')); };
      document.head.appendChild(s);
    });
  }
  function loadSdk() {
    if (sdkPromise) return sdkPromise;
    var base = 'https://www.gstatic.com/firebasejs/' + SDK_VERSION + '/';
    sdkPromise = loadScript(base + 'firebase-app-compat.js')
      .then(function () { return loadScript(base + 'firebase-messaging-compat.js'); })
      .then(function () {
        if (!window.firebase.apps.length) {
          var c = cfg();
          window.firebase.initializeApp({
            apiKey: c.apiKey, authDomain: c.authDomain, projectId: c.projectId,
            messagingSenderId: c.messagingSenderId, appId: c.appId
          });
        }
        return window.firebase.messaging();
      })
      .catch(function (e) { sdkPromise = null; throw e; });
    return sdkPromise;
  }

  function getRegistration() {
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      return reg || navigator.serviceWorker.register('sw.js');
    }).then(function () { return navigator.serviceWorker.ready; });
  }

  function fetchToken() {
    return Promise.all([loadSdk(), getRegistration()]).then(function (r) {
      return r[0].getToken({ vapidKey: cfg().vapidKey, serviceWorkerRegistration: r[1] });
    }).then(function (token) {
      if (!token) throw new Error('Token notifikasi tidak diterima. Coba lagi.');
      return token;
    });
  }

  // ---------- tampilan ----------
  function setStatus(text, tone) {
    var p = el('push-status-text');
    if (!p) return;
    p.textContent = text;
    p.setAttribute('data-tone', tone || '');
  }
  function show(id, on) { var e = el(id); if (e) e.style.display = on ? '' : 'none'; }

  // ---------- indikator titik di header ----------
  // Status AKTUAL, bukan sekadar toggle: konfigurasi lengkap + izin 'granted'
  // + penanda aktif + langganan push benar-benar ada di browser (PushManager).
  var indicatorSeq = 0;
  function setDot(state, title) {
    var dot = document.querySelector('#screen-app .header-status .status-dot') || document.querySelector('.header-status .status-dot');
    if (!dot) return;
    dot.classList.toggle('is-on', state === 'on');
    dot.classList.toggle('is-off', state === 'off');
    dot.title = title || '';
  }
  var healing = false;
  var lastHealAt = 0;

  /**
   * Status AKTUAL perangkat ini:
   *  'na'   : tidak tersedia (versi /exec atau Firebase belum diisi)
   *  'off'  : tidak didukung / izin ditolak / belum diaktifkan
   *  'lost' : sudah diaktifkan & izin ada, tetapi langganan push di browser HILANG
   *  'on'   : langganan push benar-benar ada
   */
  function permissionGranted() {
    return browserSupports() && Notification.permission === 'granted';
  }

  /** Langganan push nyata dari service worker; 'unknown' bila service worker belum siap. */
  function readSubscription() {
    return Promise.race([
      navigator.serviceWorker.ready,
      new Promise(function (res) { setTimeout(function () { res(null); }, 6000); })
    ]).then(function (reg) {
      if (!reg || !reg.pushManager) return { known: false, sub: null };
      return reg.pushManager.getSubscription().then(function (sub) { return { known: true, sub: sub, scope: reg.scope }; });
    }).catch(function () { return { known: false, sub: null }; });
  }

  var lastDiag = '';
  var DIAG_KEY = 'fs_push_diag';
  function pushDiagLog(line) {
    // Simpan 4 catatan terakhir (lintas halaman: index / buat) agar bisa dibandingkan.
    var t = new Date(), hh = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
    var arr = [];
    try { arr = JSON.parse(ls(DIAG_KEY) || '[]'); } catch (e) {}
    var entry = hh + ' ' + line;
    if (arr.length && arr[arr.length - 1].slice(9) === line) return;
    arr.push(entry); if (arr.length > 4) arr = arr.slice(-4);
    ls(DIAG_KEY, JSON.stringify(arr));
  }
  function detectState() {
    if (!isGitHubMode() || !isConfigured()) return Promise.resolve('na');
    if (!browserSupports() || Notification.permission === 'denied') return Promise.resolve('off');
    if (!permissionGranted()) {
      lastDiag = 'Izin: ' + Notification.permission + ' · Mode: ' + (isStandalone() ? 'aplikasi' : 'browser') + ' · Halaman: ' + location.pathname.split('/').pop();
      pushDiagLog(lastDiag);
      return Promise.resolve('off');
    }
    return readSubscription().then(function (r) {
      var marked = ls(LS_ON) === '1';
      lastDiag = 'Izin: diberikan · Service worker: ' + (r.known ? 'siap' : 'belum siap') +
        ' · Langganan: ' + (r.sub ? 'ada' : 'tidak ada') + ' · Penanda: ' + (marked ? 'ya' : 'tidak') +
        ' · Mode: ' + (isStandalone() ? 'aplikasi' : 'browser') + ' · Halaman: ' + location.pathname.split('/').pop() +
        (r.scope ? ' · Scope: ' + r.scope.replace(location.origin, '') : '');
      pushDiagLog(lastDiag);
      if (!r.known) return 'unknown';                       // jangan menebak merah
      if (r.sub) { if (!marked) ls(LS_ON, '1'); return 'on'; } // langganan nyata = aktif (penanda dipulihkan)
      return marked ? 'lost' : 'off';
    });
  }

  var unknownRetries = 0;
  function refreshIndicator() {
    var seq = ++indicatorSeq;
    detectState().then(function (state) {
      if (seq !== indicatorSeq) return;
      if (state === 'adopt') {
        ls(LS_ON, '1');
        lastHealAt = 0; healing = false;
        state = 'lost'; // jalankan pendaftaran ulang token ke akun yang login
      }
      if (state === 'na') setDot('', '');
      else if (state === 'on') setDot('on', 'Notifikasi aktif');
      else setDot('off', state === 'lost' ? 'Notifikasi terputus' : 'Notifikasi nonaktif');
      renderCard(state);
      if (state === 'lost') heal();
    });
  }

  /** Pulihkan otomatis langganan yang hilang (tanpa pengguna Matikan → Aktifkan). */
  function heal() {
    if (healing || busy || !accessCode) return;
    if (Date.now() - lastHealAt < 60000) return; // jangan mengulang terus-menerus
    healing = true; lastHealAt = Date.now();
    setStatus('Notifikasi terputus. Menyambungkan ulang...', 'warn');
    fetchToken().then(function (token) {
      return call('registerPushToken', accessCode, token, deviceLabel()).then(function (res) {
        unwrap(res);
        ls(LS_TOKEN, token); ls(LS_SYNC, accessCode + '|' + Date.now());
      });
    }).catch(function () {}).then(function () { healing = false; refreshIndicator(); });
  }

  function contextHint() {
    var ua = navigator.userAgent || '';
    var inFrame = false;
    try { inFrame = window.top !== window.self; } catch (e) { inFrame = true; }
    if (inFrame) return 'Aplikasi ini terbuka di dalam frame/halaman lain (mis. Launcher), sehingga izin notifikasi tidak bisa dipakai. Buka FAST langsung di tab atau aplikasi terpasang.';
    if (/; wv\)|FBAN|FBAV|Instagram|Line\/|Telegram|GSA\//i.test(ua)) return 'Aplikasi terbuka di browser bawaan aplikasi lain. Izin notifikasi terpisah dari Chrome/aplikasi terpasang — buka lewat Chrome atau aplikasi FAST yang terpasang.';
    if (!isStandalone()) return 'Terbuka di tab browser, bukan aplikasi terpasang. Bila notifikasi aktif di aplikasi terpasang tetapi tidak di sini, kemungkinan browser/profil berbeda.';
    return '';
  }

  function render() { refreshIndicator(); }

  var DIAG_COLS = [['Waktu', null], ['Izin', 'Izin'], ['Service Worker', 'Service worker'], ['Langganan', 'Langganan'], ['Penanda', 'Penanda'], ['Mode', 'Mode'], ['Halaman', 'Halaman'], ['Scope', 'Scope']];
  function showDiag() {
    var box = el('push-diag-box'), wrap = el('push-details');
    if (!box) return;
    var arr = [];
    try { arr = JSON.parse(ls(DIAG_KEY) || '[]'); } catch (e) {}
    if (wrap) wrap.style.display = arr.length ? '' : 'none';
    var table = document.createElement('table');
    table.className = 'akun-table';
    var thead = table.createTHead().insertRow();
    DIAG_COLS.forEach(function (c) { var th = document.createElement('th'); th.textContent = c[0]; thead.appendChild(th); });
    var tbody = table.createTBody();
    arr.forEach(function (line) {
      var row = tbody.insertRow();
      var fields = {};
      String(line).slice(9).split(' · ').forEach(function (part) {
        var i = part.indexOf(': ');
        if (i > 0) fields[part.slice(0, i)] = part.slice(i + 2);
      });
      DIAG_COLS.forEach(function (c) {
        var td = row.insertCell();
        var v = c[1] === null ? String(line).slice(0, 8) : (fields[c[1]] || '-');
        if (c[1] === 'Langganan' || c[1] === 'Penanda') {
          var good = (v === 'ada' || v === 'ya');
          var badge = document.createElement('span');
          badge.className = 'akun-badge ' + (good ? 'ok' : 'off');
          badge.textContent = v; td.appendChild(badge);
        } else if (c[1] === 'Scope') {
          var code = document.createElement('code'); code.textContent = v; td.appendChild(code);
        } else { td.textContent = v; }
      });
    });
    box.innerHTML = '';
    box.appendChild(table);
  }

  function renderCard(state) {
    var card = el('card-notifikasi');
    if (!card) return;
    showDiag();
    var hintEl = el('push-hint-text');
    if (hintEl) {
      var hint = state === 'on' ? '' : contextHint();
      hintEl.textContent = hint;
      hintEl.style.display = hint ? '' : 'none';
    }
    if (state === 'na') { card.style.display = 'none'; return; }
    card.style.display = '';

    show('btn-push-enable', false); show('btn-push-test', false); show('btn-push-disable', false);

    if (!browserSupports()) {
      if (isIos() && !isStandalone()) {
        setStatus('Di iPhone/iPad, notifikasi hanya bisa dipakai dari aplikasi yang sudah ditambahkan ke Layar Utama: buka menu Bagikan di Safari → "Tambah ke Layar Utama", lalu buka aplikasi dari ikonnya dan aktifkan di sini.', 'warn');
      } else {
        setStatus('Browser ini belum mendukung notifikasi. Gunakan Chrome/Edge terbaru atau pasang aplikasinya (PWA).', 'warn');
      }
      return;
    }
    if (Notification.permission === 'denied') {
      setStatus('Notifikasi diblokir untuk aplikasi ini. Izinkan kembali lewat pengaturan situs/aplikasi di perangkat Anda, lalu muat ulang.', 'warn');
      return;
    }
    if (state === 'on') {
      setStatus('Aktif di perangkat ini. Anda akan diberi tahu saat ada pekerjaan baru atau komentar baru.', 'ok');
      show('btn-push-test', true); show('btn-push-disable', true);
    } else if (state === 'lost') {
      if (healing) { setStatus('Notifikasi terputus. Menyambungkan ulang...', 'warn'); }
      else {
        setStatus('Notifikasi terputus di perangkat ini. Tekan Aktifkan untuk menyambungkan kembali.', 'warn');
        show('btn-push-enable', true); show('btn-push-disable', true);
      }
    } else {
      setStatus('Dapatkan pemberitahuan saat ada pekerjaan baru untuk Anda dan komentar baru di pekerjaan terkait.');
      show('btn-push-enable', true);
    }
  }

  function setBusy(on, label) {
    busy = on;
    ['btn-push-enable', 'btn-push-test', 'btn-push-disable'].forEach(function (id) {
      var b = el(id); if (b) b.disabled = on;
    });
    if (on && label) setStatus(label);
  }
  function toast(msg, type) { if (typeof showSnackbar === 'function') showSnackbar(msg, type || 'info'); }

  // ---------- aksi ----------
  function enable() {
    if (busy) return;
    if (!browserSupports()) { render(); return; }
    setBusy(true, 'Meminta izin notifikasi...');
    var p = (Notification.permission === 'granted') ? Promise.resolve('granted') : Notification.requestPermission();
    Promise.resolve(p).then(function (perm) {
      if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Izin notifikasi ditolak.' : 'Izin notifikasi tidak diberikan.');
      setStatus('Menyiapkan perangkat...');
      return fetchToken();
    }).then(function (token) {
      setStatus('Mendaftarkan perangkat...');
      return call('registerPushToken', accessCode, token, deviceLabel()).then(function (res) {
        unwrap(res, 'Gagal mendaftarkan perangkat.');
        ls(LS_TOKEN, token); ls(LS_ON, '1'); ls(LS_SYNC, accessCode + '|' + Date.now());
        toast('Notifikasi diaktifkan', 'success');
      });
    }).catch(function (e) {
      toast(e.message || 'Gagal mengaktifkan notifikasi.', 'error');
    }).then(function () { setBusy(false); render(); });
  }

  function disable() {
    if (busy) return;
    setBusy(true, 'Mematikan notifikasi...');
    var token = ls(LS_TOKEN);
    var done = function () { ls(LS_ON, null); ls(LS_TOKEN, null); ls(LS_SYNC, null); };
    var tasks = [];
    if (token) tasks.push(call('unregisterPushToken', accessCode, token).catch(function () {}));
    Promise.all(tasks).then(function () {
      if (sdkPromise) { return sdkPromise.then(function (m) { return m.deleteToken(); }).catch(function () {}); }
    }).then(function () {
      // Batalkan juga langganan push yang nyata di browser (SDK mungkin belum dimuat di halaman ini);
      // tanpa ini status aktual akan kembali "aktif" karena langganan masih ada.
      return readSubscription().then(function (r) {
        return r.sub && r.sub.unsubscribe ? r.sub.unsubscribe().catch(function () {}) : null;
      });
    }).then(function () {
      return navigator.serviceWorker.getRegistration().then(function (reg) {
        return reg && reg.pushManager ? reg.pushManager.getSubscription() : null;
      }).then(function (sub) { return sub ? sub.unsubscribe() : null; }).catch(function () {});
    }).then(function () {
      done();
      toast('Notifikasi dimatikan', 'success');
    }).then(function () { setBusy(false); render(); });
  }

  function sendTest() {
    if (busy) return;
    setBusy(true, 'Mengirim notifikasi tes...');
    call('sendTestPush', accessCode).then(function (res) {
      unwrap(res, 'Gagal mengirim notifikasi tes.');
      toast('Tes terkirim — notifikasi akan muncul sebentar lagi', 'success');
    }).catch(function (e) {
      toast(e.message, 'error');
    }).then(function () { setBusy(false); render(); });
  }

  /**
   * Dipanggil setiap kali aplikasi terbuka & login. Bila notifikasi sudah
   * aktif di perangkat ini, token didaftarkan ulang ke AKUN YANG SEDANG LOGIN
   * (perangkat bersama: kepemilikan pindah ke pengguna terakhir) — maksimal
   * sekali per 24 jam per akun agar tidak memuat SDK di setiap buka aplikasi.
   */
  function syncOnLogin() {
    if (!isGitHubMode() || !isConfigured() || !browserSupports()) return;
    if (ls(LS_ON) !== '1' || Notification.permission !== 'granted') return;
    var last = (ls(LS_SYNC) || '').split('|');
    if (last[0] === accessCode && (Date.now() - (parseInt(last[1], 10) || 0)) < SYNC_EVERY_MS) return;
    fetchToken().then(function (token) {
      return call('registerPushToken', accessCode, token, deviceLabel()).then(function (res) {
        unwrap(res);
        ls(LS_TOKEN, token); ls(LS_SYNC, accessCode + '|' + Date.now());
      });
    }).catch(function () { /* diam-diam; dicoba lagi pada pembukaan berikutnya */ });
  }

  // Ikon pada kartu menu Akun (SVG inline dari mdIcon; tanpa ketergantungan CDN).
  function applyAkunIcons() {
    var nodes = document.querySelectorAll('[data-ico]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.getAttribute('data-ico-done')) continue;
      var big = n.classList.contains('akun-card-icon');
      n.innerHTML = mdIcon(n.getAttribute('data-ico'), big ? 22 : 18);
      n.setAttribute('data-ico-done', '1');
    }
  }

  function init(session) {
    applyAkunIcons();
    accessCode = (session && session.accessCode) || '';
    if (!accessCode) return;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    var be = el('btn-push-enable'), bt = el('btn-push-test'), bd = el('btn-push-disable');
    if (be && !be._pushBound) { be._pushBound = true; be.addEventListener('click', enable); }
    if (bt && !bt._pushBound) { bt._pushBound = true; bt.addEventListener('click', sendTest); }
    if (bd && !bd._pushBound) { bd._pushBound = true; bd.addEventListener('click', disable); }
    render();
    syncOnLogin();
    setTimeout(refreshIndicator, 6000);
    if (!watching) {
      watching = true;
      try {
        if (navigator.permissions && navigator.permissions.query) {
          navigator.permissions.query({ name: 'notifications' }).then(function (st) { st.onchange = render; }).catch(function () {});
        }
      } catch (e) {}
      document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
      window.addEventListener('focus', render);
    }
  }
  var watching = false;

  return { init: init, refreshIndicator: refreshIndicator };
})();

// Dipanggil otomatis setelah renderApp (script-core.html) tanpa mengubah file itu.
(function () {
  var original = window.renderApp;
  if (typeof original !== 'function') return;
  window.renderApp = function (bootstrap, session) {
    var out = original.apply(this, arguments);
    try { PushUI.init(session || (typeof loadSession === 'function' ? loadSession() : null)); } catch (e) {}
    return out;
  };
})();
</script>
