<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Koneksi - FAST APP</title>
<script src="config.js"></script><script src="api-adapter.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#1b2430}
h1{font-size:20px} button,input{font:inherit;padding:10px 12px;margin:4px 0;border-radius:8px;border:1px solid #bbb}
button{background:#1F4E9C;color:#fff;border:0;cursor:pointer} button.g{background:#666}
pre{background:#f3f5f8;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.ok{color:#1a7f37;font-weight:700}.bad{color:#c62828;font-weight:700}
</style></head><body>
<h1>Uji Koneksi GitHub Pages ⇄ Apps Script</h1>
<p>EXEC_URL: <code id="u"></code></p>
<input id="code" placeholder="Kode Akses (3 huruf)" maxlength="8" autocapitalize="characters">
<div>
<button id="b1">1. Uji getBootstrapData</button>
<button id="b2">2. Uji fungsi di luar whitelist</button><br>
<button id="b3">3. Uji payload 1 MB</button>
<button id="b4">3. Uji payload 4 MB</button>
<button id="b5" class="g">Hapus cache PWA</button>
</div>
<pre id="out">Siap.</pre>
<script>
var out=document.getElementById('out'),code=document.getElementById('code');
document.getElementById('u').textContent=(window.FASTAPP_CONFIG||{}).EXEC_URL||'(kosong)';
function log(h,c){out.innerHTML='<span class="'+(c||'')+'">'+h+'</span>';}
function t0(){return performance.now();}
document.getElementById('b1').onclick=function(){
  var s=t0();log('Memanggil...');
  google.script.run.withSuccessHandler(function(r){
    var ms=Math.round(t0()-s);
    log(r&&r.success?'BERHASIL dalam '+ms+' ms\n':'Respons gagal ('+ms+' ms)\n','ok');
    out.appendChild(document.createTextNode('\n'+JSON.stringify(r,null,1).slice(0,1500)));
  }).withFailureHandler(function(e){log('GAGAL: '+e.message,'bad');}).getBootstrapData(code.value.trim());
};
document.getElementById('b2').onclick=function(){
  window.FASTAPP_callApi('setupSystem',[]).then(function(r){
    var ok=r&&r.success===false;log((ok?'DITOLAK SERVER (benar)':'PERHATIAN: tidak ditolak!')+'\n'+JSON.stringify(r),ok?'ok':'bad');
  }).catch(function(e){log('GAGAL: '+e.message,'bad');});
};
function payload(mb){
  var s=t0(),junk=new Array(mb*1024*1024+1).join('A');log('Mengirim '+mb+' MB...');
  window.FASTAPP_callApi('uji_payload',[junk]).then(function(r){
    var ms=Math.round(t0()-s);var ok=r&&/tidak dikenal/i.test(r.error||'');
    log((ok?'DITERIMA server':'Respons tak terduga')+' dalam '+ms+' ms\n'+JSON.stringify(r),ok?'ok':'bad');
  }).catch(function(e){log('GAGAL: '+e.message,'bad');});
}
document.getElementById('b3').onclick=function(){payload(1);};
document.getElementById('b4').onclick=function(){payload(4);};
document.getElementById('b5').onclick=function(){
  Promise.all([navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}):0,
    window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):0
  ]).then(function(){log('Cache & service worker dihapus. Muat ulang halaman.','ok');});
};
</script></body></html>
