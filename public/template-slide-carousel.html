<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Template Slide Carousel FAST</title>
<!--
  TEMPLATE SLIDE CAROUSEL — FAST APP
  Kanvas TETAP 960 x 720 px (rasio 4:3, untuk HP). Aplikasi menskalakan kanvas ini agar pas
  ke area Carousel; ukuran area tidak berubah berapa pun isi slide Anda.

  ATURAN (dicek otomatis saat unggah):
  - Hanya HTML + CSS. Tanpa JavaScript, tanpa atribut onclick/onload dsb.
  - Tanpa tautan, formulir, bingkai tertanam, CSS/skrip/gambar dari alamat luar
    (http/https). Semua harus berada di dalam file ini.
  - Gambar kecil: sisipkan sebagai data URI (data:image/...;base64,...).
  - Font: pakai font sistem (font luar tidak dimuat).
  - Maksimal ukuran file 200 KB.
  - Animasi: gunakan CSS (@keyframes). Slide tidak bisa diklik/digulir.

  AREA AMAN: biarkan 48 px dari tepi kiri/kanan dan 40 px atas/bawah bebas dari
  teks penting. Pojok kanan bawah (±200 x 70 px) dapat tertutup chip "Detail".
  Silakan ubah teks, warna (variabel --... di :root), dan animasi di bawah.
-->
<style>
  :root {
    --biru: #1F4E9C;
    --lime: #9CC247;
    --merah: #D6312B;
    --gelap: #0f172a;
    --terang: #ffffff;
    --aman-x: 48px;
    --aman-y: 40px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 960px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--terang);
    background: linear-gradient(135deg, var(--biru) 0%, #173b78 60%, var(--gelap) 100%);
  }

  /* Dekorasi latar (boleh dihapus/diganti) */
  .bulat { position: absolute; border-radius: 50%; opacity: .18; animation: melayang 9s ease-in-out infinite; }
  .b1 { width: 460px; height: 460px; right: -140px; top: -150px; background: var(--lime); }
  .b2 { width: 360px; height: 360px; left: -120px; bottom: -150px; background: var(--merah); animation-delay: -4s; }
  .garis { position: absolute; left: 0; right: 0; top: 0; height: 12px;
    background: linear-gradient(90deg, var(--biru) 0 55%, var(--lime) 55% 85%, var(--merah) 85% 100%); }

  /* Isi utama di dalam area aman */
  .isi {
    position: absolute; inset: var(--aman-y) var(--aman-x);
    display: flex; flex-direction: column; justify-content: center; gap: 24px;
  }
  .label {
    align-self: flex-start;
    font-size: 26px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gelap); background: var(--lime);
    padding: 8px 22px; border-radius: 999px;
    animation: masuk .7s ease-out both;
  }
  h1 {
    font-size: 76px; line-height: 1.08; font-weight: 900; letter-spacing: -.02em;
    animation: masuk .8s .15s ease-out both;
  }
  p {
    font-size: 34px; line-height: 1.35; max-width: 820px; opacity: .92;
    animation: masuk .8s .3s ease-out both;
  }
  .info {
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px;
    animation: masuk .8s .45s ease-out both;
  }
  .kartu {
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35);
    border-radius: 20px; padding: 12px 24px; font-size: 28px; font-weight: 700;
  }
  .kartu b { color: var(--lime); }
  .sorot { color: var(--lime); }

  @keyframes masuk { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes melayang { 0%,100% { transform: translateY(0); } 50% { transform: translateY(22px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="bulat b1"></div>
  <div class="bulat b2"></div>
  <div class="garis"></div>

  <div class="isi">
    <div class="label">Pengumuman</div>
    <h1>Judul Slide <span class="sorot">Facility Support</span></h1>
    <p>Tulis pesan singkat di sini. Ubah teks, warna, dan animasi sesuai kebutuhan.</p>
    <div class="info">
      <div class="kartu">Tanggal: <b>01 Jan 2026</b></div>
      <div class="kartu">Lokasi: <b>Gedung A</b></div>
    </div>
  </div>
</body>
</html>
